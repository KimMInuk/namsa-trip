<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남미 13일</title>
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="남미13일">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
--bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f2a;
--text:#eef0f5; --muted:#8d94a6; --faint:#5c6373;
--line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
--hi:inset 0 1px 0 rgba(255,255,255,.04);
--accent:#f2b544; --cool:#5aa9e6; --bad:#e2645c; --good:#5cb88a;
--pe:#e07a4a; --bo:#5cb88a; --cl:#5aa9e6;
--tint:var(--accent);
--r-card:18px; --r-tile:14px; --r-photo:16px; --r-chip:999px;
--radius:18px;
--maxw:640px; --pad:20px;
--tabh:60px;
--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--bg); color:var(--text); font-family:var(--font);
font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
-webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere;
overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{
max-width:var(--maxw); margin:0 auto;
padding:14px var(--pad) calc(var(--tabh) + 28px + env(safe-area-inset-bottom));
}
@keyframes nsPage{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.pgin{animation:nsPage .16s cubic-bezier(.22,.61,.36,1) both}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.96)}
.tap.lg:active{transform:scale(.985)}
@keyframes nsSkel{0%,100%{opacity:.45}50%{opacity:.9}}
.skel{background:var(--surface-2);border-radius:8px;animation:nsSkel 1.1s ease-in-out infinite;display:block}
@media (prefers-reduced-motion:reduce){
#app.pgin{animation:none}
.tap,.tap:active{transition:none;transform:none}
.skel{animation:none}
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.display{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.title{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.015em}
.h{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.body{font-size:15px;line-height:24px;font-weight:400}
.small{font-size:13px;line-height:18px}
.micro{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.num,.tab-num{font-variant-numeric:tabular-nums}
.page-title{font-size:22px;line-height:28px;margin:6px 0 4px}
.page-sub{color:var(--muted);font-size:13px;line-height:18px;margin:0 0 18px}
.sec{margin:24px 0 0}
.sec-h{
font-size:11px;line-height:14px;color:var(--muted);font-weight:600;
letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;
}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.card{
background:var(--surface); border:1px solid var(--line);
border-radius:var(--r-card); padding:16px; margin-bottom:12px;
box-shadow:var(--hi);
}
.card.tight{padding:13px 14px}
.card.flat{background:transparent;box-shadow:none}
.callout{
border:1px solid rgba(242,181,68,.35); background:rgba(242,181,68,.07);
border-radius:12px; padding:13px 14px; margin:12px 0 0;
}
.callout .lab{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.callout.cool{border-color:rgba(110,168,216,.32);background:rgba(110,168,216,.07)}
.callout.cool .lab{color:var(--cool)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
display:inline-flex;align-items:center;gap:4px;
font-size:11px;font-weight:600;letter-spacing:.02em;
padding:3px 8px;border-radius:999px;
border:1px solid var(--line); color:var(--muted); background:var(--surface-2);
white-space:nowrap;
}
.badge.accent{color:var(--accent);border-color:rgba(242,181,68,.35);background:rgba(242,181,68,.08)}
.badge.cool{color:var(--cool);border-color:rgba(110,168,216,.35);background:rgba(110,168,216,.09)}
.badge.off{opacity:.35}
.row{
display:flex;gap:11px;align-items:flex-start;
padding:12px 13px; border:1px solid var(--line); border-radius:var(--r-tile);
background:var(--surface); margin-bottom:8px; width:100%; text-align:left;
box-shadow:var(--hi); transition:transform .12s ease,background .12s ease;
}
.row.plain{background:transparent;box-shadow:none}
a.row:active,button.row:active{background:var(--surface-2);transform:scale(.985)}
.row .ico{flex:0 0 auto;margin-top:2px;color:var(--accent);display:flex}
.row .ico.geo{position:relative}
.row .ico.geo::after{content:"";position:absolute;top:0;right:-1px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.85}
.row .bd{flex:1 1 auto;min-width:0}
.row .nm{display:block;font-weight:600;font-size:15px}
.row .mt{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.row .nt{display:block;color:var(--muted);font-size:13px;margin-top:5px;line-height:1.55}
.row .badges{display:flex}
.row .chev{flex:0 0 auto;color:var(--muted);align-self:center}
ul.bul{margin:0;padding-left:18px}
ul.bul li{margin:5px 0}
ul.bul.tight li{margin:3px 0}
.btn{
display:inline-flex;align-items:center;justify-content:center;gap:6px;
padding:10px 14px;border-radius:12px;border:1px solid var(--line);
background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;
cursor:pointer;min-height:44px;transition:transform .12s ease,opacity .12s ease;
}
.btn:active{opacity:.75;transform:scale(.96)}
.btn.ghost{background:transparent}
.btn.accent{border-color:rgba(242,181,68,.4);color:var(--accent);background:rgba(242,181,68,.08)}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-row .btn{flex:1 1 auto}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],input[type=email],select{
background:var(--bg);border:1px solid var(--line);border-radius:10px;
padding:9px 11px;width:100%;outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
label.fl{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.shake{animation:nsShake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes nsShake{
10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.vault-err{color:var(--bad)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;cursor:pointer;min-height:44px}
.chk input{
appearance:none;-webkit-appearance:none;flex:0 0 auto;
width:19px;height:19px;margin:2px 0 0;border:1.5px solid var(--line);
border-radius:6px;background:var(--bg);position:relative;cursor:pointer;
}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{
content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
border:solid #0b0d12;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.chk span{flex:1;font-size:14px;line-height:1.55}
.chk input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tabbar{
position:fixed;left:0;right:0;bottom:0;z-index:50;
background:rgba(11,13,18,.72); backdrop-filter:blur(18px) saturate(140%);
-webkit-backdrop-filter:blur(18px) saturate(140%);
border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:var(--maxw);margin:0 auto;display:flex}
.tab{
position:relative;
flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;height:var(--tabh);color:var(--muted);font-size:11px;font-weight:500;
background:none;border:0;cursor:pointer;transition:color .12s ease;
}
.tab.on{color:var(--text);font-weight:700}
.tab svg{display:block}
.tab .dotm{display:block;width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on .dotm{background:var(--accent)}
.tab.on .ic{color:var(--accent)}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-item{position:relative;margin-bottom:10px}
.tl-item::before{
content:"";position:absolute;left:-18px;top:20px;width:9px;height:9px;
border-radius:50%;background:var(--bg);border:1.5px solid var(--line);
}
.tl-item.on::before{background:var(--accent);border-color:var(--accent)}
.tl-head{
display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
background:var(--surface);border:1px solid var(--line);border-radius:12px;
padding:12px 13px;cursor:pointer;
}
.tl-item.on .tl-head{border-color:rgba(242,181,68,.4)}
.tl-d{flex:0 0 46px;font-size:12px;font-weight:700;color:var(--accent);padding-top:1px}
.tl-b{flex:1;min-width:0}
.tl-t{display:block;font-weight:600;font-size:14.5px}
.tl-m{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tl-body{padding:2px 0 6px}
.alt{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px}
.alt-b{flex:1;background:var(--surface-2);border-radius:3px 3px 0 0;min-height:4px;position:relative}
.alt-b.on{background:var(--accent)}
.alt-l{display:flex;gap:3px;margin-top:6px}
.alt-l span{flex:1;font-size:9px;color:var(--muted);text-align:center;line-height:1.25;word-break:keep-all}
.alt-l span.on{color:var(--accent);font-weight:700}
.read-wrap{font-size:16px;line-height:1.75;max-width:60ch}
.read-wrap p{margin:0 0 14px}
details.art{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.art > summary{
list-style:none;cursor:pointer;padding:14px 15px;display:flex;gap:10px;align-items:flex-start;
font-weight:600;font-size:15.5px;line-height:1.5;
}
details.art > summary::-webkit-details-marker{display:none}
details.art[open] > summary{border-bottom:1px solid var(--line)}
details.art .art-body{padding:15px}
.art-chk{
flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--line);border-radius:6px;
display:flex;align-items:center;justify-content:center;margin-top:2px;
background:var(--bg);color:transparent;
}
.art-chk.done{background:var(--accent);border-color:var(--accent);color:#0b0d12}
details.art .art-t{flex:1;min-width:0}
details.plain{margin-top:12px}
details.plain > summary{
list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;
padding:8px 0;display:flex;align-items:center;gap:6px;
}
details.plain > summary::-webkit-details-marker{display:none}
table.fx{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.fx th,table.fx td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.fx th:first-child,table.fx td:first-child{text-align:left;color:var(--muted)}
table.fx th{color:var(--muted);font-weight:600;font-size:12px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.clock{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.clock:last-child{border-bottom:0}
.clock .z{font-weight:600}
.clock .z small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.clock .t{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.01em}
.clock .t small{display:block;text-align:right;color:var(--muted);font-size:11.5px;font-weight:400}
.ph{padding:11px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph .es{font-weight:700;font-size:15px}
.ph .pr{color:var(--accent);font-size:15px;font-weight:500;line-height:1.45;margin-top:3px;letter-spacing:-.01em}
.ph .ko{color:var(--muted);font-size:13.5px;margin-top:3px}
.ph-search{padding:2px 0 2px;margin:0 0 4px}
.dd{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13.5px}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{text-align:right}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;padding:6px 0;margin-bottom:2px;background:none;border:0;cursor:pointer}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}
.flt{display:flex;align-items:center;gap:10px;margin:10px 0}
.flt .side{flex:1;min-width:0}
.flt .side.r{text-align:right}
.flt .code{font-size:19px;font-weight:700;letter-spacing:-.01em}
.flt .tm{font-variant-numeric:tabular-nums;font-size:13.5px;margin-top:1px}
.flt .term{color:var(--muted);font-size:11.5px;margin-top:1px}
.flt .mid{flex:0 0 auto;color:var(--muted);font-size:11px;text-align:center;padding:0 4px}
.hero{
position:relative;border-radius:var(--r-photo);overflow:hidden;
background:var(--surface-2);border:1px solid var(--line);margin:0 0 14px;
}
.hero .ph{aspect-ratio:16/9}
.hero.compact .ph{max-height:150px}
.hero .cap{
position:absolute;left:0;right:0;bottom:0;padding:30px 16px 13px;
background:linear-gradient(to top,rgba(11,13,18,calc(.62 + .34 * var(--gk,.5))),rgba(11,13,18,calc(.2 + .34 * var(--gk,.5))) 46%,rgba(11,13,18,0));
font-weight:700;font-size:17px;line-height:24px;letter-spacing:-.01em;
}
.hero .cap small{display:block;font-weight:500;font-size:11.5px;color:#c3c9d6;margin-top:2px}
.hero .crd{
position:absolute;right:8px;top:8px;font-size:10px;color:#c3c9d6;
background:rgba(11,13,18,.62);border-radius:6px;padding:2px 6px;
}
.row.rowimg{padding:0;gap:0;overflow:hidden;align-items:stretch}
.row.rowimg .rowlink{display:flex;gap:11px;align-items:flex-start;flex:1 1 auto;min-width:0;padding:12px 13px}
.row.rowimg .rowlink:active{background:var(--surface-2)}
.thumb{
flex:0 0 auto;width:72px;height:72px;align-self:center;margin:8px 8px 8px 4px;
padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
background:var(--surface-2);cursor:pointer;display:block;
}
.thumb .ph{height:100%}
.thumb:active{opacity:.7}
.gal{margin:0 0 16px}
.gal .bhead{margin-bottom:8px}
.gal-s{
display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:1px 0 7px;
-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;
}
.gal-s::-webkit-scrollbar{display:none}
.gal-c{
position:relative;flex:0 0 auto;width:198px;scroll-snap-align:start;padding:0;
border:1px solid var(--line);border-radius:12px;overflow:hidden;
background:var(--surface-2);color:inherit;cursor:pointer;display:block;
}
.gal-c .ph{aspect-ratio:16/9}
.gal-c:active{opacity:.75}
.gal-c .gc{
position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;text-align:left;
font-size:11px;line-height:1.35;font-weight:600;color:#eef1f6;
background:linear-gradient(to top,rgba(11,13,18,calc(.62 + .34 * var(--gk,.5))),rgba(11,13,18,0));
}
.gal.compact .gal-c{width:138px}
.gal.compact .gal-c .gc{font-size:10px;padding:14px 7px 5px}
.lb{
position:fixed;inset:0;z-index:200;background:rgba(6,7,10,.97);
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
}
.lb img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;display:block}
.lb .lb-cap{max-width:min(100%,560px);margin-top:14px;font-size:13px;line-height:1.55;text-align:center}
.lb .lb-cap .cr{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.lb .lb-cap .cr a{text-decoration:underline;text-underline-offset:2px}
.lb .lb-x{
position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.lb .lb-b{display:flex;flex-direction:column;align-items:center;max-width:100%}
.lb .lb-a{
position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
border:1px solid var(--line);background:rgba(20,23,30,.9);color:var(--text);
display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
}
.lb .lb-a.p{left:8px}
.lb .lb-a.n{right:8px}
.lb .lb-a.p .ic{transform:none}
.thumb.sm{width:56px;height:56px;margin:0;border-radius:9px;align-self:flex-start}
.row .oth{
flex:0 0 auto;width:56px;height:56px;align-self:center;display:block;overflow:hidden;
border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
}
.row .oth .ph{height:100%}
.credits{font-size:12px;line-height:1.6}
.credits .cr-g{color:var(--muted);font-weight:600;letter-spacing:.04em;padding:12px 0 3px}
.credits .cr-g:first-child{padding-top:0}
.credits .cr-i{padding:9px 0;border-bottom:1px solid var(--line)}
.credits .cr-i:last-child{border-bottom:0}
.credits .cr-t{color:var(--text);word-break:break-all}
.credits .cr-m{color:var(--muted);margin-top:2px}
.credits a{text-decoration:underline;text-underline-offset:2px}
.wx{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 13px}
.wx-top{display:flex;align-items:center;gap:11px}
.wx-ico{flex:0 0 auto;color:var(--accent);display:flex}
.wx-now{flex:0 0 auto;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx-lab{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.45}
.wx-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.wx-grid .wx-c{
flex:1 1 84px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;
}
.wx-c .k{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.wx-c .v{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.wx-ref{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6;border-left:2px solid var(--line-2);padding-left:10px}
.wx-ref b{color:var(--text);font-weight:600}
.wx-stale{font-size:11px;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcard{
display:flex;flex-direction:column;gap:8px;padding:14px 13px;
border:1px solid var(--line);border-radius:12px;background:var(--surface);
}
.gcard:active{background:var(--surface-2)}
.gcard .gi{color:var(--accent);display:flex}
.gcard .gt{font-weight:600;font-size:14.5px}
.gcard .gs{color:var(--muted);font-size:11.5px;line-height:1.4}
.prac{font-size:15px;line-height:1.65}
.prac li{margin:7px 0}
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.grp > summary{
list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:9px;align-items:center;
font-weight:600;font-size:15px;line-height:1.45;
}
details.grp > summary::-webkit-details-marker{display:none}

:406},{"city":"쿠스코","altitude_m":3400},{"city":"마추픽추","altitude_m":2430},{"city":"푸노 · 티티카카","altitude_m":3812},{"city":"라파즈","altitude_m":3640},{"city":"우유니","altitude_m":3656},{"city":"알티플라노 · 라구나 콜로라다","altitude_m":4300},{"city":"산페드로 데 아따까마","altitude_m":2408},{"city":"산티아고","altitude_m":520}],"tips":{"altitude":["고산약은 한국에서 처방받아 가고, 리마공항에서 쿠스코행 탑승 전(D4, 09-24 오전)부터 복용. 현지에선 코카차·코카캔디로 보조.","고산약을 못 챙겼다면 D1(09-21) 리마 자유일정 때 약국에서 구입 — 투어캡틴 안내 사항.","도착 첫날 룰: 술·담배·과식·뜨거운 물 샤워 금지, 무리한 일정 금지, 물 많이. 이상 시 즉시 투어캡틴에게.","고산증세가 있을 때는 온수 샤워를 자제하고, 잠을 많이 자거나 누워만 있지 않기.","가장 큰 두 결정은 D3 나스카/바예스타와 D6 비니쿤카. 비용·체력·시간을 통으로 먹으니 이 둘만 정하면 끝.","비니쿤카 말(馬): 오르막은 말로 커버되지만 정상 직전 10~20분 + 계단은 직접 걷고 하산은 보통 도보. 쉬운 코스 아님.","고도 순서: 리마 154m → 쿠스코 3,400m → 푸노 3,812m(최고 숙박지) → 라파즈 3,640m → 우유니 3,656m → 라구나 4,300m대 → 아따까마 2,408m → 산티아고 520m","고산약은 리마공항 탑승 전부터 최소 48시간 복용. 현지 Altavita 20알 45~60솔(US$18). 투어 최고점 4,950m.","여행사 경험상 10명 중 1명 정도 증상 호소, 심하면 응급실. 가벼운 증상은 충분히 관리 가능."],"packing":["일교차 큰 레이어드(낮 반팔·밤 패딩), 선글라스·선크림·모자, 보조배터리, 멀미약.","D2 이카 사막 디너: 갑작스러운 기온 변화 대비 가벼운 외투, 모래바람 대비 선글라스·마스크.","D5 마추픽추: 긴바지·긴팔 권장, 화장실은 입구에만 있으니 입장 전 해결.","D10~D12 우유니 지프투어: 밤 영하 — 방한복·장갑·핫팩, 숙소 온수/전기 제한 가정.","D3 협곡 트레킹을 택하면 운동화 필수.","국제선 위탁 2개(각 23kg/158cm)·기내 1개(10kg). 남미 국내선은 위탁 23kg 1개, 기내 JetSMART·Sky 10kg(25×35×45), BoA 7kg(55×35×20). 기내용 캐리어는 유료 → 백팩.","수영복·스포츠타월 (이카 호텔 수영장, 우유니 노천온천).","핫팩 1~2개, 컵라면·햇반·컵밥, 휴대폰 방수팩, KF마스크·버프, 여권용 사진 2장, 휴대용 우산.","우유니 사진 소품: 야마 인형, 원통 과자통, 컬러풀 판초(쿠스코에서 구입 가능). 장화는 현지 제공.","보조배터리(대한항공 2026.4 기준): 1인 2개, 100Wh 이하(20,000mAh≈74Wh), 기내 휴대, 기내 사용·충전 금지, 선반 보관 금지, 지퍼백 개별 보관.","24인치 캐리어 권장 (오래 메고 다닐 일 없음). 캐리어 자물쇠."],"border":["여권 잔여 유효기간 6개월 이상 필요.","미국 경유 → ESTA 필수 (출발 72시간 전 승인 권장). 애틀랜타에서 입국심사 + 짐 찾아 재위탁 절차 있음.","볼리비아는 라파즈·우유니만 방문이면 황열병 접종 불요.","D8: 페루→볼리비아 데사구아데로 육로 국경, 출입국 심사 약 1시간. 페루와 볼리비아는 1시간 시차.","D12: 칠레 입국 시 각종 농식품 반입 금지 — 익히지 않은 유제품/과일류/농산물/코카잎/고기류 등. 지프투어 중 받은 간식·코카잎은 국경 전에 처리.","미성년자(만18세 미만)의 중남미 여행은 대사관 공증 필요.","칠레 반입: 조리된 포장식품(김치·멸치볶음 등)은 허용. 익히지 않은 농수산물·과일·유제품·코카잎·육류 금지."]},"readings":{"intro":{"id":"intro","name":"여행 전체 배경","articles":[{"title":"안데스 5천 년, 13일로 압축하기","paragraphs":["이번 여행이 지나가는 땅은 세계에서 가장 오래된 문명권 중 하나다. 리마 북쪽 카랄 유적은 기원전 3000년경, 이집트 피라미드와 같은 시대에 세워진 아메리카 최고(最古)의 도시다. 그 뒤로 차빈(기원전 900~200), 파라카스(기원전 800~기원후 100), 나스카(기원전 100~기원후 800), 모체(100~700), 티와나쿠(500~1000), 와리(600~1000) 문명이 차례로 안데스와 해안을 지배했다.","잉카는 이 긴 역사의 마지막 100년에 불과하다. 1438년 파차쿠텍이 확장을 시작해 1532년 스페인이 도착하기까지, 잉카는 오늘의 콜롬비아 남부에서 칠레 중부까지 약 4천km를 하나로 묶었다. 여행에서 만나는 유적 중 잉카의 것은 쿠스코·마추픽추·오얀따이땀보 정도이고, 나스카 라인·파라카스·우아카 푸야나·티와나쿠는 모두 잉카보다 수백에서 천 년 이상 앞선 것들이다.","여행 순서는 우연히도 역사 순서와 비슷하다. 리마(선잉카 우아카)→이카(파라카스·나스카)→쿠스코(잉카)→티티카카(잉카의 창조신화)→라파즈(식민지·독립)→산티아고(현대사). 각 도시에서 그 시대의 이야기를 하나씩 붙이면 13일이 하나의 연대기가 된다."]},{"title":"168명이 제국을 무너뜨린 이유","paragraphs":["1532년 11월 16일 카하마르카. 프란시스코 피사로의 168명이 수만 명의 잉카 군대 앞에서 황제 아타우알파를 생포했다. 이 믿기 어려운 사건의 배경에는 세 가지가 있다. 첫째, 천연두. 스페인인이 도착하기 5년 전 천연두가 먼저 남하해 황제 우아이나 카팍과 후계자를 죽였고, 형제 우아스카르와 아타우알파의 내전이 제국을 두 쪽 냈다. 둘째, 말과 강철. 안데스에는 말도 철도 없었다. 셋째, 잉카 내부의 피정복 민족들이 스페인 편에 섰다.","아타우알파는 몸값으로 방 하나를 황금으로, 두 방을 은으로 채우겠다고 약속했고 실제로 채웠다. 스페인은 몸값을 받은 뒤 1533년 7월 그를 처형했다. 같은 해 11월 스페인군은 쿠스코에 입성했다. 1536년 꼭두각시 황제 망코 잉카가 반란을 일으켜 삭사이와망에서 격전을 벌였지만 실패했고, 잉카의 잔존 세력은 빌카밤바의 밀림으로 물러나 1572년 마지막 황제 투팍 아마루가 쿠스코 광장에서 처형될 때까지 버텼다."]},{"title":"남미 독립과 세 나라의 얽힌 관계","paragraphs":["페루·볼리비아·칠레는 1810~1825년 사이 스페인에서 독립했다. 남쪽에서는 아르헨티나의 산 마르틴이 안데스를 넘어 칠레(1818)를 해방하고 1821년 7월 28일 리마에서 페루 독립을 선언했다. 북쪽에서는 시몬 볼리바르가 내려와 1824년 아야쿠초 전투로 스페인 세력을 완전히 몰아냈다. 볼리비아(1825)는 아예 볼리바르의 이름을 따 나라 이름을 지었다. 두 영웅은 1822년 에콰도르 과야킬에서 단 한 번 만났고, 회담 내용은 지금도 비밀로 남아 있다.","세 나라의 관계를 지금까지 규정하는 사건은 태평양 전쟁(1879~1884)이다. 아타카마 사막의 초석(질산염)과 구아노를 둘러싼 이 전쟁에서 칠레가 승리해 페루 남부와 볼리비아의 해안 전체를 가져갔다. 볼리비아는 바다를 잃고 내륙국이 되었지만 지금도 해군을 유지하고 매년 3월 23일 바다의 날을 기념한다. 이번 여행에서 우유니 투어 마지막 날 볼리비아에서 칠레로 넘어가는 그 국경이 바로 이 전쟁의 결과다."]},{"title":"출발 전 볼 것","paragraphs":["여행사가 사전모임 자료에서 추천한 예습 목록이다. 다큐멘터리로는 KBS 걸어서 세계속으로의 남미 편(공룡 도시 라파즈, 시간이 멈춘 잉카의 땅, 안데스 8천km 여정 등)이 이번 경로와 겹친다. 예능은 떠나면 김에 세계일주 시즌 1(페루·볼리비아), 지구마을 세계여행 시즌 2(페루). 넷플릭스 다큐 라틴아메리카는 4회가 페루 리마, 6회가 볼리비아 편이다.","영화로는 체 게바라의 남미 종단을 그린 모터사이클 다이어리(마추픽추·쿠스코 장면), 1988년 칠레 국민투표를 다룬 노(No), 아타카마 사막과 피노체트 시대 실종자를 함께 다룬 다큐 빛을 향한 노스탤지어가 여행지와 직접 닿아 있다. 음악은 엘 콘도르 파사 원곡(로스 잉카스)과 볼리비아 포크 그룹 로스 카르카스, 칠레의 비올레타 파라를 들어 두면 현지 거리 공연이 반갑게 들린다.","책은 존 헤밍의 잉카 제국의 정복, 마크 애덤스의 마추픽추 발견기(Turn Right at Machu Picchu)가 읽기 쉽다. 시간이 없으면 이 앱의 읽을거리를 비행기에서 순서대로 읽는 것으로 충분하다."]}]},"lima":{"id":"lima","name":"리마","articles":[{"title":"왕들의 도시: 피사로는 왜 쿠스코를 버렸나","paragraphs":["피사로는 1535년 1월 18일 리마를 세웠다. 잉카의 수도 쿠스코가 있는데 굳이 새 도시를 만든 이유는 바다다. 해발 3,400m의 산악 도시는 스페인과의 연결에 불리했고, 리막 강 하구와 카야오 항구가 있는 이 자리는 태평양을 통해 파나마와 세비야로 은을 실어 보내기에 이상적이었다. 공식 이름은 시우다드 데 로스 레예스(왕들의 도시). 동방박사 축일에 부지를 정한 데서 나온 이름이지만, 곧 원주민 이름 리막(말하는 자)이 변한 리마로 불리게 됐다.","이후 300년 가까이 리마는 스페인 남미 식민지 전체의 수도였다. 페루 부왕령은 한때 파나마부터 아르헨티나까지를 관할했고, 포토시의 은이 전부 이곳을 거쳐 유럽으로 갔다. 아메리카 최초의 대학(산 마르코스, 1551)과 종교재판소도 리마에 세워졌다. 1746년 대지진과 쓰나미로 도시 대부분과 카야오가 파괴됐고, 지금 구시가지의 바로크 건물 상당수는 그 뒤 재건된 것이다.","산 프란시스코 수도원 지하의 카타콤에는 약 2만 5천 구의 유골이 안치돼 있다. 1808년 시립 묘지가 생기기 전까지 리마 시민은 교회 지하에 묻혔고, 뼈들이 종류별로 정리된 기하학적 배열은 20세기 발굴 때 만들어진 것이다."]},{"title":"비는 안 오는데 늘 흐린 도시","paragraphs":["리마는 카이로 다음으로 건조한 대도시다. 연 강수량이 10mm 안팎으로 사막 한복판이나 다름없다. 그런데 5월부터 11월까지는 해가 거의 나지 않는다. 남극에서 올라오는 차가운 훔볼트 해류가 바다 위 공기를 식혀 두꺼운 안개층을 만들고, 이것이 도시를 덮는다. 페루 사람들은 이 안개를 가루아라고 부르며, 비가 아니라 이슬처럼 내려앉는다.","9월 말 도착하면 바로 이 회색 하늘을 만날 가능성이 높다. 기온은 15~19도로 서늘하고 습도가 높아 체감은 더 춥다. 이 우울한 하늘 때문에 리마 사람들은 허먼 멜빌이 백경에서 세상에서 가장 슬픈 도시라고 쓴 것을 자주 인용한다. 반대로 훔볼트 해류는 세계에서 가장 풍부한 어장을 만들어 페루 요리의 기반이 됐다. 세비체는 이 차가운 바다 덕분에 가능하다."]},{"title":"미라플로레스, 바랑코, 그리고 1992년","paragraphs":["호텔이 있는 미라플로레스는 리마의 부유한 해안 지구다. 태평양을 향한 100m 높이 절벽 위에 공원과 아파트가 늘어서 있고, 절벽 아래로는 서핑 해변과 라르코마르 쇼핑몰이 박혀 있다. 이 동네 한복판의 우아카 푸야나는 잉카보다 1천 년 앞선 리마 문화(200~700년)가 진흙 벽돌로 쌓은 피라미드다. 도시가 유적을 삼킨 것이 아니라 유적 주위로 도시가 자란 셈이다.","미라플로레스가 지금처럼 안전하고 정돈된 모습이 된 것은 오래되지 않았다. 1980~1992년 페루는 마오주의 게릴라 센데로 루미노소와의 내전으로 약 7만 명이 죽었고, 1992년 7월 16일 미라플로레스 타라타 거리에서 차량 폭탄이 터져 25명이 숨졌다. 그해 9월 지도자 아비마엘 구스만이 체포되면서 내전은 사실상 끝났고, 2000년대 경제 성장과 함께 미라플로레스와 바랑코가 관광·미식의 중심이 됐다. 바랑코는 19세기 리마 상류층의 해변 휴양지였다가 예술가들이 모여든 동네로, 한숨의 다리는 한 번에 숨을 참고 건너면 소원이 이뤄진다는 이야기가 있다."]},{"title":"페루 요리가 세계 1위가 된 이유","paragraphs":["2023년 리마의 레스토랑 센트랄이 세계 50대 레스토랑 1위에 올랐다. 페루 요리의 힘은 재료와 이민의 조합이다. 해안에는 훔볼트 해류의 해산물, 안데스에는 3천 종이 넘는 감자와 수십 종의 옥수수, 아마존에는 열대 과일이 있다. 여기에 스페인(양파·라임·소), 아프리카 노예(내장 요리 안티쿠초), 1849년부터 온 중국인 노동자(볶음 요리 치파, 로모 살타도는 웍 기법), 1899년부터 온 일본인(날생선을 얇게 써는 티라디토, 니케이 요리)이 겹쳐졌다.","세비체는 날생선을 라임즙·고추·양파·소금에 몇 분만 재운 것으로, 원래는 몇 시간 재웠지만 일본 이민자의 영향으로 짧게 재우는 지금 방식이 됐다. 생선을 재우고 남은 국물 레체 데 티그레(호랑이 우유)는 숙취 해소제이자 정력제로 따로 마신다. 세비체는 아침에 잡은 생선으로 점심에 먹는 음식이라 정통 세비체리아는 오후 4~5시면 문을 닫는다. 로모 살타도(소고기 볶음+감자튀김+밥), 아히 데 가이나(닭고기 크림), 카우사(감자 테린), 안티쿠초(소 염통 꼬치)가 대표 메뉴이고, 보라색 옥수수 음료 치차 모라다와 노란 탄산음료 잉카 콜라를 곁들인다."]},{"title":"피스코 사워, 원조 논쟁의 한가운데","paragraphs":["피스코는 포도 증류주다. 16세기 스페인이 가져온 포도로 이카 지방에서 만들기 시작했고, 선적항 이름 피스코가 술 이름이 됐다. 피스코 사워는 1920년대 리마 구시가지의 모리스 바에서 미국인 바텐더 빅터 모리스가 위스키 사워를 변형해 만든 것으로 알려져 있다. 피스코, 라임, 시럽, 달걀흰자를 흔들어 거품을 내고 앙고스투라 비터스 몇 방울을 떨어뜨린다.","페루와 칠레는 피스코의 원조를 두고 수십 년째 싸우고 있다. 칠레도 북부에서 피스코를 만들고 지역 이름을 아예 피스코 엘키로 바꿨다. 페루는 2월 첫째 토요일을 피스코 사워의 날로 지정했다. 이번 여행은 페루에서 시작해 칠레에서 끝나니 양쪽에서 한 잔씩 마시고 직접 판정해 볼 수 있다."]}]},"ica":{"id":"ica","name":"이카·와카치나·나스카","articles":[{"title":"사막 속 오아시스의 전설과 현실","paragraphs":["와카치나는 이카 시내에서 5km 떨어진 사막 한복판의 작은 호수다. 전설에 따르면 한 잉카 공주가 목욕하다 사냥꾼에게 들켜 도망쳤고, 그가 남긴 물이 호수가, 벗어 던진 망토가 모래언덕이 됐다고 한다. 지명은 케추아어로 우는 여인이라는 뜻이다. 1940~50년대에는 리마 상류층의 온천 휴양지로 호숫가에 호텔이 지어졌다.","현실은 덜 낭만적이다. 주변 농업용 지하수 채취로 수위가 계속 내려가 한때 거의 말랐고, 지금은 인근 우물에서 물을 펌프로 끌어와 채우고 있다. 그래도 야자수와 모래언덕, 100m 넘는 사구를 오르내리는 버기카와 샌드보딩은 남미에서 여기서만 가능한 경험이다. 밤의 사막은 기온이 급격히 떨어지고 별이 쏟아진다."]},{"title":"나스카 라인: 누가, 왜 그렸나","paragraphs":["나스카 라인은 기원전 100년경부터 기원후 800년까지 나스카 문화가 사막 표면의 검붉은 돌을 걷어내 밝은 흙을 드러내는 방식으로 만든 지상화다. 벌새, 원숭이, 거미, 고래 등 70여 점의 동물·식물 그림과 수백 개의 직선·기하 도형이 있고, 큰 것은 300m가 넘는다. 비가 거의 오지 않고 바람이 약해 2천 년 동안 지워지지 않았다.","1927년 근처 언덕에서 처음 보고됐지만 본격적으로 알려진 것은 비행기가 다니면서다. 독일 수학자 마리아 라이헤는 1940년부터 1998년 사망까지 50년을 사막에서 혼자 살며 선을 측량하고 지켰다. 그녀는 지상화가 천문 달력이라고 믿었다. 이후 연구는 물과 풍요를 비는 의례 공간, 즉 걸으며 기도하는 길이었다는 설에 무게를 둔다. 2024년에는 일본 야마가타 대학이 AI로 항공사진을 분석해 303개의 새 지상화를 찾아냈다. 경비행기 투어는 30분 남짓으로, 조종사가 그림마다 좌우로 급선회하며 보여 주기 때문에 멀미가 심하면 약을 미리 먹어야 한다."]},{"title":"파라카스와 구아노 전쟁","paragraphs":["파라카스 반도는 나스카보다 앞선 파라카스 문화(기원전 800~기원후 100)의 땅이다. 1925년 페루 고고학자 훌리오 테요가 발굴한 400여 기의 미라 묶음에서 나온 직물은 세계에서 가장 정교한 고대 직물로 꼽힌다. 파라카스 사람들은 아기 머리를 판자로 눌러 길게 변형하고, 두개골에 구멍을 뚫는 수술을 했는데 상당수가 수술 후 생존했다.","바예스타 섬은 페루 근대사와 얽혀 있다. 섬을 뒤덮은 바닷새의 배설물 구아노는 19세기 최고의 비료였다. 1840~1870년대 구아노 수출은 페루 정부 수입의 대부분을 차지했고, 중국인 노동자 수만 명이 이 섬에서 구아노를 팠다. 구아노와 초석을 둘러싼 이권 다툼이 태평양 전쟁으로 이어졌다. 지금은 보호구역으로 바다사자, 훔볼트 펭귄, 가마우지가 산다. 보트로 가는 길에 언덕에 새겨진 촛대 모양의 거대 지상화(칸델라브로)를 지나는데, 누가 왜 만들었는지 아직 모른다."]},{"title":"이카의 피스코 보데가","paragraphs":["이카는 페루 피스코와 와인의 본고장이다. 1550년대 스페인 선교사들이 미사용 포도주를 만들기 위해 포도를 심었고, 이 사막 계곡의 강한 햇빛과 건조한 기후가 포도 재배에 맞았다. 17세기에는 스페인 본국 와인 산업을 위협한다며 왕이 수출을 금지하는 바람에 포도주 대신 증류주 피스코가 발달했다.","이카 시 주변의 보데가(양조장) 가운데 타카마는 1540년 설립을 내세우는 남미 최고(最古)의 와이너리이고, 비스타 알레그레, 엘 카타도르 등이 투어와 시음을 한다. 페루 피스코는 물이나 오크 없이 포도 원액만 증류하는 것이 규정이라 도수 38~48도에 향이 강하다. 케브란타 품종이 표준이고, 이탈리아·모스카텔 품종은 아로마틱 피스코로 따로 분류된다."]}]},"cusco":{"id":"cusco","name":"쿠스코·마추픽추","articles":[{"title":"세계의 배꼽, 타완틴수유","paragraphs":["쿠스코는 케추아어로 배꼽이다. 잉카는 자기 나라를 타완틴수유, 즉 네 지방의 합이라고 불렀고 그 중심이 쿠스코였다. 전설에 따르면 첫 잉카 망코 카팍이 티티카카 호수에서 황금 지팡이를 들고 올라와 지팡이가 땅에 꽂히는 곳에 도시를 세웠다. 실제 잉카는 13세기경 쿠스코 계곡의 작은 부족이었고, 1438년 9대 황제 파차쿠텍이 창카족의 침입을 막아낸 뒤 폭발적으로 팽창했다. 파차쿠텍은 쿠스코를 퓨마 모양으로 재설계했고, 삭사이와망이 퓨마의 머리다.","잉카는 문자가 없었다. 대신 키푸라는 매듭 끈으로 인구·세금·창고를 기록했고, 총 4만km에 이르는 도로망 카팍냔을 따라 차스키(전령)가 릴레이로 하루 240km를 달렸다. 쿠스코 광장에서 태평양의 생선이 이틀 만에 황제 식탁에 올랐다는 이야기가 전해진다. 정복 후 잉카의 신전 위에 성당이, 궁전 위에 저택이 지어졌다. 아르마스 광장의 대성당은 비라코차 신전 터에, 라 콤파니아 교회는 우아이나 카팍 궁전 터에 서 있다."]},{"title":"면도날도 안 들어가는 돌","paragraphs":["잉카 석조의 비밀은 아직 완전히 풀리지 않았다. 철도, 바퀴도, 시멘트도 없이 수 톤짜리 안산암을 다각형으로 깎아 종이 한 장 들어갈 틈 없이 맞췄다. 하툰 루미욕 거리의 12각돌은 12개의 모서리가 주변 돌과 정확히 맞물린다. 돌 하나를 다른 돌에 반복해서 대보며 갈았을 것으로 추정된다.","이 석조는 지진에 강하다. 벽은 안쪽으로 살짝 기울어져 있고, 창과 문은 위가 좁은 사다리꼴이며, 돌들은 서로 맞물려 흔들려도 제자리로 돌아온다. 1650년과 1950년 대지진 때 스페인 식민 건물은 무너졌지만 그 아래 잉카 벽은 그대로 남았다. 코리칸차(태양의 신전)는 이것을 가장 극적으로 보여 준다. 벽이 황금판으로 덮여 있던 잉카 최고의 신전은 약탈당한 뒤 산토 도밍고 성당이 그 위에 지어졌고, 1950년 지진으로 성당이 무너지자 안에서 잉카의 곡선 벽이 드러났다."]},{"title":"마추픽추: 잃어버린 적 없는 잃어버린 도시","paragraphs":["마추픽추는 1450년경 파차쿠텍이 지은 왕실 영지로 추정된다. 황제와 귀족이 쿠스코의 추위를 피해 머무는 별장이자 종교 시설이었고, 상주 인구는 750명 정도였다. 스페인은 이곳을 끝내 찾지 못했다. 1572년 이후 버려진 채 숲에 덮였다.","1911년 7월 24일 예일 대학의 하이럼 빙엄이 이곳에 도착했다. 그는 잉카 최후의 도시 빌카밤바를 찾고 있었고, 현지 농부 멜초르 아르테아가의 안내로 산을 올랐다. 도착해 보니 이미 두 가족이 계단식 밭에서 농사를 짓고 있었고, 1902년 현지인 아구스틴 리사라가가 벽에 이름을 새겨 놓은 것도 있었다. 잃어버린 도시는 현지인에게는 잃어버린 적이 없었다. 빙엄은 유물 수천 점을 예일로 가져갔고, 페루는 100년 가까이 반환을 요구해 2011년에야 돌려받았다. 마추픽추는 1983년 유네스코 세계유산, 2007년 신7대 불가사의에 선정됐다.","유적에서 볼 것은 세 가지다. 인티우아타나(태양을 묶는 기둥)는 동지·하지에 그림자가 사라지는 천문 관측용 돌이다. 태양의 신전은 자연 바위 위에 곡선으로 쌓은 잉카 석조의 정점이며 6월 동지 아침 창으로 햇빛이 정확히 들어온다. 그리고 눈에 안 보이는 배수 시스템이 있다. 연 강수량 2천mm의 산 위에서 500년을 버틴 것은 지하에 깔린 130개의 배수로와 계단식 밭의 층별 자갈층 덕분이다."]},{"title":"비니쿤카, 2015년에 나타난 산","paragraphs":["무지개산 비니쿤카는 잉카 유적이 아니다. 몇 년 전까지 눈과 얼음에 덮여 있었고, 기후 변화로 만년설이 녹으면서 2015년경 지금의 줄무늬가 드러났다. 붉은색은 산화철(적철석), 노란색은 황화철, 녹색은 녹니석과 구리, 흰색은 석회암과 석영이다. 수천만 년 전 바다와 호수 밑에 쌓인 퇴적층이 안데스 융기로 기울어져 세로 줄무늬로 보이는 것이다.","정상 전망대는 해발 5,036m로 이번 여행의 최고점이다. 쿠스코에서 새벽 4~5시 출발해 차로 3시간, 주차장(4,600m)에서 걸어서 1시간 반~2시간이다. 말을 빌리면 대부분 구간을 태워 주지만 마지막 가파른 언덕과 계단은 걸어야 한다. 이 고도에서는 산소가 해수면의 절반이라 평소 체력과 무관하게 숨이 찬다. 천천히, 자주 쉬면서 올라가고 이상하면 바로 내려오는 것이 규칙이다."]},{"title":"코카잎과 고산병","paragraphs":["쿠스코에 도착하면 호텔에서 코카차를 준다. 코카잎은 안데스에서 4천 년 이상 씹어 온 식물로, 잉카 시대에는 귀족과 사제만 쓸 수 있었다. 잎 자체는 코카인과 다르며 약한 각성 효과와 식욕 억제, 고산 증상 완화에 도움이 된다. 잎을 뭉쳐 볼에 넣고 천천히 즙을 빨거나 차로 마시고, 코카 캔디도 흔하다. 다만 코카잎은 한국·칠레 등 대부분 나라에서 반입 금지이므로 칠레 국경을 넘기 전에 다 버려야 한다.","고산병(소로체)은 산소 부족에 몸이 적응하지 못해 생긴다. 두통, 메스꺼움, 불면, 식욕 부진이 흔하고 보통 1~2일 안에 가라앉는다. 예방약(아세타졸아미드)은 리마에서 쿠스코행 비행기 타기 전날이나 당일 아침부터 먹는다. 첫날은 술·과식·뜨거운 샤워를 피하고 물을 많이 마시며 천천히 걷는다. 안데스 원주민은 수천 년 적응의 결과로 폐가 크고 혈액의 산소 운반 능력이 높다. 잉카 병사들이 5천m 고개를 달려 넘은 것은 이 몸 덕분이다."]}]},"puno":{"id":"puno","name":"푸노·티티카카","articles":[{"title":"잉카가 태어난 호수","paragraphs":["티티카카는 해발 3,812m, 면적 8,300km²로 세계에서 가장 높은 곳에 있는 대형 호수다. 남한 면적의 8%가 넘고 가장 깊은 곳은 280m다. 안데스 사람들에게 이곳은 세상이 시작된 자리다. 창조신 비라코차가 호수에서 나와 해와 달과 별을 만들었고, 첫 잉카 부부 망코 카팍과 마마 오클로가 호수 안 태양의 섬에서 태어나 쿠스코로 갔다고 한다.","잉카 이전에 이 호수 남쪽에는 티와나쿠 문명(500~1000년)이 있었다. 라파즈 근교의 티와나쿠 유적은 거석 신전과 태양의 문으로 유명하고, 잉카는 자신들의 석조 기술과 신화 상당 부분을 이 문명에서 물려받았다. 호수 이름은 아이마라어로 퓨마의 바위라는 뜻이라는 설이 유력하다. 페루와 볼리비아가 호수를 나눠 갖고 있어 페루 쪽 사람들은 티티는 페루 것, 카카는 볼리비아 것이라는 농담을 한다."]},{"title":"갈대 위에서 사는 사람들","paragraphs":["우로스는 토토라 갈대를 엮어 만든 인공 섬 위에 사는 사람들이다. 원래는 호수 주변에 살던 우루족이 콜라족과 잉카의 압박을 피해 호수 안으로 들어간 것이 시작이다. 섬은 갈대 뿌리 덩어리를 밧줄로 묶어 띄우고 그 위에 마른 갈대를 겹겹이 깐다. 아래층 갈대가 썩기 때문에 2~3주마다 새 갈대를 위에 덧대고, 섬 하나의 수명은 약 30년이다. 집, 배, 심지어 간식(갈대 밑동의 흰 부분)까지 갈대다.","현재 약 100개 섬에 2천 명 정도가 살고, 거의 전적으로 관광 수입에 의존한다. 섬마다 순번을 정해 관광객을 받고, 태양광 패널로 전기를 쓰며 아이들은 배로 통학한다. 보여 주기용이라는 비판도 있지만 이들이 갈대 섬을 유지하는 기술 자체는 진짜다. 푸노 항구에서 보트로 30분 거리이고 반나절이면 충분하다."]},{"title":"뜨개질하는 남자들의 섬, 타킬레","paragraphs":["타킬레는 우로스보다 훨씬 안쪽에 있는 진짜 섬으로 보트로 2~3시간 걸린다. 인구 2천 명의 케추아 공동체가 사는데, 이곳의 남자들은 어릴 때부터 뜨개질을 배운다. 모자 색과 무늬가 결혼 여부와 사회적 지위를 나타내고, 남자는 자기 모자를 직접 짜서 신부 가족에게 실력을 증명해야 한다. 이 직조 문화는 2005년 유네스코 인류무형유산에 올랐다. 섬에는 차도 개도 없고 호텔 대신 민박을 공동체가 순번으로 운영한다."]},{"title":"노새가 싣고 온 증기선","paragraphs":["푸노 항구에는 야바리라는 증기선이 있다. 1862년 영국 버밍엄에서 만들어져 2,766개의 부품으로 분해된 채 배로 페루에 왔고, 사막과 안데스를 넘어 노새와 짐꾼이 6년에 걸쳐 4천m 고원까지 날랐다. 1870년 진수 후 라마 배설물을 연료로 달렸다는 기록이 있다. 지금은 박물관 겸 숙소로 복원돼 있다. 푸노는 페루의 민속 수도로 불리며, 매년 2월 칸델라리아 축제 때는 수만 명의 무용수가 악마 춤(디아블라다)을 추며 2주간 도시를 채운다."]}]},"lapaz":{"id":"lapaz","name":"라파즈","articles":[{"title":"협곡 속의 수도","paragraphs":["라파즈는 1548년 알론소 데 멘도사가 포토시의 은을 리마로 나르는 길목에 세웠다. 정식 이름은 누에스트라 세뇨라 데 라 파스(평화의 성모)다. 도시는 초케야푸 강이 판 깊은 협곡 안에 들어앉아 있어, 고도가 3,200m에서 4,100m까지 900m나 차이 난다. 다른 도시와 반대로 이곳에서는 높은 곳이 가난하고 낮은 곳이 부유하다. 협곡 위 고원 도시 엘 알토(4,100m)는 이주 원주민의 도시이고, 협곡 바닥의 소나 수르는 공기가 따뜻하고 산소가 많아 부촌이 됐다.","볼리비아의 헌법상 수도는 수크레다. 1899년 내전에서 라파즈가 이기면서 정부와 의회가 라파즈로 옮겨 왔고, 대법원만 수크레에 남았다. 그래서 라파즈는 세계에서 가장 높은 행정 수도로 불린다. 2014년 개통한 미 텔레페리코 케이블카는 지형 때문에 지하철을 놓을 수 없는 이 도시의 해법이다. 10개 노선 30km가 넘는 세계 최장 도시 케이블카망으로, 시내 교통수단이면서 동시에 도시 전체와 일리마니 설산(6,438m)이 보이는 최고의 전망대다."]},{"title":"은의 산에서 리튬까지: 볼리비아 압축사","paragraphs":["볼리비아 역사는 땅속 자원의 역사다. 1545년 발견된 포토시의 세로 리코(부유한 산)는 200년간 세계 은의 절반 이상을 쏟아냈고, 17세기 포토시는 런던보다 큰 도시였다. 그 은을 캐다 죽은 원주민과 아프리카 노예는 수백만으로 추산된다. 볼리비아 사람들은 이것을 유럽을 먹여 살린 산이라고 부른다.","1825년 독립 후 볼리비아는 영토의 절반 이상을 이웃에 잃었다. 태평양 전쟁으로 칠레에 해안을(1879~84), 아크레 전쟁으로 브라질에 고무 지대를(1903), 차코 전쟁으로 파라과이에 남부 저지대를(1932~35) 내줬다. 1952년 혁명으로 광산 국유화와 토지 개혁, 원주민 보통선거가 이뤄졌고, 2006년 아이마라 출신 에보 모랄레스가 첫 원주민 대통령이 됐다. 그는 2019년 부정선거 논란 속에 사임했다. 볼리비아 인구의 40% 이상이 원주민으로 남미에서 비율이 가장 높고, 아이마라어와 케추아어가 스페인어와 함께 공용어다. 그리고 우유니 아래 묻힌 리튬은 21세기의 은이 될지 모른다."]},{"title":"촐리타: 중절모와 폴레라 치마","paragraphs":["라파즈 거리에서 만나는 폭 넓은 치마(폴레라), 숄, 작은 중절모(봄빈)를 쓴 여성들이 촐리타다. 촐라는 원래 원주민 혼혈 여성을 낮춰 부르는 말이었다. 폴레라 치마는 18세기 스페인 여성 복장을 식민 당국이 원주민에게 강제한 것이고, 중절모는 1920년대 영국 철도 노동자용으로 들여온 모자가 사이즈가 맞지 않아 여성에게 팔렸다는 설이 유력하다.","20세기 내내 촐리타는 식당 출입, 버스 탑승, 공직 진출에서 차별받았다. 2000년대 이후 상황이 뒤집혀 지금은 촐리타 복장이 자부심의 상징이 됐고, 촐리타 앵커, 촐리타 국회의원, 촐리타 등반대가 있다. 엘 알토의 촐리타 레슬링은 여성 레슬러들이 전통 복장으로 링에 오르는 쇼로, 원래는 가정폭력 피해 여성들의 자기방어 모임에서 시작됐다."]},{"title":"마녀시장과 파차마마","paragraphs":["사가르나가 거리 옆 마녀시장에서는 말린 야마 태아, 개구리, 부엉이 깃털, 색색의 사탕 판을 판다. 야마 태아(수유)는 집을 지을 때 기초 아래 묻어 파차마마(대지의 어머니)에게 바치는 제물이다. 대부분 자연 유산한 태아를 모아 파는 것이다. 사탕과 미니어처를 얹은 판은 메사라고 하며, 야티리(아이마라 주술사)가 소원에 맞춰 조합해 태우는 용도다.","안데스에서는 가톨릭과 파차마마 신앙이 500년째 공존한다. 술을 마시기 전 첫 모금을 땅에 뿌리는 차야는 파차마마에게 먼저 권하는 것이고, 8월은 땅이 입을 여는 파차마마의 달이라 제물을 바친다. 매년 1월 알라시타스 축제에서는 갖고 싶은 것의 미니어처(집, 차, 돈다발, 졸업장)를 사서 축복을 받으면 그해 진짜가 생긴다고 믿는다. 라파즈 공항 근처 엘 알토에서는 실제로 야티리들이 거리에서 점을 본다."]}]},"uyuni":{"id":"uyuni","name":"우유니","articles":[{"title":"소금 사막이 만들어진 4만 년","paragraphs":["우유니 소금사막은 면적 10,582km²로 세계 최대다. 약 4만 년 전 이 고원 전체를 덮었던 거대한 민친 호수가 마르고, 다시 타우카 호수가 생겼다 1만 년 전쯤 완전히 증발하면서 소금이 남았다. 소금층은 두께가 최대 10m, 표면은 극도로 평평해 전체 고저차가 1m 이내다. 그래서 인공위성이 고도계를 보정하는 기준면으로 쓴다.","소금 아래 염수에는 리튬이 녹아 있다. 볼리비아는 세계 최대 리튬 매장국으로 추정되며(약 2,100만 톤), 아르헨티나·칠레와 함께 리튬 삼각지대를 이룬다. 전기차 배터리 시대에 이 하얀 평원이 볼리비아 경제를 바꿀 수 있지만, 국유화 원칙과 기술 부족으로 개발은 더디다. 소금 표면의 육각형 무늬는 소금이 마르며 수축할 때 생기는 것으로, 12~3월 우기에 얕은 물이 덮이면 하늘을 비추는 거울이 된다. 9월 말은 건기라 거울 대신 끝없이 하얀 평원과 원근감이 사라진 사진, 그리고 밤하늘의 은하수가 주인공이다."]},{"title":"선인장 섬과 산호","paragraphs":["소금평원 한복판의 잉카와시(잉카의 집) 섬은 옛 화산의 꼭대기다. 섬을 덮은 거대 선인장은 1년에 1cm씩 자라 큰 것은 12m, 나이가 1,200년이 넘는다. 섬의 바위를 자세히 보면 산호와 조류 화석이 있다. 이곳이 호수 바닥이었다는 증거다. 잉카 시대에는 소금평원을 건너는 대상들의 쉼터였다.","우유니 마을 외곽의 기차 무덤은 1890년대 영국 기술자들이 건설한 안토파가스타~볼리비아 철도의 유산이다. 우유니는 1889년 이 철도의 교차점으로 세워진 마을이고, 광산 붐이 꺼지고 1940년대 광산이 문을 닫으면서 증기기관차들이 이곳에 버려졌다. 소금기 섞인 바람에 녹슨 철골은 지금 우유니의 첫 포토존이다."]},{"title":"붉은 호수와 국경의 영웅","paragraphs":["투어 2일차의 라구나 콜로라다는 물이 붉다. 붉은 조류와 플랑크톤, 미네랄 때문이고, 바람과 시간대에 따라 색이 변한다. 이 붉은 물에 사는 조류를 먹고 살아 몸이 분홍색인 제임스 플라밍고는 한때 멸종한 것으로 여겨졌다가 1957년 이곳에서 다시 발견됐다. 세계 개체수 대부분이 이 일대에 산다.","이 지역은 에두아르도 아바로아 국립 안데스 동물 보호구역이다. 아바로아는 태평양 전쟁 첫 전투(1879년 토파테르)에서 칠레군의 항복 요구에 맞서다 전사한 볼리비아의 국민 영웅이다. 국경 지대에 그의 이름이 붙은 것은 우연이 아니다. 보호구역 입장료(현금 볼리비아노)는 별도이고, 4,900m 고지의 새벽 간헐천(솔 데 마냐나)과 노천 온천을 지나면 칠레 국경이다. 국경에서 볼리비아 출국 도장을 받고 칠레 쪽에서는 과일·씨앗·유제품·코카잎을 엄격히 검사한다."]},{"title":"소금 호텔에서의 이틀","paragraphs":["소금 호텔은 소금 벽돌로 벽을 쌓고 바닥에 소금 알갱이를 깐 숙소다. 침대 틀, 식탁, 의자도 소금이다. 물이 귀한 곳이라 샤워는 시간이 제한되거나 유료이고 뜨거운 물이 안 나올 수 있으며, 전기도 저녁 몇 시간만 들어오는 곳이 많다. 보조배터리를 미리 충전하고, 밤에는 영하로 내려가므로 침낭(투어사 대여)과 두꺼운 양말이 필요하다.","지프 한 대에 6명이 타고 사흘을 함께 다닌다. 물과 간식, 화장지, 물티슈, 헤드랜턴, 선글라스, 선크림은 우유니 마을에서 미리 사야 한다. 2일차 밤 숙소는 4,300m 고지라 우유니보다 춥고 숨이 차다. 별은 1일차 밤 소금평원에서 가장 잘 보인다."]}]},"atacama":{"id":"atacama","name":"산페드로 데 아따까마","articles":[{"title":"400년 동안 비가 안 온 땅","paragraphs":["아타카마는 극지방을 빼면 지구에서 가장 건조한 사막이다. 원인은 이중 비그늘이다. 동쪽 안데스가 아마존의 습기를 막고, 서쪽에서는 차가운 훔볼트 해류가 바다 위 공기를 식혀 비구름이 생기지 않게 한다. 일부 기상 관측소는 관측 이래 강수량 0을 기록했고, 사막 중심부는 400년 이상 비가 오지 않은 것으로 추정된다. 토양이 너무 건조해 미생물조차 없는 곳이 있어 NASA가 화성 탐사 장비를 여기서 시험한다.","산페드로 데 아타카마는 이 사막 안의 오아시스 마을이다. 흙벽돌(아도베) 집과 비포장 골목, 중심가 카라콜레스 거리에 식당과 여행사가 몰려 있다. 마을 광장의 산페드로 교회는 17세기에 지어진 칠레 최고(最古)급 교회로, 천장을 선인장 나무와 가죽끈으로 엮었다. 고도 2,400m로 우유니보다 1,200m 낮아 국경을 넘으면 몸이 한결 편해진다."]},{"title":"세계 천문학의 수도","paragraphs":["아타카마 하늘은 1년에 300일 이상 맑고 대기가 건조하며 주변에 불빛이 없다. 그래서 세계 최대 전파망원경 ALMA가 산페드로 근처 5,000m 차낙토르 고원에 있다. 접시 안테나 66개를 연결해 하나의 거대한 망원경처럼 쓰며, 미국·유럽·일본·한국 등이 참여한다. 2019년 인류 첫 블랙홀 사진에도 ALMA가 기여했다. 남쪽 파라날 산의 VLT, 건설 중인 세계 최대 광학망원경 ELT도 이 사막에 있다.","산페드로 마을에서도 밤에 조명을 벗어나면 은하수가 맨눈으로 보인다. 관광용 별 관측 투어가 많고, 맑은 날 밤 마을 외곽에 서 있기만 해도 남십자성과 마젤란 은하를 찾을 수 있다. 다만 이번 일정은 저녁 비행기로 산티아고로 떠나므로 밤하늘은 우유니에서 챙겨야 한다."]},{"title":"초석, 광부, 그리고 미라","paragraphs":["아타카마의 모래에는 초석(질산나트륨)이 묻혀 있다. 19세기 말 화약과 비료 원료로 유럽이 앞다퉈 사들였고, 이 이권을 두고 칠레가 페루·볼리비아와 태평양 전쟁을 벌여 이 땅을 가져갔다. 사막 곳곳에 남은 초석 공장 도시 험버스톤과 산타 라우라는 1930년대 합성 질산염 발명으로 버려져 유령 도시가 됐고 지금은 유네스코 세계유산이다.","2010년 이 사막의 산호세 광산에서 광부 33명이 지하 700m에 69일간 갇혔다 전원 구조된 사건은 전 세계가 지켜봤다. 한편 아타카마 북부 해안에서는 7천 년 전 친초로 문화의 미라가 발견됐다. 이집트보다 2천 년 앞선 세계 최고(最古)의 인공 미라다. 건조한 사막은 모든 것을 보존한다. 산페드로 마을 사람들 다수는 리칸 안타이(아타카메뇨) 원주민의 후손으로, 잉카 이전부터 이 오아시스에서 살아왔다."]}]},"santiago":{"id":"santiago","name":"산티아고","articles":[{"title":"우엘렌 언덕에서 시작된 도시","paragraphs":["1541년 2월 12일 페드로 데 발디비아가 마포초 강가의 작은 언덕 우엘렌 옆에 산티아고를 세웠다. 이 언덕이 지금의 산타루시아 언덕이다. 발디비아는 몇 달 뒤 남쪽 마푸체족의 공격으로 도시가 불탄 뒤에도 재건을 고집했고, 마푸체와의 전쟁은 이후 300년간 이어졌다. 스페인은 끝내 칠레 남부를 정복하지 못했고 마푸체는 지금도 칠레 인구의 약 10%로 정체성 운동을 이어 간다.","1810년 9월 18일 산티아고에서 첫 자치 정부가 세워졌고, 이날은 지금도 칠레 최대 명절 디에시오초다. 1818년 산 마르틴과 베르나르도 오이긴스가 안데스를 넘어온 군대로 독립을 확정했다. 오이긴스는 아일랜드계 스페인 총독의 사생아였고, 산티아고의 중심 대로에 그의 이름이 붙어 있다. 이번 여행이 도착하는 10월 초는 9월 18일 연휴 직후라 도시가 아직 축제 분위기의 여운을 갖고 있을 수 있다."]},{"title":"1973년 9월 11일, 라 모네다","paragraphs":["칠레 현대사의 중심은 아르마스 광장 남쪽의 대통령궁 라 모네다다. 1970년 세계 최초로 선거로 집권한 사회주의자 살바도르 아옌데는 구리 국유화와 토지 개혁을 밀어붙였고, 1973년 9월 11일 아우구스토 피노체트 장군의 쿠데타로 무너졌다. 공군기가 라 모네다를 폭격하는 동안 아옌데는 라디오 연설을 남기고 궁 안에서 사망했다.","피노체트 정권 17년 동안 3천 명 이상이 살해되거나 실종됐고 수만 명이 고문당했다. 동시에 시카고 대학 출신 경제학자들이 급진적 시장 경제를 도입해 오늘날 칠레 경제의 틀을 만들었다. 1988년 국민투표에서 반대(NO) 진영이 이기면서 1990년 민주 정부가 들어섰고, 이 과정은 영화 노(No)로 만들어졌다. 2019년에는 지하철 요금 인상에서 시작된 대규모 시위(에스타이도 소시알)가 헌법 개정 논의로 이어졌다. 산티아고 곳곳의 벽화와 기념관은 이 기억의 흔적이다."]},{"title":"네루다와 라 차스코나","paragraphs":["파블로 네루다는 1971년 노벨문학상을 받은 칠레의 시인이자 외교관, 공산당 상원의원이었다. 산크리스토발 언덕 아래 베야비스타의 라 차스코나는 그가 1953년 비밀 연인 마틸데 우루티아를 위해 지은 집이다. 차스코나는 헝클어진 머리라는 뜻으로 마틸데의 붉은 곱슬머리를 가리킨다. 집은 배 모양으로 지어졌고 방마다 그가 세계에서 모은 물건이 가득하다.","네루다는 1973년 쿠데타 12일 뒤 병원에서 죽었다. 공식 사인은 전립선암이었지만 독살 의혹이 계속 제기됐고, 2023년 법의학 조사에서 독성 박테리아가 검출됐다는 발표가 나왔다. 그의 장례식은 쿠데타 후 첫 공개 저항 집회가 됐다. 라 차스코나는 쿠데타 직후 군에 의해 파괴됐다가 마틸데가 복원해 지금은 박물관이다."]},{"title":"안데스, 와인, 그리고 마지막 저녁","paragraphs":["산티아고는 해발 520m 분지에 있고 동쪽으로 6천m급 안데스가 병풍처럼 서 있다. 겨울(6~8월)에는 스모그로 산이 잘 안 보이지만 봄인 10월 초는 비 온 뒤 설산이 선명하게 보이는 시기다. 산크리스토발 언덕(880m)은 푸니쿨라나 케이블카로 오르며, 정상의 성모상 앞에서 도시와 안데스를 한눈에 본다.","칠레 와인은 프랑스 품종을 19세기에 들여와 필록세라 없이 보존한 것이 강점이다. 특히 카르메네르는 프랑스에서는 멸종하다시피 했는데 칠레에서 메를로로 잘못 알려진 채 자라다 1994년 재발견됐다. 산티아고 남쪽 마이포 계곡이 주산지다. 마지막 저녁으로는 완전한 칠레식 메뉴가 어울린다. 파스텔 데 초클로(옥수수 크림 아래 다진 고기), 메르카도 센트랄의 해산물(파일라 마리나 수프, 성게, 대게), 그리고 아보카도와 토마토를 얹은 핫도그 콤플레토. 피스코 사워 칠레 버전을 마시며 페루 것과 비교하는 것으로 여행을 마무리하면 된다."]}]},"geo":{"id":"geo","name":"땅과 하늘: 지질·자연","articles":[{"title":"안데스는 왜 이렇게 높은가","paragraphs":["안데스는 태평양 바닥의 나스카판이 남아메리카판 아래로 1년에 6~7cm씩 파고들면서 만들어졌다. 대륙 가장자리가 밀려 두꺼워지고 구겨지며 솟아올랐고, 녹은 암석이 화산으로 터져 나왔다. 히말라야가 두 대륙의 충돌이라면 안데스는 바다가 대륙 밑으로 사라지는 현장이다. 그래서 안데스에는 활화산이 200개 가까이 있고, 페루·볼리비아·칠레 전부가 환태평양 조산대(불의 고리) 위에 있다.","이 융기는 약 2,500만 년 전부터 빨라졌고 지금도 진행 중이다. 쿠스코의 잉카 석벽이 지진에 강하게 설계된 것, 리마가 몇 백 년마다 대지진을 맞는 것, 아타카마에 구리가 묻힌 것, 우유니에 리튬이 녹아 있는 것이 모두 같은 원인에서 나온다. 여행 중 만나는 풍경의 절반은 이 판의 충돌이 만든 것이다.","7,000km에 이르는 안데스는 세계에서 가장 긴 산맥이고, 최고봉 아콩카과(6,961m, 아르헨티나)는 아시아 밖에서 가장 높은 산이다. 이번 여행에서 보는 산들도 만만치 않다. 라파즈 뒤의 일리마니 6,438m, 볼리비아 최고봉 사하마 6,542m, 아타카마 마을 뒤의 리칸카부르 5,916m."]},{"title":"알티플라노: 티베트 다음으로 큰 고원","paragraphs":["쿠스코를 지나 푸노부터 우유니까지 여행하는 땅이 알티플라노다. 평균 해발 3,750m, 길이 약 1,000km로 티베트 고원 다음으로 넓은 고원이다. 안데스가 동서 두 줄기(코르디예라)로 갈라지면서 그 사이가 높이 들려 평평한 분지가 됐고, 여기에 물이 고여 거대한 호수들이 생겼다.","티티카카는 그 호수 중 살아남은 것이다. 남쪽으로는 데사구아데로 강을 통해 포오포 호수로 흐르는데, 포오포는 2015년 완전히 말라 버렸다. 티티카카 물의 90%는 강으로 빠지지 않고 증발한다. 우유니 소금사막은 이 고원의 남쪽 끝에서 물이 다 증발한 뒤 남은 바닥이다. 즉 이번 여행은 하나의 거대한 고원을 북쪽 호수에서 남쪽 소금 바닥까지 종단하는 코스다."]},{"title":"훔볼트 해류와 엘니뇨","paragraphs":["페루 앞바다에는 남극에서 올라온 차가운 훔볼트 해류가 흐른다. 이 바닷물이 깊은 곳의 영양분을 끌어올려 세계 최대의 어장을 만든다. 페루의 안초베타(멸치) 어획량은 단일 어종으로 세계 1위이고, 그 대부분이 어분이 되어 전 세계 양식장으로 간다. 세비체가 싱싱한 것도, 바예스타 섬의 바닷새 수십만 마리도 이 해류 덕분이다.","몇 년에 한 번 이 해류가 약해지고 따뜻한 물이 밀려온다. 크리스마스 무렵에 잘 나타나 페루 어부들이 아기 예수라는 뜻의 엘니뇨라고 불렀다. 엘니뇨가 오면 물고기가 사라지고 사막 리마에 폭우가 내리며, 반대로 지구 반대편 호주·인도네시아는 가뭄이 든다. 페루 해안의 작은 수온 변화가 전 지구 기후를 흔드는 것이다. 2023~2024년 강한 엘니뇨 뒤 지금은 평년에 가까운 상태다."]},{"title":"바다에 붙은 사막","paragraphs":["리마에서 아타카마까지 해안 3,500km는 거의 끊어지지 않는 사막이다. 바다 옆에 사막이 있는 이유는 훔볼트 해류다. 찬 바다 위의 공기는 무겁고 안정돼 비구름이 생기지 않고, 대신 낮은 안개만 만든다. 리마의 가루아 안개, 아타카마의 카만차카 안개가 그것이다. 이 안개를 먹고 사는 사막 식물 군락(로마스)이 해안 언덕에 띠처럼 자란다.","이카의 모래언덕은 이 사막의 하이라이트다. 나스카 근처 세로 블랑코는 높이 1,000m 이상으로 세계에서 가장 높은 사구로 꼽힌다. 와카치나 주변 사구도 100~200m로, 버기카가 오르는 언덕이 아파트 40층 높이다. 이 모래는 안데스에서 강이 실어 온 퇴적물이 바람에 다시 쌓인 것이다."]},{"title":"리마의 지진, 그리고 흔들리면 할 일","paragraphs":["리마는 1687년, 1746년, 1940년, 1974년, 2007년에 큰 지진을 겪었다. 1746년에는 도시가 무너지고 카야오 항구가 쓰나미로 사라졌다. 2007년 피스코 지진(규모 8.0)은 이카 근처가 진원이었고 500명 이상이 죽었다. 지질학자들은 리마 앞바다에 200년 이상 에너지가 쌓여 있다고 본다.","여행자가 할 일은 단순하다. 호텔 방에 들어가면 비상계단 위치를 확인한다. 흔들리면 문틀이나 튼튼한 탁자 아래로, 창문과 거울에서 멀어진다. 엘리베이터는 쓰지 않는다. 해안(미라플로레스 절벽 아래, 바랑코 해변)에서 강한 진동을 느끼면 즉시 높은 곳으로 올라간다. 페루 건물의 녹색 S 표시(Zona Segura)가 대피 안전 지점이다. 칠레는 지진 대비가 세계 최고 수준이라 건물 안에 있는 것이 대개 가장 안전하다."]},{"title":"우유니 소금의 육각형은 왜 생기나","paragraphs":["소금사막 표면은 한 변이 1m 안팎인 육각형 타일로 덮여 있다. 오랫동안 마른 진흙이 갈라지듯 소금이 수축해 갈라진 것으로 설명했지만, 2023년 물리학자들이 다른 답을 냈다. 소금 껍질 아래 염수가 아래에서 위로 천천히 순환(대류)하고, 그 순환 세포의 크기가 육각형 크기를 정한다는 것이다. 세계 어느 소금사막에서도 육각형 크기가 비슷한 이유가 이것이다. 발밑의 무늬는 땅속 물의 움직임을 보여 주는 지도다.","이 염수에는 리튬·칼륨·마그네슘·붕소가 녹아 있다. 볼리비아 정부는 우유니 남쪽에 리튬 공장을 세웠지만 증발 방식은 물이 많이 들고 느려서 생산량이 적다. 지프가 지나는 새하얀 평원 아래 수십 미터에 21세기 배터리 산업이 노리는 액체가 잠겨 있다."]},{"title":"색깔 호수의 화학","paragraphs":["투어 2일차에 만나는 호수들은 저마다 색이 다르다. 라구나 콜로라다의 붉은색은 붉은 조류와 플랑크톤, 그리고 호수 바닥의 붉은 퇴적물이 바람에 섞인 것이다. 색은 시간대와 바람에 따라 주황에서 진홍으로 바뀐다. 국경 근처 라구나 베르데는 구리·비소·납 성분 때문에 에메랄드빛인데, 바람이 물을 섞어야 색이 살아나서 오전 늦게가 가장 선명하다. 그래서 유독하고, 어떤 호수도 손을 담그지 않는 것이 규칙이다.","솔 데 마냐나(아침의 태양)는 해발 4,850m의 지열 지대다. 진흙이 부글거리고 증기가 50m까지 솟지만 엄밀히는 간헐천이 아니라 분기공이다. 새벽에 기온이 낮을 때 증기가 가장 장관이고, 가장자리는 얇아서 무너질 수 있으니 표시된 길 밖으로 나가지 않는다. 그 뒤에 들어가는 폴케스 온천은 35도 안팎의 천연 온천이고, 영하의 새벽에 몸을 담그는 것이 이 투어의 명장면이다."]},{"title":"아타카마: 화성에 가장 가까운 땅","paragraphs":["아타카마는 최소 1,500만 년 동안 극도로 건조했던, 지구에서 가장 오래된 사막이다. 토양에는 화성 표면과 같은 과염소산염이 있고, 일부 지역은 유기물이 거의 없어 NASA가 화성 탐사 로버의 생명 탐지 장비를 여기서 시험한다. 2003년 이 사막 토양으로 바이킹 탐사선의 실험을 재현했더니 화성처럼 생명이 없다는 결과가 나와 화제가 됐다.","산페드로 마을 동쪽에 우뚝 선 리칸카부르 화산(5,916m)은 볼리비아와 칠레의 국경이다. 정상 분화구 안에 세계에서 가장 높은 호수 중 하나가 있고, 겨울에도 얼지 않는 이 호수는 잉카 시대 제단이 있던 곳이다. 우유니 투어 마지막 날 국경을 넘어 내려오면서 이 산을 정면으로 보게 된다."]},{"title":"칠레의 구리와 규모 9.5","paragraphs":["칼라마 공항으로 가는 길에 지나는 추키카마타는 부피 기준 세계 최대의 노천 구리 광산이다. 길이 4.3km, 깊이 900m의 구멍이 100년 넘게 파였다. 칠레는 세계 구리의 4분의 1을 생산하고, 이 광산들의 세금이 칠레 경제를 떠받친다. 스마트폰 안 구리의 상당 부분이 이 사막에서 나왔다.","칠레는 지진의 나라이기도 하다. 1960년 발디비아 지진은 규모 9.5로 인류가 기록한 가장 강한 지진이고, 그 쓰나미가 하와이와 일본까지 갔다. 2010년 마울레 지진(8.8) 때 산티아고 고층 건물들이 거의 피해 없이 버틴 것은 세계 최고 수준의 내진 규정 덕분이다. 산티아고에서 진동을 느끼면 건물 밖으로 뛰어나가지 말고 안에서 기다리는 것이 칠레 사람들의 상식이다."]},{"title":"고도가 몸에 하는 일","paragraphs":["해발 3,400m 쿠스코의 공기는 해수면의 65%, 우유니 투어 최고점 4,950m에서는 55%의 산소만 담고 있다. 몸은 처음 며칠 호흡과 심박을 늘려 버티고, 2~3주가 지나야 적혈구가 늘어난다. 우리 일정은 그 적응 기간 안에 끝나므로 계속 약간 힘든 상태다. 고산약(아세타졸아미드)은 혈액을 약간 산성으로 만들어 호흡을 재촉하는 원리로, 적응을 빠르게 한다.","고도는 일상도 바꾼다. 쿠스코에서 물은 88도에서 끓어 차가 덜 뜨겁고 밥이 덜 익는다. 압력이 낮아 감자칩 봉지가 빵빵하게 부풀고, 볼펜 잉크가 새고, 선크림 뚜껑을 열면 튄다. 자외선은 해수면보다 40% 이상 강해 흐린 날에도 탄다. 안데스 사람들이 감자를 밤 서리에 얼리고 낮에 밟아 물을 뺀 추뇨를 만든 것도 이 기후 덕분이다. 세계 최초의 냉동건조 식품이다."]},{"title":"남반구의 밤하늘 읽는 법","paragraphs":["우유니와 아타카마의 밤하늘에는 한국에서 볼 수 없는 것이 세 가지 있다. 첫째, 남십자성. 남쪽 하늘의 작은 십자 모양 네 별로, 긴 축을 4.5배 연장하면 남쪽 하늘의 극점이다. 옆의 밝은 두 별(켄타우루스 알파·베타)이 가짜 십자와 구별하는 표지다. 둘째, 대·소 마젤란 은하. 남쪽 하늘에 떠 있는 희미한 구름 두 조각으로, 우리 은하의 위성 은하다. 셋째, 은하수의 중심. 9월 말 저녁 8~9시에 은하수 중심부(궁수자리)가 서쪽 하늘 높이 걸려 있어 가장 밝고 굵은 부분이 보인다.","잉카는 별이 아니라 은하수의 어두운 부분으로 별자리를 만들었다. 남십자성 옆의 검은 구멍(석탄자루 성운)은 야카나라는 검은 야마, 그 옆은 새끼 야마, 두꺼비, 여우, 뱀이다. 밤에 은하수를 볼 때 밝은 별 대신 검은 강줄기를 따라가면 그들이 본 하늘이 보인다. 스마트폰 야간 모드로 10~30초 노출을 주면 은하수가 찍힌다. 폰을 바위나 지프 지붕에 고정하고, 화면 밝기를 최소로 낮추고, 눈이 어둠에 적응하는 데 20분이 걸린다는 것만 기억하면 된다."]}]},"trivia":{"id":"trivia","name":"네타 창고: 알면 재미있는 것들","articles":[{"title":"패딩턴 베어는 페루에서 왔다","paragraphs":["영국의 국민 곰 패딩턴은 어두운 페루에서 마멀레이드를 좋아하는 이모 루시 손에 자라 런던으로 밀항한 곰이다. 작가 마이클 본드는 원래 아프리카 출신으로 쓰려다 아프리카에 곰이 없다는 지적에 페루로 바꿨다. 실제로 안데스에는 남미 유일의 곰인 안경곰이 산다. 미라플로레스 해안 절벽의 살라사르 공원에는 2015년 영국이 선물한 패딩턴 동상이 서 있다. 라르코마르 바로 옆이라 첫날 산책 코스에 넣기 좋다."]},{"title":"코카콜라가 이기지 못한 나라","paragraphs":["페루는 코카콜라가 판매 1위를 빼앗기지 못한 몇 안 되는 나라다. 1935년 리마의 영국 이민자 가족이 만든 노란 탄산음료 잉카 콜라가 늘 1위였다. 레몬 버베나 향에 풍선껌 맛이라는 평이 많고, 페루 사람들은 치파(중국 요리)와 함께 마시는 것이 진리라고 한다. 1999년 코카콜라가 결국 지분 절반을 사 버렸지만 페루에서는 여전히 잉카 콜라 로고가 코카콜라보다 크다."]},{"title":"감자 4천 종의 고향","paragraphs":["감자는 티티카카 호수 주변에서 약 8천 년 전 처음 재배됐다. 페루에는 지금도 4천 종 넘는 감자가 있고, 색은 노란색·보라색·붉은색·검은색까지 다양하다. 리마에는 국제감자센터가 있어 전 세계 감자 유전자를 보관한다. 16세기 스페인이 유럽으로 가져간 감자는 아일랜드와 독일 인구를 폭발시켰고, 프렌치프라이는 결국 안데스 원산이다. 시장에서 감자 이름을 물으면 열 가지는 나온다."]},{"title":"야마, 알파카, 비쿠냐, 과나코 구별법","paragraphs":["넷 다 낙타과 사촌이다. 야마는 크고 귀가 바나나처럼 휘었고 짐을 나른다. 알파카는 작고 얼굴이 뭉툭하며 털이 폭신하다. 사진에 자주 나오는 것은 대부분 알파카다. 비쿠냐는 야생이고 가늘고 우아하며, 그 털은 세계에서 가장 고운 동물 섬유라 잉카 시대에는 왕만 입었다. 지금도 3년에 한 번 마을 전체가 몰이(차쿠)를 해서 깎고, 비쿠냐 스카프 하나가 수백만 원이다. 과나코는 야생 야마로 아타카마와 파타고니아에 산다. 국경을 넘어 칠레로 내려올 때 도로 옆에 보이는 것이 비쿠냐 아니면 과나코다."]},{"title":"최후의 만찬에 기니피그가 있다","paragraphs":["쿠스코 대성당의 최후의 만찬 그림(마르코스 사파타, 1753)에는 식탁 한가운데 구운 기니피그가 놓여 있다. 안데스 화가가 성서 장면을 자기 땅의 잔칫상으로 옮긴 것이다. 옆에는 치차 술잔도 보인다. 페루는 1년에 기니피그 6천5백만 마리를 먹고, 축제 음식이라 값도 비싸다. 반 마리에 뼈가 많고 살은 적어 맛보다 경험에 가깝다. 기니피그를 애완동물로 만든 것은 16세기 유럽이지 안데스가 아니다."]},{"title":"엘 콘도르 파사의 진짜 주인","paragraphs":["사이먼 앤 가펑클의 엘 콘도르 파사는 원래 1913년 페루 작곡가 다니엘 알로미아 로블레스가 쓴 사르수엘라(음악극) 곡이다. 광산 노동자의 저항을 다룬 극에서 자유의 상징으로 콘도르가 등장한다. 폴 사이먼은 파리에서 이 곡을 연주하던 페루 그룹 로스 잉카스에게 배워 가사를 붙였고, 나중에 저작권 소송이 있었다. 2004년 페루는 이 곡을 국가 문화유산으로 지정했다. 쿠스코·푸노 광장에서 팬플루트 연주자가 이 곡을 연주하면 관광객용이 아니라 자기 노래를 부르는 것이다. 안데스 콘도르는 날개 폭 3.3m로 나는 새 중 가장 크고, 잉카에게는 하늘 세계의 사자였다."]},{"title":"세계에서 가장 위험한 도로","paragraphs":["라파즈에서 열대 저지대 코로이코로 내려가는 옛 융가스 도로는 폭 3m의 비포장 절벽길로, 매년 200~300명이 죽어 죽음의 도로라 불렸다. 2006년 새 도로가 생긴 뒤 지금은 자전거 내리막 투어 코스다. 4,650m에서 1,200m까지 64km를 내려오며 열대 우림으로 들어가는 이 투어는 라파즈 자유일정에 넣기에는 하루가 꽉 차지만, 이 도로 이야기를 알면 라파즈 버스 창밖 절벽길이 다르게 보인다."]},{"title":"거꾸로 도는 시계","paragraphs":["라파즈 무리요 광장의 국회 건물 시계는 거꾸로 돈다. 숫자가 반시계 방향으로 붙어 있고 바늘도 반대로 간다. 2014년 정부가 남반구의 시계라며 바꿨다. 북반구에서 해시계 그림자가 시계 방향으로 도는 것을 흉내 낸 것이 시계인데, 남반구에서는 그림자가 반대로 도니 시계도 반대로 가야 한다는 논리다. 시티투어에서 무리요 광장에 들르면 위를 올려다볼 것."]},{"title":"바다 없는 나라의 해군","paragraphs":["볼리비아는 1879년 태평양 전쟁으로 해안을 잃었지만 해군을 해체하지 않았다. 약 5천 명의 해군이 티티카카 호수와 강에서 근무하고, 매년 3월 23일 바다의 날에 바다를 되찾자는 행진을 한다. 2018년 국제사법재판소에 칠레가 협상 의무가 있다고 제소했지만 패소했다. 볼리비아 학교에서는 지금도 잃어버린 해안 지도를 가르친다. 국경에서 칠레로 넘어갈 때 이 감정의 온도를 알면 볼리비아 사람들의 칠레 이야기가 이해된다."]},{"title":"세계에서 가장 높은 국제공항","paragraphs":["라파즈 엘알토 공항은 해발 4,061m로 세계에서 가장 높은 국제공항 중 하나다. 공기가 희박해 비행기가 뜨는 데 더 긴 활주로가 필요하고(4km), 엔진 출력도 제한된다. 승객 쪽 문제도 있다. 착륙 직후 짐을 들고 뛰면 바로 숨이 찬다. 우리는 반대로 새벽 4시에 여기서 우유니로 떠나는데, 이 공항의 새벽은 영하다. 2015년 교황 프란치스코가 여기 착륙할 때 코카차를 마셨다는 이야기가 유명하다."]},{"title":"다카르 랠리가 지나간 소금사막","paragraphs":["2014년부터 2018년까지 다카르 랠리가 볼리비아를 통과했고, 우유니 소금사막이 하이라이트 구간이었다. 소금 위를 시속 150km로 달리는 사륜차와 모터사이클 영상이 우유니를 세계에 알렸다. 소금 표면은 단단해서 자동차가 달릴 수 있지만 가장자리는 물러서 빠진다. 지프 기사들이 정해진 길만 가는 이유다. 소금사막 한가운데 있는 다카르 기념비(소금 조각)가 투어 1일차 사진 포인트다."]},{"title":"코카콜라에 코카잎이 들어간다","paragraphs":["코카콜라의 이름은 코카잎과 콜라 열매에서 왔다. 1903년 코카인 성분은 빼기 시작했지만, 지금도 미국 뉴저지의 한 회사가 페루에서 코카잎을 합법적으로 수입해 코카인을 제거한 추출물을 코카콜라에 공급한다. 코카잎은 페루·볼리비아 사람들에게는 차와 껌이고, 미국에서는 콜라 향료이며, 국경에서는 마약이다. 볼리비아 헌법은 코카잎을 문화유산으로 규정하고, 유엔 마약 협약에서 코카잎 씹는 것을 예외로 인정받았다."]},{"title":"나스카의 우주인과 폰 데니켄","paragraphs":["1968년 스위스 작가 에리히 폰 데니켄은 신들의 전차라는 책에서 나스카 라인이 외계인의 활주로라고 주장해 세계적 베스트셀러가 됐다. 나스카에는 실제로 우주인이라 불리는 손을 흔드는 인물 그림이 있다. 고고학자들은 이것이 부엉이 머리를 한 사람이고, 직선들은 활주로가 아니라 물을 비는 의례 행렬 길이라고 본다. 마리아 라이헤는 이 책이 유적을 망쳤다고 평생 분노했다. 경비행기를 안 타는 대신, 팬아메리칸 고속도로 옆 전망탑(미라도르)에서 손과 나무 그림 두 개를 볼 수 있다는 것은 기억할 만하다."]},{"title":"마추픽추 여권 도장과 라마 정원사","paragraphs":["마추픽추 입구에는 여권에 찍는 기념 도장이 있다. 출구 쪽 부스에서 무료로 찍어 주고, 여권에 관광 도장을 찍는 것은 일부 나라에서 문제가 될 수 있으니 빈 페이지 대신 도장이 이미 있는 페이지 구석에 찍는 사람이 많다. 유적 안의 잔디는 라마 몇 마리가 관리한다. 사람을 겁내지 않아 사진 모델이 되어 주지만 침을 뱉으니 얼굴을 너무 가까이 대지 않는다. 하루 입장 인원은 시간대별로 제한되고, 입장 후 정해진 코스를 한 방향으로만 돈다. 되돌아가서 다시 볼 수 없으니 좋은 사진 자리에서는 시간을 쓴다."]},{"title":"틴틴과 인디아나 존스","paragraphs":["땡땡(틴틴)의 태양의 신전(1949)은 페루가 배경이다. 잉카 후예들의 비밀 신전, 일식으로 위기를 넘기는 장면이 유명하고, 마추픽추 발견 뒤 유럽에 번진 잃어버린 잉카 도시 열풍을 그대로 담았다. 인디아나 존스의 모델로 자주 언급되는 사람이 마추픽추의 하이럼 빙엄이다. 예일 교수, 탐험가, 페도라 모자. 실제로 그는 나중에 코네티컷 주지사와 상원의원이 됐다. 마추픽추로 가는 고급 열차 이름도 하이럼 빙엄호다."]},{"title":"칠레 스페인어는 왜 알아듣기 힘든가","paragraphs":["칠레 스페인어는 남미에서 가장 빠르고 어미의 s를 삼킨다. 스페인어권 사람들도 어렵다고 한다. 알아두면 좋은 것 몇 개. 문장 끝의 포(po)는 아무 뜻 없는 강조다(sí po = 그렇지). 카차이(¿cachai?)는 알겠어? 웨온(weón)은 친구부터 욕까지 다 되는 만능 단어라 외국인은 쓰지 않는다. 한 잔 하자는 카레테(carrete), 멋지다는 바칸(bacán), 간식 시간은 온세(once). 페루에서 배운 표현이 산티아고에서 안 통해도 당황할 필요 없다."]},{"title":"칠레 국기와 텍사스 깃발","paragraphs":["칠레 국기(1817)는 텍사스 주 깃발(1839)과 거의 같아서 미국인들이 자주 헷갈린다. 칠레 쪽이 20년 먼저다. 칠레 국기는 파란 사각형 안에 별 하나가 있고, 텍사스는 파란 띠 전체에 별이 있다. 9월 18일 독립기념일 주간에는 법으로 모든 건물에 국기를 걸어야 해서, 우리가 도착하는 10월 초에도 국기가 많이 남아 있다."]},{"title":"30페소가 아니라 30년","paragraphs":["2019년 10월 산티아고 지하철 요금이 30페소 오르자 학생들이 개찰구를 뛰어넘는 시위를 시작했고, 이것이 수백만 명의 시위로 번졌다. 구호가 30페소가 아니라 30년이었다. 1990년 민주화 이후 30년간 쌓인 불평등에 대한 분노라는 뜻이다. 그 결과 새 헌법 제정 국민투표가 열렸지만 두 번의 개헌안이 모두 부결됐다. 아르마스 광장 주변 벽화와 바케다노 광장(시위의 중심)의 흔적이 그 기억이다."]},{"title":"우유니에서 원근법 사진 잘 찍는 법","paragraphs":["소금사막 사진의 원리는 배경이 없다는 것이다. 지평선까지 하얀 평면이라 거리감이 사라져, 가까운 것과 먼 것이 같은 평면에 있는 것처럼 보인다. 폰을 땅에 거의 붙여서 낮게 잡고, 소품(공룡 피규어, 과자통)은 카메라 앞 30cm에, 사람은 20~30m 뒤에 세운다. 광각보다 기본 렌즈가 왜곡이 적다. 해를 등지고 찍어야 그림자가 앞으로 나와 재미있고, 정오보다 오후 4시 이후 빛이 부드럽다. 기사들이 이 사진에 전문가라 소품만 주면 연출을 알아서 해 준다.","별 사진은 다르다. 야간 모드 10~30초, 폰을 지프 지붕이나 바위에 올려 고정, 셀프타이머 3초로 손 떨림을 없앤다. 화면은 최저 밝기로, 플래시는 끈다. 별과 사람을 같이 찍으려면 사람이 노출 시간 동안 움직이지 않아야 한다. 9월 말은 달의 위상이 관건인데, 9월 26일이 보름 근처라 투어 1일차(9월 30일) 밤은 달이 밝아 은하수보다 달빛 소금사막이 주인공이 될 가능성이 크다. 달빛 아래 하얀 평원도 충분히 비현실적이다."]},{"title":"남미의 아시아 대통령과 페루 정치","paragraphs":["페루는 1990년 일본계 알베르토 후지모리를 대통령으로 뽑았다. 그는 내전을 끝내고 경제를 안정시켰지만 독재와 부패로 결국 감옥에 갔고, 딸 게이코는 세 번 대선에서 아슬아슬하게 졌다. 페루 정치는 그 뒤로도 격동이다. 2016년부터 2023년까지 대통령이 여섯 명 바뀌었고, 2025년 말 또 교체됐으며, 2026년 4~6월 대선으로 새 정부가 7월 28일 취임했다. 리마 거리에서 시위를 보면 이 맥락이다. 관광지 치안과는 별개이니 걱정할 일은 아니고, 대통령궁 앞 아르마스 광장이 시위로 막히면 우회하면 된다."]},{"title":"리마의 중국, 그리고 한국","paragraphs":["리마에는 차이나타운(바리오 치노)이 있고 페루 전체에 중국 음식점 치파가 6천 곳이 넘는다. 1849년부터 온 중국인 계약 노동자 10만 명의 후예다. 페루 인구의 5% 이상이 중국계 혈통을 갖고 있다는 추정이 있고, 볶음밥 차우파와 로모 살타도는 이 만남의 결과다. 한국과의 인연은 2011년 발효된 한·페루 FTA와 K-팝이다. 미라플로레스에는 한식당이 몇 곳 있어 고산 가기 전 마지막 한식을 먹을 수 있다. 칠레와의 FTA(2004)는 한국의 첫 자유무역협정이고, 그래서 콘차 이 토로 와인이 한국 마트에 그렇게 많다."]}]},"nature":{"id":"nature","name":"자연경관: 눈앞의 풍경이 만들어진 이야기","articles":[{"title":"리마 절벽은 강이 쌓은 자갈이다","paragraphs":["미라플로레스 해안 절벽(코스타 베르데)은 높이 70~100m의 자갈층이다. 바위가 아니라 리막 강이 수만 년 동안 안데스에서 실어 내려 쌓은 선상지(부채 모양 퇴적층)의 끝을 바다가 깎아 낸 것이다. 절벽을 가까이 보면 둥근 돌들이 층층이 박혀 있고, 그래서 비가 오면 쉽게 무너진다. 절벽 아래 도로 옆에 낙석 방지 그물이 촘촘한 이유다.","이 자갈층은 리마의 지하수 저장고이기도 하다. 비가 오지 않는 도시가 1천만 명을 먹이는 물의 대부분은 리막 강과 이 지하수에서 나온다. 절벽 위 공원의 초록 잔디는 전부 관개다. 해안 절벽에서 패러글라이더가 뜨는 것은 바다에서 절벽으로 부는 바람이 절벽에 부딪혀 위로 솟기 때문이고, 오후 2~5시가 바람이 가장 좋다."]},{"title":"이카의 오아시스는 어디서 물을 얻나","paragraphs":["사막 한복판의 와카치나 호수는 지하수가 지표로 솟은 곳이다. 안데스에서 내려온 이카 강은 대부분 사막 모래 속으로 스며들어 지하 수맥이 되고, 지형이 낮은 곳에서 다시 배어 나온다. 그래서 오아시스 주변 모래언덕은 겉은 바싹 말랐어도 몇 미터 아래는 젖어 있다. 근처 농장들이 아스파라거스·포도를 키우려 지하수를 퍼 올리면서 호수 수위가 내려간 것이 최근 20년의 문제다.","이카 사막의 모래는 원래 안데스의 암석이었다. 강이 깎아 바다까지 실어 가고, 파도가 해안에 뿌리고, 남쪽에서 늘 부는 바람이 다시 내륙으로 밀어 올려 사구가 됐다. 모래언덕은 지금도 1년에 몇 미터씩 북쪽으로 움직인다. 버기카가 넘는 언덕 능선이 칼처럼 날카로운 것은 바람이 바람맞이 쪽은 완만하게, 반대쪽은 급하게 깎기 때문이다. 샌드보딩은 이 급경사면에서 한다."]},{"title":"페루 중부에 화산이 없는 이유","paragraphs":["안데스 전체가 화산 지대인데 리마에서 쿠스코까지 페루 중부에는 활화산이 하나도 없다. 볼리비아·칠레 국경에 가면 화산이 줄지어 서 있는데 말이다. 이유는 판이 파고드는 각도다. 페루 중부 아래 나스카판은 거의 수평으로 미끄러져 들어가(평판 섭입) 마그마가 생길 깊이까지 내려가지 않는다. 남쪽 아레키파 부근부터 판이 급하게 꺾이면서 다시 화산이 나타난다. 우유니 투어에서 보는 화산들(오야궤, 리칸카부르)과 아레키파의 미스티 화산은 그 결과다.","대신 페루 중부는 지진이 잦다. 얕게 파고드는 판은 넓은 면적에서 마찰을 일으켜 큰 지진을 만든다. 1970년 안카시 지진(7만 명 사망)과 2007년 피스코 지진이 그것이다. 쿠스코 주변의 산들이 높지만 뾰족한 화산 모양이 아니고 주름진 습곡 산지인 것도 같은 이유다."]},{"title":"마추픽추는 왜 거기 지어졌나","paragraphs":["마추픽추가 앉은 봉우리는 거대한 화강암 덩어리다. 2억 5천만 년 전 땅속에서 식은 마그마가 화강암이 되고, 안데스 융기로 솟아오르며 두 개의 단층이 교차하는 자리에 놓였다. 단층을 따라 바위가 이미 잘게 갈라져 있어서 잉카 석공들은 채석장에서 돌을 떼어 내기가 쉬웠다. 유적 안의 채석장 구역에 반쯤 쪼개진 돌들이 그대로 있다.","또 하나는 물이다. 우루밤바 강은 마추픽추 봉우리를 세 방향에서 감싸 흐르며 300m 아래 협곡을 만들었다. 이 강은 안데스 동쪽 사면의 구름이 비로 내리는 곳이라 연 2,000mm가 온다. 잉카는 산 위 샘에서 물을 끌어와 16개의 분수를 이었고, 계단식 밭 밑에 자갈층을 깔아 배수를 해결했다. 유적이 500년간 산사태를 견딘 것은 이 지하 공사 덕분이다. 우루밤바 강 협곡을 기차로 내려가면서 식생이 고산 초원에서 열대 밀림(운무림)으로 바뀌는 것을 보게 된다. 해발 3,400m에서 2,000m로 내려가는 사이 안데스와 아마존이 만나는 경계를 지나는 셈이다."]},{"title":"사라지는 빙하와 무지개산","paragraphs":["비니쿤카가 2015년경 갑자기 나타난 것은 그 위를 덮고 있던 얼음과 눈이 사라졌기 때문이다. 페루는 세계 열대 빙하의 70%를 갖고 있는데, 1970년 이후 그 절반 이상이 녹았다. 쿠스코에서 보이는 아우상가테(6,384m)와 성스러운 계곡의 살칸타이(6,271m), 베로니카(5,893m)의 흰 봉우리가 매년 조금씩 작아진다.","빙하가 녹으면 처음에는 물이 늘어 농사가 잘되고, 빙하가 다 사라지면 건기에 강이 마른다. 쿠스코 주변 마을들은 이미 그 두 번째 단계로 들어가고 있다. 비니쿤카 줄무늬가 예쁜 색으로 보이는 것은 광물의 색이기도 하지만, 그 색을 드러낸 것이 기후 변화라는 것을 알고 보면 다른 감정이 든다. 말을 타고 오를 때 발밑에 굴러다니는 둥근 돌들은 빙하가 갈아 만든 것이다."]},{"title":"티티카카의 이상한 생물들","paragraphs":["해발 3,800m 호수에는 여기서만 사는 생물이 산다. 티티카카 거대개구리는 몸길이 20cm에 피부가 축 늘어져 주름이 많다. 산소가 적은 물에서 피부로 호흡하기 위해 표면적을 늘린 것이다. 1969년 자크 쿠스토 탐사대가 이 개구리를 처음 세계에 알렸다. 지금은 남획과 오염으로 멸종 위기이고 푸노 시장에서 개구리 주스가 팔리던 시절도 끝나 가고 있다.","날지 못하는 티티카카 논병아리, 호수 바닥의 토토라 갈대, 그리고 우로족이 먹는 갈대 밑동 흰 부분은 모두 이 호수의 산물이다. 반면 식당 메뉴의 송어는 1930년대 북미에서 들여온 외래종이다. 송어가 토착 어종을 몰아냈지만 지금은 호수 경제의 중심이다. 호수 물은 염분이 약간 있어 살짝 짠맛이 나고, 수온은 연중 10~14도로 수영은 무리다."]},{"title":"알티플라노의 야생동물 구별법","paragraphs":["푸노에서 우유니까지 고원 도로 옆에 보이는 동물은 대개 네 가지다. 목이 길고 우아하게 서 있으면 야생 비쿠냐(황갈색, 배가 흰색). 뭉툭하고 털이 폭신하면 방목 알파카. 크고 귀가 휘어 있으면 야마. 아르마딜로처럼 낮게 뛰어가면 비스카차인데, 토끼 몸에 긴 꼬리가 달린 설치류로 우유니 투어 기암 지대 바위 틈에서 볕을 쬔다. 기사가 차를 세우고 손짓하면 대개 비스카차다.","플라밍고는 세 종이 섞여 산다. 가장 흔한 칠레 플라밍고는 다리가 회색에 무릎이 붉고, 안데스 플라밍고는 다리가 노랗고 몸이 크며, 제임스 플라밍고는 가장 작고 눈 주위가 붉다. 라구나 콜로라다는 세 종을 한 번에 볼 수 있는 세계 유일의 장소로 꼽힌다. 호수 물을 쳐서 붉은 조류를 걸러 먹는 방식이 몸을 분홍색으로 만든다. 안데스 여우와 안데스 콘도르는 운이 좋으면 본다. 콘도르는 라 라야 고개 부근 상공에서 가끔 원을 그린다."]},{"title":"우유니 소금사막의 계절과 거울","paragraphs":["소금사막은 1년에 두 얼굴을 가진다. 12~3월 우기에는 주변 산에서 흘러든 물이 소금 껍질 위에 몇 cm 고여 세계 최대의 거울이 된다. 4~11월 건기에는 물이 증발해 순백의 평원과 육각형 무늬가 드러난다. 우리가 가는 9월 말은 건기 끝이라 완전히 마른 상태이고, 기사들이 아는 몇 군데 낮은 지점에만 물이 남아 있다. 여행사가 물찬 포인트를 항상 찾을 수 있다고 하는 것은 이 지점을 말한다.","거울이 없는 대신 건기의 장점이 있다. 지프가 소금평원 어디든 달릴 수 있어 잉카와시 섬과 소금 채취장까지 들어가고, 밤에 소금 위에 서서 별을 볼 수 있다. 우기에는 물 때문에 못 하는 일들이다. 소금 표면은 낮에 60도까지 뜨거워지고 밤에는 영하로 떨어져 하루 온도차가 50도를 넘는다. 이 열팽창과 수축이 육각형 가장자리를 볼록하게 만든다. 발에 밟히는 오돌토돌한 능선이 그것이다."]},{"title":"화산 사이를 달리는 길","paragraphs":["우유니 투어 2~3일차는 볼리비아와 칠레 국경을 따라 늘어선 화산 벨트 안을 달린다. 오야궤(5,868m)는 정상 옆에서 늘 연기가 나는 활화산으로, 2일차 오후에 오른쪽으로 보인다. 라구나 콜로라다 주변의 붉은 흙과 실로리 사막의 자갈은 화산재와 용암이 풍화된 것이고, 아르볼 데 피에드라(돌 나무)는 화산암이 바람에 아래쪽만 깎여 버섯 모양이 된 것이다. 이곳 바람은 오후에 시속 60~80km로 불어 지프 문을 열 때 조심해야 한다.","솔 데 마냐나의 진흙 구덩이와 증기는 땅속 3km 아래 마그마가 지하수를 데우는 현장이다. 볼리비아는 여기에 남미 최고 고도의 지열 발전소를 짓고 있다. 국경의 리칸카부르는 대칭이 완벽한 원뿔 화산으로 1만 년 안에 폭발한 기록은 없지만 휴화산으로 분류된다. 정상 분화구 호수는 수온이 영하에 가까운데도 얼지 않고 미생물이 사는데, 화성 탐사를 준비하는 과학자들이 여기서 잠수한 적이 있다."]},{"title":"아타카마의 달의 계곡과 소금 산맥","paragraphs":["산페드로 마을 서쪽 코르디예라 데 라 살(소금 산맥)은 이름 그대로 소금과 점토가 섞인 산맥이다. 2천만 년 전 이곳은 얕은 호수였고, 물이 증발하면서 두꺼운 소금·석고층이 쌓였다. 안데스가 밀어 올리면서 이 층이 구겨지고 기울어져 톱니 같은 능선이 됐다. 달의 계곡은 그 능선 사이의 침식 지형으로, 비가 거의 오지 않아 바람만이 조각을 하고 있다. 저녁에 기온이 떨어지면 소금 결정이 수축하며 딱딱 소리를 내는데, 현지인들은 산이 노래한다고 말한다.","산페드로에서 칼라마로 가는 길에 지나는 아타카마 소금 평원(살라르 데 아타카마)은 우유니보다 작지만 리튬 생산은 세계 1~2위다. 표면이 흰색이 아니라 갈색으로 울퉁불퉁한 것은 소금이 오래 노출되어 먼지와 섞였기 때문이다. 이 평원 아래 염수에서 리튬을 뽑아 증발 연못에서 농축하는 시설이 도로 멀리 보인다. 주변 원주민 공동체는 물 사용 문제로 광산 회사와 오랫동안 다투고 있다."]},{"title":"안개가 키우는 사막, 꽃이 피는 사막","paragraphs":["칠레 북부 해안에는 카만차카라는 안개가 아침마다 밀려온다. 훔볼트 해류 위에서 생긴 이 안개는 해안 산맥에 걸려 물방울을 떨어뜨리고, 그것만으로 사는 식물 군락이 있다. 페루의 로마스와 같은 원리다. 아타카마 일부 마을은 안개 그물을 세워 하루 수백 리터의 물을 모은다.","몇 년에 한 번 엘니뇨 해에 아타카마 남부에 비가 내리면 수십 년간 땅속에서 기다린 씨앗이 한꺼번에 발아해 사막이 보라색·노란색 꽃밭이 된다. 꽃피는 사막(데시에르토 플로리도)이라 부르고, 가장 최근에는 2022년과 2024년에 크게 피었다. 우리가 가는 9월 말~10월 초가 바로 그 시기이지만 산페드로 일대는 너무 건조해 해당되지 않고, 산티아고 북쪽 500km의 코피아포 부근 일이다. 칠레 뉴스에서 꽃 사진이 나오면 그 이야기다."]},{"title":"태양은 머리 위에, 달은 거꾸로","paragraphs":["리마는 남위 12도, 쿠스코는 13도로 열대 안에 있다. 9월 23일 추분 전후에는 태양이 정오에 거의 머리 바로 위에 온다. 그림자가 발밑으로 사라지고, 모자 없이는 정수리가 탄다. 한국에서 보던 것처럼 해가 남쪽에 낮게 걸리는 일이 없어 방향 감각이 흔들린다. 리마 구시가지에서 해를 보고 남북을 판단하면 틀린다.","밤에는 달이 뒤집혀 보인다. 남반구에서는 초승달의 밝은 쪽이 한국과 반대이고, 달 표면의 토끼 무늬도 위아래가 바뀐다. 해와 달이 모두 북쪽 하늘을 지나가고, 오리온자리는 거꾸로 서 있다. 우유니에서 별을 볼 때 익숙한 별자리를 못 찾는 것은 정상이다. 대신 남십자성과 마젤란 은하가 그 자리를 채운다."]},{"title":"산티아고 분지와 안데스의 눈","paragraphs":["산티아고는 해안 산맥과 안데스 사이에 낀 분지다. 겨울에는 찬 공기가 분지 바닥에 깔려 뚜껑처럼 덮이고, 그 아래 매연이 갇혀 남미에서 대기질이 나쁜 도시로 꼽힌다. 10월 초 봄에는 이 뚜껑이 자주 열려 비 온 다음 날 동쪽으로 눈 덮인 6천m 봉우리들이 도시 바로 뒤에 서 있는 것처럼 보인다. 산크리스토발 언덕에서 이 장면을 보려면 오전이 유리하다.","산티아고를 먹이는 물은 이 눈이다. 마이포 강과 마포초 강은 안데스 겨울 눈이 봄에 녹은 물이고, 그래서 봄이 수량이 가장 많다. 도심을 가르는 마포초 강이 10월에 흙탕물로 콸콸 흐르는 이유다. 최근 10년간 칠레 중부는 기록적인 가뭄(메가 가뭄)을 겪어 눈이 적게 내렸고, 산티아고 상수 제한 논의가 이어졌다. 콘차 이 토로 와이너리의 마이포 계곡 포도밭도 이 눈 녹은 물로 관개한다."]}]}},"rail":[{"id":"exp31","name":"PeruRail Expedition 31","from":"오얀따이땀보","to":"아구아스칼리엔테스","dep":"2026-09-25T09:15","arr":"2026-09-25T10:52"},{"id":"exp604","name":"PeruRail Expedition 604","from":"아구아스칼리엔테스","to":"오얀따이땀보","dep":"2026-09-25T17:23","arr":"2026-09-25T19:02"}]};</script>

<script>window.PRACTICAL = [{"id":"transit","title":"애틀랜타 환승과 미국 입국","topics":[{"title":"ESTA는 출발 전 반드시","items":["미국은 환승 승객도 정식 입국 심사를 받는다. 한국 여권은 ESTA(전자여행허가)가 필요하며, 없으면 인천에서 탑승이 거부된다.","비용은 2025년 9월 30일부터 USD 40.27로 올랐다. 공식 사이트(esta.cbp.dhs.gov)에서만 신청하고, 대행 사이트는 피한다. 대부분 몇 분~72시간 안에 승인된다.","ESTA 소지자는 Mobile Passport Control(MPC) 앱을 쓸 수 있다. 미리 설치해 여권 정보를 넣어 두면 입국 심사 줄이 훨씬 짧다.","왕복 모두 애틀랜타를 거치므로 ESTA는 두 번 쓰인다. 유효기간 2년."]},{"title":"애틀랜타 환승 순서 (갈 때 6시간 35분, 올 때 4시간)","items":["1단계: 착륙 후 CBP 입국 심사. 여권·ESTA. 미국 체류 목적은 transit(환승), 최종 목적지 Lima/Seoul.","2단계: 위탁 수하물을 직접 찾는다. 인천에서 수하물 태그가 최종 목적지(LIM)까지 붙어 있더라도 미국에서는 일단 짐을 찾아야 한다.","3단계: 세관 통과 후 바로 나오는 연결편 수하물 재위탁(Baggage Re-check) 벨트에 짐을 다시 올린다.","4단계: TSA 보안검색을 다시 받는다. 액체 규정 100ml 적용. 인천 면세점에서 산 술은 밀봉 봉투(STEB)가 아니면 압수될 수 있으니 애틀랜타 이후에 사는 것이 안전하다.","5단계: Plane Train으로 국제선 콩코스 F 또는 E로 이동. 2분 간격, 24시간 운행.","6시간 대기는 이 절차에 충분하고, 귀국 편 4시간도 보통 문제없다. 다만 입국 심사 줄이 1시간 넘게 걸릴 수 있으니 서두르는 것이 좋다."]},{"title":"보조배터리와 수하물 (대한항공 2026년 4월 규정)","items":["보조배터리는 1인 최대 2개, 100Wh 이하(20,000mAh는 약 74Wh). 100~160Wh는 항공사 승인 필요, 160Wh 초과는 반입 불가. 용량 표시가 없거나 훼손된 제품은 거부될 수 있다.","기내 휴대만 가능하고 위탁 금지. 기내에서 사용·충전 금지, 머리 위 선반 보관 금지. 직접 소지하거나 좌석 앞 주머니에, 1개씩 지퍼백이나 파우치에 넣는다.","국제선 수하물: 위탁 2개(각 23kg, 158cm), 기내 1개(10kg, 115cm).","남미 국내선(여행사 발권): 위탁 23kg 1개. 기내 JetSMART·Sky 10kg(25×35×45cm), BoA 7kg(55×35×20cm). 기내용 캐리어는 유료라 기내 짐은 백팩으로."]},{"title":"애틀랜타 공항에서 시간 보내기","items":["국제선 콩코스 F: 식당·카페 다수, 무료 와이파이. 델타 스카이클럽 라운지는 이코노미 코드셰어 승객은 무료 입장 불가. 프라이오리티 패스 제휴 라운지도 제한적이니 기대하지 말 것.","미국 콘센트는 A/B형 120V. 한국 충전기는 대부분 프리볼트라 어댑터만 있으면 된다.","유심: 미국 6시간을 위해 사는 것은 낭비. 공항 와이파이로 충분하다.","물은 보안검색 후 리필 스테이션에서 채운다."]}]},{"id":"entry","title":"입국·국경 절차","topics":[{"title":"페루 입국 (리마, 9월 20일 밤)","items":["한국 여권 무비자 90일. 종이 입국카드(TAM)는 폐지되어 여권에 도장 또는 전자 기록만 남는다. 심사관이 체류 일수를 적어 주면 확인한다.","리마 신공항 터미널(2025년 6월 개장)은 넓고 현대적이다. 밤 22시 도착이라 택시 카운터·환전소는 열려 있지만 SIM 매장은 닫혀 있을 수 있다.","공항 환전은 택시비 정도만. 본 환전은 다음 날 투어캡틴과 단체 환전."]},{"title":"페루 → 볼리비아 (데사구아데로 육로, D8)","items":["한국은 2025년 12월 3일부터 볼리비아 무비자 대상(90일). 볼리비아 이민국의 온라인 사전 등록(SIGEMIG)을 요구할 수 있으니 투어캡틴에게 필요 여부를 확인한다.","절차: 페루 측 출국 도장 → 다리를 걸어서 건넘 → 볼리비아 측 입국 도장. 버스는 국경 양쪽에서 갈아타거나 기다린다. 전체 1~2시간.","볼리비아 입국 시 황열병 접종 증명은 라파즈·우유니 고지대 일정에는 필요하지 않다. 다만 심사관이 물으면 \"고지대만 간다\"고 답한다.","국경 마을은 소매치기가 많다. 가방은 앞으로, 여권은 손에서 놓지 않는다.","남은 페루 솔은 국경 환전상보다 푸노에서 미리 정리하는 것이 유리하다. 볼리비아 소액 지폐가 필요하니 국경에서 USD 20 정도만 볼리비아노로."]},{"title":"볼리비아 → 칠레 (이토 카혼, D12 새벽)","items":["해발 4,480m의 작은 국경 초소. 볼리비아 출국 도장을 받고 차로 45km를 내려가 산페드로 데 아타카마 세관에서 칠레 입국 심사와 세관 검사를 받는다.","칠레는 무비자 90일. 입국 시 종이 관광카드(Tarjeta de Turismo, PDI 슬립)를 준다. 출국할 때 반납해야 하므로 여권 사이에 끼워 잃어버리지 않는다. 호텔에서 이 카드와 여권을 제시하고 외화로 결제하면 19% 부가세가 면제된다.","SAG(농업검역)이 엄격하다. 과일·채소·씨앗·꿀·유제품·익히지 않은 육류·코카잎(차 티백 포함) 전부 금지. 신고서에 정직하게 쓰고, 애매한 것은 국경 전에 버린다. 미신고 적발 시 벌금이 크다.","한국에서 가져온 조리된 포장식품(김치, 멸치볶음, 컵라면, 햇반)은 반입이 허용된다. 여행사 FAQ에서 확인된 사항이다.","우유니에서 산 코카 캔디·코카차는 볼리비아에서 다 먹거나 버린다. 한국 입국 시에도 코카잎은 마약류로 취급된다.","지프투어 짐은 국경에서 전부 내려 검사대에 올린다. 배낭 정리를 미리 해 두면 빠르다."]},{"title":"칠레 출국과 귀국","items":["산티아고 공항 국제선은 T2. 출국 심사에서 관광카드를 반납한다.","칠레는 관광객 물품 부가세 환급 제도가 없다.","애틀랜타에서 다시 입국 심사·짐 재위탁·보안검색을 거친다(위 환승 절차와 동일)."]}]},{"id":"money","title":"돈","topics":[{"title":"환율 감각 (2026년 9월 기준, 출발 전 재확인)","items":["페루 솔(PEN): USD 1 = 약 3.4솔. 1솔 = 약 410원. 물 한 병 1~3솔, 세비체 25~45솔, 점심 세트 12~20솔.","볼리비아노(BOB): 2026년 7월 변동환율로 전환되어 USD 1 = 약 11.5Bs(8월 말). 이전 고정환율 6.96보다 볼리비아노가 크게 싸졌다. 즉 달러 여행자에게 볼리비아 물가가 더 저렴해졌다. 다만 변동성이 크니 현지 도착 후 ATM 인출 환율을 확인한다.","칠레 페소(CLP): USD 1 = 약 930~950페소. 1,000페소 = 약 1,500원. 콤플레토 4,000~6,000페소, 저녁 한 끼 15,000~25,000페소.","앱의 환율 계산기 기본값을 현지 첫날 실제 환율로 고쳐 두면 이후 계산이 편하다."]},{"title":"현금 준비","items":["USD 현금은 여행사 안내대로 USD 650 이상. 페루는 투어·호텔에서 달러를 널리 받고, 볼리비아는 큰 금액만, 칠레는 거의 안 받는다.","지폐 상태가 중요하다. 찢어짐·낙서·도장·구권 달러는 환전소·상점이 거부한다. 여행사 안내대로 100달러 신권 위주로 은행에서 받고, 팁용 1달러 지폐 20장을 따로 챙긴다.","환전은 도착 후 각 도시에서 투어캡틴과 함께 환전소에 간다. 미리 솔·볼리비아노를 한국에서 바꿀 필요 없다.","볼리비아 국립공원 입장료(에두아르도 아바로아 150Bs), 잉카와시 섬(30Bs), 온천(6Bs), 화장실(2~5Bs)은 볼리비아노 현금만 받는다. 우유니 마을에서 미리 인출한다. 투어 중에는 ATM이 없다.","페루 솔은 리마 첫날 단체 환전. 미라플로레스 환전소(casa de cambio)가 공항보다 유리하다."]},{"title":"ATM","items":["페루: BCP·Interbank는 인출 수수료 15~25솔, 한도 400~700솔. Banco de la Nación(MultiRed)은 수수료가 없지만 한도 400솔. 은행 안 ATM을 이용하고 카드 복제기를 확인한다.","볼리비아: Banco Unión·BNB·Bisa는 현지 수수료가 거의 없고 한도 약 3,000Bs. 변동환율 전환 후 ATM 환율이 시장 환율에 가까워졌다.","칠레: 수수료가 비싸다. 회당 5,500~8,000페소. 한도 약 200,000페소. Banco Estado가 가장 싸고, Scotiabank는 글로벌 ATM 제휴 카드면 면제된다. 한 번에 많이 뽑는 것이 유리하다.","세 나라 모두 \"환율 우대(DCC)\" 선택 화면이 나오면 거부하고 현지 통화로 결제한다. 카드사 환율이 더 좋다."]},{"title":"카드와 팁","items":["카드: 세 나라 도시 호텔·식당은 Visa/Master를 받는다. 시장·택시·소도시·우유니는 현금.","팁: 페루는 식당 10% 선택(영수증에 servicio가 있으면 이미 포함). 볼리비아는 5~10% 선택. 칠레는 영수증에 propina sugerida 10%가 자동으로 찍히고 카드 결제 시 \"con propina?\"라고 묻는다. 거부해도 되지만 대부분 준다.","가이드·기사 팁: 마추픽추 가이드 20~30솔, 우유니 지프 기사 3일에 50~100Bs 정도가 통례."]}]},{"id":"comms","title":"통신","topics":[{"title":"유심 vs eSIM","items":["가장 편한 선택은 세 나라를 한 번에 커버하는 리저널 eSIM이다. Airalo Latin America(LatamLink) 기준 10GB/7일 USD 29, 20GB/15~30일 USD 47~49. 출발 전 한국에서 설치하고 리마 착륙 즈음 켠다.","현지 유심은 훨씬 싸다. 페루 Claro/Movistar 5~7GB 30일 30솔(약 USD 8), 볼리비아 Entel/Tigo 5GB USD 8, 칠레 Movistar/Entel 40GB 1주 5,000페소. 단 매번 매장 방문·여권 등록이 필요하고, 페루 공항 매장은 USD 50 수준으로 비싸다.","여행사 안내: 볼리비아는 한국 로밍과 글로벌 eSIM 연결이 불안정하다. 라파즈 도착 후 ENTEL 현지 유심(6일 무제한 약 80Bs, 여권 필요)을 사는 것을 권장한다.","추천 조합: eSIM 하나로 페루·칠레를 커버하고, 볼리비아 3박은 ENTEL 유심. 페루에서 데이터가 많이 필요하면 Claro 유심 추가.","우유니 지프투어 2박 3일은 대부분 신호가 없다. 소금호텔 일부만 와이파이가 있다. 출발 전 가족에게 알려 둔다.","라파즈 케이블카 역, 쿠스코 광장 등에는 공공 와이파이가 있으나 느리다."]},{"title":"오프라인 준비","items":["구글맵 오프라인 지역을 8개 도시별로 미리 내려받는다(리마, 이카, 쿠스코+성스러운 계곡, 푸노, 라파즈, 우유니, 산페드로, 산티아고). 와이파이 있을 때 앱에서 \"오프라인 지도\" 메뉴.","구글 번역 스페인어 오프라인 언어팩을 받아 둔다. 카메라 번역이 메뉴판에 유용하다.","이 앱은 한 번 열어 두면 오프라인에서 동작한다. 첫 실행은 와이파이에서."]}]},{"id":"transport","title":"교통","topics":[{"title":"앱 택시","items":["리마: Uber·Cabify·DiDi·InDrive 모두 잘 된다. 밤에 길에서 택시를 잡지 않는다.","쿠스코: Uber·Cabify 가능하나 새벽에는 차가 드물다. 호텔에서 불러 주는 택시가 안전하고 시내는 6~10솔.","푸노: 앱 택시가 적다. 호텔에 부탁하고 시내 이동은 5솔 안팎.","라파즈: Uber·InDrive가 된다. 케이블카(미 텔레페리코)가 3Bs로 가장 쾌적한 이동 수단.","산티아고: Uber·Cabify·DiDi 활발. 지하철 1호선이 프로비덴시아를 지난다(bip! 카드 필요).","우유니·산페드로: 앱 택시 없음. 투어사·숙소 픽업."]},{"title":"공항 택시 기준 요금","items":["리마 공항 → 미라플로레스: 공식 택시 카운터 60~95솔(밤·피크 요금), Uber 40~70솔. 45~75분 소요. Uber는 출국장 3번 문 근처 지정 픽업 구역에서 탄다. 호객 기사는 절대 따라가지 않는다.","쿠스코 공항 → 시내: 공식 택시 45~55솔, 밖에서 흥정하면 10~15솔. 20분.","산티아고 공항 → 프로비덴시아: 공식 택시 25,000~30,000페소, Transvip 합승 셔틀 약 8,000~10,000페소, Uber 15,000~25,000페소. 20~40분. 마지막 날 호텔에서 공항으로 갈 때는 Uber나 호텔 택시.","이번 일정에서 공항·터미널 이동은 대부분 여행사 차량이 포함되어 있어, 실제로 직접 택시를 탈 곳은 첫날 리마 공항과 자유일정 시내 이동 정도다."]},{"title":"버스 이동 (D2, D3, D7)","items":["리마↔이카(4시간 30분)와 쿠스코→푸노(7시간)는 여행사 전세 또는 Cruz del Sur급 우등버스. 좌석 등급은 Cruzero(140도)·Excluciva(160도)·Sofá Cama(180도).","버스에서 짐은 발밑이나 무릎 위. 머리 위 선반의 가방은 소매치기 표적이다.","멀미약, 목베개, 얇은 담요(에어컨 강함), 간식·물을 챙긴다. 화장실은 버스 안에 있지만 상태가 좋지 않다."]}]},{"id":"life","title":"생활","topics":[{"title":"물·음식 위생","items":["페루·볼리비아 수돗물은 마시지 않는다. 양치는 병 물로. 생수는 1~3솔.","산티아고 수돗물은 마실 수 있지만 석회가 많아 맛이 다르다. 예민하면 병 물.","얼음·샐러드는 관광객 식당이면 대체로 안전하고, 시장 음식은 익힌 것 위주로. 세비체는 점심에, 손님이 많은 집에서.","고산에서는 소화가 느려진다. 저녁은 수프 위주로 가볍게."]},{"title":"화장실","items":["공중화장실은 유료다. 페루 1~2솔, 볼리비아 1~5Bs. 휴지가 없는 곳이 많으니 휴대용 휴지·물티슈를 항상 가진다.","휴지는 변기에 넣지 않고 옆 쓰레기통에 버린다. 남미 배관의 상식이다.","우유니 투어 중 화장실은 매우 드물다. 소금호텔·식사 장소에서 기회가 있을 때 간다."]},{"title":"전기·충전","items":["페루 220V, A/C형(한국 플러그 C형이 대부분 맞음). 볼리비아 230V A/C형. 칠레 220V C/L형(C형 대부분 호환). 미국 120V A/B형.","결론: 한국 플러그가 대부분 그대로 꽂히고, 미국 환승과 일부 A형 콘센트를 위해 멀티 어댑터 하나만 챙긴다.","소금호텔은 전기가 제한된다. 20,000mAh 보조배터리를 우유니 전날 완충한다."]},{"title":"세탁","items":["세탁소(lavandería)는 kg 단위. 쿠스코 6~10솔/kg, 라파즈 비슷한 수준, 보통 당일 또는 다음 날.","세탁 타이밍: 쿠스코 3박(D4~D6)이 최적. 이후 푸노·라파즈는 1~2박이라 빠듯하고, 우유니 3일은 불가. 산티아고에서 마지막 세탁은 시간상 어렵다.","호텔 세탁은 세탁소의 3~5배."]},{"title":"약국","items":["페루 약국(InkaFarma, Mifarma)은 처방 없이 파는 것이 많다. 고산증약 아세타졸아미드(acetazolamida)는 10정에 USD 3 안팎, 소로치 필(Sorojchi Pills, 아스피린+카페인)은 어디서나.","그래도 고산약은 한국에서 처방받아 가는 것이 원칙이다. 현지 약은 보조.","상비약 목록: 두통약, 지사제, 소화제, 멀미약, 감기약, 밴드, 입술보호제(고산 건조), 선크림 SPF50.","산소 캔은 쿠스코·라파즈 약국과 호텔에서 판다. 비니쿤카 가는 날 하나 사 두면 심리적으로 도움이 된다."]}]},{"id":"safety","title":"안전","topics":[{"title":"지금 상황 (출발 전 재확인)","items":["페루: 2025년 10월부터 리마·카야오에 치안 비상사태가 선포되어 연장되고 있다. 관광지 치안은 유지되지만 밤 혼자 걷기, 고가품 노출, 길거리 택시를 피한다.","볼리비아: 2026년 5~6월 대규모 도로 봉쇄와 시위가 있었고 6월 비상사태가 선포됐다. 봉쇄가 재발하면 푸노→라파즈 육로, 라파즈→우유니 항공, 우유니 투어에 차질이 생길 수 있다. 출발 1주 전 여행사와 외교부 해외안전여행 사이트(0404.go.kr)에서 상황을 확인한다.","칠레: 산티아고 소매치기가 늘었다. 아르마스 광장·베야비스타 밤·지하철 혼잡 시간이 주의 구역."]},{"title":"흔한 수법","items":["가짜 경찰: 신분증을 보여 달라며 지갑을 검사하는 척 돈을 빼 간다. 진짜 경찰은 길에서 지갑을 검사하지 않는다. 경찰서로 가자고 한다.","겨자·오물 묻히기: 옷에 무언가를 묻히고 닦아 주는 척 소지품을 턴다. 도와주겠다는 사람을 뿌리치고 자리를 떠난다.","택시 바가지·우회: 공식 카운터·앱만 쓴다. 현금은 잔돈을 준비해 큰 지폐를 내지 않는다.","위조지폐: 50·100솔, 100Bs 지폐를 거스름돈으로 받을 때 은선·워터마크 확인.","휴대폰 날치기: 길에서 폰을 들고 걷지 않는다. 카페 테이블 위에 두지 않는다."]},{"title":"기본 규칙","items":["여권은 호텔 금고에, 복사본과 사진을 폰에. 여권 사본으로 대부분의 상황이 해결된다.","현금·카드를 두 곳에 나눈다. 비상용 USD 100은 별도 보관.","밤 이동은 앱 택시. 술 마신 뒤 혼자 걷지 않는다.","고산에서는 판단력이 떨어진다. 첫날 무리한 일정을 잡지 않는다."]},{"title":"긴급 연락","items":["페루: 경찰 105, 구급 106, 소방 116. 관광경찰(리마 미라플로레스)이 따로 있다.","볼리비아: 경찰 110, 구급 118, 소방 119.","칠레: 경찰 133, 구급 131, 소방 132.","대한민국 영사콜센터 +82-2-3210-0404 (24시간). 대사관 번호는 정보 탭 긴급 연락 참고.","여행자보험 긴급 전화는 정보 탭 문서 칸에 적어 둔다."]}]},{"id":"airport","title":"공항 편의","topics":[{"title":"리마 호르헤 차베스 (LIM)","items":["2025년 6월 개장한 신터미널. 식음료 구역이 넓고 페루 음식 위주. 24시간 운영.","도착층에 공식 택시 카운터, 환전소, ATM. 유심 매장은 밤에 닫힐 수 있다.","D4 국내선(→쿠스코) 출발 시 같은 터미널. 국내선은 출발 2시간 전 도착으로 충분."]},{"title":"우유니 호야 안디나 (UYU)","items":["활주로 하나의 작은 공항. ATM이 없거나 고장인 경우가 많다. 현금은 라파즈에서 미리.","시내까지 차로 8분. 여행사 픽업."]},{"title":"칼라마 엘 로아 (CJC)","items":["산페드로 데 아타카마에서 차로 1시간 30분. 국내선 공항, 식당 몇 곳. 산티아고행은 LATAM·Sky·JetSMART.","칠레 국내선도 신분증(여권) 확인. 관광카드도 같이."]},{"title":"산티아고 아르투로 메리노 베니테스 (SCL)","items":["국제선 T2. 출국 심사에서 관광카드 반납. 식당·라운지 있고 물가는 비싸다.","마지막 날 체크아웃 후 짐은 호텔에 맡기고 16:30경 공항으로 출발하면 20:40 항공편에 여유 있다.","부가세 환급 없음. 남은 페소는 공항에서 다 쓰거나 달러로 재환전(환율 나쁨)."]}]},{"id":"qna","title":"사전모임에서 물어볼 것","topics":[{"title":"도착·첫날","items":["9월 20일 밤 21:55 리마 도착인데 투어캡틴 공항 픽업이 가능한지, 아니면 공식 택시 카운터로 가면 되는지. 캡틴 연락처(왓츠앱)는 언제 받는지.","9월 21일 10:30 미팅 장소가 Casa Andina Benavides 로비가 맞는지, 단체 환전은 어디서 얼마나 하는지(솔 얼마 정도 권장).","첫날 자유일정에 캡틴이 구시가지 동행을 하는지, 아니면 완전 자유인지."]},{"title":"자유일정·선택투어","items":["나스카 경비행기가 안전상 제외된 구체적 이유. 개별로 타는 것도 비추천인지.","잃어버린 협곡 투어와 바예스타 투어의 현지 가격, 신청 시점(전날 저녁?), 최소 인원.","비니쿤카: 현지 가격, 말 대여 가격, 출발 시각, 신청 마감. 성스러운 계곡 투어와 같은 날 병행이 불가능한지.","우로스 섬 반나절 투어 가격과 푸노 도착 당일 오후 가능 여부.","라파즈 오후 자유시간에 촐리타 레슬링(목·일)이나 티와나쿠 유적 신청이 가능한지.","산티아고 콘차 이 토로 와이너리 투어: 신청 방법, 가격, 몇 시 출발이면 16:30 공항 이동에 맞는지.","선택투어 결제는 달러 현금인지 현지 화폐인지, 카드 가능한지."]},{"title":"우유니 투어","items":["2일차 숙소 San Bernardo의 위치(마을 이름), 온수·전기·와이파이 여부, 침낭 대여비.","지프 1대에 몇 명, 짐은 지붕에 실리는지(방수 커버), 큰 캐리어를 우유니 마을에 두고 가는지 아니면 전부 싣는지.","국립공원 입장료·온천 입장료 등 볼리비아노 현금이 총 얼마 필요한지.","장화는 현지 제공이라는데 9월 말 건기에 물찬 포인트가 실제로 있는지, 별 투어는 날씨에 따라 취소되는지.","칠레 국경에서 과일·코카 외에 걸린 사례가 있는지(견과류, 육포, 라면 스프 등)."]},{"title":"이동·항공","items":["남미 국내선 3편의 기내 수하물(BoA 7kg)이 실제로 엄격하게 재는지. 기내용 캐리어를 들고 타면 추가 요금이 얼마인지.","라파즈→우유니 새벽 4시 출발 날 조식 대체(도시락)가 있는지.","쿠스코→푸노 버스 종류(관광버스인지 일반 우등인지), 중간 화장실 휴식 여부.","데사구아데로 국경에서 볼리비아 온라인 사전등록(SIGEMIG)이 필요한지, 필요하면 언제 어떻게 하는지.","애틀랜타 환승 시 수하물을 찾아 재위탁해야 하는지 대한항공에 확인해 준 적이 있는지."]},{"title":"돈·통신·건강","items":["현지 경비 USD 650의 대략적 배분(도시별 식비, 선택투어별 가격) 예시.","볼리비아 변동환율 이후 달러 환전이 은행·환전소 어디가 유리한지, 캡틴이 환전을 도와주는지.","볼리비아 ENTEL 유심을 캡틴이 단체로 구매 안내해 주는지.","고산약을 안 먹고 코카차만으로 버틴 참가자 비율, 산소통을 차량에 싣고 다니는지.","여행자보험 증서 제출 방법과 기한."]},{"title":"팀·기타","items":["이번 팀 인원과 남녀·연령 구성, 5개국 일주 팀과 합류하는 인원.","캡틴 공지 채널(카톡 단체방 여부), 매일 저녁 다음 날 안내 시각.","팁 관례: 마추픽추 가이드, 우유니 기사, 버스 기사에게 팀 단위로 걷는지 개인이 주는지.","세탁하기 좋은 시점을 캡틴 경험상 어디로 보는지(쿠스코 3박?).","한국 음식(컵라면·햇반) 먹을 수 있는 환경(뜨거운 물)이 호텔마다 있는지."]}]}];</script>

따도"},{"es":"Relleno","ko":"속을 채운","desc":"로코토 레예노(고추 속 채움)","pron":"레예노"},{"es":"Guiso / Estofado","ko":"스튜","desc":"","pron":"기소 / 에스또파도"},{"es":"Sudado","ko":"국물 있게 조린","desc":"생선 수다도는 토마토 국물 생선찜","pron":"수다도"},{"es":"Chicharrón","ko":"바삭하게 튀긴 고기","desc":"돼지·생선·닭 다 가능","pron":"치차론"},{"es":"Ají","ko":"고추 (소스)","desc":"아히 아마리요(노란 고추)가 페루 요리의 기본","pron":"아히"},{"es":"Rocoto","ko":"매운 고추","desc":"피망처럼 생겼지만 매우 매움","pron":"로꼬또"},{"es":"Choclo","ko":"옥수수","desc":"알이 큰 안데스 옥수수","pron":"초끌로"},{"es":"Papa","ko":"감자","desc":"페루 감자 3천 종","pron":"빠빠"},{"es":"Camote","ko":"고구마","desc":"세비체 옆에 나옴","pron":"까모떼"},{"es":"Yuca","ko":"카사바","desc":"튀기면 감자튀김 같음","pron":"유까"},{"es":"Quinua","ko":"퀴노아","desc":"수프·샐러드","pron":"끼누아"},{"es":"Chuño","ko":"냉동건조 감자","desc":"안데스 전통 보존 감자. 특유의 흙 맛","pron":"추뇨"},{"es":"Palta","ko":"아보카도","desc":"칠레·페루에서 아보카도는 palta","pron":"빨따"},{"es":"Pollo","ko":"닭","desc":"","pron":"뽀요"},{"es":"Res / Carne / Lomo","ko":"소고기 / 안심","desc":"","pron":"레스 / 까르네 / 로모"},{"es":"Cerdo / Chancho","ko":"돼지","desc":"","pron":"세르도 / 찬초"},{"es":"Cordero","ko":"양","desc":"","pron":"꼬르데로"},{"es":"Alpaca","ko":"알파카","desc":"지방 적고 부드러움. 쿠스코 필수 경험","pron":"알빠까"},{"es":"Cuy","ko":"기니피그","desc":"안데스 전통 요리. 통째로 나오면 놀라지 말 것","pron":"꾸이"},{"es":"Trucha","ko":"송어","desc":"티티카카·쿠스코의 대표 생선","pron":"뜨루차"},{"es":"Pescado","ko":"생선","desc":"","pron":"뻬스까도"},{"es":"Mariscos","ko":"해산물","desc":"","pron":"마리스꼬스"},{"es":"Camarón / Langostino","ko":"새우","desc":"","pron":"까마론 / 랑고스띠노"},{"es":"Pulpo","ko":"문어","desc":"","pron":"뿔뽀"},{"es":"Calamar","ko":"오징어","desc":"","pron":"깔라마르"},{"es":"Conchas","ko":"조개 (가리비류)","desc":"세비체 데 콘차스","pron":"꼰차스"},{"es":"Huevo","ko":"달걀","desc":"","pron":"우에보"},{"es":"Queso","ko":"치즈","desc":"","pron":"께소"},{"es":"Arroz","ko":"밥","desc":"남미 밥은 대부분 요리 옆에 기본으로","pron":"아로스"},{"es":"Fideos / Tallarines","ko":"면","desc":"","pron":"피데오스 / 타야리네스"},{"es":"Ensalada","ko":"샐러드","desc":"","pron":"엔살라다"},{"es":"Pan","ko":"빵","desc":"","pron":"빤"},{"es":"Mantequilla","ko":"버 <script>window.SOUVENIRS = [{"id":"guide","name":"기념품 전략 한 장","items":[],"spots":[],"tips":[],"guide":["가장 싼 곳은 쿠스코(산페드로 시장·산블라스)와 라파즈(사가르나가 거리). 리마·산티아고·공항은 같은 물건이 1.5~3배. 무거운 것은 여정 후반(라파즈)에서, 깨지는 것은 마지막(산티아고)에서.","알파카 100% 표기는 대부분 혼방(아크릴 섞임)이다. 만져서 차갑고 매끈하며 정전기가 없으면 진짜에 가깝고, 가격이 스웨터 150솔 미만이면 혼방으로 보면 된다. 베이비 알파카 스웨터는 150~300솔, 비쿠냐는 수백만 원.","흥정은 시장·노점에서만. 첫 가격의 60~70%에서 시작해 80% 선에서 끝나는 게 보통. 두세 개 묶으면 더 내려간다. 상점·브랜드는 정가.","반입 주의: 코카잎·코카차·코카 캔디는 칠레·미국·한국 모두 금지. 야마 태아, 동물 가죽·깃털, 선인장 같은 식물, 고고학 유물(진품 표기)은 반출·반입 불가. 소금은 식품이라 신고 대상이나 소량 가공 소금(우유니)은 대체로 통과.","무게: 국내선 위탁 23kg 1개. 도자기·소금·와인은 캐리어 무게를 먹는다. 마지막 산티아고 와인 2병까지가 현실적.","결제: 시장은 현금(현지 화폐), 브랜드는 카드. 100달러로는 거스름돈이 안 나온다."]},{"id":"lima","name":"리마","items":[{"name":"피스코 (Pisco)","price":"1병 40~90솔","note":"페루 국민주. 케브란타 품종 표준, 아로마틱은 이탈리아 품종. 라르코마르·슈퍼 Wong 주류 코너. 마지막 날 산티아고에서 칠레 피스코와 비교 구매도 가능"},{"name":"마라스 소금·페루 고추 소금","price":"10~25솔","note":"슈퍼마켓(Wong·Metro) 조미료 코너. 가볍고 실용적"},{"name":"페루 초콜릿 (Cacaosuyo, Shattell)","price":"15~35솔","note":"카카오 70%+ 아마존 원두. 라르코마르 상점·슈퍼. 세계 대회 수상 브랜드"},{"name":"잉카 콜라·치차 모라다 분말","price":"5~15솔","note":"슈퍼. 가벼운 웃음용 선물"},{"name":"커피 (Tunki, 찬차마요)","price":"30~60솔/250g","note":"카페·슈퍼. 푸노에서 툰키 커피를 직접 사도 됨"}],"spots":[{"name":"Larcomar 쇼핑몰","note":"절벽 위 몰. 페루 디자이너 브랜드(Kuna·Sol Alpaca 알파카 고급, Ilaria 은세공). 가격은 높지만 품질 보증","mapQuery":"Larcomar, Lima, Peru"},{"name":"Wong 슈퍼마켓 (Benavides)","note":"호텔 도보 14분. 식품 기념품(소금·초콜릿·피스코·커피) 한 번에","mapQuery":"Wong, Lima, Peru"},{"name":"Mercado Indio (Av. Petit Thouars)","note":"미라플로레스 대형 수공예 시장 골목. 쿠스코보다 비싸지만 마지막 날 부족한 것 채우기 좋음. 이번 일정은 리마가 앞이라 구경만","mapQuery":"Mercado Indio, Lima, Peru"}],"tips":["리마에서는 식품류만. 알파카·수공예는 쿠스코·라파즈가 절반 가격.","피스코는 위탁 수하물, 1인 1L 이상은 한국 세관 신고(주류 1병 400달러 이하 면세)."],"guide":[]},{"id":"ica","name":"이카·와카치나","items":[{"name":"이카 피스코·와인 (Tacama, Vista Alegre, El Catador)","price":"40~80솔","note":"보데가 직판이 슈퍼보다 종류가 많다. 케브란타 순수 피스코 + 아차올라도(블렌드)"},{"name":"테하스 (Tejas)","price":"10~20솔/상자","note":"이카 특산 과자. 피칸·무화과에 만하르(밀크 캐러멜)를 채우고 설탕 옷. 초코테하 <script>window.SPANISH = {"rules":["모음은 항상 한 가지 소리다. a 아, e 에, i 이, o 오, u 우. 영어처럼 바뀌지 않아 글자대로 읽으면 90% 맞는다.","ll 과 y 는 '이/야' 소리. calle 까예, pollo 뽀요, Callao 까야오. (아르헨티나식 '샤' 발음은 이번 3개국에서는 안 쓴다)","j 와 g(e, i 앞) 는 목에서 나는 'ㅎ'. Jorge 호르헤, jugo 후고, Gerardo 헤라르도.","h 는 소리가 없다. hotel 오뗄, Huacachina 와카치나, hora 오라.","c(e, i 앞) 와 z 는 'ㅅ'. cerveza 세르베사, Cusco 꾸스코, plaza 쁠라사. 스페인 본토의 'ㅆ' 혀짤배기 발음은 남미에 없다.","qu 는 'ㄲ'. que 께, quinua 끼누아, Quechua 께추아. gu(e, i 앞) 는 'ㄱ'. guía 기아.","ñ 은 '니'. baño 바뇨, mañana 마냐나, año 아뇨.","r 한 개는 살짝 굴리고 rr 은 강하게 굴린다. pero 뻬로(그러나), perro 뻬로(개)는 굴림 길이만 다르다. 못 굴려도 뜻은 통한다.","v 와 b 는 같은 'ㅂ'. vino 비노, Bolivia 볼리비아.","d 는 모음 사이에서 부드럽게 'ㄷ/ㄹ' 사이. nada 나다.","강세: 모음이나 n, s로 끝나면 뒤에서 두 번째 음절(ca-MA-ra 아님, CA-ma-ra), 그 외 자음으로 끝나면 마지막 음절(ho-TEL), 악센트 표시(á é í ó ú)가 있으면 그 자리. 강세를 틀리면 못 알아듣는 경우가 있어 발음 표기에서 굵은 부분을 세게 읽는다.","물음표·느낌표는 문장 앞에도 거꾸로(¿ ¡) 붙는다. 의문문은 끝을 올려 읽으면 된다.","한국인이 자주 틀리는 것: Machu Picchu 마추 픽추(삐추 아님), Cusco 꾸스코, Uyuni 우유니, La Paz 라 빠스(z는 ㅅ), Santiago 산띠아고, gracias 그라시아스(그라씨아스 아님), ceviche 세비체."],"showcards":[{"es":"A este hotel, por favor: Casa Andina Standard Benavides, Av. Alfredo Benavides 271, Miraflores","ko":"이 호텔로 가 주세요 (리마)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Hampton by Hilton, Av. Tullumayu 227, Cusco","ko":"이 호텔로 가 주세요 (쿠스코)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Hotel Rosario Sur, Calle 16 de Calacoto, Zona Sur","ko":"이 호텔로 가 주세요 (라파즈)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Novotel Santiago Providencia, Av. Holanda 222","ko":"이 호텔로 가 주세요 (산티아고)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"Al aeropuerto, por favor. Vuelo a las __","ko":"공항으로 가 주세요. __시 비행기","pron":"알 아에로뿌에르또 뽀르 파보르"},{"es":"¿Cuánto cuesta hasta allí? Con taxímetro, por favor","ko":"거기까지 얼마예요? 미터기로 부탁합니다","pron":"꽌또 꾸에스따 아스따 아이"},{"es":"Tengo mal de altura. Necesito oxígeno, por favor","ko":"고산증이에요. 산소가 필요해요","pron":"뗑고 말 데 알뚜라. 네세시또 옥시헤노"},{"es":"Necesito un médico. Hablo coreano, no hablo español","ko":"의사가 필요해요. 한국어만 합니다","pron"
