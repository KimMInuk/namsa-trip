<script>window.PREP_DATA = [{"id":"timeline","title":"출발 전 타임라인 (D-15 → D-day)","topics":[{"title":"D-15 ~ D-10 (9/5~9/10) 서류·돈","items":["ESTA 신청 (esta.cbp.dhs.gov, USD 40.27, 승인 메일 PDF를 폰에 저장). 왕복 두 번 쓰이니 유효기간 확인.","여권 유효기간 6개월 이상(2027년 4월 이후 만료) 확인. 여권 사본 2장 인쇄 + 폰 사진. 여권용 사진 2장.","여행자보험 가입. 사망 1~3억, 해외 질병·상해 각 2천만 원 이상, 휴대품 손해 포함. 가입 기간은 9/20 출발~10/5 도착. 증서 PDF를 여행사에 보내고 폰에 저장.","은행에서 USD 신권 준비: 100달러 신권 6~7장 + 20달러 5장 + 1달러 20장(팁·화장실). 낙서·접힘 없는 것으로 골라 받는다. 지폐 번호대가 이어지는 신권을 달라고 하면 된다.","해외 결제 카드 2장(Visa/Master 각 1장, 다른 은행). 해외 사용 한도와 출금 가능 여부 확인, 카드사 앱에 해외 결제 알림 설정.","병원에서 고산약(아세타졸아미드) 처방. 성인 1일 2회 125~250mg, 9/23 저녁부터 9/27까지 최소 5일 + 우유니 9/29~10/2 4일 = 약 20정. 설파제 알레르기 있으면 의사에게 말할 것. 멀미약(패치형 편함), 지사제, 소화제, 두통약 함께.","여행사에 확인: 9/20 밤 픽업 여부, 볼리비아 사전등록(SIGEMIG) 필요 여부, 캡틴 연락처."]},{"title":"D-9 ~ D-5 (9/11~9/15) 물건·디지털","items":["이 앱을 폰 홈 화면에 설치하고 와이파이에서 한 번 열어 사진까지 캐시. 비행기 모드로 동작 확인.","구글맵 오프라인 지도 8개 도시 다운로드(프로필 → 오프라인 지도 → 직접 지도 선택, 도시당 100~300MB, 30일 유효라 9/10 이후에 받기). 구글 번역 스페인어 오프라인 팩. Uber·Cabify 앱 설치 후 카드 등록. 왓츠앱 설치(남미 현지 연락은 전부 왓츠앱).","백업 지도 Organic Maps 설치 후 페루(리마·이카·쿠스코·푸노 지역), 볼리비아 전체, 칠레 북부·산티아고 지도 다운로드. 완전 오프라인에서 도보 경로 안내까지 된다.","eSIM 구매(Airalo 등 남미 리저널 10~20GB). 설치만 하고 활성화는 리마 도착 시.","보조배터리 2개 용량 표기 확인(100Wh 이하). 멀티 어댑터, 3구 멀티탭(호텔 콘센트 부족), C to C 케이블 2개.","우유니 사진 소품 준비: 공룡 피규어, 프링글스 통, 장난감 자동차. 다이소에서 해결.","옷은 아래 짐 싸기 목록대로 꺼내 놓고 하루 입어 본다. 특히 경량 패딩과 바람막이 조합, 등산화 길들이기.","한식 비상식량: 컵라면 4~6개, 햇반 3~4개, 볶음김치 파우치, 김, 고추장 튜브. 칠레 반입 허용 품목."]},{"title":"D-4 ~ D-2 (9/16~9/18) 최종 확인","items":["대한항공 앱에서 좌석 지정(KE33 ICN→ATL 13시간 50분, 통로석 권장), 온라인 체크인은 출발 24시간 전.","항공권 e티켓·아고다 바우처·보험증서·ESTA 승인서·여권 사본을 폰 앨범 하나에 모아 두고, 종이로도 1부 인쇄.","환율 계산기 기본값 확인. 여행사 단체 카톡방 공지 확인.","집안 정리: 냉장고, 가스, 우편물, 화분. 카드·통신사에 해외 체류 알림.","짐 최종 패킹. 위탁 23kg 이내(캐리어 자체 무게 포함), 기내 백팩 7kg 이내로 맞춰 본다(BoA 기준). 저울로 재기."]},{"title":"D-1 (9/19) 전날","items":["보조배터리·카메라·폰 완충. 오프라인 콘텐츠 마지막 동기화.","기내 백팩에 넣을 것: 여권·지갑·보조배터리·충전기·상비약·고산약·목베개·안대·귀마개·양치세트·갈아입을 티셔츠·경량 패딩(기내 추움)·펜.","액체는 100ml 이하, 지퍼백 1개. 애틀랜타 보안검색을 다시 받으므로 인천 면세 주류는 사지 않는다.","일찍 잔다. 08:45 출발이면 06:30 공항 도착, 집에서 05:00 출발 기준."]},{"title":"D-day (9/20) 출발","items":["인천 T2 대한항공 카운터. 위탁 짐 태그가 LIM까지 찍혔는지 확인하되, 애틀랜타에서 어차피 찾는다.","탑승 전 ESTA 승인 여부를 카운터에서 확인받는다.","기내에서 시계를 리마 시간(-14시간)에 맞추고, 도착 시각(21:55)까지 깨어 있을 수 있게 첫 식사 후 5~6시간 자기.","애틀랜타 도착 09:35 → 입국심사 → 짐 수취 → 재위탁 → 보안검색 → 콩코스 F. 16:10 출발까지 6시간 35분.","리마 도착 21:55 → 입국심사 → 짐 → 공식 택시 카운터 또는 Uber(3번 문) → Casa Andina Benavides 체크인(아고다 예약번호는 앱 문서 칸)."]}]},{"id":"packing","title":"짐 싸기 상세 (체크리스트)","topics":[{"title":"서류·돈 (기내 백팩, 몸에 지님)","items":["여권 (유효기간 2027.04 이후)","여권 사본 2장 + 폰 사진, 여권용 사진 2장","ESTA 승인서 (PDF + 인쇄)","e티켓 인쇄본 (예약번호는 앱 정보 → 문서에 저장)","아고다 바우처 인쇄본 (예약번호는 앱 문서 칸)","여행자보험 증서 + 긴급 전화번호","USD 현금: 100달러 신권 6~7장, 20달러 5장, 1달러 20장 (두 곳에 분산)","해외 결제 카드 2장 (다른 은행), 비상용 카드 1장은 캐리어 안","원화 소액 (귀국 후 공항버스·택시)","볼펜 2개 (세관 신고서용)"]},{"title":"전자기기","items":["스마트폰 + 보호 필름·방수팩","보조배터리 2개 (각 20,000mAh 이하, 용량 표기 있는 것)","충전기 (65W GaN 멀티포트 1개면 충분) + 케이블 2~3개","멀티 어댑터 (A/B/C/L형) + 3구 멀티탭","이어폰 (유선 1개 예비, 기내 엔터테인먼트용)","카메라 있으면 배터리 2개·메모리카드 예비·삼각대(별 사진용 미니 삼각대)","헤드랜턴 또는 소형 손전등 (소금호텔·새벽 출발)","손목시계 (폰 배터리 아낄 때, 시차 확인)","스마트워치 충전기 잊지 말 것"]},{"title":"옷 (13일, 세탁 1회 기준: 쿠스코)","items":["상의 속건 티셔츠 5~6장 (면 티는 고산에서 땀 마르지 않음)","긴팔 기능성 셔츠 2장 (자외선·마추픽추 벌레)","플리스 또는 얇은 니트 1장","경량 패딩 1장 (필수. 우유니 밤 영하, 새벽 출발 날들)","바람막이·방수 재킷 1장 (마추픽추 비, 우유니 바람)","긴바지 2~3장 (트레킹 바지 1 + 편한 바지 1~2), 반바지 1장 (이카·산티아고)","내복 상하 1세트 (우유니 2박 밤 + 새벽 4시 출발 날)","속옷 7세트, 양말 7쌍 (두꺼운 등산 양말 2쌍 포함)","잠옷 겸 실내복 1세트","수영복 1 + 스포츠 타월 1 (이카 호텔 수영장, 우유니 노천온천)","모자 (햇빛용 챙 모자 1 + 방한 비니 1), 장갑 (얇은 것), 버프 또는 스카프 (모래바람·먼지·추위)","신발: 등산화 또는 트레킹 운동화 1 (메인), 편한 운동화 또는 샌들 1 (도시·버스·호텔), 슬리퍼 1 (호텔·온천)","선글라스 (고산 자외선 필수, 여분 1개 저가형)"]},{"title":"세면·위생","items":["선크림 SPF50 2개 (얼굴용·몸용), 립밤 SPF (고산에서 입술 갈라짐)","보습제 진한 것 (고산 건조), 핸드크림","클렌징·샴푸·린스 소분 (호텔 어메니티는 3성급이라 기대하지 말 것)","칫솔·치약, 면도기","휴대용 휴지 3~4개, 물티슈 2팩 (화장실에 휴지 없음, 우유니 필수)","손 소독제, 마스크 KF94 5장 (버스·먼지·사막)","생리용품 (현지 구매 가능하나 종류 적음)","귀마개·안대 (기내·버스·호텔 소음)","손톱깎이, 반창고, 소형 반짇고리","빨래용 비누 조각 또는 세탁 시트, 빨래줄 (양말·속옷 호텔 세탁)"]},{"title":"약 (처방·상비)","items":["고산약 아세타졸아미드 20정 (처방)","소로치 필 또는 두통약 (이부프로펜·아세트아미노펜)","멀미약 (버스 7시간, 보트, 경비행기 안 타도 지프 3일)","지사제 + 정로환, 소화제, 위장약","감기약, 목 사탕 (건조한 고산 공기)","항히스타민제 (알레르기·벌레)","밴드·상처 연고, 근육 파스 (트레킹 뒤)","전해질 파우더 (고산 수분 보충, 설사 시)","개인 복용약 + 처방전 영문 사본","수면유도제 (27시간 비행·시차, 필요 시)"]},{"title":"우유니·고산 전용","items":["핫팩 4~6개 (여행사는 1~2개라 했지만 2박 밤 + 새벽 출발 고려)","사진 소품: 공룡 피규어, 프링글스 통, 미니카, 컬러풀한 옷·판초","지퍼백 여러 장 (소금·먼지에서 전자기기 보호, 보조배터리 개별 포장)","보온병 500ml (호텔 뜨거운 물 받아 코카차·컵라면)","간식: 견과류·에너지바·초콜릿 (지프 이동 중, 고산 저혈당 대비)","물 2L 우유니 마을에서 구매 (투어 3일용, 지프에 실어 줌)","코카 캔디 (쿠스코에서 구매, 칠레 국경 전 소진)"]},{"title":"가방","items":["캐리어 24~26인치 (위탁 23kg 이내), 자물쇠, 이름표","기내 백팩 20~30L (기내용 캐리어는 국내선 유료. BoA 7kg 기준)","접이식 데이팩 또는 크로스백 (시내 관광, 소매치기 대비 앞으로 메는 것)","압축팩 또는 파우치 (옷·전자기기·약 구분)","방수 커버 (백팩용, 지프 지붕 짐칸 대비)","빈 에코백 1개 (시장·기념품)"]},{"title":"한식·먹을 것 (칠레 반입 허용: 조리·포장 식품)","items":["컵라면 4~6개 (뜨거운 물은 호텔 로비·전기포트)","햇반 3~4개, 볶음김치 파우치 2~3개, 김 몇 봉, 고추장 튜브","인스턴트 커피·믹스 (페루 식당 커피는 인스턴트인 경우 많으니 취향대로)","생과일·육포·견과 무가공은 칠레 반입 금지이니 볼리비아에서 소진"]}]},{"id":"clothes","title":"도시별 옷차림","topics":[{"title":"리마 (15~20도, 흐림·습함)","items":["낮: 긴팔 셔츠 또는 티셔츠 + 얇은 겉옷. 해가 안 나도 자외선은 있다.","밤: 바람막이나 플리스. 해안 절벽은 바람이 차다.","신발: 운동화. 구시가지·미라플로레스 하루 2만 보."]},{"title":"이카·와카치나 (11~28도, 사막)","items":["낮: 반팔·반바지 가능, 모자·선글라스·선크림 필수. 버기카는 모래가 들어오니 버프와 지퍼백에 폰.","사막 디너·밤: 기온 급강하. 경량 패딩. 샌드보딩은 긴바지가 덜 아프다.","수영복: 호텔 수영장. 오후 도착이라 체크인 후 1시간 여유."]},{"title":"쿠스코·마추픽추 (5~22도, 건조·강한 햇빛)","items":["낮 햇빛 아래는 티셔츠, 그늘·실내는 플리스. 하루 안에 사계절.","마추픽추: 긴바지·긴팔(벌레·햇빛), 바람막이(비), 모자. 큰 배낭 반입 금지(40×35×20cm 이하), 물병·간식은 소량. 우산은 금지, 우비 허용.","비니쿤카: 내복 상의 + 플리스 + 패딩 + 바람막이 4겹, 비니·장갑, 등산화. 정상은 체감 영하.","밤: 패딩. 호텔 난방이 약하다."]},{"title":"푸노·라파즈 (1~19도, 건조)","items":["낮 햇빛 강하고 밤 0도 근처. 경량 패딩은 항상 가방에.","티티카카 보트: 호수 위 바람이 차고 자외선 반사가 강하다. 바람막이·선글라스.","라파즈: 언덕이 많아 운동화. 케이블카 안은 따뜻하다."]},{"title":"우유니·알티플라노 (-8~16도, 극건조·강풍)","items":["낮 소금사막: 햇빛 반사가 눈밭 수준. 선글라스 없으면 눈이 아프다. 반팔 위 바람막이.","선셋 이후·별 투어: 내복 + 플리스 + 패딩 + 바람막이 + 비니 + 장갑 + 두꺼운 양말. 핫팩.","2일차 숙소 밤: 침낭 + 옷 다 입고 잔다. 3일차 새벽 온천은 수영복을 옷 안에 입고 출발, 나올 때 큰 타월과 패딩."]},{"title":"아타카마·산티아고 (3~25도, 봄)","items":["아타카마 낮은 덥고 건조. 반팔 + 모자. 저녁 비행기라 산티아고 도착은 밤 22시, 서늘함.","산티아고 10월 초: 아침 6~8도, 낮 20도. 티셔츠 + 재킷. 마지막 날 와이너리는 야외라 모자."]}]},{"id":"flight","title":"27시간 비행 꿀팁","topics":[{"title":"인천 → 애틀랜타 (13시간 50분)","items":["좌석: 통로석. 대한항공 KE33은 보통 A350 또는 B777. 대한항공 앱에서 사전 지정.","시차 전략: 리마는 한국보다 14시간 늦다. 즉 낮밤이 거의 뒤집힌다. 기내 첫 식사 후 5~6시간 자고, 애틀랜타 도착(현지 아침 9:35)부터는 깨어 있는다. 리마 도착 21:55에 바로 자면 첫날 시차가 거의 해결된다.","물 많이 마시고 술은 피한다. 압박 스타킹이 있으면 다리 부종에 도움.","기내 반입: 목베개, 안대, 귀마개, 립밤, 보습제, 양치세트, 슬리퍼용 양말, 태블릿에 영화 다운로드."]},{"title":"애틀랜타 6시간 35분","items":["입국심사 줄이 길면 1시간. MPC 앱을 미리 설치하면 별도 줄.","짐을 찾아 재위탁 후 보안검색. 여기서 액체 규정 다시 적용. 인천 면세 주류 사지 않는다.","콩코스 F는 식당이 많다. 미국식 아침(팬케이크·베이컨)이나 치킨. 물은 리필 스테이션.","유심을 안 사도 공항 와이파이 무료. 가족에게 안착 연락.","남은 시간은 걷는다. 다음 비행 6시간 45분을 위해 다리를 풀어 둔다."]},{"title":"애틀랜타 → 리마 (6시간 45분, 델타 운항)","items":["델타 기내식은 저녁 1회 + 간식. 기내 엔터테인먼트 한국어 자막은 적다.","리마 도착 직전 입국 신고서는 없다. 심사관에게 관광 목적, 13일, 호텔 이름을 말한다.","도착 21:55. 짐 찾고 나오면 22:30~23:00. 택시 카운터에서 미라플로레스 60~95솔 또는 Uber. 호텔 도착 자정 전후."]},{"title":"귀국 편 (산티아고 20:40 → 애틀랜타 05:20 → 인천 14:10)","items":["산티아고→애틀랜타 9시간 40분은 밤 비행이라 자기 좋다. 도착 후 애틀랜타 4시간 환승은 새벽이라 줄이 짧다.","애틀랜타→인천 15시간 50분. 한국 시간에 맞추려면 이 구간 전반부는 깨어 있다가 후반부에 잔다. 인천 도착 14:10(월요일).","칠레 페소는 공항에서 다 쓴다. 남은 볼리비아노·솔은 재환전이 어려우니 기념으로."]}]},{"id":"apps","title":"앱·디지털 준비","topics":[{"title":"설치할 앱","items":["Uber, Cabify (리마·쿠스코·산티아고), InDrive (라파즈·쿠스코, 가격 협상형)","WhatsApp (캡틴·호텔·투어사 연락 표준)","Google 지도 (오프라인 8도시. 오프라인에서 지도 보기·내 위치·자동차 경로는 되고, 도보·대중교통 경로와 작은 상점 검색은 안 됨)","Organic Maps (완전 오프라인 지도, 도보 경로 가능, 무료·광고 없음). 구글맵이 못 찾는 골목 식당은 이 앱의 지도에서 좌표로 확인","Google 번역 (스페인어 오프라인 + 카메라)","이 앱은 설치 후 오프라인 동작. 장소 링크는 좌표가 들어 있어 오프라인 구글맵에서도 핀이 찍힌다. 실시간 날씨만 온라인 필요","Airalo 등 eSIM 앱, 대한항공 앱, 아고다 앱(바우처)","환율: 이 앱 계산기로 충분. 정확한 실시간은 XE.","날씨: 이 앱 오늘 화면(Open-Meteo). 우유니 별 보기용으로 Windy(구름 예보) 추천.","별자리: Stellarium 또는 Sky Guide(유료) 오프라인 모드로 남십자성 찾기.","지진: 칠레·페루는 흔하다. 폰 긴급재난문자가 오면 안내대로.","PeruRail 앱은 불필요(여행사 발권). 마추픽추 입장권은 캡틴이 나눠 준다."]},{"title":"폰 설정","items":["구글 계정 2단계 인증 백업코드 저장 (해외에서 로그인 막힐 때).","카카오톡 로밍 상태에서 잘 되게 데이터 절약 모드 해제. 사진 자동 백업은 와이파이에서만.","사진 저장 공간 확보: 13일 3천 장 기준 30GB. 클라우드 자동 업로드는 호텔 와이파이에서 밤에.","위치 공유(가족)를 카카오맵 또는 구글 위치공유로 켜 두면 우유니 이후 연락 안 될 때 안심.","폰 잠금 화면에 비상 연락처와 혈액형·알레르기를 표시(안드로이드 긴급 정보)."]}]},{"id":"sim","title":"유심·eSIM 완전 가이드 (2026년 9월 조사)","topics":[{"title":"결론부터: 추천 조합","items":["1순위(추천): 출발 전 볼리비아 포함이 확인된 남미 리저널 eSIM 1개(Airalo LatamLink 또는 Holafly 라틴아메리카) + 라파즈에서 ENTEL 현지 유심 추가(여행사 권장, 약 80Bs) + 한국 유심은 그대로 두고 데이터 로밍만 OFF(은행 OTP 문자 수신용). 총비용 약 5~9만 원.","2순위(가장 싼 법): 현지 유심 2장. 리마 미라플로레스에서 Entel 또는 Claro 유심(20~40솔, 7~12GB) + 라파즈 ENTEL 유심(80Bs). 칠레 이틀은 호텔 와이파이로 버티거나 eSIM 1일권. 총 2~3만 원. 단 페루는 48시간 안에 IMEI 등록을 매장에서 해야 하고, 유심을 갈아 끼우는 번거로움.","3순위(가장 편한 법): 한국 통신사 로밍 요금제. 번호 그대로, 설정 없음. 하루 1.1만~1.65만 원 수준 × 14일 = 15~23만 원. 볼리비아가 요금제 대상국에 포함되는지 반드시 확인(제외되는 상품이 있음).","어떤 조합이든 우유니 지프투어 2박 3일과 마추픽추 유적 안은 신호가 없다. 이 앱과 오프라인 지도가 그 구간의 대안이다."]},{"title":"왜 여행사 안내와 다른가","items":["여행사는 볼리비아 ENTEL 유심을 권장하고 글로벌 eSIM은 볼리비아에서 불안정하다고 안내한다. 조사 결과 일부는 맞다. 남미 리저널 eSIM 중 볼리비아를 아예 빼는 상품이 많고(Instabridge, Jetpac, aloSIM 남미 플랜), 포함되는 상품도 볼리비아 파트너 망(Tigo·Viva)이 시외에서 약하다.","그래서 볼리비아 3박은 ENTEL 유심을 추가하는 것이 맞다. 다만 페루 8일과 칠레 2일은 eSIM이 현지 유심보다 편하고 값도 비슷하다. 특히 칠레는 2025년부터 선불 유심 구매에 지문 생체인증이 요구되어 외국인 판매를 거부하는 매장이 늘었다. 칠레 현지 유심은 계획에서 빼는 것이 안전하다."]},{"title":"리저널 eSIM 비교 (2026년 상반기 가격, 출발 전 재확인)","items":["Airalo LatamLink: 볼리비아 포함 확인. 2GB/15일 USD 28, 5GB/30일 USD 60. 데이터 단가는 비싸지만 가장 널리 검증됨. 페루 단일국 eSIM은 더 저렴하니 페루용 단일 + 칠레용 단일로 나누는 것도 방법.","Holafly 라틴아메리카: 볼리비아 포함. 무제한(공정사용 기준) 30일 USD 69~79. 사진 백업·영상 통화가 많으면 이쪽. 핫스팟 제한 있음.","Nomad 라틴아메리카: 볼리비아 포함. 5~20GB 옵션 약 USD 45 전후.","Saily(NordVPN 계열) 남미 리저널: 볼리비아 포함, 1~20GB USD 8~45.","Maya Mobile 라틴아메리카: 14일 무제한 약 USD 28로 표기된 상품이 있으나 볼리비아 망·속도 제한을 결제 전 확인.","한국 판매처(유심사·말톡·도시락)의 남미 eSIM은 대부분 위 공급사를 재판매하는 것으로, 한국어 상담과 카카오 결제가 장점. 볼리비아 포함 여부를 상품 상세에서 반드시 확인.","구매 시 확인 3가지: 볼리비아 포함, 핫스팟(테더링) 가능, 개통 시점(설치 시 vs 첫 접속 시). 첫 접속 시 개통되는 상품을 골라 한국에서 설치해 두고 리마에서 켠다."]},{"title":"현지 유심 (나라별)","items":["페루: Entel 7GB 20솔, 12GB 29솔, 20GB 39솔 / Claro 관광객 플랜 5GB 7일 67솔(미국·칠레 통화 포함). 미라플로레스 케네디 공원 주변 공식 매장 다수, 여권 필요. 공항 Claro 부스는 USD 50 수준으로 비싸니 피한다.","페루 IMEI 규정: 2026년부터 외국 폰에 현지 유심을 개통하면 48시간 안에 통신사 매장에서 IMEI 등록(무료, 여권 제시)을 해야 하고 안 하면 차단될 수 있다. 유심을 사는 매장에서 바로 등록을 요청한다. eSIM·로밍은 해당 없음.","볼리비아: ENTEL 유심 10Bs + 6일 무제한 약 80Bs(여행사 안내) 또는 7~15GB 패키지 40~80Bs. 구매 시 여권 등록 필수(직원이 여권 촬영, 15~30분). 라파즈 시내 ENTEL 매장 또는 소나 수르 메가센터. Entel이 시외·우유니 마을에서 가장 잘 잡힌다.","칠레: Movistar 40GB 5,000페소 등 가격은 매우 싸지만 2025년 2월 생체인증 규정으로 외국인 선불 유심 판매를 거부하는 매장이 많다. 30일 미만 체류는 IMEI 등록 불필요. 결론: 칠레는 eSIM 또는 로밍."]},{"title":"한국 통신사 로밍","items":["요금제 예: SKT baro(3GB 29,000원, 6GB 39,000원, 12GB 59,000원 등), KT 데이터로밍 하루종일 ON, LG U+ 제로라밍. 남미는 하루 1.1만~1.65만 원 상품이 보통.","반드시 확인할 것: 페루·볼리비아·칠레·미국(환승) 4개국이 모두 대상국인지. 볼리비아가 빠진 상품이 있다. 통신사 앱의 국가 검색으로 확인.","장점: 번호 유지, 설정 없음, 한국 전화 수신. 단점: 비용, 볼리비아 시외 커버리지는 현지 유심보다 약함.","로밍을 안 쓰더라도 한국 유심은 빼지 않는다. 데이터 로밍만 끄면 문자(OTP)는 무료로 받는다. 대신 전화가 오면 착신 요금이 붙으니 받지 않고 왓츠앱으로 다시 건다."]},{"title":"갤럭시 설정 순서","items":["eSIM 지원 확인: 설정 → 연결 → SIM 관리자 → eSIM 추가 메뉴가 있으면 지원. 국내 S23 이후·Z플립4/폴드4 이후·A54 이후 대부분 지원. S22 이전 국내 모델은 미지원이 많다. 통신사에서 eSIM 기능이 잠긴 경우 고객센터에 해제 요청.","출발 전(와이파이): eSIM 앱에서 구매 → QR 또는 자동 설치 → SIM 관리자에 프로필이 보이면 완료. 활성화는 리마에서.","리마 착륙 후: SIM 관리자 → 모바일 데이터 = eSIM, 통화·문자 = 한국 SIM, 한국 SIM의 데이터 로밍 OFF. 데이터 로밍은 eSIM 쪽만 ON.","볼리비아 도착: ENTEL 유심을 한국 유심 자리에 끼우면 OTP를 못 받는다. eSIM 지원 폰이면 한국 유심 유지 + ENTEL 유심을 물리 슬롯에 넣기 위해 한국 유심을 빼야 하므로, 볼리비아 3일은 OTP가 필요한 은행 업무를 미리 끝내 둔다. 빠진 한국 유심은 지퍼백에 여권과 함께.","데이터가 안 잡히면: 비행기 모드 켰다 끄기 → APN 자동 설정 확인 → eSIM 앱 고객센터(채팅). 대부분 APN 자동.","통화는 전부 왓츠앱. 캡틴·호텔·투어사가 다 왓츠앱을 쓴다."]},{"title":"데이터 얼마나 필요한가","items":["14일 5~10GB면 충분하다. 지도는 오프라인, 사진 백업은 호텔 와이파이, 영상 시청은 안 한다는 전제.","많이 쓰는 것: 구글맵 실시간 경로(시간당 5~10MB), 왓츠앱 사진, 인스타 업로드, 번역 카메라. 적게 쓰려면 사진 자동 백업을 와이파이 전용으로.","하루 300~500MB 기준으로 7GB. 여유 있게 10GB. 무제한 상품은 그 이상 쓸 때만."]},{"title":"어디서 신호가 없나 (조사 결과)","items":["우유니 지프투어: 마을은 Entel 4G. 기차무덤·콜차니는 약하고, 소금사막 안쪽·잉카와시·라구나 콜로라다·산베르나르도 숙소는 0. 즉 9/30 오전 11시부터 10/2 정오 국경까지 약 48시간 완전 오프라인.","마추픽추: 아구아스칼리엔테스 마을은 4G, 유적 안은 간헐적(Movistar가 조금 낫다), 높은 구역은 없음.","쿠스코·성스러운 계곡: 도시 4G, 마을 사이 3G. Claro가 고지대에서 낫다. 비니쿤카 정상은 없음.","푸노~데사구아데로: 양쪽 마을 4G, 사이 구간 끊김. 국경에서 볼리비아 eSIM·유심으로 전환하는 타이밍.","라파즈 소나 수르: 커버리지 있음, Entel이 낫다. 케이블카 안 4G.","산페드로 데 아타카마: 마을 4G(Entel), 국경 이토 카혼 주변은 약함.","산티아고: 전 지역 4G/5G.","애틀랜타: 공항 무료 와이파이. 6시간을 위해 미국 데이터를 사지 않는다."]},{"title":"출발 전 체크","items":["eSIM 구매·설치 완료, 활성화 방식 확인","한국 유심 데이터 로밍 OFF 방법 미리 확인, 통신사 로밍 차단 서비스 신청 여부 결정","은행·카드 앱의 OTP 수단을 문자 대신 앱 인증(PASS·토스 등)으로 바꿔 두면 유심을 뺀 볼리비아에서도 결제 승인 가능","카카오톡·왓츠앱 로그인 상태 확인, 왓츠앱에 캡틴·가족 번호 저장(+82 형식)","유심 핀(SIM 이젝터)과 빈 유심 케이스를 지갑에"]}]},{"id":"hacks","title":"여행 꿀팁 모음","topics":[{"title":"돈 아끼는 법","items":["점심은 메누 델 디아(세트) 12~20솔로 배를 채우고 저녁은 가볍게. 페루 식당 세트는 양이 많다.","물은 시장이나 마트에서 2.5L 대용량 5솔. 편의점 소병은 3배.","택시 대신 앱. 흥정할 때는 미리 앱으로 가격을 확인하고 그 가격을 부른다.","기념품은 쿠스코 산페드로 시장과 라파즈 사가르나가 거리가 가장 싸다. 알파카 100% 표기는 대부분 혼방이니 가격이 5만 원 아래면 혼방으로 생각한다. 진짜 베이비 알파카 스웨터는 150~300솔.","칠레 ATM 수수료가 크니 한 번에 20만 페소. 산티아고 이틀 경비는 카드 위주.","볼리비아노는 정확히 필요한 만큼만 환전. 남으면 재환전이 어렵다."]},{"title":"시간 아끼는 법","items":["매일 저녁 다음 날 카드를 보고 짐을 두 종류로 나눈다: 지프·버스에 실을 것과 손에 들 것.","호텔 체크인 시 조식 시간과 세탁 서비스, 뜨거운 물 받을 곳을 바로 묻는다.","마추픽추 날: 전날 밤 배낭을 다 꾸리고 물병만 아침에. 기차 시간은 절대적이다.","우유니 전날(라파즈 2일차 밤): 캐리어를 3일용 백팩과 남는 짐으로 분리. 새벽 3시에 짐 싸지 않는다.","국경 넘는 날 여권·관광카드·세관 신고서를 한 파우치에."]},{"title":"몸 관리","items":["고산 도착 첫날 규칙: 천천히, 물 3L, 술 금지, 뜨거운 샤워 짧게, 저녁은 수프. 두통은 정상, 구토·착란은 비정상.","쿠스코에서 하루 한 번 코카차, 우유니에서 하루 한 번 온천은 안 된다(3일차 새벽 한 번). 대신 밤에 물을 마셔 두면 아침 두통이 준다.","자외선: 고산은 흐려도 탄다. 2시간마다 선크림. 콧등·귀·목 뒤·손등.","배탈: 처음 이틀은 얼음·생야채를 피하고 익힌 것만. 세비체는 점심에 사람 많은 곳.","잠: 고산에서 첫 며칠 새벽에 깬다. 정상이다. 낮에 20분 낮잠이 도움.","발: 등산화 안에 두꺼운 양말, 저녁에 발 마사지. 물집 밴드 지참."]},{"title":"사진","items":["마추픽추: 입장 직후 상단 전망대(가디언 하우스 방향)에서 전경을 먼저 찍는다. 오전 12시 입장이라 빛이 위에서 내려오니 그림자가 짧다. 오후 3시 이후 사람이 빠진다.","우유니: 원근법 사진은 오후 4시 이후, 선셋은 물찬 포인트에서 반영, 별은 달 뜨기 전. 폰 렌즈를 자주 닦는다(소금 먼지).","라파즈 케이블카: 레드라인 하행이 도시 전경, 옐로우·그린라인이 부촌과 일리마니. 유리에 붙지 말고 30cm 떨어져 찍으면 반사가 준다.","사람 사진 예절: 촐리타·시장 상인은 찍기 전에 꼭 묻는다(¿Puedo tomar una foto?). 몇 솔 요구하기도 하니 잔돈.","매일 밤 호텔 와이파이에서 백업. 폰 분실 대비."]},{"title":"데이터 없이 살기","items":["이 앱: 출발 전 와이파이에서 한 번 열어 사진까지 뜨게 두면 이후 비행기 모드에서도 전부 동작. 크롬 캐시·사이트 데이터를 지우지 말 것.","구글맵 오프라인 영역을 받아 두면 앱의 장소 링크를 눌렀을 때 좌표로 핀이 찍힌다. 길찾기는 자동차 모드만 오프라인 가능, 걷기는 지도를 보며 직접.","Organic Maps는 걷기 경로까지 오프라인. 두 지도를 같이 쓰면 데이터 없이 도시 이동이 된다.","호텔 와이파이에서 매일 밤: 사진 백업, 가족 연락, 다음 날 장소 미리 검색해 구글맵 별표 저장(별표는 오프라인에서도 보인다).","번역은 구글 번역 오프라인 팩, 환율은 이 앱 계산기, 시계는 이 앱 시계. 우유니 3일은 완전 오프라인이라고 생각하고 출발 전날 다 받아 둔다.","통신 없이 캡틴과 만나기: 매일 저녁 다음 날 집합 시각·장소를 이 앱 메모나 종이에 적어 둔다. 왓츠앱은 와이파이에서만 확인된다고 생각한다."]},{"title":"소소한 것들","items":["화장실은 유료·휴지 없음이 기본. 카페에서 뭔가 사고 쓰는 게 가장 깨끗하다.","페루·볼리비아 식당은 계산서를 달라고 해야 온다. 카드 결제 시 카드를 들고 가면 따라간다.","팁 문화: 짐 들어주는 호텔 직원 1달러, 가이드 팀 단위, 식당 10%는 선택.","물건 흥정은 시장에서만. 상점·마트는 정가.","볼리비아·페루에서 시간 약속은 10~20분 늦는 게 보통이지만 투어·기차·비행기는 정확하다.","잉카 콜라 한 번, 치차 모라다 한 번, 피스코 사워 두 나라 비교, 알파카 스테이크 한 번, 세비체 두 번, 살테냐 아침 한 번, 콤플레토 한 번. 이 정도면 먹을 것 미션 완료.","남은 페루 솔 지폐는 볼리비아 국경에서 볼리비아노로 바꿀 수 있지만 환율이 나쁘다. 푸노에서 다 쓰거나 국경 전 환전소.","우유니 투어 기사에게 첫날 이름을 묻고 불러 주면 사진 연출과 서비스가 확실히 달라진다."]}]}];</script>
<script>window.OPTIONS_DATA = [{"id":"boleto","title":"쿠스코 통합 입장권 (Boleto Turístico) 먼저 이해하기","meta":{"day":4,"city":"cusco","mapQuery":"COSITUC Boleto Turistico, Av. El Sol 103, Cusco","time":"구매 10분","cost":"전체권 130솔(10일, 16곳) / 부분권 70솔(1~2일, 권역별 4곳)","level":"☆☆☆ 정보","book":"Av. El Sol 103 COSITUC 사무소 또는 각 유적 입구. 현금·카드. 여권 필요","lat":-13.51827,"lon":-71.97829},"sections":[{"title":"왜 알아야 하나","paragraphs":["쿠스코 주변 유적 대부분은 개별 입장권을 팔지 않고 통합권으로만 들어간다. 삭사이와망, 켄코, 푸카푸카라, 탐보마차이(쿠스코 근교 4곳), 피삭, 오얀따이땀보, 친체로, 모라이(성스러운 계곡), 그리고 시내 박물관 몇 곳이 포함된다. 코리칸차와 대성당은 별도다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["부분권 1권(70솔)은 쿠스코 근교 4곳(삭사이와망 등), 3권(70솔)은 성스러운 계곡(피삭·오얀따이땀보·친체로·모라이).","삭사이와망만 가고 계곡 투어도 갈 거면 전체권(130솔)이 이득. 하나만 갈 거면 부분권.","마추픽추는 이 표와 무관하고 여행사 포함이다. 마라스 염전도 별도(10~20솔, 마을이 운영).","성스러운 계곡 투어 상품 가격에는 이 표가 포함되지 않는 것이 보통이다. 투어 신청 시 확인."]},{"title":"이야기","paragraphs":["통합권 수익은 쿠스코 지방정부 문화재 기금으로 간다. 유적마다 표 검사가 엄격해 여권과 함께 보여 주어야 하고, 한 유적은 한 번만 들어갈 수 있다. 첫날 도착해 시내 아르마스 광장을 걷다 Av. El Sol의 사무소에서 사 두면 D6 자유일정 계획이 편하다."],"bullets":[]}]},{"id":"lostcanyon","title":"잃어버린 협곡 (Cañón de los Perdidos)","meta":{"day":3,"city":"ica","mapQuery":"Cañón de los Perdidos, Ica, Peru","time":"5~6시간 (사막 차량 왕복 3~4시간 + 협곡 산책 1~1.5시간). 보통 08:00 출발 → 13:30 복귀","cost":"약 70~120솔/인 (4WD 차량·가이드), 입장료 약 10솔 별도","level":"★★☆ 오프로드 이동이 거칠고, 협곡 바닥까지 내려가는 짧은 트레킹. 운동화 필수","book":"전날(D2) 저녁 캡틴 통해 신청. 4~6인 차량 단위라 인원이 모이면 저렴","lat":-14.75444,"lon":-75.51404},"sections":[{"title":"왜 갈까","paragraphs":["이카 남쒹 사막 한복판에 숨어 있어 2011년까지 외부에 거의 알려지지 않았던 협곡이다. 미국 그랜드캐니언의 축소판 같은 붉은 절벽이 사막 바닥에 갑자기 갈라져 있고, 바닥에는 마른 강줄기가 굽이친다. 나스카 경비행기가 빠진 자리에 여행사가 넣은 대안으로, 사진이 극적이고 사람이 적다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["협곡까지 가는 길이 절반은 비포장 사막이다. 멀미약, 물 1L, 모자, 선글라스, 버프.","그늘이 거의 없다. 선크림을 출발 전에 바르고 중간에 한 번 더.","전망대에서 사진, 그다음 바닥으로 내려가는 길은 경사가 있어 샌들은 위험.","화장실은 출발지와 도착 매점에만. 물은 매점에서도 산다.","바예스타와 같은 날 병행은 시간상 어렵다. 둘 중 하나."]},{"title":"이야기","paragraphs":["협곡을 만든 것은 물이다. 비가 오지 않는 사막이지만 안데스에서 내려온 강이 수천 년에 걸쳐 퇴적층을 깎았고, 엘니뇨 해에만 물이 흐른다. 절벽 층마다 색이 다른 것은 각 시대의 홍수가 실어 온 흙이 다르기 때문이다. 바닥에서 위를 보면 층리가 시간표처럼 읽힌다."],"bullets":[]}]},{"id":"ballestas","title":"바예스타 섬 + 파라카스 보호구역","meta":{"day":3,"city":"ica","mapQuery":"Islas Ballestas, Paracas, Peru","time":"06:30 출발 → 13:00 복귀 (이카→파라카스 1시간 15분, 보트 2시간, 보호구역 1~2시간)","cost":"보트 약 40~60솔 + 선착장·입장세 약 16~20솔. 보호구역 추가 시 +11솔 입장 + 투어 20~30솔","level":"★☆☆ 보트에 앉아 있으면 됨. 멀미 약간","book":"전날 저녁 캡틴 통해. 보트는 08:00·10:00 출발이 보통","lat":-13.8306,"lon":-76.24716},"sections":[{"title":"왜 갈까","paragraphs":["가난한 자의 갈라파고스라는 별명이 붙은 섬이다. 보트로 섬을 돌며 바다사자 수백 마리, 훔볼트 펭귄, 가마우지·부비·펠리컨이 절벽을 덮은 광경을 본다. 배에서 내리지는 않는다. 가는 길에 언덕에 새겨진 촛대 모양 지상화 칸델라브로(높이 180m)를 지나는데, 기원과 목적을 아무도 모른다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["바람이 차고 물이 튄다. 바람막이 필수. 새 배설물이 떨어질 수 있어 모자.","카메라 줌이 있으면 좋다. 폰은 3배 정도면 충분.","파라카스 국립보호구역은 붉은 해변(플라야 로하)과 대성당 바위 전망대가 하이라이트. 보트 뒤 2시간 미니버스 투어로 붙일 수 있다.","파라카스 항구 마을에서 점심(세비체가 신선)을 먹고 이카로 돌아와 16:00 리마행 버스."]},{"title":"이야기","paragraphs":["19세기 이 섬의 구아노(바닷새 배설물)는 두께 50m로 쌓여 있었고, 페루 정부 수입의 대부분이 이 새똥 수출이었다. 지금도 수년마다 한 번 정부가 구아노를 채취한다. 파라카스라는 이름은 케추아어로 모래비라는 뜻으로, 오후에 부는 강한 바람을 가리킨다. 오전 투어를 권하는 이유다."],"bullets":[]}]},{"id":"limacentro","title":"리마 구시가지 도보 코스","meta":{"day":1,"city":"lima","mapQuery":"Plaza Mayor de Lima","time":"3~4시간 (미라플로레스에서 이동 편도 40분 추가)","cost":"산프란시스코 수도원 20솔(가이드 포함), 대성당 20솔, 교통 택시 25~35솔 또는 메트로폴리타노 버스 3.2솔","level":"★☆☆ 평지 걷기","book":"불필요. 산프란시스코 영어 가이드는 정시마다 출발","lat":-12.04594,"lon":-77.03057},"sections":[{"title":"왜 갈까","paragraphs":["1535년 피사로가 세운 도시의 원점이다. 아르마스 광장(플라사 마요르)을 둘러싼 대통령궁·대성당·시청은 유네스코 세계유산이고, 산프란시스코 수도원 지하의 카타콤(유골 2만 5천 구)은 리마에서 가장 기억에 남는 장소다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["추천 순서: 산프란시스코 수도원(카타콤·도서관) → 아르마스 광장 → 대성당(피사로의 관) → 산토도밍고 → 히론 데 라 우니온 보행자 거리 → 산마르틴 광장.","대통령궁 근위병 교대식은 정오. 광장이 시위로 통제되는 날이 있다.","광장 남쪽·동쒹 몇 블록만 벗어나면 치안이 급격히 나빠진다. 지도의 관광 구역 밖으로 가지 않는다.","점심은 구시가지의 전통 식당(엘 코르다노 등 100년 된 카페)에서 부티파라 샌드위치.","오후에 미라플로레스로 돌아와 해안 절벽 산책과 일몰. 저녁 분수쇼로 이어진다."]},{"title":"이야기","paragraphs":["피사로의 유해는 대성당 첫 예배당에 있다. 1977년까지 다른 시신이 피사로로 전시되다가 진짜 유골이 지하실에서 발견됐다. 두개골에 칼자국이 있어 1541년 암살 기록과 일치했다."],"bullets":[]}]},{"id":"barranco","title":"미라플로레스·바랑코 산책","meta":{"day":1,"city":"lima","mapQuery":"Puente de los Suspiros, Barranco, Lima","time":"반나절","cost":"무료 (우아카 푸야나 15솔, 야간 투어 약 17솔)","level":"★☆☆","book":"불필요","lat":-12.14917,"lon":-77.02259},"sections":[{"title":"왜 갈까","paragraphs":["호텔에서 걸어서 갈 수 있는 리마의 얼굴이다. 미라플로레스 해안 절벽의 사랑의 공원(연인 조각 엘 베소), 패러글라이더가 뜨는 절벽, 절벽에 박힌 쇼핑몰 라르코마르, 그리고 택시 10분 거리 바랑코의 벽화 골목과 한숨의 다리."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["코스: 호텔 → 케네디 공원(고양이 공원) → 라르코마르 → 사랑의 공원 → 절벽길 남쪽으로 걸어 바랑코까지 40분(또는 택시) → 한숨의 다리 → 바하다 데 로스 바뇨스 → 해변.","우아카 푸야나는 미라플로레스 한복판의 선잉카 피라미드. 가이드 투어만 가능, 40분. 부지 안 레스토랑은 야경이 좋다.","살라사르 공원의 패딩턴 동상은 라르코마르 옆.","일몰은 18:15 전후. 절벽 위 공원에서 보고 라르코마르에서 저녁.","바랑코 밤 골목은 소지품 주의. 메인 광장 주변은 안전."]},{"title":"이야기","paragraphs":["한숨의 다리는 1876년에 세워진 목조 다리로, 숨을 참고 한 번에 건너면 소원이 이뤄진다는 말이 있다. 다리 아래 바하다 데 로스 바뇨스는 어부들이 바다로 내려가던 길이었고, 지금은 카페와 벽화 거리다. 바랑코는 리마 예술가와 음악가의 동네로, 가수 차부카 그란다의 노래 한숨의 다리가 이 다리에서 나왔다."],"bullets":[]}]},{"id":"magicwater","title":"분수쇼 (Circuito Mágico del Agua)","meta":{"day":1,"city":"lima","mapQuery":"Parque de la Reserva, Lima","time":"1.5~2시간 (19:15·20:15·21:30 레이저 쇼, 여행사 안내 기준 저녁 7·8·9시)","cost":"입장 4~7솔","level":"★☆☆","book":"불필요. 화~일 15:00~22:30, 월요일 휴무(여행사 자료는 월~일로 표기, 현장 확인)","lat":-12.0711,"lon":-77.0337},"sections":[{"title":"왜 갈까","paragraphs":["공원 하나에 13개의 분수가 있고 그중 터널 분수는 안을 걸어서 지나가고, 어린이 분수는 뛰어들 수 있다. 밤 레이저·음악 쇼는 남미 최대 규모라는 기네스 기록이 있다. 입장료가 커피 한 잔 값이라 첫날 저녁 시차 적응용으로 최적이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["미라플로레스에서 택시·Uber 20~30분(15~25솔). 돌아올 때 공원 앞에서 Uber.","분수에 들어갈 생각이면 갈아입을 옷이나 우비. 9월 리마 밤은 15도라 젖으면 춥다.","마술 분수 쇼는 정각에 시작하고 15분. 자리는 30분 전에."]},{"title":"이야기","paragraphs":["공원은 1929년 만들어졌다가 방치되어 2007년 재개장했다. 분수를 만든 것은 리마 시가 상수도 회사와 손잡은 사업이었고, 개장 당시 물 낭비라는 비판을 받았으나 지금은 리마 시민이 가장 사랑하는 공원이다."],"bullets":[]}]},{"id":"larco","title":"라르코 박물관 (Museo Larco)","meta":{"day":1,"city":"lima","mapQuery":"Museo Larco, Av. Bolívar 1515, Pueblo Libre, Lima","time":"2~3시간","cost":"약 40솔 (09:00~19:00 연중무휴)","level":"★☆☆","book":"불필요","lat":-12.07278,"lon":-77.0709},"sections":[{"title":"왜 갈까","paragraphs":["페루 5천 년 문명을 한 건물에서 보는 가장 좋은 방법이다. 모체·나스카·파라카스·잉카의 토기, 황금 장신구, 직물이 깨끗하게 전시되어 있고, 창고까지 개방해 유물 4만 점을 선반째로 볼 수 있다. 부속 에로틱 토기관은 이 박물관의 유명한 별관이다. 정원 안 카페는 리마에서 가장 아름다운 점심 장소로 꼽힌다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["미라플로레스에서 택시 25~35분(20~30솔). 구시가지와 묶으면 이동이 효율적이다.","한국어 오디오 가이드는 없지만 영어 설명이 충분하다. 앱 읽을거리의 안데스 문명 연표를 먼저 읽으면 두 배로 보인다.","저녁 19:00까지 열어 일몰 뒤 방문도 가능. 카페 저녁은 예약 권장."]},{"title":"이야기","paragraphs":["1926년 라파엘 라르코 오일레가 25세에 세운 개인 박물관이다. 그는 모체 문명의 연대를 토기 양식으로 정리해 페루 고고학의 기초를 놓았다. 모체 토기의 초상 항아리는 개인의 얼굴을 사실적으로 빚은 것으로, 2천 년 전 페루 사람들의 얼굴을 눈앞에서 본다."],"bullets":[]}]},{"id":"vinicunca","title":"비니쿤카 (무지개산)","meta":{"day":6,"city":"cusco","mapQuery":"Vinicunca Rainbow Mountain, Peru","time":"04:00~05:00 출발 → 17:00~18:00 복귀. 차량 3시간 + 트레킹 왕복 3시간 + 아침·점심","cost":"투어 약 60~100솔(차량·아침·점심 포함) + 입장료 25~30솔(마을 징수) + 말 편도 80~100솔(선택)","level":"★★★ 최고점 5,036m. 거리(왕복 7km)보다 고도가 문제","book":"전날(D5) 저녁까지 캡틴 통해. D4 밤 컨디션을 보고 결정","lat":-13.87047,"lon":-71.24231},"sections":[{"title":"왜 갈까","paragraphs":["빙하가 녹아 2015년경 드러난 줄무늬 산이다. 붉은색(산화철), 노란색(황화철), 녹색(녹니석), 흰색(석회암·석영) 지층이 세로로 서 있다. 정상 전망대에서 보는 산은 사진과 같지만, 뒤로 돌면 아우상가테 설산(6,384m)과 붉은 계곡이 펼쳐진다. 이번 여행의 최고점이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["출발 전날 밤 잠을 충분히. 새벽 4시 픽업, 차에서 2시간 잔다.","아침은 투어 식당(피툰마르카 마을)에서 빵·죽. 트레킹 출발 주차장이 4,600m다.","말은 주차장에서 정상 직전(약 4,900m)까지. 거기서 정상 계단 15~20분은 걸어야 한다. 하산은 도보.","복장 4겹(내복·플리스·패딩·바람막이), 비니·장갑, 등산화. 정상은 바람에 체감 영하. 낮에는 덥다.","물 1.5L, 코카 캔디, 초콜릿. 산소 캔 하나 사 가면 심리적 안정.","고산 증상(심한 두통·구토·어지럼)이 있으면 무조건 내려온다. 정상은 다음에.","대안: 팔코요(Palccoyo)는 트레킹 40분, 4,900m, 무지개산 3개. 사람 적고 쉬움. 투어사에 물어볼 것."]},{"title":"이야기","paragraphs":["비니쿤카는 케추아어로 색깔의 산 또는 일곱 색의 산이다. 2016년 사진이 퍼진 뒤 하루 1천 명이 몰려들었고, 마을 두 곳(피툰마르카·쿠시팜파)이 서로 다른 길로 관광객을 받으며 입장료 분쟁을 했다. 2018년에는 산 아래 광산 채굴권 논란이 있었다. 지금 걷는 길은 마을이 관리하고 말은 마을 사람의 수입이다."],"bullets":[]}]},{"id":"sacredvalley","title":"성스러운 계곡 (마라스·모라이·오얀따이땀보·친체로)","meta":{"day":6,"city":"cusco","mapQuery":"Salineras de Maras, Peru","time":"종일 08:00~18:30 (반일 코스도 있음)","cost":"투어 약 50~90솔(차량·가이드, 점심 별도) + 통합권 부분권 70솔(모라이·오얀따이땀보·친체로·피삭) + 마라스 염전 10~20솔","level":"★☆☆ 차로 이동, 각 유적 30분~1시간 걷기. 고도 2,900~3,700m로 쿠스코보다 낮은 곳이 많음","book":"캡틴 통해 전날. 비니쿤카의 대안으로 여행사 추천","lat":-13.30008,"lon":-72.15624},"sections":[{"title":"왜 갈까","paragraphs":["우루밤바 강이 만든 계곡은 잉카의 곡창이었고, 마추픽추로 가는 길이다. D5에 오얀따이땀보 역을 스쳐 지나가지만 유적은 보지 못한다. 이 투어는 그것을 채운다. 마라스 염전은 산비탈에 3천 개의 소금 밭이 계단처럼 걸려 있고, 모라이는 원형 계단식 밭이 지름 30m 구덩이를 이룬다. 오얀따이땀보 요새는 1536년 잉카가 스페인을 이긴 유일한 전투 현장이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["코스 예: 친체로(일요 시장·직조 시연) → 모라이 → 마라스 염전 → 우루밤바 점심 → 오얀따이땀보 → 쿠스코. 피삭을 넣으면 하루가 빠듯하다.","마라스 염전은 2019년부터 밭 안으로 못 들어가고 전망대에서 본다. 소금은 마을 상점에서 5솔.","친체로는 3,760m로 쿠스코보다 높다. 잠깐이니 문제없다.","점심은 우루밤바 뷔페(25~40솔)가 보통. 알파카 요리 있음.","비니쿤카보다 몸이 훨씬 편하고, 사진·역사 밀도는 더 높다. 고산 적응이 걱정되면 이쪽."]},{"title":"이야기","paragraphs":["마라스 염전은 잉카 이전부터 쓰였다. 산속 온천수가 소금기를 품고 흘러나와 밭에 채우면 햇빛에 증발해 소금이 남는다. 밭은 마을 가족들의 소유로 대를 이어 내려온다. 모라이의 원형 밭은 단마다 기온이 달라 잉카의 농업 실험장이었다는 설이 유력하다. 맨 아래와 맨 위의 기온 차가 5도에 이른다."],"bullets":[]}]},{"id":"sacsayhuaman","title":"삭사이와망과 쿠스코 근교 4유적","meta":{"day":4,"city":"cusco","mapQuery":"Sacsayhuamán, Cusco","time":"2~3시간 (택시 10분 또는 도보 40분 오르막)","cost":"통합권 부분권 70솔 (삭사이와망·켄코·푸카푸카라·탐보마차이) 또는 전체권. 택시 왕복 20~30솔","level":"★☆☆ 유적 내부는 평지, 접근이 오르막","book":"불필요","lat":-13.50678,"lon":-71.98024},"sections":[{"title":"왜 갈까","paragraphs":["쿠스코를 내려다보는 언덕 위 잉카 요새다. 무게 100톤이 넘는 돌을 지그재그 3단 성벽으로 쌓았고, 가장 큰 돌은 높이 8.5m다. 1536년 망코 잉카의 반란군과 스페인군이 여기서 격전을 벌였다. 도착 첫날(D4) 오후 고산 적응 겸 가볍게 다녀오기에 좋고, D6 오전 반나절 코스로도 좋다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["이름을 발음하면 영어의 sexy woman과 비슷해 가이드마다 이 농담을 한다.","언덕 위라 쿠스코 시내(3,400m)보다 300m 높다. 첫날이면 천천히.","켄코(제단 동굴), 푸카푸카라(붉은 요새), 탐보마차이(잉카의 목욕탕)는 같은 길에 있어 택시로 이어서 2시간.","유적 옆 하얀 예수상(크리스토 블랑코)에서 쿠스코 전경.","라마·알파카가 잔디를 먹고 있으면 촐리타 아주머니가 사진값 2~3솔을 요구한다."]},{"title":"이야기","paragraphs":["스페인은 이 성벽의 돌을 뜯어 성당을 지었다. 남은 것은 너무 커서 옮길 수 없던 돌들이다. 매년 6월 24일 인티 라이미(태양 축제)가 이 광장에서 열려 잉카 황제 역이 태양신에게 제사를 올린다. 잉카는 쿠스코를 퓨마 모양으로 설계했고 삭사이와망이 머리, 지그재그 성벽이 이빨이다."],"bullets":[]}]},{"id":"coricancha","title":"코리칸차·산블라스·산페드로 시장 (시내 반나절)","meta":{"day":6,"city":"cusco","mapQuery":"Qorikancha, Cusco","time":"3~4시간","cost":"코리칸차 15솔(통합권 미포함), 대성당 40솔(선택), 나머지 무료","level":"★☆☆ 시내 도보, 산블라스는 오르막","book":"불필요","lat":-13.52026,"lon":-71.97514},"sections":[{"title":"왜 갈까","paragraphs":["비니쿤카를 안 가는 날 오전 코스이자, D4·D5 저녁 자투리 시간에도 나눠 갈 수 있다. 코리칸차는 황금으로 덮였던 태양의 신전 위에 성당을 얹은 곳으로 잉카 곡선 석벽이 남아 있다. 산블라스는 언덕 위 예술가 골목, 산페드로 시장은 과일 주스와 로컬 점심."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["12각돌은 하툰 루미욕 거리(대성당 뒤). 경찰이 지키고 있어 손대지 말 것. 오전 이른 시간이 사진 찍기 좋다.","산페드로 시장: 과일 주스 5솔(과일 두 종 섞어 달라고), 점심 세트 8~12솔. 소매치기 주의, 가방 앞으로. 코카잎·코카 캔디·알파카 제품 가장 저렴.","산블라스 광장 카페에서 커피, 골목 공방에서 기념품. 광장 교회 안 설교단은 나무 조각의 정점.","대성당은 최후의 만찬 기니피그 그림 때문에 들어갈 가치가 있다(40솔). 사진 금지."]},{"title":"이야기","paragraphs":["코리칸차 벽에 붙어 있던 황금판 700장은 아타우알파의 몸값으로 스페인에 뜯겨 녹여졌다. 1950년 지진으로 위에 지은 산토도밍고 성당이 무너졸 때 잉카 벽은 멀쩡했고, 그 뒤로 성당을 잉카 벽이 보이게 복원했다. 안뜰에 서면 두 문명이 한 벽에 붙어 있다."],"bullets":[]}]},{"id":"uros","title":"우로스 갈대섬","meta":{"day":7,"city":"puno","mapQuery":"Islas Uros, Puno","time":"반나절 2.5~3시간. 도착 당일 14:30 출발 편이 있음","cost":"약 30~40솔 (보트·섬 입장·가이드). 갈대배 시승 10솔 별도","level":"★☆☆","book":"캡틴 통해 당일 또는 전날. 호텔이 항구 옆이라 이동 10분","lat":-15.81634,"lon":-69.97191},"sections":[{"title":"왜 갈까","paragraphs":["토토라 갈대를 엮어 띄운 인공 섬 위에 사는 우로족을 만난다. 섬을 밟으면 스펀지처럼 푹신하고, 갈대 집·갈대 배·갈대 간식(밑동의 흰 부분)을 보여 준다. 푸노 1박이라 시간이 없어 반나절이 딱 맞다. 우리 호텔은 호숫가라 배 타기까지 가장 가깝다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["14:30 오후 편은 빛이 좋고 사람이 적다. 오전 편은 07:00.","섬에 내리면 가족이 노래·수공예 판매를 한다. 살 생각이 없으면 웃으며 그라시아스. 소액 기념품 10~20솔은 이들의 주 수입.","갈대배 시승(10솔)은 옆 섬까지 10분. 탈 만하다.","호수 위는 자외선 반사가 강하고 바람이 차다. 바람막이·선글라스·모자.","타킬레 섬까지 가는 종일 투어는 이번 일정(D7 오후 도착, D8 07:00 출발)에는 불가능하다."]},{"title":"이야기","paragraphs":["우로족은 원래 호수 주변에 살던 사람들이었으나 잉카에 밀려 물 위로 피했다. 우로어는 사멸했고 지금은 아이마라어를 쓴다. 섬은 갈대 뿌리 덩어리(키유)를 묶어 띄우고 그 위에 마른 갈대를 40cm 두께로 깐다. 아래층이 썩으면 위에 덧대고, 섬 전체를 30년마다 새로 만든다. 섬끼리 사이가 나빠지면 밧줄을 끊어 섬을 반으로 나눠 떠난다는 이야기가 유명하다."],"bullets":[]}]},{"id":"sillustani","title":"시유스타니 장묘탑 (Sillustani)","meta":{"day":7,"city":"puno","mapQuery":"Sillustani, Puno","time":"3시간 (오후 14:30 출발 투어)","cost":"투어 40~50솔 + 입장 15솔","level":"★☆☆ 완만한 언덕 20분","book":"캡틴 통해. 우로스와 같은 오후에는 하나만 가능","lat":-15.72165,"lon":-70.15899},"sections":[{"title":"왜 갈까","paragraphs":["푸노 외곽 우마요 호숫가 언덕에 선잉카 콜라족과 잉카가 세운 원통형 석탑 무덤(추야)이 서 있다. 높이 12m, 위가 더 넓은 독특한 형태로 귀족 가족을 미라로 안치했다. 호수 풍경과 함께 보는 석탑은 마추픽추와 결이 다른 사진이 된다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["우로스와 시유스타니 중 하나를 골라야 한다. 사람과 문화가 궁금하면 우로스, 풍경과 고고학이면 시유스타니.","3,900m로 푸노보다 높다. 언덕은 천천히.","돌아오는 길에 현지 농가에 들러 감자와 치즈, 기니피그를 보여 준다."]},{"title":"이야기","paragraphs":["석탑 중 하나는 도마뱀이 새겨져 있어 도마뱀 탑이라 불린다. 콜라족은 티티카카 북쪽을 지배했고 잉카에 정복된 뒤에도 장묘 전통을 이어 갔다. 탑 문은 동쪽을 향해 있어 매일 첫 햇빛이 죽은 자를 비춘다."],"bullets":[]}]},{"id":"witches","title":"마녀시장·사가르나가 거리와 케이블카 한 바퀴","meta":{"day":8,"city":"lapaz","mapQuery":"Mercado de las Brujas, La Paz","time":"반나절 (호텔 소나 수르에서 시내까지 케이블카 30~40분)","cost":"케이블카 1구간 3Bs, 환승 시 구간당 추가. 시장 무료","book":"불필요","level":"★☆☆ 시내는 언덕. 3,600~3,700m","lat":-16.49624,"lon":-68.13915},"sections":[{"title":"왜 갈까","paragraphs":["도착일 오후 자유시간의 정석 코스다. 소나 수르 호텔에서 그린라인(Irpavi 역)을 타고 시내로 올라가며 협곡 도시 전경을 보고, 마녀시장에서 야마 태아와 부적을 구경하고, 산프란시스코 광장을 지나 해 진 뒤 레드라인으로 야경을 본다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["케이블카 노선: 호텔 → 그린라인 Irpavi → 옐로우로 환승(Libertador) → 소포카치(Sopocachi) 또는 시내까지 40분. 마녀시장은 산프란시스코 광장 뒤 리나레스·사가르나가 거리.","사가르나가 거리는 알파카 제품·기념품이 가장 싼 곳. 흥정 가능.","레드라인은 센트랄 역에서 엘알토까지 올라가며 도시 전체 야경. 엘알토 역에서 내리지 말고 바로 왕복(6Bs). 밤 엘알토는 치안이 나쁘다.","저녁 시내에서 먹고 돌아올 때는 Uber(호텔까지 30~40Bs). 케이블카는 21~22시 막차.","마녀시장 상인 촬영은 허락을 받는다. 물건을 사면 대개 좋아한다."]},{"title":"이야기","paragraphs":["마녀시장의 정식 이름은 메르카도 데 라스 브루하스, 상인은 대부분 아이마라 여성이다. 야마 태아(수유)는 새집 기초에 묻는 제물이고, 사탕·미니어처·색 실을 조합한 메사는 야티리(주술사)가 태우는 기도문이다. 8월은 파차마마의 달이라 매출이 가장 높다."],"bullets":[]}]},{"id":"cholitas","title":"촐리타 레슬링 (엘알토)","meta":{"day":9,"city":"lapaz","mapQuery":"Multifuncional de la Ceja, El Alto, La Paz","time":"저녁 3~4시간 (목·일요일 공연. 우리 D9는 화요일이라 해당 없음 → D8 월요일도 불가)","cost":"투어 약 100~150Bs (왕복 차량·입장·간식)","level":"★☆☆","book":"요일 확인 필수. 이번 일정(월·화)에는 정기 공연이 없다. 캡틴에게 특별 공연 여부만 확인","lat":-16.51927,"lon":-68.18245},"sections":[{"title":"왜 갈까","paragraphs":["전통 폴레라 치마와 중절모를 쓴 여성 레슬러들이 링에서 뒹구는 쇼다. 원래 가정폭력 피해 여성들의 자기방어 모임에서 시작되어 지금은 엘알토의 명물이 됐다. 관광객은 링 옆 좌석에 앉아 팝콘을 먹으며 야유와 환호를 보낸다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["정기 공연은 일요일 오후와 목요일 저녁. 우리 라파즈 체류(9/28 월, 9/29 화)에는 겹치지 않는다. 대안은 케이블카 야경이나 소나 수르 저녁.","혹시 특별 공연이 있으면 반드시 투어 차량으로. 엘알토(4,100m) 밤 개별 이동은 위험."]},{"title":"이야기","paragraphs":["촐리타 레슬러들은 링 밖에서는 시장 상인이고 어머니다. 2010년대 다큐멘터리와 잡지에 소개되며 세계적으로 알려졸고, 볼리비아 여성의 힘을 상징하는 문화 아이콘이 됐다."],"bullets":[]}]},{"id":"tiwanaku","title":"티와나쿠 유적","meta":{"day":9,"city":"lapaz","mapQuery":"Tiwanaku, Bolivia","time":"반일 5~6시간 (차 1.5시간 편도). 시티투어(09:00~13:30) 뒤 오후에는 시간 부족","cost":"입장 100Bs(외국인) + 투어 150~250Bs 또는 택시 대여","level":"★☆☆","book":"시티투어와 같은 날은 어렵다. 캡틴에게 D9 오후 반일 투어 가능 여부 문의"},"sections":[{"title":"왜 갈까","paragraphs":["잉카보다 500년 앞선 티와나쿠 문명(500~1000년)의 수도다. 태양의 문(하나의 돌로 만든 문, 상단에 비라코차 신 조각), 반지하 신전의 얼굴 조각들, 거석 아카파나 피라미드가 있다. 잉카는 자기 창조신화와 석조 기술을 이 도시에서 가져왔다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["시티투어가 13:30에 끝나면 14:00 출발해 16:00 도착, 17:30 폐장. 촉박하다. 캡틴이 반일 상품을 잡아 주면 가능.","박물관 두 곳(석조·토기)이 입장에 포함된다. 3,850m 평원이라 바람이 세고 춥다.","안 가도 아쉬움을 덜 방법: 라파즈 시내 국립고고학박물관(무리요 광장 근처)에 티와나쿠 유물이 있다."]},{"title":"이야기","paragraphs":["1500년 전 이곳은 인구 수만의 도시였고 티티카카 호수가 바로 옆까지 와 있었다. 호수가 물러가고 기후가 건조해지자 도시는 버려졌다. 스페인은 돌을 뜯어 교회와 철도 침목을 만들었고, 태양의 문은 20세기까지 반쪽으로 깨진 채 서 있었다."],"bullets":[]}]},{"id":"atacamavillage","title":"산페드로 마을 3시간 (카라콜레스 거리)","meta":{"day":12,"city":"atacama","mapQuery":"Calle Caracoles, San Pedro de Atacama","time":"12:00~15:00 자유시간","cost":"점심 CLP 10,000~15,000. 운석 박물관 CLP 5,000 전후","level":"☆☆☆","book":"불필요. 달의 계곡·석호 투어는 시간상 불가","lat":-22.91147,"lon":-68.19807},"sections":[{"title":"왜 갈까","paragraphs":["3일간 볼리비아 고원의 흙과 소금에서 내려와 처음 만나는 문명이다. 흙벽돌 골목, 카페, 아이스크림, 와이파이. 카라콜레스 거리 200m가 마을의 전부다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["국경 통과 후 12시 도착이면 점심이 먼저. 카라콜레스의 식당은 관광지 물가(칠레 페소 필요, 카드 대부분 가능). 환전소 두 곳, ATM은 수수료 높음.","광장의 산페드로 교회(선인장 나무 천장), 운석 박물관(작지만 알차다), 거리 끝 리칸카부르 화산 전망.","달의 계곡 일몰 투어는 17:30 이후라 불가. 대신 마을 남쪽 끝에서 사막 지형을 잠깐 볼 수 있다.","기념품: 구리 제품, 리카나타이 직물, 리카레 소금. 기내 짐 7~10kg 제한 기억.","15:00 칼라마 공항으로 출발. 1시간 30분."]},{"title":"이야기","paragraphs":["산페드로는 잉카 도로의 정거장이자 아타카메뇨(리칸 안타이) 사람들의 오아시스였다. 1950년대 벨기에 신부 구스타보 르 페주가 고고학 박물관을 세워 마을을 알렸고, 지금은 칠레 최대 관광 마을이다. 마을 전체가 흙색인 것은 건축 규제 때문이다."],"bullets":[]}]},{"id":"santiagocentro","title":"산티아고 역사 중심가 도보","meta":{"day":13,"city":"santiago","mapQuery":"Plaza de Armas, Santiago","time":"3~4시간","cost":"무료 (라 모네다 내부는 사전 예약 무료 투어, 산타루시아 무료, 메르카도 센트랄 식사 CLP 15,000~25,000)","level":"★☆☆ 지하철 1호선으로 프로비덴시아에서 15분","book":"불필요","lat":-33.43742,"lon":-70.65128},"sections":[{"title":"왜 갈까","paragraphs":["마지막 날 반나절로 칠레의 근현대사를 걷는 코스다. 아르마스 광장(대성당·중앙우체국) → 라 모네다 대통령궁(1973년 폭격 현장) → 산타루시아 언덕(도시 창건지, 계단 전망) → 메르카도 센트랄(해산물 점심)."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["지하철: 프로비덴시아 Pedro de Valdivia 역 → 1호선 → Universidad de Chile 또는 Plaza de Armas 역. bip! 카드 CLP 1,550 + 충전. 출퇴근 시간 소매치기 주의.","아르마스 광장 소매치기와 사기(가짜 경찰) 주의. 폰을 손에 들고 걷지 않는다.","메르카도 센트랄 안쪽 큰 식당은 관광객 가격이고 호객이 세다. 가장자리 작은 식당이 싸고 맛있다. 파일라 마리나·성게·대게.","산타루시아 언덕은 무료, 입구에서 방명록. 계단 많음. 정상에서 안데스 조망.","라 모네다 앞 시위가 있으면 우회. 지하 문화센터(GAM 아님, Centro Cultural La Moneda)는 전시가 좋고 무료."]},{"title":"이야기","paragraphs":["1541년 발디비아가 우엘렌(산타루시아) 언덕 옆에 도시를 세웠고, 아르마스 광장은 그때 그린 격자의 중심이다. 라 모네다는 원래 조폐국이었다가 1846년부터 대통령궁이 됐다. 1973년 9월 11일 아옌데 대통령은 이 건물 안에서 마지막 라디오 연설을 하고 죽었다. 지금은 매일 격일로 근위병 교대식이 열린다."],"bullets":[]}]},{"id":"sancristobal","title":"산크리스토발 언덕·베야비스타·라 차스코나","meta":{"day":13,"city":"santiago","mapQuery":"Cerro San Cristóbal, Santiago","time":"3시간","cost":"푸니쿨라 왕복 CLP 3,000~5,000, 케이블카 결합권 CLP 9,000 전후. 라 차스코나 CLP 10,000","level":"★☆☆","book":"라 차스코나는 화~일 10:00~18:00, 월 휴무(10/3 토요일이라 가능)","lat":-33.42034,"lon":-70.6299},"sections":[{"title":"왜 갈까","paragraphs":["산티아고 전경과 안데스를 한눈에 보는 곳이다. 베야비스타의 푸니쿨라 역(1925년 개통)에서 올라가면 정상(880m)에 성모상이 서 있고, 맑은 날 동쪽으로 설산이 벽처럼 펼쳐진다. 언덕 아래 베야비스타는 벽화·식당 거리, 그 골목 안이 네루다의 집 라 차스코나다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["오전에 가면 안데스가 선명하고 오후엔 스모그가 끼기 쉽다. 10월 초는 비 온 뒤 가장 맑은 편.","푸니쿨라로 올라가 케이블카로 프로비덴시아 쪽(오아시스 역)으로 내려오면 호텔까지 걸어갈 수 있다. 결합권 이용.","정상에서 모테 콘 우에시요 한 잔(CLP 2,000). 칠레 여름 음료.","라 차스코나는 오디오 가이드로 40분. 사진 촬영 금지 구역 있음.","베야비스타 점심: 파티오 베야비스타 단지 또는 콘스티투시온 거리 식당. 밤 골목은 소지품 주의."]},{"title":"이야기","paragraphs":["산크리스토발 정상의 성모상은 1908년 프랑스에서 만들어 왔고 높이 14m다. 1987년 교황 요한 바오로 2세가 여기서 미사를 올렸다. 언덕 전체가 메트로폴리탄 공원으로 뉴욕 센트럴파크의 두 배 넓이다. 라 차스코나는 네루다가 마틸데를 위해 지은 집으로, 1973년 쿠데타 직후 군이 침수시켰지만 마틸데가 그곳에서 장례를 치렀다."],"bullets":[]}]},{"id":"conchaytoro","title":"콘차 이 토로 와이너리 투어","meta":{"day":13,"city":"santiago","mapQuery":"Viña Concha y Toro, Pirque, Chile","time":"총 5시간 (이동 편도 1시간~1시간 20분 + 투어 1시간 15분 + 시음·매장)","cost":"전통 투어 약 CLP 35,000~45,000(3종 시음 포함, 시음 잔 기념), 교통 지하철 4호선 Las Mercedes 역 + 택시/우버 CLP 8,000 또는 프로비덴시아에서 우버 편도 CLP 25,000~35,000","level":"★☆☆ 야외 정원 걷기","book":"공식 사이트(conchaytoro.com) 온라인 예약 필수. 영어 투어 10:00·11:30 등 시간대 선택. 여행사 추천","lat":-33.63558,"lon":-70.57455},"sections":[{"title":"왜 갈까","paragraphs":["한국 마트 와인 코너의 절반을 차지하는 카시예로 델 디아블로(악마의 저장소)의 본가다. 1883년 창업자의 저택과 정원, 포도밭, 그리고 악마 전설의 지하 저장소(소리·조명 연출)를 돌고 3종을 시음한다. 여행 마지막 날 오전 일정으로 알맞고, 공항 가기 전 여유 있게 돌아올 수 있다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["16:30 호텔 출발을 지키려면 10:00 또는 11:30 투어. 09:00 호텔 출발.","지하철 1호선 → Tobalaba 환승 4호선 → Las Mercedes 종점(약 45분) → 택시 10분. 돌아올 때 와이너리 앞에서 우버.","와인 구매는 면세 가격 아니고 한국보다 조금 싼 정도. 위탁 짐에 넣으면 되지만 23kg과 파손 주의(에어캡 판매).","시음 3잔은 낮술로 충분하다. 점심을 와이너리 레스토랑(비쌈)이나 돌아와서 프로비덴시아에서.","시내 도보 코스와 병행하려면 와이너리 오전 → 시내 점심·산타루시아 오후 → 15:30 호텔. 산크리스토발까지는 무리."]},{"title":"이야기","paragraphs":["창업자 돈 멜초르는 일꾼들이 지하 저장소에서 와인을 훔치자 그 안에 악마가 산다는 소문을 퍼뜨렸다. 소문은 통했고, 그 이름이 브랜드가 됐다. 카시예로 델 디아블로는 지금 140개국에 팔리는 칠레 최대 와인 브랜드이고, 2004년 한·칠레 FTA 이후 한국이 주요 시장이 됐다. 카르메네르 품종은 이 회사 포도밭에서 1994년 재발견됐다."],"bullets":[]}]},{"id":"skycostanera","title":"스카이 코스타네라 전망대","meta":{"day":12,"city":"santiago","mapQuery":"Sky Costanera, Santiago","time":"1시간 (호텔에서 도보 10분)","cost":"약 CLP 15,000~18,000 (10:00~22:00, 일몰 시간대 인기)","level":"☆☆☆","book":"현장 구매 가능, 온라인 예약 시 시간 지정","lat":-33.41672,"lon":-70.60683},"sections":[{"title":"왜 갈까","paragraphs":["남미에서 가장 높은 건물(300m)의 61~62층 전망대다. 도착 밤(D12) 22시 호텔 체크인 후에는 닫혀 있지만, D13 아침 일찍(10:00) 올라가면 안데스와 도시를 360도로 보고 바로 옆 코스타네라 센터 몰에서 마지막 쇼핑(수퍼 Jumbo에서 와인·초콜릿·마누카 꿀 등 기념품)을 할 수 있다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["호텔에서 도보 10분. 몰 지하 Jumbo는 기념품 쇼핑에 가장 실용적이다(카르메네르 와인 CLP 5,000~10,000, 만하르, 견과류).","아침이 시야가 좋다. 오후는 역광과 스모그.","몰 안에 환전소·약국·푸드코트가 있어 마지막 날 잔여 페소 정리에 편하다."]},{"title":"이야기","paragraphs":["그란 토레 산티아고는 2014년 완공됐다. 2010년 대지진(8.8) 중에도 공사 중이던 이 건물은 흔들렸지만 손상이 없었고, 칠레 건축 기술의 자존심이 됐다. 전망대 유리 바닥은 없다. 겁 안 먹어도 된다."],"bullets":[]}]}];</script>
<script>

/* ===================== utils ===================== */

    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* true when a place object carries usable WGS84 coordinates */
function hasGeo(o) {
  return !!o && typeof o.lat === 'number' && typeof o.lon === 'number' &&
    isFinite(o.lat) && isFinite(o.lon) && !(o.lat === 0 && o.lon === 0);
}
/* single map-link builder. Accepts a place object (lat/lon/name/title/mapQuery)
   or, for legacy callers, a plain query string. */
function mapsUrl(o) {

  var q = o.mapQuery || o.q || o.name || o.title || '';
  if (hasGeo(o)) {
    /* labelled pin: parentheses delimit the label, so strip them from it */
    var label = o.name || o.title || String(q).split(',')[0] || '';
    label = String(label).replace(/[()]/g, '').replace(/\s+/g, ' ').trim();

function altitudeStrip(activeCity) {
  var prof = T.altitudeProfile || [];
  var max = 0;
  prof.forEach(function (p) { if (p.altitude_m > max) max = p.altitude_m; });
  /* compare on the leading token so "알티플라노 고원" still matches
     "알티플라노 · 라구나 콜로라다", and D5 highlights 쿠스코 rather than two bars */
  function head(s) { return String(s || '').split(/[\s·]+/)[0]; }
  var activeHead = head(activeCity);
  var bars = [], labs = [];
  prof.forEach(function (p) {
    var on = !!activeHead && head(p.city) === activeHead;
    var pct = max ? Math.max(6, Math.round((p.altitude_m / max) * 100)) : 6;
    bars.push('<div class="alt-b' + (on ? ' on' : '') + '" style="height:' + pct + '%" title="' + esc(p.city) + ' ' + num(p.altitude_m) + 'm"></div>');
    labs.push('<span class="' + (on ? 'on' : '') + '">' + esc(head(p.city)) + '</span>');
  });
  return '<div class="sec"><div class="sec-h">고도 흐름</div><div class="card">' +
    '<div class="alt">' + bars.join('') + '</div><div class="alt-l">' + labs.join('') + '</div>' +
    '<div class="tiny muted" style="margin-top:10px">최고 숙박지 푸노 3,812m · 최고 통과점 알티플라노 4,300m</div>' +
    '</div></div>';
}

/* packing·timeline 만 체크박스로 남긴다. 나머지는 읽고 넘기는 정보라 상태를 저장하지 않는다. */
var PREP_CHECK = { packing: 1, timeline: 1 };
var PREP_DESC = {
  timeline: '언제 무엇을 해야 하는지 날짜순으로',
  packing: '가방에 넣을 것 전부, 체크하며 담기',
  clothes: '도시별 기온과 그날 입을 옷',
  flight: '27시간 비행을 덜 힘들게 보내는 법',
  apps: '설치할 앱과 출발 전 폰 설정',
  sim: '유심 · eSIM · 로밍 비교와 추천 조합, 갤럭시 설정 순서',
  hacks: '돈 · 시간 · 몸 · 사진 요령 모음'
};
var PREP_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h16v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5z"/><path d="M9 7.5V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5v3"/><path d="m9.5 14 1.8 1.8 3.2-3.4"/></svg>';

function prepById(id) { for (var i = 0; i < PREP.length; i++) if (PREP[i].id === id) return PREP[i]; return null; }
function prepTotal(s) { var n = 0; (s.topics || []).forEach(function (t) { n += (t.items || []).length; }); return n; }
function prepDone(s) {
  var n = 0;
  (s.topics || []).forEach(function (t, ti) {
    (t.items || []).forEach(function (x, ii) { if (ls('prep.' + s.id + '.' + ti + '.' + ii, '') === '1') n++; });
  });
  return n;
}
function prepKey(s, ti, ii) { return 'prep.' + s.id + '.' + ti + '.' + ii; }

/* "D-15 ~ D-10 (9/5~9/10) 서류·돈" -> { lo:10, hi:15 } (남은 날 수 기준) */
function dRange(title) {
  var t = String(title || '');
  if (/^D-?day/i.test(t)) return { lo: 0, hi: 0 };
  var m = t.match(/^D-(\d+)\s*~\s*D-(\d+)/);
  if (m) { var a = Number(m[1]), b = Number(m[2]); return { lo: Math.min(a, b), hi: Math.max(a, b) }; }
  m = t.match(/^D-(\d+)/);
  if (m) return { lo: Number(m[1]), hi: Number(m[1]) };
  return null;
}
/* 화면에 짧게 쓸 이름: 날짜 괄호를 떼고 D 범위의 공백을 붙인다 */
function prepShort(title) {
  return String(title || '')
    .replace(/\s*\([^)]*\)\s*/, ' ')
    .replace(/^(D-\S+)\s*~\s*(D-\S+)/, '$1~$2')
    .replace(/\s+/g, ' ').trim();
}
/* 출발까지 남은 날. 여행이 시작되면 음수가 된다. */
function daysToStart() { return daysBetween(resolveToday().today, T.trip.start); }
function prepTimeline() {
  var s = prepById('timeline');
  var out = { states: [], cur: -1, label: '' };
  if (!s) return out;
  var dd = daysToStart();
  (s.topics || []).forEach(function (t, i) {
    var rg = dRange(t.title);
    var st = 'future';
    if (rg) {
      if (dd < rg.lo) st = 'past';
      else if (dd <= rg.hi) { st = 'cur'; if (out.cur < 0) out.cur = i; }
    }
    out.states.push(st);
  });
  var pick = out.cur;
  if (pick < 0) pick = dd < 0 ? (s.topics.length - 1) : 0;
  var t0x = s.topics[pick];
  out.label = t0x ? prepShort(t0x.title) : '';
  return out;
}

  return h.join('');

        '<td style="white-space:nowrap">' + num(c.elevation_m) + 'm</td>' +
        '<td style="white-space:nowrap">' + t0(c.sep.high) + '/' + t0(c.sep.low) + '°</td>' +
        '<td style="white-space:nowrap">' + t0(c.oct.high) + '/' + t0(c.oct.low) + '°</td>' +
        '<td style="white-space:nowrap">' + esc(c.sunrise_0925) + '<br>' + esc(c.sunset_0925) + '</td>' +
        '<td>' + esc(uvKo(c.uv)) + '</td></tr>';
    }).join('') + '</tbody></table></div>');
  h.push('<div class="card tight" style="margin-top:10px">');
  CLIMATE_ORDER.forEach(function (id) {
    var c = CLIM[id];
    if (!c) return;
    h.push('<div class="kv" style="align-items:flex-start"><span class="k" style="flex:0 0 92px">' + esc(c.name_ko.split(' (')[0]) + '</span>' +
      '<span class="v">' + esc(skyKo(c.sky)) + ' · ' + esc(c.clothing_ko) + '</span></div>');
  });
  h.push('</div>');
  h.push('<div class="btn-row"><button class="btn accent full" id="wxAll">지금 날씨 새로고침</button></div>');
  h.push('<div id="wxAllOut" class="tiny muted" style="margin-top:8px">Open-Meteo에서 10개 도시의 현재 날씨를 한 번에 받아 기기에 저장합니다. 오프라인이면 마지막으로 받은 값이 그대로 쓰입니다.</div>');
  h.push('<div id="wxAllList"></div>');
  h.push('</div>');

  /* 10. 사진 출처 */
  var creds = IMG_ALL.slice().sort(function (a, b) {
    return a.cityId === b.cityId ? (a.key < b.key ? -1 : 1) : (a.cityId < b.cityId ? -1 : 1);
  });
  h.push('<div class="sec"><div class="sec-h">10. 사진 출처</div>');
  h.push('<div class="card"><div class="tiny muted" style="margin-bottom:8px">앱에 담긴 사진 ' + creds.length +
    '장은 모두 위키미디어 공용에서 가져왔습니다. CC BY · CC BY-SA 사진은 저작자와 라이선스를 아래에 밝힙니다.</div>' +
    '<div class="credits">');
  creds.forEach(function (v) {
    h.push('<div class="cr-i"><div class="cr-t">' + esc(cleanTitle(v)) + '</div>' +
      '<div class="cr-m">' + creditLine(v) +
      (v.source ? ' · <a href="' + esc(v.source) + '" target="_blank" rel="noopener">원본</a>' : '') + '</div></div>');
  });
  h.push('</div></div></div>');

  h.push('<div class="tiny muted" style="margin-top:26px;text-align:center">남미 13일 · 오프라인 동작 · 데이터 ' + esc(T.meta.generated) + ' 기준</div>');
  return h.join('');
}

/* "지금 날씨 새로고침" — fetches every destination city and caches the result */
function bindWxAll() {
  var btn = document.getElementById('wxAll');
  if (!btn) return;
  var out = document.getElementById('wxAllOut');
  var list = document.getElementById('wxAllList');
  function draw() {
    var rows = CLIMATE_ORDER.map(function (id) {
      var hit = wxCacheGet(id);
      if (!hit) return '';
      var cur = hit.d.current || {}, dd = hit.d.daily || {};
      var w = wxCode(cur.weather_code);
      return '<tr><td>' + esc(CLIM[id].name_ko.split(' (')[0]) + '</td>' +
        '<td>' + t0(cur.temperature_2m) + '°</td>' +
        '<td>' + t0((dd.temperature_2m_max || [])[0]) + '/' + t0((dd.temperature_2m_min || [])[0]) + '°</td>' +
        '<td>' + esc(w.t) + '</td></tr>';
    }).filter(Boolean).join('');
    list.innerHTML = rows
      ? '<div class="tbl-scroll" style="margin-top:6px"><table class="fx"><thead><tr><th>도시</th><th>지금</th><th>오늘</th><th>하늘</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '';
  }
  draw();
  btn.onclick = function () {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      out.textContent = '오프라인입니다. 마지막으로 받아 둔 값을 그대로 보여줍니다.';
      draw();
      return;
    }
    btn.disabled = true;
    out.textContent = '받는 중...';
    var okCount = 0;
    Promise.all(CLIMATE_ORDER.map(function (id) {
      return wxFetch(id).then(function (j) { if (j) okCount++; });
    })).then(function () {
      btn.disabled = false;
      out.textContent = okCount
        ? okCount + '개 도시 갱신 완료 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        : '지금은 받아올 수 없습니다. 아래 월평균 기준값을 보세요.';
      draw();
    });
  };
}

/* ---- info interactions ---- */
function fxRates() { return lsJson('fx', null) || FX_DEFAULT; }
function fxCompute() {
  var amtEl = document.getElementById('fxAmt');
  var fromEl = document.getElementById('fxFrom');
  var toEl = document.getElementById('fxTo');
  var out = document.getElementById('fxOut');
  var tbl = document.getElementById('fxTable');
  if (!amtEl || !out) return;
  var r = fxRates();
  var from = fromEl.value, to = toEl.value;
  var amt = parseFloat(amtEl.value);
  lsSet('fxAmt', amtEl.value); lsSet('fxFrom', from); lsSet('fxTo', to);
  if (isNaN(amt)) { out.innerHTML = '<span class="muted small">금액을 입력하세요</span>'; }
  else {
    var v = amt / r[from] * r[to];
    var shown = v >= 100 ? Math.round(v) : Math.round(v * 100) / 100;
    out.innerHTML = '<div style="font-size:12px;color:var(--muted)">' + esc(num(amt) + ' ' + from) + '</div>' +
      '<div style="font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.01em">' + esc(num(shown)) + ' <span style="font-size:15px">' + esc(to) + '</span></div>' +
      '<div class="tiny muted" style="margin-top:2px">1 ' + esc(from) + ' = ' + esc(String(Math.round(r[to] / r[from] * 10000) / 10000)) + ' ' + esc(to) + '</div>';
  }
  var rows = [10, 50, 100].map(function (u) {
    var cells = FX_CODES.filter(function (c) { return c !== from; }).map(function (c) {
      var v = u / r[from] * r[c];
      return '<td>' + esc(num(v >= 100 ? Math.round(v) : Math.round(v * 100) / 100)) + '</td>';
    }).join('');
    return '<tr><td>' + u + ' ' + esc(from) + '</td>' + cells + '</tr>';
  }).join('');
  var head = FX_CODES.filter(function (c) { return c !== from; }).map(function (c) { return '<th>' + c + '</th>'; }).join('');
  tbl.innerHTML = '<table class="fx"><thead><tr><th>기준</th>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

var CLOCK_ZONES = [
  { n: '서울', tz: 'Asia/Seoul' },
  { n: '리마', tz: 'America/Lima' },
  { n: '라파즈', tz: 'America/La_Paz' },
  { n: '산티아고', tz: 'America/Santiago' }
];
var clockTimer = null;
function tzOffsetMinutes(d, tz) {
  var f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).formatToParts(d);
  var o = {};
  f.forEach(function (p) { o[p.type] = p.value; });
  var asUTC = Date.UTC(+o.year, +o.month - 1, +o.day, +(o.hour === '24' ? '00' : o.hour), +o.minute, +o.second);
  return Math.round((asUTC - Math.floor(d.getTime() / 1000) * 1000) / 60000);
}
function renderClocks() {
  var box = document.getElementById('clocks');
  if (!box) { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } return; }
  var now = new Date();
  var kst = tzOffsetMinutes(now, 'Asia/Seoul');
  box.innerHTML = CLOCK_ZONES.map(function (z) {
    var t = new Intl.DateTimeFormat('ko-KR', {
      timeZone: z.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(now);
    var dstr = new Intl.DateTimeFormat('ko-KR', {
      timeZone: z.tz, month: 'numeric', day: 'numeric', weekday: 'short'
    }).format(now);
    var off = tzOffsetMinutes(now, z.tz) - kst;
    var oh = Math.round(off / 60);
    var lab = oh === 0 ? '기준' : (oh > 0 ? '+' + oh : String(oh)) + '시간';
    return '<div class="clock"><div class="z">' + esc(z.n) + '<small>KST ' + esc(lab) + '</small></div>' +
      '<div class="t">' + esc(t) + '<small>' + esc(dstr) + '</small></div></div>';
  }).join('');
}

/* ===================== router ===================== */
var TABS = [
  { id: 'today', label: '오늘', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' },
  { id: 'days', label: '일정', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>' },
  { id: 'hotels', label: '숙소', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V6l9-4 9 4v15"/><path d="M3 21h18M9 21v-6h6v6"/></svg>' },
  { id: 'read', label: '읽을거리', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/><path d="M8 7h8M8 11h6"/></svg>' },
  { id: 'info', label: '정보', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-5M12 8h.01"/></svg>' }
];

/* routes that live under a tab but are not tabs themselves */
var SUB_ROUTES = { practical: 'info', menu: 'info', prep: 'info', opt: 'days' };

function parseHash() {
  var raw = (location.hash || '').replace(/^#/, '');
  var parts = raw.split('/').filter(function (x) { return x !== ''; });
  var tab = parts[0] || 'today';
  var valid = TABS.some(function (t) { return t.id === tab; }) || !!SUB_ROUTES[tab];
  if (!valid) tab = 'today';
  return { tab: tab, arg: parts.length > 1 ? decodeURIComponent(parts[1]) : null };
}

function renderTabs(active) {
  var on = SUB_ROUTES[active] || active;
  document.getElementById('tabbar').innerHTML = TABS.map(function (t) {
    return '<a class="tab' + (t.id === on ? ' on' : '') + '" href="#' + t.id + '">' + t.icon + '<span>' + t.label + '</span></a>';
  }).join('');
}

var lastKey = '';
function scrollToPhrases() {
  if (parseHash().arg !== 'phrases') return;
  var ph = document.getElementById('sec-phrases');
  if (ph) ph.scrollIntoView({ block: 'start' });
  else window.scrollTo(0, 0);
}
function render() {
  var r = parseHash();
  var html;
  if (r.tab === 'today') html = viewToday();
  else if (r.tab === 'days') html = viewDays(r.arg);
  else if (r.tab === 'hotels') html = r.arg ? viewHotelDetail(r.arg) : viewHotels();
  else if (r.tab === 'read') html = r.arg ? viewReadCity(r.arg) : viewRead();
  else if (r.tab === 'practical') html = viewPractical(r.arg);
  else if (r.tab === 'prep') html = viewPrep(r.arg);
  else if (r.tab === 'opt') html = r.arg ? viewOptDetail(r.arg) : viewOptList();
  else if (r.tab === 'menu') html = viewMenu();
  else html = viewInfo();

  closeLightbox();
  document.getElementById('app').innerHTML = html;
  renderTabs(r.tab);

  var key = r.tab + '/' + (r.arg || '');
  if (key !== lastKey) {
    if (r.tab === 'days' && r.arg) {
      var target = document.getElementById('day-' + r.arg);
      if (target) target.scrollIntoView({ block: 'start' });
      else window.scrollTo(0, 0);
    } else if (r.tab === 'info' && r.arg === 'phrases') {
      /* 사진이 늦게 자리를 잡으면 위치가 밀리므로 한 번 더 맞춘다 */
      scrollToPhrases();
      setTimeout(scrollToPhrases, 350);
    } else {
      window.scrollTo(0, 0);
    }
    lastKey = key;
  }

  bindOverride();

  /* checkboxes */
  Array.prototype.forEach.call(document.querySelectorAll('[data-chk]'), function (el) {
    el.addEventListener('change', function () {
      if (el.checked) lsSet(el.getAttribute('data-chk'), '1');
      else lsDel(el.getAttribute('data-chk'));
      if (el.getAttribute('data-prept') !== null) prepCounts();
      if (el.getAttribute('data-qna')) {
        var box = document.getElementById('qnaCount');
        if (box) {
          var all = document.querySelectorAll('[data-qna]');
          var on = document.querySelectorAll('[data-qna]:checked');
          box.textContent = on.length + ' / ' + all.length;
        }
      }
    });
  });
  /* reading toggle */
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggleread]'), function (btn) {
    btn.addEventListener('click', function () {
      var k = btn.getAttribute('data-toggleread');
      var now = ls(k, '') !== '1';
      if (now) lsSet(k, '1'); else lsDel(k);
      btn.textContent = now ? '읽음 해제' : '읽음으로 표시';
      var det = btn.closest('details.art');
      if (det) {
        var chk = det.querySelector('.art-chk');
        if (chk) chk.className = 'art-chk' + (now ? ' done' : '');
      }
    });
  });
  /* auto mark read on open */
  Array.prototype.forEach.call(document.querySelectorAll('details.art'), function (det) {
    det.addEventListener('toggle', function () {
      if (!det.open) return;
      var k = det.getAttribute('data-art');
      if (ls(k, '') === '1') return;
      lsSet(k, '1');
      var chk = det.querySelector('.art-chk');
      if (chk) chk.className = 'art-chk done';
      var btn = det.querySelector('[data-toggleread]');
      if (btn) btn.textContent = '읽음 해제';
    });
  });
  /* doc fields */
  Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'), function (el) {
    el.addEventListener('input', function () { lsSet('doc.' + el.getAttribute('data-doc'), el.value); });
  });
  /* fx */
  if (r.tab === 'info') {
    ['fxAmt', 'fxFrom', 'fxTo'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) { el.addEventListener('input', fxCompute); el.addEventListener('change', fxCompute); }
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rate]'), function (el) {
      el.addEventListener('input', function () {
        var rt = fxRates(); var v = parseFloat(el.value);
        if (!isNaN(v) && v > 0) { rt[el.getAttribute('data-rate')] = v; rt.USD = 1; lsSet('fx', JSON.stringify(rt)); lsSet('fxCustom', '1'); fxCompute(); }
      });
    });
    var rs = document.getElementById('fxReset');
    if (rs) rs.onclick = function () { lsDel('fx'); lsDel('fxCustom'); render(); };
    fxCompute();
    bindWxAll();
    bindPhrases();
    renderClocks();
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(renderClocks, 1000);
  } else if (clockTimer) {
    clearInterval(clockTimer); clockTimer = null;
  }

  if (r.tab === 'today') wxHydrate();
  if (r.tab === 'menu') bindMenu();
  if (r.tab === 'prep') bindPrep();
}

window.addEventListener('hashchange', render);
render();

/* ===================== service worker ===================== */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
})();
</script>
