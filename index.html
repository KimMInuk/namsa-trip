<script>window.PRACTICAL = [{"id":"transit","title":"애틀랜타 환승과 미국 입국","topics":[{"title":"ESTA는 출발 전 반드시","items":["미국은 환승 승객도 정식 입국 심사를 받는다. 한국 여권은 ESTA(전자여행허가)가 필요하며, 없으면 인천에서 탑승이 거부된다.","비용은 2025년 9월 30일부터 USD 40.27로 올랐다. 공식 사이트(esta.cbp.dhs.gov)에서만 신청하고, 대행 사이트는 피한다. 대부분 몇 분~72시간 안에 승인된다.","ESTA 소지자는 Mobile Passport Control(MPC) 앱을 쓸 수 있다. 미리 설치해 여권 정보를 넣어 두면 입국 심사 줄이 훨씬 짧다.","왕복 모두 애틀랜타를 거치므로 ESTA는 두 번 쓰인다. 유효기간 2년."]},{"title":"애틀랜타 환승 순서 (갈 때 6시간 35분, 올 때 4시간)","items":["1단계: 착륙 후 CBP 입국 심사. 여권·ESTA. 미국 체류 목적은 transit(환승), 최종 목적지 Lima/Seoul.","2단계: 위탁 수하물을 직접 찾는다. 인천에서 수하물 태그가 최종 목적지(LIM)까지 붙어 있더라도 미국에서는 일단 짐을 찾아야 한다.","3단계: 세관 통과 후 바로 나오는 연결편 수하물 재위탁(Baggage Re-check) 벨트에 짐을 다시 올린다.","4단계: TSA 보안검색을 다시 받는다. 액체 규정 100ml 적용. 인천 면세점에서 산 술은 밀봉 봉투(STEB)가 아니면 압수될 수 있으니 애틀랜타 이후에 사는 것이 안전하다.","5단계: Plane Train으로 국제선 콩코스 F 또는 E로 이동. 2분 간격, 24시간 운행.","6시간 대기는 이 절차에 충분하고, 귀국 편 4시간도 보통 문제없다. 다만 입국 심사 줄이 1시간 넘게 걸릴 수 있으니 서두르는 것이 좋다."]},{"title":"보조배터리와 수하물 (대한항공 2026년 4월 규정)","items":["보조배터리는 1인 최대 2개, 100Wh 이하(20,000mAh는 약 74Wh). 100~160Wh는 항공사 승인 필요, 160Wh 초과는 반입 불가. 용량 표시가 없거나 훼손된 제품은 거부될 수 있다.","기내 휴대만 가능하고 위탁 금지. 기내에서 사용·충전 금지, 머리 위 선반 보관 금지. 직접 소지하거나 좌석 앞 주머니에, 1개씩 지퍼백이나 파우치에 넣는다.","국제선 수하물: 위탁 2개(각 23kg, 158cm), 기내 1개(10kg, 115cm).","남미 국내선(여행사 발권): 위탁 23kg 1개. 기내 JetSMART·Sky 10kg(25×35×45cm), BoA 7kg(55×35×20cm). 기내용 캐리어는 유료라 기내 짐은 백팩으로."]},{"title":"애틀랜타 공항에서 시간 보내기","items":["국제선 콩코스 F: 식당·카페 다수, 무료 와이파이. 델타 스카이클럽 라운지는 이코노미 코드셰어 승객은 무료 입장 불가. 프라이오리티 패스 제휴 라운지도 제한적이니 기대하지 말 것.","미국 콘센트는 A/B형 120V. 한국 충전기는 대부분 프리볼트라 어댑터만 있으면 된다.","유심: 미국 6시간을 위해 사는 것은 낭비. 공항 와이파이로 충분하다.","물은 보안검색 후 리필 스테이션에서 채운다."]}]},{"id":"entry","title":"입국·국경 절차","topics":[{"title":"페루 입국 (리마, 9월 20일 밤)","items":["한국 여권 무비자 90일. 종이 입국카드(TAM)는 폐지되어 여권에 도장 또는 전자 기록만 남는다. 심사관이 체류 일수를 적어 주면 확인한다.","리마 신공항 터미널(2025년 6월 개장)은 넓고 현대적이다. 밤 22시 도착이라 택시 카운터·환전소는 열려 있지만 SIM 매장은 닫혀 있을 수 있다.","공항 환전은 택시비 정도만. 본 환전은 다음 날 투어캡틴과 단체 환전."]},{"title":"페루 → 볼리비아 (데사구아데로 육로, D8)","items":["한국은 2025년 12월 3일부터 볼리비아 무비자 대상(90일). 볼리비아 이민국의 온라인 사전 등록(SIGEMIG)을 요구할 수 있으니 투어캡틴에게 필요 여부를 확인한다.","절차: 페루 측 출국 도장 → 다리를 걸어서 건넘 → 볼리비아 측 입국 도장. 버스는 국경 양쪽에서 갈아타거나 기다린다. 전체 1~2시간.","볼리비아 입국 시 황열병 접종 증명은 라파즈·우유니 고지대 일정에는 필요하지 않다. 다만 심사관이 물으면 \"고지대만 간다\"고 답한다.","국경 마을은 소매치기가 많다. 가방은 앞으로, 여권은 손에서 놓지 않는다.","남은 페루 솔은 국경 환전상보다 푸노에서 미리 정리하는 것이 유리하다. 볼리비아 소액 지폐가 필요하니 국경에서 USD 20 정도만 볼리비아노로."]},{"title":"볼리비아 → 칠레 (이토 카혼, D12 새벽)","items":["해발 4,480m의 작은 국경 초소. 볼리비아 출국 도장을 받고 차로 45km를 내려가 산페드로 데 아타카마 세관에서 칠레 입국 심사와 세관 검사를 받는다.","칠레는 무비자 90일. 입국 시 종이 관광카드(Tarjeta de Turismo, PDI 슬립)를 준다. 출국할 때 반납해야 하므로 여권 사이에 끼워 잃어버리지 않는다. 호텔에서 이 카드와 여권을 제시하고 외화로 결제하면 19% 부가세가 면제된다.","SAG(농업검역)이 엄격하다. 과일·채소·씨앗·꿀·유제품·익히지 않은 육류·코카잎(차 티백 포함) 전부 금지. 신고서에 정직하게 쓰고, 애매한 것은 국경 전에 버린다. 미신고 적발 시 벌금이 크다.","한국에서 가져온 조리된 포장식품(김치, 멸치볶음, 컵라면, 햇반)은 반입이 허용된다. 여행사 FAQ에서 확인된 사항이다.","우유니에서 산 코카 캔디·코카차는 볼리비아에서 다 먹거나 버린다. 한국 입국 시에도 코카잎은 마약류로 취급된다.","지프투어 짐은 국경에서 전부 내려 검사대에 올린다. 배낭 정리를 미리 해 두면 빠르다."]},{"title":"칠레 출국과 귀국","items":["산티아고 공항 국제선은 T2. 출국 심사에서 관광카드를 반납한다.","칠레는 관광객 물품 부가세 환급 제도가 없다.","애틀랜타에서 다시 입국 심사·짐 재위탁·보안검색을 거친다(위 환승 절차와 동일)."]}]},{"id":"money","title":"돈","topics":[{"title":"환율 감각 (2026년 9월 기준, 출발 전 재확인)","items":["페루 솔(PEN): USD 1 = 약 3.4솔. 1솔 = 약 410원. 물 한 병 1~3솔, 세비체 25~45솔, 점심 세트 12~20솔.","볼리비아노(BOB): 2026년 7월 변동환율로 전환되어 USD 1 = 약 11.5Bs(8월 말). 이전 고정환율 6.96보다 볼리비아노가 크게 싸졌다. 즉 달러 여행자에게 볼리비아 물가가 더 저렴해졌다. 다만 변동성이 크니 현지 도착 후 ATM 인출 환율을 확인한다.","칠레 페소(CLP): USD 1 = 약 930~950페소. 1,000페소 = 약 1,500원. 콤플레토 4,000~6,000페소, 저녁 한 끼 15,000~25,000페소.","앱의 환율 계산기 기본값을 현지 첫날 실제 환율로 고쳐 두면 이후 계산이 편하다."]},{"title":"현금 준비","items":["USD 현금은 여행사 안내대로 USD 650 이상. 페루는 투어·호텔에서 달러를 널리 받고, 볼리비아는 큰 금액만, 칠레는 거의 안 받는다.","지폐 상태가 중요하다. 찢어짐·낙서·도장·구권 달러는 환전소·상점이 거부한다. 여행사 안내대로 100달러 신권 위주로 은행에서 받고, 팁용 1달러 지폐 20장을 따로 챙긴다.","환전은 도착 후 각 도시에서 투어캡틴과 함께 환전소에 간다. 미리 솔·볼리비아노를 한국에서 바꿀 필요 없다.","볼리비아 국립공원 입장료(에두아르도 아바로아 150Bs), 잉카와시 섬(30Bs), 온천(6Bs), 화장실(2~5Bs)은 볼리비아노 현금만 받는다. 우유니 마을에서 미리 인출한다. 투어 중에는 ATM이 없다.","페루 솔은 리마 첫날 단체 환전. 미라플로레스 환전소(casa de cambio)가 공항보다 유리하다."]},{"title":"ATM","items":["페루: BCP·Interbank는 인출 수수료 15~25솔, 한도 400~700솔. Banco de la Nación(MultiRed)은 수수료가 없지만 한도 400솔. 은행 안 ATM을 이용하고 카드 복제기를 확인한다.","볼리비아: Banco Unión·BNB·Bisa는 현지 수수료가 거의 없고 한도 약 3,000Bs. 변동환율 전환 후 ATM 환율이 시장 환율에 가까워졌다.","칠레: 수수료가 비싸다. 회당 5,500~8,000페소. 한도 약 200,000페소. Banco Estado가 가장 싸고, Scotiabank는 글로벌 ATM 제휴 카드면 면제된다. 한 번에 많이 뽑는 것이 유리하다.","세 나라 모두 \"환율 우대(DCC)\" 선택 화면이 나오면 거부하고 현지 통화로 결제한다. 카드사 환율이 더 좋다."]},{"title":"카드와 팁","items":["카드: 세 나라 도시 호텔·식당은 Visa/Master를 받는다. 시장·택시·소도시·우유니는 현금.","팁: 페루는 식당 10% 선택(영수증에 servicio가 있으면 이미 포함). 볼리비아는 5~10% 선택. 칠레는 영수증에 propina sugerida 10%가 자동으로 찍히고 카드 결제 시 \"con propina?\"라고 묻는다. 거부해도 되지만 대부분 준다.","가이드·기사 팁: 마추픽추 가이드 20~30솔, 우유니 지프 기사 3일에 50~100Bs 정도가 통례."]}]},{"id":"comms","title":"통신","topics":[{"title":"유심 vs eSIM","items":["가장 편한 선택은 세 나라를 한 번에 커버하는 리저널 eSIM이다. Airalo Latin America(LatamLink) 기준 10GB/7일 USD 29, 20GB/15~30일 USD 47~49. 출발 전 한국에서 설치하고 리마 착륙 즈음 켠다.","현지 유심은 훨씬 싸다. 페루 Claro/Movistar 5~7GB 30일 30솔(약 USD 8), 볼리비아 Entel/Tigo 5GB USD 8, 칠레 Movistar/Entel 40GB 1주 5,000페소. 단 매번 매장 방문·여권 등록이 필요하고, 페루 공항 매장은 USD 50 수준으로 비싸다.","여행사 안내: 볼리비아는 한국 로밍과 글로벌 eSIM 연결이 불안정하다. 라파즈 도착 후 ENTEL 현지 유심(6일 무제한 약 80Bs, 여권 필요)을 사는 것을 권장한다.","추천 조합: eSIM 하나로 페루·칠레를 커버하고, 볼리비아 3박은 ENTEL 유심. 페루에서 데이터가 많이 필요하면 Claro 유심 추가.","우유니 지프투어 2박 3일은 대부분 신호가 없다. 소금호텔 일부만 와이파이가 있다. 출발 전 가족에게 알려 둔다.","라파즈 케이블카 역, 쿠스코 광장 등에는 공공 와이파이가 있으나 느리다."]},{"title":"오프라인 준비","items":["구글맵 오프라인 지역을 8개 도시별로 미리 내려받는다(리마, 이카, 쿠스코+성스러운 계곡, 푸노, 라파즈, 우유니, 산페드로, 산티아고). 와이파이 있을 때 앱에서 \"오프라인 지도\" 메뉴.","구글 번역 스페인어 오프라인 언어팩을 받아 둔다. 카메라 번역이 메뉴판에 유용하다.","이 앱은 한 번 열어 두면 오프라인에서 동작한다. 첫 실행은 와이파이에서."]}]},{"id":"transport","title":"교통","topics":[{"title":"앱 택시","items":["리마: Uber·Cabify·DiDi·InDrive 모두 잘 된다. 밤에 길에서 택시를 잡지 않는다.","쿠스코: Uber·Cabify 가능하나 새벽에는 차가 드물다. 호텔에서 불러 주는 택시가 안전하고 시내는 6~10솔.","푸노: 앱 택시가 적다. 호텔에 부탁하고 시내 이동은 5솔 안팎.","라파즈: Uber·InDrive가 된다. 케이블카(미 텔레페리코)가 3Bs로 가장 쾌적한 이동 수단.","산티아고: Uber·Cabify·DiDi 활발. 지하철 1호선이 프로비덴시아를 지난다(bip! 카드 필요).","우유니·산페드로: 앱 택시 없음. 투어사·숙소 픽업."]},{"title":"공항 택시 기준 요금","items":["리마 공항 → 미라플로레스: 출국장 밖 Green Taxi 부스 75~90솔(여행사 9/9 안내, 카드 결제 가능), 다른 공식 카운터 60~95솔, Uber 40~70솔. 35분~1시간 30분 소요. Uber는 출국장 3번 문 근처 지정 픽업 구역에서 탄다. 호객 기사는 절대 따라가지 않는다.","쿠스코 공항 → 시내: 공식 택시 45~55솔, 밖에서 흥정하면 10~15솔. 20분.","산티아고 공항 → 프로비덴시아: 공식 택시 25,000~30,000페소, Transvip 합승 셔틀 약 8,000~10,000페소, Uber 15,000~25,000페소. 20~40분. 마지막 날 호텔에서 공항으로 갈 때는 Uber나 호텔 택시.","이번 일정에서 공항·터미널 이동은 대부분 여행사 차량이 포함되어 있어, 실제로 직접 택시를 탈 곳은 첫날 리마 공항과 자유일정 시내 이동 정도다."]},{"title":"버스 이동 (D2, D3, D7)","items":["리마↔이카(4시간 30분)와 쿠스코→푸노(7시간)는 여행사 전세 또는 Cruz del Sur급 우등버스. 좌석 등급은 Cruzero(140도)·Excluciva(160도)·Sofá Cama(180도).","버스에서 짐은 발밑이나 무릎 위. 머리 위 선반의 가방은 소매치기 표적이다.","멀미약, 목베개, 얇은 담요(에어컨 강함), 간식·물을 챙긴다. 화장실은 버스 안에 있지만 상태가 좋지 않다."]}]},{"id":"life","title":"생활","topics":[{"title":"물·음식 위생","items":["페루·볼리비아 수돗물은 마시지 않는다. 양치는 병 물로. 생수는 1~3솔.","산티아고 수돗물은 마실 수 있지만 석회가 많아 맛이 다르다. 예민하면 병 물.","얼음·샐러드는 관광객 식당이면 대체로 안전하고, 시장 음식은 익힌 것 위주로. 세비체는 점심에, 손님이 많은 집에서.","고산에서는 소화가 느려진다. 저녁은 수프 위주로 가볍게."]},{"title":"화장실","items":["공중화장실은 유료다. 페루 1~2솔, 볼리비아 1~5Bs. 휴지가 없는 곳이 많으니 휴대용 휴지·물티슈를 항상 가진다.","휴지는 변기에 넣지 않고 옆 쓰레기통에 버린다. 남미 배관의 상식이다.","우유니 투어 중 화장실은 매우 드물다. 소금호텔·식사 장소에서 기회가 있을 때 간다."]},{"title":"전기·충전","items":["페루 220V, A/C형(한국 플러그 C형이 대부분 맞음). 볼리비아 230V A/C형. 칠레 220V C/L형(C형 대부분 호환). 미국 120V A/B형.","결론: 한국 플러그가 대부분 그대로 꽂히고, 미국 환승과 일부 A형 콘센트를 위해 멀티 어댑터 하나만 챙긴다.","소금호텔은 전기가 제한된다. 20,000mAh 보조배터리를 우유니 전날 완충한다."]},{"title":"세탁","items":["세탁소(lavandería)는 kg 단위. 쿠스코 6~10솔/kg, 라파즈 비슷한 수준, 보통 당일 또는 다음 날.","세탁 타이밍: 쿠스코 3박(D4~D6)이 최적. 이후 푸노·라파즈는 1~2박이라 빠듯하고, 우유니 3일은 불가. 산티아고에서 마지막 세탁은 시간상 어렵다.","호텔 세탁은 세탁소의 3~5배."]},{"title":"약국","items":["페루 약국(InkaFarma, Mifarma)은 처방 없이 파는 것이 많다. 고산증약 아세타졸아미드(acetazolamida)는 10정에 USD 3 안팎, 소로치 필(Sorojchi Pills, 아스피린+카페인)은 어디서나.","그래도 고산약은 한국에서 처방받아 가는 것이 원칙이다. 현지 약은 보조. 여행사 안내: 리마 약국의 알타비타(Altavita) 20알 45~60솔, 첫날 환전 후 캡틴이 약국 안내. 복용은 쿠스코행 탑승 시점부터 우유니까지 9일.","상비약 목록: 두통약, 지사제, 소화제, 멀미약, 감기약, 밴드, 입술보호제(고산 건조), 선크림 SPF50.","산소 캔은 쿠스코·라파즈 약국과 호텔에서 판다. 비니쿤카 가는 날 하나 사 두면 심리적으로 도움이 된다."]}]},{"id":"safety","title":"안전","topics":[{"title":"지금 상황 (출발 전 재확인)","items":["페루: 2025년 10월부터 리마·카야오에 치안 비상사태가 선포되어 연장되고 있다. 관광지 치안은 유지되지만 밤 혼자 걷기, 고가품 노출, 길거리 택시를 피한다.","볼리비아: 2026년 5~6월 대규모 도로 봉쇄와 시위가 있었고 6월 비상사태가 선포됐다. 봉쇄가 재발하면 푸노→라파즈 육로, 라파즈→우유니 항공, 우유니 투어에 차질이 생길 수 있다. 출발 1주 전 여행사와 외교부 해외안전여행 사이트(0404.go.kr)에서 상황을 확인한다.","칠레: 산티아고 소매치기가 늘었다. 아르마스 광장·베야비스타 밤·지하철 혼잡 시간이 주의 구역."]},{"title":"흔한 수법","items":["가짜 경찰: 신분증을 보여 달라며 지갑을 검사하는 척 돈을 빼 간다. 진짜 경찰은 길에서 지갑을 검사하지 않는다. 경찰서로 가자고 한다.","겨자·오물 묻히기: 옷에 무언가를 묻히고 닦아 주는 척 소지품을 턴다. 도와주겠다는 사람을 뿌리치고 자리를 떠난다.","택시 바가지·우회: 공식 카운터·앱만 쓴다. 현금은 잔돈을 준비해 큰 지폐를 내지 않는다.","위조지폐: 50·100솔, 100Bs 지폐를 거스름돈으로 받을 때 은선·워터마크 확인.","휴대폰 날치기: 길에서 폰을 들고 걷지 않는다. 카페 테이블 위에 두지 않는다."]},{"title":"기본 규칙","items":["여권은 호텔 금고에, 복사본과 사진을 폰에. 여권 사본으로 대부분의 상황이 해결된다.","현금·카드를 두 곳에 나눈다. 비상용 USD 100은 별도 보관.","밤 이동은 앱 택시. 술 마신 뒤 혼자 걷지 않는다.","고산에서는 판단력이 떨어진다. 첫날 무리한 일정을 잡지 않는다."]},{"title":"긴급 연락","items":["페루: 경찰 105, 구급 106, 소방 116. 관광경찰(리마 미라플로레스)이 따로 있다.","볼리비아: 경찰 110, 구급 118, 소방 119.","칠레: 경찰 133, 구급 131, 소방 132.","대한민국 영사콜센터 +82-2-3210-0404 (24시간). 대사관 번호는 정보 탭 긴급 연락 참고.","여행자보험 긴급 전화는 정보 탭 문서 칸에 적어 둔다."]}]},{"id":"airport","title":"공항 편의","topics":[{"title":"리마 호르헤 차베스 (LIM)","items":["2025년 6월 개장한 신터미널. 식음료 구역이 넓고 페루 음식 위주. 24시간 운영.","도착층에 공식 택시 카운터, 환전소, ATM. 유심 매장은 밤에 닫힐 수 있다.","D4 국내선(→쿠스코) 출발 시 같은 터미널. 국내선은 출발 2시간 전 도착으로 충분."]},{"title":"우유니 호야 안디나 (UYU)","items":["활주로 하나의 작은 공항. ATM이 없거나 고장인 경우가 많다. 현금은 라파즈에서 미리.","시내까지 차로 8분. 여행사 픽업."]},{"title":"칼라마 엘 로아 (CJC)","items":["산페드로 데 아타카마에서 차로 1시간 30분. 국내선 공항, 식당 몇 곳. 산티아고행은 LATAM·Sky·JetSMART.","칠레 국내선도 신분증(여권) 확인. 관광카드도 같이."]},{"title":"산티아고 아르투로 메리노 베니테스 (SCL)","items":["국제선 T2. 출국 심사에서 관광카드 반납. 식당·라운지 있고 물가는 비싸다.","마지막 날 체크아웃 후 짐은 호텔에 맡기고 16:30경 공항으로 출발하면 20:40 항공편에 여유 있다.","부가세 환급 없음. 남은 페소는 공항에서 다 쓰거나 달러로 재환전(환율 나쁨)."]}]},{"id":"meeting","title":"사전모임 정리 (9/9 온라인 모임, 9/10 반영)","topics":[{"title":"팀 구성과 첫 모임","items":["09/21 B팀: 참가자 15명 + 투어캡틴 다니. 같은 날 A팀도 출발하며, 이과수 플러스팩(A팀 6명 + B팀 13명)은 산티아고에서 합류한다. 우리는 13DAYS라 10/3 산티아고에서 헤어진다.","첫 모임: 9/21 오전 11시 전후, Casa Andina Standard Benavides 로비. 세부 시간은 캡틴이 공지한다. 전날 도착한 우리는 개별 이동 후 11시까지 로비로.","9/21 오전 08:10까지 리마 공항에 도착하는 4명만 캡틴 픽업. 우리는 해당 없음.","호텔 주소 Av. Alfredo Benavides 271, Miraflores. 전화 +51 1 379 1610. 호텔 출입구 앞에서 택시 하차 가능."]},{"title":"공항 → 호텔 (여행사 안내)","items":["출국장 밖 Green Taxi 부스. 약 22km, 35분~1시간 30분. 요금 75~90솔(1솔 약 400원). 카드 결제 가능이라 공항에서 환전 없이 탈 수 있다.","이 앱의 공항 가이드(자유선택 → 리마 공항 → 호텔)에 우버 승차 위치와 대안이 있다. 밤 22시 이후 버스는 없다."]},{"title":"고산약 (여행사 안내)","items":["복용 시작: 리마 공항에서 쿠스코행 비행기 탑승 시점(9/24 아침). 복용 기간: 쿠스코~우유니 9일, 최소 48시간.","한국에서 처방받아 오는 것이 우선. 한국 약이 안 들으면 현지 약. 리마 약국에서 알타비타(Altavita) 20알 45~60솔(약 18달러). 첫날 환전 후 캡틴이 약국을 안내한다.","주요 증상: 두통·어지럼·메스꺼움·구토, 숨 가쁨·피로·수면 장애, 식욕 저하. 심하거나 지속되면 병원 진료가 필요하고, 의사 판단에 따라 일정 참여가 제한될 수 있다."]},{"title":"마추픽추 입장 (우리 팀 배정)","items":["B팀은 예약 시점에 따라 세 루트로 나뉜다. 우리는 RUTA 2-A(클래식 루트, 9명), 입장 12:00. 클래식 루트는 대표 전망 포인트와 유적 내부 관람을 모두 하는 코스(BEST)다. 다른 팀원은 RUTA 3-B(하단 루트, 11:00·12:00)와 RUTA 1-B(상단 루트, 12:00).","입장 루트는 변경 불가. 정해진 시간에 맞춰 입장한다. 관람 후 16:30경 마을로 내려와 기차 전에 저녁을 먹는다.","입장에 필요한 것: 여권 원본(사본 불가), 입장권 출력본 또는 QR.","반입 규칙: 우산 금지, 셀카봉·삼각대 금지, 등산 스틱은 고무 캡을 씌운 것만. 배낭이 크면 화장실 옆 유료 짐 보관소. 음식은 원칙적으로 물만 허용되고 음료는 괜찮다. 초코바는 눈치껏, 쓰레기는 도로 가져 나온다. 기차에서 내리기 전에 식사(김밥 등)를 권한다.","복장: 얇은 옷 여러 겹, 바람막이나 가벼운 우의(쿠스코나 한국에서 준비), 편한 운동화(계단이 많다). 발목 등산화가 필요한 구간은 없다. 그늘이 없어 선글라스·모자·선크림. 벌레(샌드플라이)가 많아 긴팔·긴바지·발목 덮는 양말, 벌레기피제(현지 구매 가능).","마추픽추 안에서는 식사 금지. 입장 전에 간단히 먹는다. 과일은 야마가 달려들 수 있다."]},{"title":"선택투어 가격표 (13DAYS, 2026년 9월 1일 기준)","items":["추천 투어는 각 도시 도착 2~3일 전 캡틴이 공지하고 신청을 받아 예약까지 해 준다. 신청하지 않으면 자유일정. 인원에 따라 가격이 달라진다.","D3 잃어버린 협곡 06:30~14:30: 2~3인 60달러, 4~6인 45, 7~11인 36, 12~16인 25. 차량·영어 가이드·도시락(샌드위치·음료·과일) 포함. 준비물 운동화·선글라스·선크림·모자·생수.","D3 바예스타 섬(차량+입장권+보트 탑승): 2~3인 45달러, 4인 이상 30. 최소 2인. 배에서 나스카식 그림(칸델라브로) 1개를 본다.","D6 쿠스코 근교(성계) 투어: 차량+영어 가이드+입장권, 모라이+살리네라스(소금 염전). 4인 70달러, 7인 65, 12인 60. 최소 4인. 고도는 3,000~3,500m로 쿠스코와 비슷하다.","D6 비니쿤카: 60달러(차량+아침+점심+입장료). 말 또는 오토바이 왕복은 현장에서 100솔(약 30달러) 별도.","D6 코리칸차 입장 6달러. 월~토 08:30~17:30, 일 14:00~17:00.","D7 우로스 섬(차량+입장료+보트+영어 가이드) 30달러, 최소 4인.","D9 라파즈 시티투어는 포함(달의 계곡, 키리키리 전망대, 무리요 광장, 케이블카). 촐리타 쇼(차량+입장료) 30달러, 최소 4인.","D10~12 우유니 2박 3일 포함(차량·식사·소금사막·선라이즈·선셋·별 투어).","D13 콘차 이 토로 와이너리(차량+입장권+영어 가이드) 60달러.","여행사 예상 현지 경비: 인기 선택투어 3개 135달러 + 식비 하루 30달러 × 11일 315달러 + 시내 교통 하루 2달러 × 11일 22달러 = 472달러. 가이드·기사 팁은 별도로 걷지 않는다."]},{"title":"나스카 경비행기 제외","items":["2026년 8월 나스카 경비행기 투어 중 사고가 있었고, 여행사는 안전을 이유로 추천 투어에서 뺐다. 개별 예약은 가능하지만 캡틴을 통한 예약과 도움은 없다. 이 앱도 권하지 않는다. 대신 바예스타 배에서 칸델라브로 지상화를 본다."]},{"title":"볼리비아 (여행사 답변)","items":["한국 여권은 2025년 12월 3일부터 볼리비아 무비자.","환전은 페루/볼리비아 국경 환전소에서 하거나, 환율이 나쁘면 라파즈 숙소 주변 환전소에서 한다.","우유니 2일차 숙소는 사막 한가운데라 발전기로 제한된 시간에만 전기가 온다. 드라이기·전기장판은 전기가 끊길 수 있어 사용 불가. 핫팩 권장.","소금 호텔은 최초의 소금 호텔을 투어 중 들르고, 숙박은 우유니 시내 호텔이다. 오지 소금 호텔은 위생·샤워가 불편하기 때문.","사진 소품(공룡·우산 등)은 기사들이 웬만큼 갖고 있고, 신고 있던 장화나 신발도 쓴다. 프링글스 통 같은 나만의 아이템은 따로 준비."]},{"title":"우유니 투어 안내 (여행사)","items":["포함: 장화(물 찬 포인트에서 제공), 전 일정 식사.","기온 -3~16도. 해 질 무렵부터 매우 춥다. 겹쳐 입을 옷, 경량 패딩, 핫팩 1~2개(우리는 넉넉히), 선크림·선글라스·모자, 먼지 대비 마스크나 버프. 판초·스웨터·장갑·스카프는 쿠스코·라파즈에서 산다.","3일차 온천에 들어가려면 수영복 필수(래시가드 가능).","2일차가 가장 힘든 날: 08:30 출발, 종일 고원 사막 이동, 중간중간 내려서 사진, 14:00경 플라밍고 호수에서 점심, 18:00경 국경 근처 숙소 도착. 차 안은 덥고 밖은 춥다.","별 투어·선라이즈 투어는 비·낙뢰 등 기상 악화 시 취소될 수 있고 현장에서 캡틴이 안내한다.","팁: 선글라스는 설맹 예방용으로 필수. 립밤·핸드크림·인공눈물. 사진은 강렬한 원색 옷이나 현지 판초가 잘 나온다. 소금물은 상처에 닿으면 따갑고 폰에 튀면 수리가 안 되니 폰 스트랩. 화장실은 전부 유료(약 5볼리비아노)라 2박 3일에 50~100볼리비아노 소액권을 준비한다. 보일 때마다 들른다."]},{"title":"칠레와 마지막 날 (여행사)","items":["10/2 우유니 투어 마지막 날 산티아고 호텔 도착은 21시 전후.","13일차 자유일정, 와이너리 투어 신청 가능. 짐은 호텔에 맡기고 다닌다. 국제선 출발 4시간 전에 호텔에서 공항으로 개별 이동(우리 편 20:40 → 16:40 출발).","칠레 입국 반입: 햇반·라면·과자·음료·맥주 가능. 그 밖의 조리되지 않은 식품은 전부 불가.","호텔 옆 바가 새벽 2시까지 연다. 이과수팀과 작별 인사 자리로 안내됐다."]},{"title":"공지 7가지","items":["위탁 수하물에 현금 절대 넣지 않는다. 현금은 본인이 직접 소지.","ESTA(미국 경유 필수): 출발 2주 전까지 온라인 승인, 출국 시 프린트본 1장 지참.","여행자보험: 출발 전 가입 후 가입증서를 여행사에 전달.","슬리퍼나 크록스 1개(샤워 시).","항공 예약번호·e티켓을 핸드폰에 저장.","여권용 사진 1장 + 여권 사본(분실 시 단수여권 발급용).","여행용 멀티 콘센트(나라마다 다르다. 크고 무거운 어댑터는 지지가 안 되니 가벼운 것).","건강: 배탈이 잦으니 상비약으로 배탈약, 지사제, 소화제."]},{"title":"항공권과 수하물 (여행사)","items":["남미 왕복 항공권은 입국·국경 심사에 대비해 프린트본 준비.","남미 내 항공편 스케줄과 예약번호는 출발 전 카카오톡으로 오며, 받으면 폰에 저장.","무료 수하물: 위탁 1인 1개 23kg 이하, 세 변 합 158cm 이내. 기내 수하물은 백팩 1개. 기내용 캐리어는 불포함(유료).","국내선: 젯스마트 리마→쿠스코 위탁 23kg·기내 10kg(25×35×45), BoA 라파즈→우유니 위탁 23kg·기내 7kg(55×35×20), 스카이 칼라마→산티아고 위탁 23kg·기내 10kg."]},{"title":"대도시 안전과 단체 에티켓","items":["리마·라파즈·산티아고는 치안이 취약한 대도시. 시내 자유일정 때 여권은 숙소에 보관(사본 휴대), 현금은 필요한 만큼만, 가방은 앞으로, 가급적 3~4명 이상 함께 이동.","집합 시간 준수, 통화·알람·음량 배려, 개인 일정은 캡틴에게 사전 공유, 차량·숙소 공용 공간 배려, 불편 사항은 캡틴에게."]}]},{"id":"qna","title":"아직 확인할 것 (캡틴에게)","topics":[{"title":"남은 질문","items":["캡틴 다니의 왓츠앱 연락처와 공지 채널(카톡 단체방)이 언제 열리는지.","첫날 단체 환전은 어디서 얼마나 하는지, 첫날 자유일정에 캡틴 동행이 있는지.","데사구아데로 국경에서 볼리비아 온라인 사전등록(SIGEMIG)이 필요한지.","라파즈→우유니 새벽 4시 출발 날 조식 대체(도시락)가 있는지.","쿠스코→푸노 버스 종류와 중간 화장실 휴식.","우유니 2일차 숙소 San Bernardo의 온수·와이파이·침낭 대여비, 지프 1대 탑승 인원과 큰 캐리어 처리.","볼리비아 국립공원 입장료 등 현금 총액, 볼리비아 ENTEL 유심 단체 구매 안내 여부.","세탁하기 좋은 시점을 캡틴 경험상 어디로 보는지."]}]}];</script>

<script>window.SOUVENIRS = [{"id":"guide","name":"기념품 전략 한 장","items":[],"spots":[],"tips":[],"guide":["가장 싼 곳은 쿠스코(산페드로 시장·산블라스)와 라파즈(사가르나가 거리). 리마·산티아고·공항은 같은 물건이 1.5~3배. 무거운 것은 여정 후반(라파즈)에서, 깨지는 것은 마지막(산티아고)에서.","알파카 100% 표기는 대부분 혼방(아크릴 섞임)이다. 만져서 차갑고 매끈하며 정전기가 없으면 진짜에 가깝고, 가격이 스웨터 150솔 미만이면 혼방으로 보면 된다. 베이비 알파카 스웨터는 150~300솔, 비쿠냐는 수백만 원.","흥정은 시장·노점에서만. 첫 가격의 60~70%에서 시작해 80% 선에서 끝나는 게 보통. 두세 개 묶으면 더 내려간다. 상점·브랜드는 정가.","반입 주의: 코카잎·코카차·코카 캔디는 칠레·미국·한국 모두 금지. 야마 태아, 동물 가죽·깃털, 선인장 같은 식물, 고고학 유물(진품 표기)은 반출·반입 불가. 소금은 식품이라 신고 대상이나 소량 가공 소금(우유니)은 대체로 통과.","무게: 국내선 위탁 23kg 1개. 도자기·소금·와인은 캐리어 무게를 먹는다. 마지막 산티아고 와인 2병까지가 현실적.","결제: 시장은 현금(현지 화폐), 브랜드는 카드. 100달러로는 거스름돈이 안 나온다."]},{"id":"lima","name":"리마","items":[{"name":"피스코 (Pisco)","price":"1병 40~90솔","note":"페루 국민주. 케브란타 품종 표준, 아로마틱은 이탈리아 품종. 라르코마르·슈퍼 Wong 주류 코너. 마지막 날 산티아고에서 칠레 피스코와 비교 구매도 가능"},{"name":"마라스 소금·페루 고추 소금","price":"10~25솔","note":"슈퍼마켓(Wong·Metro) 조미료 코너. 가볍고 실용적"},{"name":"페루 초콜릿 (Cacaosuyo, Shattell)","price":"15~35솔","note":"카카오 70%+ 아마존 원두. 라르코마르 상점·슈퍼. 세계 대회 수상 브랜드"},{"name":"잉카 콜라·치차 모라다 분말","price":"5~15솔","note":"슈퍼. 가벼운 웃음용 선물"},{"name":"커피 (Tunki, 찬차마요)","price":"30~60솔/250g","note":"카페·슈퍼. 푸노에서 툰키 커피를 직접 사도 됨"}],"spots":[{"name":"Larcomar 쇼핑몰","note":"절벽 위 몰. 페루 디자이너 브랜드(Kuna·Sol Alpaca 알파카 고급, Ilaria 은세공). 가격은 높지만 품질 보증","mapQuery":"Larcomar, Lima, Peru"},{"name":"Wong 슈퍼마켓 (Benavides)","note":"호텔 도보 14분. 식품 기념품(소금·초콜릿·피스코·커피) 한 번에","mapQuery":"Wong, Lima, Peru"},{"name":"Mercado Indio (Av. Petit Thouars)","note":"미라플로레스 대형 수공예 시장 골목. 쿠스코보다 비싸지만 마지막 날 부족한 것 채우기 좋음. 이번 일정은 리마가 앞이라 구경만","mapQuery":"Mercado Indio, Lima, Peru"}],"tips":["리마에서는 식품류만. 알파카·수공예는 쿠스코·라파즈가 절반 가격.","피스코는 위탁 수하물, 1인 1L 이상은 한국 세관 신고(주류 1병 400달러 이하 면세)."],"guide":[]},{"id":"ica","name":"이카·와카치나","items":[{"name":"이카 피스코·와인 (Tacama, Vista Alegre, El Catador)","price":"40~80솔","note":"보데가 직판이 슈퍼보다 종류가 많다. 케브란타 순수 피스코 + 아차올라도(블렌드)"},{"name":"테하스 (Tejas)","price":"10~20솔/상자","note":"이카 특산 과자. 피칸·무화과에 만하르(밀크 캐러멜)를 채우고 설탕 옷. 초코테하 <script>window.SPANISH = {"rules":["모음은 항상 한 가지 소리다. a 아, e 에, i 이, o 오, u 우. 영어처럼 바뀌지 않아 글자대로 읽으면 90% 맞는다.","ll 과 y 는 '이/야' 소리. calle 까예, pollo 뽀요, Callao 까야오. (아르헨티나식 '샤' 발음은 이번 3개국에서는 안 쓴다)","j 와 g(e, i 앞) 는 목에서 나는 'ㅎ'. Jorge 호르헤, jugo 후고, Gerardo 헤라르도.","h 는 소리가 없다. hotel 오뗄, Huacachina 와카치나, hora 오라.","c(e, i 앞) 와 z 는 'ㅅ'. cerveza 세르베사, Cusco 꾸스코, plaza 쁠라사. 스페인 본토의 'ㅆ' 혀짤배기 발음은 남미에 없다.","qu 는 'ㄲ'. que 께, quinua 끼누아, Quechua 께추아. gu(e, i 앞) 는 'ㄱ'. guía 기아.","ñ 은 '니'. baño 바뇨, mañana 마냐나, año 아뇨.","r 한 개는 살짝 굴리고 rr 은 강하게 굴린다. pero 뻬로(그러나), perro 뻬로(개)는 굴림 길이만 다르다. 못 굴려도 뜻은 통한다.","v 와 b 는 같은 'ㅂ'. vino 비노, Bolivia 볼리비아.","d 는 모음 사이에서 부드럽게 'ㄷ/ㄹ' 사이. nada 나다.","강세: 모음이나 n, s로 끝나면 뒤에서 두 번째 음절(ca-MA-ra 아님, CA-ma-ra), 그 외 자음으로 끝나면 마지막 음절(ho-TEL), 악센트 표시(á é í ó ú)가 있으면 그 자리. 강세를 틀리면 못 알아듣는 경우가 있어 발음 표기에서 굵은 부분을 세게 읽는다.","물음표·느낌표는 문장 앞에도 거꾸로(¿ ¡) 붙는다. 의문문은 끝을 올려 읽으면 된다.","한국인이 자주 틀리는 것: Machu Picchu 마추 픽추(삐추 아님), Cusco 꾸스코, Uyuni 우유니, La Paz 라 빠스(z는 ㅅ), Santiago 산띠아고, gracias 그라시아스(그라씨아스 아님), ceviche 세비체."],"showcards":[{"es":"A este hotel, por favor: Casa Andina Standard Benavides, Av. Alfredo Benavides 271, Miraflores","ko":"이 호텔로 가 주세요 (리마)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Hampton by Hilton, Av. Tullumayu 227, Cusco","ko":"이 호텔로 가 주세요 (쿠스코)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Hotel Rosario Sur, Calle 16 de Calacoto, Zona Sur","ko":"이 호텔로 가 주세요 (라파즈)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"A este hotel, por favor: Novotel Santiago Providencia, Av. Holanda 222","ko":"이 호텔로 가 주세요 (산티아고)","pron":"아 에스떼 오뗄 뽀르 파보르"},{"es":"Al aeropuerto, por favor. Vuelo a las __","ko":"공항으로 가 주세요. __시 비행기","pron":"알 아에로뿌에르또 뽀르 파보르"},{"es":"¿Cuánto cuesta hasta allí? Con taxímetro, por favor","ko":"거기까지 얼마예요? 미터기로 부탁합니다","pron":"꽌또 꾸에스따 아스따 아이"},{"es":"Tengo mal de altura. Necesito oxígeno, por favor","ko":"고산증이에요. 산소가 필요해요","pron":"뗑고 말 데 알뚜라. 네세시또 옥시헤노"},{"es":"Necesito un médico. Hablo coreano, no hablo español","ko":"의사가 필요해요. 한국어만 합니다","pron" <script>window.PREP_DATA = [{"id":"timeline","title":"출발 전 타임라인 (D-15 → D-day)","topics":[{"title":"D-15 ~ D-10 (9/5~9/10) 서류·돈","items":["ESTA 신청 (esta.cbp.dhs.gov, USD 40.27, 승인 메일 PDF를 폰에 저장). 왕복 두 번 쓰이니 유효기간 확인.","여권 유효기간 6개월 이상(2027년 4월 이후 만료) 확인. 여권 사본 2장 인쇄 + 폰 사진. 여권용 사진 2장.","여행자보험 가입. 사망 1~3억, 해외 질병·상해 각 2천만 원 이상, 휴대품 손해 포함. 가입 기간은 9/20 출발~10/5 도착. 증서 PDF를 여행사에 보내고 폰에 저장.","은행에서 USD 신권 준비: 100달러 신권 6~7장 + 20달러 5장 + 1달러 20장(팁·화장실). 낙서·접힘 없는 것으로 골라 받는다. 지폐 번호대가 이어지는 신권을 달라고 하면 된다.","해외 결제 카드 2장(Visa/Master 각 1장, 다른 은행). 해외 사용 한도와 출금 가능 여부 확인, 카드사 앱에 해외 결제 알림 설정.","병원에서 고산약(아세타졸아미드) 처방. 성인 1일 2회 125~250mg, 9/23 저녁부터 9/27까지 최소 5일 + 우유니 9/29~10/2 4일 = 약 20정. 설파제 알레르기 있으면 의사에게 말할 것. 멀미약(패치형 편함), 지사제, 소화제, 두통약 함께.","여행사에 확인: 9/20 밤 픽업 여부, 볼리비아 사전등록(SIGEMIG) 필요 여부, 캡틴 연락처."]},{"title":"D-9 ~ D-5 (9/11~9/15) 물건·디지털","items":["이 앱을 폰 홈 화면에 설치하고 와이파이에서 한 번 열어 사진까지 캐시. 비행기 모드로 동작 확인.","구글맵 오프라인 지도 8개 도시 다운로드(프로필 → 오프라인 지도 → 직접 지도 선택, 도시당 100~300MB, 30일 유효라 9/10 이후에 받기). 구글 번역 스페인어 오프라인 팩. Uber·Cabify 앱 설치 후 카드 등록. 왓츠앱 설치(남미 현지 연락은 전부 왓츠앱).","백업 지도 Organic Maps 설치 후 페루(리마·이카·쿠스코·푸노 지역), 볼리비아 전체, 칠레 북부·산티아고 지도 다운로드. 완전 오프라인에서 도보 경로 안내까지 된다.","eSIM 구매(Airalo 등 남미 리저널 10~20GB). 설치만 하고 활성화는 리마 도착 시.","보조배터리 2개 용량 표기 확인(100Wh 이하). 멀티 어댑터, 3구 멀티탭(호텔 콘센트 부족), C to C 케이블 2개.","우유니 사진 소품 준비: 공룡 피규어, 프링글스 통, 장난감 자동차. 다이소에서 해결.","옷은 아래 짐 싸기 목록대로 꺼내 놓고 하루 입어 본다. 특히 경량 패딩과 바람막이 조합, 등산화 길들이기.","한식 비상식량: 컵라면 4~6개, 햇반 3~4개, 볶음김치 파우치, 김, 고추장 튜브. 칠레 반입 허용 품목."]},{"title":"D-4 ~ D-2 (9/16~9/18) 최종 확인","items":["대한항공 앱에서 좌석 지정(KE33 ICN→ATL 13시간 50분, 통로석 권장), 온라인 체크인은 출발 24시간 전.","항공권 e티켓·아고다 바우처·보험증서·ESTA 승인서·여권 사본을 폰 앨범 하나에 모아 두고, 종이로도 1부 인쇄.","환율 계산기 기본값 확인. 여행사 단체 카톡방 공지 확인.","집안 정리: 냉장고, 가스, 우편물, 화분. 카드·통신사에 해외 체류 알림.","짐 최종 패킹. 위탁 23kg 이내(캐리어 자체 무게 포함), 기내 백팩 7kg 이내로 맞춰 본다(BoA 기준). 저울로 재기."]},{"title":"D-1 (9/19) 전날","items":["보조배터리·카메라·폰 완충. 오프라인 콘텐츠 마지막 동기화.","기내 백팩에 넣을 것: 여권·지갑·보조배터리·충전기·상비약·고산약·목베개·안대·귀마개·양치세트·갈아입을 티셔츠·경량 패딩(기내 추움)·펜.","액체는 100ml 이하, 지퍼백 1개. 애틀랜타 보안검색을 다시 받으므로 인천 면세 주류는 사지 않는다.","일찍 잔다. 08:45 출발이면 06:30 공항 도착, 집에서 05:00 출발 기준."]},{"title":"D-day (9/20) 출발","items":["인천 T2 대한항공 카운터. 위탁 짐 태그가 LIM까지 찍혔는지 확인하되, 애틀랜타에서 어차피 찾는다.","탑승 전 ESTA 승인 여부를 카운터에서 확인받는다.","기내에서 시계를 리마 시간(-14시간)에 맞추고, 도착 시각(21:55)까지 깨어 있을 수 있게 첫 식사 후 5~6시간 자기.","애틀랜타 도착 09:35 → 입국심사 → 짐 수취 → 재위탁 → 보안검색 → 콩코스 F. 16:10 출발까지 6시간 35분.","리마 도착 21:55 → 입국심사 → 짐 → 공식 택시 카운터 또는 Uber(3번 문) → Casa Andina Benavides 체크인(아고다 예약번호는 앱 문서 칸)."]}]},{"id":"packing","title":"짐 싸기 상세 (체크리스트)","topics":[{"title":"서류·돈 (기내 백팩, 몸에 지님)","items":["여권 (유효기간 2027.04 이후)","여권 사본 2장 + 폰 사진, 여권용 사진 2장","ESTA 승인서 (PDF + 인쇄)","e티켓 인쇄본 (예약번호는 앱 정보 → 문서에 저장)","아고다 바우처 인쇄본 (예약번호는 앱 문서 칸)","여행자보험 증서 + 긴급 전화번호 (가입증서는 출발 전 여행사에도 전달)","남미 왕복 항공권 프린트본 (국경·입국 심사 대비, 여행사 안내)","현금은 위탁 수하물에 절대 넣지 않는다 (여행사 공지). 몸에 지님","USD 현금: 100달러 신권 6~7장, 20달러 5장, 1달러 20장 (두 곳에 분산)","해외 결제 카드 2장 (다른 은행), 비상용 카드 1장은 캐리어 안","원화 소액 (귀국 후 공항버스·택시)","볼펜 2개 (세관 신고서용)"]},{"title":"전자기기","items":["스마트폰 + 보호 필름·방수팩","보조배터리 2개 (각 20,000mAh 이하, 용량 표기 있는 것)","충전기 (65W GaN 멀티포트 1개면 충분) + 케이블 2~3개","멀티 어댑터 (A/B/C/L형) + 3구 멀티탭","이어폰 (유선 1개 예비, 기내 엔터테인먼트용)","카메라 있으면 배터리 2개·메모리카드 예비·삼각대(별 사진용 미니 삼각대)","헤드랜턴 또는 소형 손전등 (소금호텔·새벽 출발)","손목시계 (폰 배터리 아낄 때, 시차 확인)","스마트워치 충전기 잊지 말 것"]},{"title":"옷 (13일, 세탁 1회 기준: 쿠스코)","items":["상의 속건 티셔츠 5~6장 (면 티는 고산에서 땀 마르지 않음)","긴팔 기능성 셔츠 2장 (자외선·마추픽추 벌레)","플리스 또는 얇은 니트 1장","경량 패딩 1장 (필수. 우유니 밤 영하, 새벽 출발 날들)","바람막이·방수 재킷 1장 (마추픽추 비, 우유니 바람)","긴바지 2~3장 (트레킹 바지 1 + 편한 바지 1~2), 반바지 1장 (이카·산티아고)","내복 상하 1세트 (우유니 2박 밤 + 새벽 4시 출발 날)","속옷 7세트, 양말 7쌍 (두꺼운 등산 양말 2쌍 포함)","잠옷 겸 실내복 1세트","수영복 1 + 스포츠 타월 1 (이카 호텔 수영장, 우유니 노천온천)","모자 (햇빛용 챙 모자 1 + 방한 비니 1), 장갑 (얇은 것), 버프 또는 스카프 (모래바람·먼지·추위)","신발: 등산화 또는 트레킹 운동화 1 (메인), 편한 운동화 또는 샌들 1 (도시·버스·호텔), 슬리퍼 1 (호텔·온천)","선글라스 (고산 자외선 필수, 여분 1개 저가형)"]},{"title":"세면·위생","items":["선크림 SPF50 2개 (얼굴용·몸용), 립밤 SPF (고산에서 입술 갈라짐)","보습제 진한 것 (고산 건조), 핸드크림","클렌징·샴푸·린스 소분 (호텔 어메니티는 3성급이라 기대하지 말 것)","칫솔·치약, 면도기","휴대용 휴지 3~4개, 물티슈 2팩 (화장실에 휴지 없음, 우유니 필수)","손 소독제, 마스크 KF94 5장 (버스·먼지·사막)","생리용품 (현지 구매 가능하나 종류 적음)","귀마개·안대 (기내·버스·호텔 소음)","손톱깎이, 반창고, 소형 반짇고리","빨래용 비누 조각 또는 세탁 시트, 빨래줄 (양말·속옷 호텔 세탁)"]},{"title":"약 (처방·상비)","items":["고산약 아세타졸아미드 20정 (처방)","소로치 필 또는 두통약 (이부프로펜·아세트아미노펜)","멀미약 (버스 7시간, 보트, 경비행기 안 타도 지프 3일)","지사제 + 정로환, 소화제, 위장약, 배탈약 (여행사: 배탈이 잦다)","벌레기피제 (마추픽추 샌드플라이. 현지 구매도 가능)","감기약, 목 사탕 (건조한 고산 공기)","항히스타민제 (알레르기·벌레)","밴드·상처 연고, 근육 파스 (트레킹 뒤)","전해질 파우더 (고산 수분 보충, 설사 시)","개인 복용약 + 처방전 영문 사본","수면유도제 (27시간 비행·시차, 필요 시)"]},{"title":"우유니·고산 전용","items":["핫팩 4~6개 (여행사는 1~2개라 했지만 2박 밤 + 새벽 출발 고려)","보온 물주머니 2L (여행사 추천, 쿠팡 8천 원대. 2일차 숙소는 전기장판 사용 불가라 이게 침대 난방)","수영복 또는 래시가드 (3일차 폴케스 온천, 여행사 \"필수\")","폰 스트랩 (소금물에 떨어뜨리면 수리 불가) + 립밤·핸드크림·인공눈물","볼리비아노 소액권 50~100Bs (화장실 전부 유료, 회당 약 5Bs)","먼지 마스크 또는 버프, 강렬한 원색 옷 1벌 (사진용)","사진 소품: 공룡 피규어, 프링글스 통, 미니카, 컬러풀한 옷·판초","지퍼백 여러 장 (소금·먼지에서 전자기기 보호, 보조배터리 개별 포장)","보온병 500ml (호텔 뜨거운 물 받아 코카차·컵라면)","간식: 견과류·에너지바·초콜릿 (지프 이동 중, 고산 저혈당 대비)","물 2L 우유니 마을에서 구매 (투어 3일용, 지프에 실어 줌)","코카 캔디 (쿠스코에서 구매, 칠레 국경 전 소진)"]},{"title":"가방","items":["캐리어 24~26인치 (위탁 23kg 이내), 자물쇠, 이름표","기내 백팩 20~30L (기내용 캐리어는 국내선 유료. BoA 7kg 기준)","접이식 데이팩 또는 크로스백 (시내 관광, 소매치기 대비 앞으로 메는 것)","압축팩 또는 파우치 (옷·전자기기·약 구분)","방수 커버 (백팩용, 지프 지붕 짐칸 대비)","빈 에코백 1개 (시장·기념품)"]},{"title":"한식·먹을 것 (칠레 반입 허용: 조리·포장 식품)","items":["컵라면 4~6개 (뜨거운 물은 호텔 로비·전기포트)","햇반 3~4개, 볶음김치 파우치 2~3개, 김 몇 봉, 고추장 튜브","인스턴트 커피·믹스 (페루 식당 커피는 인스턴트인 경우 많으니 취향대로)","생과일·육포·견과 무가공은 칠레 반입 금지이니 볼리비아에서 소진"]}]},{"id":"clothes","title":"도시별 옷차림","topics":[{"title":"리마 (15~20도, 흐림·습함)","items":["낮: 긴팔 셔츠 또는 티셔츠 + 얇은 겉옷. 해가 안 나도 자외선은 있다.","밤: 바람막이나 플리스. 해안 절벽은 바람이 차다.","신발: 운동화. 구시가지·미라플로레스 하루 2만 보."]},{"title":"이카·와카치나 (11~28도, 사막)","items":["낮: 반팔·반바지 가능, 모자·선글라스·선크림 필수. 버기카는 모래가 들어오니 버프와 지퍼백에 폰.","사막 디너·밤: 기온 급강하. 경량 패딩. 샌드보딩은 긴바지가 덜 아프다.","수영복: 호텔 수영장. 오후 도착이라 체크인 후 1시간 여유."]},{"title":"쿠스코·마추픽추 (5~22도, 건조·강한 햇빛)","items":["낮 햇빛 아래는 티셔츠, 그늘·실내는 플리스. 하루 안에 사계절.","마추픽추: 긴바지·긴팔(벌레·햇빛), 바람막이(비), 모자. 큰 배낭 반입 금지(40×35×20cm 이하), 물병·간식은 소량. 우산은 금지, 우비 허용.","비니쿤카: 내복 상의 + 플리스 + 패딩 + 바람막이 4겹, 비니·장갑, 등산화. 정상은 체감 영하.","밤: 패딩. 호텔 난방이 약하다."]},{"title":"푸노·라파즈 (1~19도, 건조)","items":["낮 햇빛 강하고 밤 0도 근처. 경량 패딩은 항상 가방에.","티티카카 보트: 호수 위 바람이 차고 자외선 반사가 강하다. 바람막이·선글라스.","라파즈: 언덕이 많아 운동화. 케이블카 안은 따뜻하다."]},{"title":"우유니·알티플라노 (-8~16도, 극건조·강풍)","items":["낮 소금사막: 햇빛 반사가 눈밭 수준. 선글라스 없으면 눈이 아프다. 반팔 위 바람막이.","선셋 이후·별 투어: 내복 + 플리스 + 패딩 + 바람막이 + 비니 + 장갑 + 두꺼운 양말. 핫팩.","2일차 숙소 밤: 침낭 + 옷 다 입고 잔다. 3일차 새벽 온천은 수영복을 옷 안에 입고 출발, 나올 때 큰 타월과 패딩."]},{"title":"아타카마·산티아고 (3~25도, 봄)","items":["아타카마 낮은 덥고 건조. 반팔 + 모자. 저녁 비행기라 산티아고 도착은 밤 22시, 서늘함.","산티아고 10월 초: 아침 6~8도, 낮 20도. 티셔츠 + 재킷. 마지막 날 와이너리는 야외라 모자."]}]},{"id":"flight","title":"27시간 비행 꿀팁","topics":[{"title":"인천 → 애틀랜타 (13시간 50분)","items":["좌석: 통로석. 대한항공 KE33은 보통 A350 또는 B777. 대한항공 앱에서 사전 지정.","시차 전략: 리마는 한국보다 14시간 늦다. 즉 낮밤이 거의 뒤집힌다. 기내 첫 식사 후 5~6시간 자고, 애틀랜타 도착(현지 아침 9:35)부터는 깨어 있는다. 리마 도착 21:55에 바로 자면 첫날 시차가 거의 해결된다.","물 많이 마시고 술은 피한다. 압박 스타킹이 있으면 다리 부종에 도움.","기내 반입: 목베개, 안대, 귀마개, 립밤, 보습제, 양치세트, 슬리퍼용 양말, 태블릿에 영화 다운로드."]},{"title":"애틀랜타 6시간 35분","items":["입국심사 줄이 길면 1시간. MPC 앱을 미리 설치하면 별도 줄.","짐을 찾아 재위탁 후 보안검색. 여기서 액체 규정 다시 적용. 인천 면세 주류 사지 않는다.","콩코스 F는 식당이 많다. 미국식 아침(팬케이크·베이컨)이나 치킨. 물은 리필 스테이션.","유심을 안 사도 공항 와이파이 무료. 가족에게 안착 연락.","남은 시간은 걷는다. 다음 비행 6시간 45분을 위해 다리를 풀어 둔다."]},{"title":"애틀랜타 → 리마 (6시간 45분, 델타 운항)","items":["델타 기내식은 저녁 1회 + 간식. 기내 엔터테인먼트 한국어 자막은 적다.","리마 도착 직전 입국 신고서는 없다. 심사관에게 관광 목적, 13일, 호텔 이름을 말한다.","도착 21:55. 짐 찾고 나오면 22:30~23:00. 택시 카운터에서 미라플로레스 60~95솔 또는 Uber. 호텔 도착 자정 전후."]},{"title":"귀국 편 (산티아고 20:40 → 애틀랜타 05:20 → 인천 14:10)","items":["산티아고→애틀랜타 9시간 40분은 밤 비행이라 자기 좋다. 도착 후 애틀랜타 4시간 환승은 새벽이라 줄이 짧다.","애틀랜타→인천 15시간 50분. 한국 시간에 맞추려면 이 구간 전반부는 깨어 있다가 후반부에 잔다. 인천 도착 14:10(월요일).","칠레 페소는 공항에서 다 쓴다. 남은 볼리비아노·솔은 재환전이 어려우니 기념으로."]}]},{"id":"apps","title":"앱·디지털 준비","topics":[{"title":"설치할 앱","items":["Uber, Cabify (리마·쿠스코·산티아고), InDrive (라파즈·쿠스코, 가격 협상형)","WhatsApp (캡틴·호텔·투어사 연락 표준)","Google 지도 (오프라인 8도시. 오프라인에서 지도 보기·내 위치·자동차 경로는 되고, 도보·대중교통 경로와 작은 상점 검색은 안 됨)","Organic Maps (완전 오프라인 지도, 도보 경로 가능, 무료·광고 없음). 구글맵이 못 찾는 골목 식당은 이 앱의 지도에서 좌표로 확인","Google 번역 (스페인어 오프라인 + 카메라)","이 앱은 설치 후 오프라인 동작. 장소 링크는 좌표가 들어 있어 오프라인 구글맵에서도 핀이 찍힌다. 실시간 날씨만 온라인 필요","Airalo 등 eSIM 앱, 대한항공 앱, 아고다 앱(바우처)","환율: 이 앱 계산기로 충분. 정확한 실시간은 XE.","날씨: 이 앱 오늘 화면(Open-Meteo). 우유니 별 보기용으로 Windy(구름 예보) 추천.","별자리: Stellarium 또는 Sky Guide(유료) 오프라인 모드로 남십자성 찾기.","지진: 칠레·페루는 흔하다. 폰 긴급재난문자가 오면 안내대로.","PeruRail 앱은 불필요(여행사 발권). 마추픽추 입장권은 캡틴이 나눠 준다."]},{"title":"폰 설정","items":["구글 계정 2단계 인증 백업코드 저장 (해외에서 로그인 막힐 때).","카카오톡 로밍 상태에서 잘 되게 데이터 절약 모드 해제. 사진 자동 백업은 와이파이에서만.","사진 저장 공간 확보: 13일 3천 장 기준 30GB. 클라우드 자동 업로드는 호텔 와이파이에서 밤에.","위치 공유(가족)를 카카오맵 또는 구글 위치공유로 켜 두면 우유니 이후 연락 안 될 때 안심.","폰 잠금 화면에 비상 연락처와 혈액형·알레르기를 표시(안드로이드 긴급 정보)."]}]},{"id":"sim","title":"유심·eSIM 완전 가이드 (2026년 9월 조사)","topics":[{"title":"결론부터: 추천 조합","items":["1순위(추천): 출발 전 볼리비아 포함이 확인된 남미 리저널 eSIM 1개(Airalo LatamLink 또는 Holafly 라틴아메리카) + 라파즈에서 ENTEL 현지 유심 추가(여행사 권장, 약 80Bs) + 한국 유심은 그대로 두고 데이터 로밍만 OFF(은행 OTP 문자 수신용). 총비용 약 5~9만 원.","2순위(가장 싼 법): 현지 유심 2장. 리마 미라플로레스에서 Entel 또는 Claro 유심(20~40솔, 7~12GB) + 라파즈 ENTEL 유심(80Bs). 칠레 이틀은 호텔 와이파이로 버티거나 eSIM 1일권. 총 2~3만 원. 단 페루는 48시간 안에 IMEI 등록을 매장에서 해야 하고, 유심을 갈아 끼우는 번거로움.","3순위(가장 편한 법): 한국 통신사 로밍 요금제. 번호 그대로, 설정 없음. 하루 1.1만~1.65만 원 수준 × 14일 = 15~23만 원. 볼리비아가 요금제 대상국에 포함되는지 반드시 확인(제외되는 상품이 있음).","어떤 조합이든 우유니 지프투어 2박 3일과 마추픽추 유적 안은 신호가 없다. 이 앱과 오프라인 지도가 그 구간의 대안이다."]},{"title":"왜 여행사 안내와 다른가","items":["여행사는 볼리비아 ENTEL 유심을 권장하고 글로벌 eSIM은 볼리비아에서 불안정하다고 안내한다. 조사 결과 일부는 맞다. 남미 리저널 eSIM 중 볼리비아를 아예 빼는 상품이 많고(Instabridge, Jetpac, aloSIM 남미 플랜), 포함되는 상품도 볼리비아 파트너 망(Tigo·Viva)이 시외에서 약하다.","그래서 볼리비아 3박은 ENTEL 유심을 추가하는 것이 맞다. 다만 페루 8일과 칠레 2일은 eSIM이 현지 유심보다 편하고 값도 비슷하다. 특히 칠레는 2025년부터 선불 유심 구매에 지문 생체인증이 요구되어 외국인 판매를 거부하는 매장이 늘었다. 칠레 현지 유심은 계획에서 빼는 것이 안전하다."]},{"title":"리저널 eSIM 비교 (2026년 상반기 가격, 출발 전 재확인)","items":["Airalo LatamLink: 볼리비아 포함 확인. 2GB/15일 USD 28, 5GB/30일 USD 60. 데이터 단가는 비싸지만 가장 널리 검증됨. 페루 단일국 eSIM은 더 저렴하니 페루용 단일 + 칠레용 단일로 나누는 것도 방법.","Holafly 라틴아메리카: 볼리비아 포함. 무제한(공정사용 기준) 30일 USD 69~79. 사진 백업·영상 통화가 많으면 이쪽. 핫스팟 제한 있음.","Nomad 라틴아메리카: 볼리비아 포함. 5~20GB 옵션 약 USD 45 전후.","Saily(NordVPN 계열) 남미 리저널: 볼리비아 포함, 1~20GB USD 8~45.","Maya Mobile 라틴아메리카: 14일 무제한 약 USD 28로 표기된 상품이 있으나 볼리비아 망·속도 제한을 결제 전 확인.","한국 판매처(유심사·말톡·도시락)의 남미 eSIM은 대부분 위 공급사를 재판매하는 것으로, 한국어 상담과 카카오 결제가 장점. 볼리비아 포함 여부를 상품 상세에서 반드시 확인.","구매 시 확인 3가지: 볼리비아 포함, 핫스팟(테더링) 가능, 개통 시점(설치 시 vs 첫 접속 시). 첫 접속 시 개통되는 상품을 골라 한국에서 설치해 두고 리마에서 켠다."]},{"title":"현지 유심 (나라별)","items":["페루: Entel 7GB 20솔, 12GB 29솔, 20GB 39솔 / Claro 관광객 플랜 5GB 7일 67솔(미국·칠레 통화 포함). 미라플로레스 케네디 공원 주변 공식 매장 다수, 여권 필요. 공항 Claro 부스는 USD 50 수준으로 비싸니 피한다.","페루 IMEI 규정: 2026년부터 외국 폰에 현지 유심을 개통하면 48시간 안에 통신사 매장에서 IMEI 등록(무료, 여권 제시)을 해야 하고 안 하면 차단될 수 있다. 유심을 사는 매장에서 바로 등록을 요청한다. eSIM·로밍은 해당 없음.","볼리비아: ENTEL 유심 10Bs + 6일 무제한 약 80Bs(여행사 안내) 또는 7~15GB 패키지 40~80Bs. 구매 시 여권 등록 필수(직원이 여권 촬영, 15~30분). 라파즈 시내 ENTEL 매장 또는 소나 수르 메가센터. Entel이 시외·우유니 마을에서 가장 잘 잡힌다.","칠레: Movistar 40GB 5,000페소 등 가격은 매우 싸지만 2025년 2월 생체인증 규정으로 외국인 선불 유심 판매를 거부하는 매장이 많다. 30일 미만 체류는 IMEI 등록 불필요. 결론: 칠레는 eSIM 또는 로밍."]},{"title":"한국 통신사 로밍","items":["요금제 예: SKT baro(3GB 29,000원, 6GB 39,000원, 12GB 59,000원 등), KT 데이터로밍 하루종일 ON, LG U+ 제로라밍. 남미는 하루 1.1만~1.65만 원 상품이 보통.","반드시 확인할 것: 페루·볼리비아·칠레·미국(환승) 4개국이 모두 대상국인지. 볼리비아가 빠진 상품이 있다. 통신사 앱의 국가 검색으로 확인.","장점: 번호 유지, 설정 없음, 한국 전화 수신. 단점: 비용, 볼리비아 시외 커버리지는 현지 유심보다 약함.","로밍을 안 쓰더라도 한국 유심은 빼지 않는다. 데이터 로밍만 끄면 문자(OTP)는 무료로 받는다. 대신 전화가 오면 착신 요금이 붙으니 받지 않고 왓츠앱으로 다시 건다."]},{"title":"갤럭시 설정 순서","items":["eSIM 지원 확인: 설정 → 연결 → SIM 관리자 → eSIM 추가 메뉴가 있으면 지원. 국내 S23 이후·Z플립4/폴드4 이후·A54 이후 대부분 지원. S22 이전 국내 모델은 미지원이 많다. 통신사에서 eSIM 기능이 잠긴 경우 고객센터에 해제 요청.","출발 전(와이파이): eSIM 앱에서 구매 → QR 또는 자동 설치 → SIM 관리자에 프로필이 보이면 완료. 활성화는 리마에서.","리마 착륙 후: SIM 관리자 → 모바일 데이터 = eSIM, 통화·문자 = 한국 SIM, 한국 SIM의 데이터 로밍 OFF. 데이터 로밍은 eSIM 쪽만 ON.","볼리비아 도착: ENTEL 유심을 한국 유심 자리에 끼우면 OTP를 못 받는다. eSIM 지원 폰이면 한국 유심 유지 + ENTEL 유심을 물리 슬롯에 넣기 위해 한국 유심을 빼야 하므로, 볼리비아 3일은 OTP가 필요한 은행 업무를 미리 끝내 둔다. 빠진 한국 유심은 지퍼백에 여권과 함께.","데이터가 안 잡히면: 비행기 모드 켰다 끄기 → APN 자동 설정 확인 → eSIM 앱 고객센터(채팅). 대부분 APN 자동.","통화는 전부 왓츠앱. 캡틴·호텔·투어사가 다 왓츠앱을 쓴다."]},{"title":"데이터 얼마나 필요한가","items":["14일 5~10GB면 충분하다. 지도는 오프라인, 사진 백업은 호텔 와이파이, 영상 시청은 안 한다는 전제.","많이 쓰는 것: 구글맵 실시간 경로(시간당 5~10MB), 왓츠앱 사진, 인스타 업로드, 번역 카메라. 적게 쓰려면 사진 자동 백업을 와이파이 전용으로.","하루 300~500MB 기준으로 7GB. 여유 있게 10GB. 무제한 상품은 그 이상 쓸 때만."]},{"title":"어디서 신호가 없나 (조사 결과)","items":["우유니 지프투어: 마을은 Entel 4G. 기차무덤·콜차니는 약하고, 소금사막 안쪽·잉카와시·라구나 콜로라다·산베르나르도 숙소는 0. 즉 9/30 오전 11시부터 10/2 정오 국경까지 약 48시간 완전 오프라인.","마추픽추: 아구아스칼리엔테스 마을은 4G, 유적 안은 간헐적(Movistar가 조금 낫다), 높은 구역은 없음.","쿠스코·성스러운 계곡: 도시 4G, 마을 사이 3G. Claro가 고지대에서 낫다. 비니쿤카 정상은 없음.","푸노~데사구아데로: 양쪽 마을 4G, 사이 구간 끊김. 국경에서 볼리비아 eSIM·유심으로 전환하는 타이밍.","라파즈 소나 수르: 커버리지 있음, Entel이 낫다. 케이블카 안 4G.","산페드로 데 아타카마: 마을 4G(Entel), 국경 이토 카혼 주변은 약함.","산티아고: 전 지역 4G/5G.","애틀랜타: 공항 무료 와이파이. 6시간을 위해 미국 데이터를 사지 않는다."]},{"title":"출발 전 체크","items":["eSIM 구매·설치 완료, 활성화 방식 확인","한국 유심 데이터 로밍 OFF 방법 미리 확인, 통신사 로밍 차단 서비스 신청 여부 결정","은행·카드 앱의 OTP 수단을 문자 대신 앱 인증(PASS·토스 등)으로 바꿔 두면 유심을 뺀 볼리비아에서도 결제 승인 가능","카카오톡·왓츠앱 로그인 상태 확인, 왓츠앱에 캡틴·가족 번호 저장(+82 형식)","유심 핀(SIM 이젝터)과 빈 유심 케이스를 지갑에"]}]},{"id":"hacks","title":"여행 꿀팁 모음","topics":[{"title":"돈 아끼는 법","items":["점심은 메누 델 디아(세트) 12~20솔로 배를 채우고 저녁은 가볍게. 페루 식당 세트는 양이 많다.","물은 시장이나 마트에서 2.5L 대용량 5솔. 편의점 소병은 3배.","택시 대신 앱. 흥정할 때는 미리 앱으로 가격을 확인하고 그 가격을 부른다.","기념품은 쿠스코 산페드로 시장과 라파즈 사가르나가 거리가 가장 싸다. 알파카 100% 표기는 대부분 혼방이니 가격이 5만 원 아래면 혼방으로 생각한다. 진짜 베이비 알파카 스웨터는 150~300솔.","칠레 ATM 수수료가 크니 한 번에 20만 페소. 산티아고 이틀 경비는 카드 위주.","볼리비아노는 정확히 필요한 만큼만 환전. 남으면 재환전이 어렵다."]},{"title":"시간 아끼는 법","items":["매일 저녁 다음 날 카드를 보고 짐을 두 종류로 나눈다: 지프·버스에 실을 것과 손에 들 것.","호텔 체크인 시 조식 시간과 세탁 서비스, 뜨거운 물 받을 곳을 바로 묻는다.","마추픽추 날: 전날 밤 배낭을 다 꾸리고 물병만 아침에. 기차 시간은 절대적이다.","우유니 전날(라파즈 2일차 밤): 캐리어를 3일용 백팩과 남는 짐으로 분리. 새벽 3시에 짐 싸지 않는다.","국경 넘는 날 여권·관광카드·세관 신고서를 한 파우치에."]},{"title":"몸 관리","items":["고산 도착 첫날 규칙: 천천히, 물 3L, 술 금지, 뜨거운 샤워 짧게, 저녁은 수프. 두통은 정상, 구토·착란은 비정상.","쿠스코에서 하루 한 번 코카차, 우유니에서 하루 한 번 온천은 안 된다(3일차 새벽 한 번). 대신 밤에 물을 마셔 두면 아침 두통이 준다.","자외선: 고산은 흐려도 탄다. 2시간마다 선크림. 콧등·귀·목 뒤·손등.","배탈: 처음 이틀은 얼음·생야채를 피하고 익힌 것만. 세비체는 점심에 사람 많은 곳.","잠: 고산에서 첫 며칠 새벽에 깬다. 정상이다. 낮에 20분 낮잠이 도움.","발: 등산화 안에 두꺼운 양말, 저녁에 발 마사지. 물집 밴드 지참."]},{"title":"사진","items":["마추픽추: 입장 직후 상단 전망대(가디언 하우스 방향)에서 전경을 먼저 찍는다. 오전 12시 입장이라 빛이 위에서 내려오니 그림자가 짧다. 오후 3시 이후 사람이 빠진다.","우유니: 원근법 사진은 오후 4시 이후, 선셋은 물찬 포인트에서 반영, 별은 달 뜨기 전. 폰 렌즈를 자주 닦는다(소금 먼지).","라파즈 케이블카: 레드라인 하행이 도시 전경, 옐로우·그린라인이 부촌과 일리마니. 유리에 붙지 말고 30cm 떨어져 찍으면 반사가 준다.","사람 사진 예절: 촐리타·시장 상인은 찍기 전에 꼭 묻는다(¿Puedo tomar una foto?). 몇 솔 요구하기도 하니 잔돈.","매일 밤 호텔 와이파이에서 백업. 폰 분실 대비."]},{"title":"데이터 없이 살기","items":["이 앱: 출발 전 와이파이에서 한 번 열어 사진까지 뜨게 두면 이후 비행기 모드에서도 전부 동작. 크롬 캐시·사이트 데이터를 지우지 말 것.","구글맵 오프라인 영역을 받아 두면 앱의 장소 링크를 눌렀을 때 좌표로 핀이 찍힌다. 길찾기는 자동차 모드만 오프라인 가능, 걷기는 지도를 보며 직접.","Organic Maps는 걷기 경로까지 오프라인. 두 지도를 같이 쓰면 데이터 없이 도시 이동이 된다.","호텔 와이파이에서 매일 밤: 사진 백업, 가족 연락, 다음 날 장소 미리 검색해 구글맵 별표 저장(별표는 오프라인에서도 보인다).","번역은 구글 번역 오프라인 팩, 환율은 이 앱 계산기, 시계는 이 앱 시계. 우유니 3일은 완전 오프라인이라고 생각하고 출발 전날 다 받아 둔다.","통신 없이 캡틴과 만나기: 매일 저녁 다음 날 집합 시각·장소를 이 앱 메모나 종이에 적어 둔다. 왓츠앱은 와이파이에서만 확인된다고 생각한다."]},{"title":"소소한 것들","items":["화장실은 유료·휴지 없음이 기본. 카페에서 뭔가 사고 쓰는 게 가장 깨끗하다.","페루·볼리비아 식당은 계산서를 달라고 해야 온다. 카드 결제 시 카드를 들고 가면 따라간다.","팁 문화: 짐 들어주는 호텔 직원 1달러, 가이드 팀 단위, 식당 10%는 선택.","물건 흥정은 시장에서만. 상점·마트는 정가.","볼리비아·페루에서 시간 약속은 10~20분 늦는 게 보통이지만 투어·기차·비행기는 정확하다.","잉카 콜라 한 번, 치차 모라다 한 번, 피스코 사워 두 나라 비교, 알파카 스테이크 한 번, 세비체 두 번, 살테냐 아침 한 번, 콤플레토 한 번. 이 정도면 먹을 것 미션 완료.","남은 페루 솔 지폐는 볼리비아 국경에서 볼리비아노로 바꿀 수 있지만 환율이 나쁘다. 푸노에서 다 쓰거나 국경 전 환전소.","우유니 투어 기사에게 첫날 이름을 묻고 불러 주면 사진 연출과 서비스가 확실히 달라진다."]}]}];</script>
<script>window.OPTIONS_DATA = [{"id":"boleto","title":"쿠스코 통합 입장권 (Boleto Turístico) 먼저 이해하기","meta":{"day":4,"city":"cusco","mapQuery":"COSITUC Boleto Turistico, Av. El Sol 103, Cusco","time":"구매 10분","cost":"전체권 130솔(10일, 16곳) / 부분권 70솔(1~2일, 권역별 4곳)","level":"☆☆☆ 정보","book":"Av. El Sol 103 COSITUC 사무소 또는 각 유적 입구. 현금·카드. 여권 필요"},"sections":[{"title":"왜 알아야 하나","paragraphs":["쿠스코 주변 유적 대부분은 개별 입장권을 팔지 않고 통합권으로만 들어간다. 삭사이와망, 켄코, 푸카푸카라, 탐보마차이(쿠스코 근교 4곳), 피삭, 오얀따이땀보, 친체로, 모라이(성스러운 계곡), 그리고 시내 박물관 몇 곳이 포함된다. 코리칸차와 대성당은 별도다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["부분권 1권(70솔)은 쿠스코 근교 4곳(삭사이와망 등), 3권(70솔)은 성스러운 계곡(피삭·오얀따이땀보·친체로·모라이).","삭사이와망만 가고 계곡 투어도 갈 거면 전체권(130솔)이 이득. 하나만 갈 거면 부분권.","마추픽추는 이 표와 무관하고 여행사 포함이다. 마라스 염전도 별도(10~20솔, 마을이 운영).","성스러운 계곡 투어 상품 가격에는 이 표가 포함되지 않는 것이 보통이다. 투어 신청 시 확인."]},{"title":"이야기","paragraphs":["통합권 수익은 쿠스코 지방정부 문화재 기금으로 간다. 유적마다 표 검사가 엄격해 여권과 함께 보여 주어야 하고, 한 유적은 한 번만 들어갈 수 있다. 첫날 도착해 시내 아르마스 광장을 걷다 Av. El Sol의 사무소에서 사 두면 D6 자유일정 계획이 편하다."],"bullets":[]}]},{"id":"lostcanyon","title":"잃어버린 협곡 (Cañón de los Perdidos)","meta":{"day":3,"city":"ica","mapQuery":"Cañón de los Perdidos, Ica, Peru","time":"5~6시간 (사막 차량 왕복 3~4시간 + 협곡 산책 1~1.5시간). 보통 08:00 출발 → 13:30 복귀","cost":"약 70~120솔/인 (4WD 차량·가이드), 입장료 약 10솔 별도","level":"★★☆ 오프로드 이동이 거칠고, 협곡 바닥까지 내려가는 짧은 트레킹. 운동화 필수","book":"전날(D2) 저녁 캡틴 통해 신청. 4~6인 차량 단위라 인원이 모이면 저렴"},"sections":[{"title":"왜 갈까","paragraphs":["이카 남쒹 사막 한복판에 숨어 있어 2011년까지 외부에 거의 알려지지 않았던 협곡이다. 미국 그랜드캐니언의 축소판 같은 붉은 절벽이 사막 바닥에 갑자기 갈라져 있고, 바닥에는 마른 강줄기가 굽이친다. 나스카 경비행기가 빠진 자리에 여행사가 넣은 대안으로, 사진이 극적이고 사람이 적다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 가격(2026.9.1 기준): 06:30~14:30, 2~3인 60달러 · 4~6인 45 · 7~11인 36 · 12~16인 25. 차량·영어 가이드·도시락 포함. 캡틴이 2~3일 전 신청을 받는다.","협곡까지 가는 길이 절반은 비포장 사막이다. 멀미약, 물 1L, 모자, 선글라스, 버프.","그늘이 거의 없다. 선크림을 출발 전에 바르고 중간에 한 번 더.","전망대에서 사진, 그다음 바닥으로 내려가는 길은 경사가 있어 샌들은 위험.","화장실은 출발지와 도착 매점에만. 물은 매점에서도 산다.","바예스타와 같은 날 병행은 시간상 어렵다. 둘 중 하나."]},{"title":"이야기","paragraphs":["협곡을 만든 것은 물이다. 비가 오지 않는 사막이지만 안데스에서 내려온 강이 수천 년에 걸쳐 퇴적층을 깎았고, 엘니뇨 해에만 물이 흐른다. 절벽 층마다 색이 다른 것은 각 시대의 홍수가 실어 온 흙이 다르기 때문이다. 바닥에서 위를 보면 층리가 시간표처럼 읽힌다."],"bullets":[]}]},{"id":"ballestas","title":"바예스타 섬 + 파라카스 보호구역","meta":{"day":3,"city":"ica","mapQuery":"Islas Ballestas, Paracas, Peru","time":"06:30 출발 → 13:00 복귀 (이카→파라카스 1시간 15분, 보트 2시간, 보호구역 1~2시간)","cost":"보트 약 40~60솔 + 선착장·입장세 약 16~20솔. 보호구역 추가 시 +11솔 입장 + 투어 20~30솔","level":"★☆☆ 보트에 앉아 있으면 됨. 멀미 약간","book":"전날 저녁 캡틴 통해. 보트는 08:00·10:00 출발이 보통"},"sections":[{"title":"왜 갈까","paragraphs":["가난한 자의 갈라파고스라는 별명이 붙은 섬이다. 보트로 섬을 돌며 바다사자 수백 마리, 훔볼트 펭귄, 가마우지·부비·펠리컨이 절벽을 덮은 광경을 본다. 배에서 내리지는 않는다. 가는 길에 언덕에 새겨진 촛대 모양 지상화 칸델라브로(높이 180m)를 지나는데, 기원과 목적을 아무도 모른다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 가격(2026.9.1 기준): 차량+입장권+보트, 2~3인 45달러 · 4인 이상 30. 최소 2인. 배에서 나스카식 지상화(칸델라브로)를 본다. 나스카 경비행기는 2026년 8월 사고로 여행사 추천에서 제외.","바람이 차고 물이 튄다. 바람막이 필수. 새 배설물이 떨어질 수 있어 모자.","카메라 줌이 있으면 좋다. 폰은 3배 정도면 충분.","파라카스 국립보호구역은 붉은 해변(플라야 로하)과 대성당 바위 전망대가 하이라이트. 보트 뒤 2시간 미니버스 투어로 붙일 수 있다.","파라카스 항구 마을에서 점심(세비체가 신선)을 먹고 이카로 돌아와 16:00 리마행 버스."]},{"title":"이야기","paragraphs":["19세기 이 섬의 구아노(바닷새 배설물)는 두께 50m로 쌓여 있었고, 페루 정부 수입의 대부분이 이 새똥 수출이었다. 지금도 수년마다 한 번 정부가 구아노를 채취한다. 파라카스라는 이름은 케추아어로 모래비라는 뜻으로, 오후에 부는 강한 바람을 가리킨다. 오전 투어를 권하는 이유다."],"bullets":[]}]},{"id":"limacentro","title":"리마 구시가지 도보 코스","meta":{"day":1,"city":"lima","mapQuery":"Plaza Mayor de Lima","time":"3~4시간 (미라플로레스에서 이동 편도 40분 추가)","cost":"산프란시스코 수도원 20솔(가이드 포함), 대성당 20솔, 교통 택시 25~35솔 또는 메트로폴리타노 버스 3.2솔","level":"★☆☆ 평지 걷기","book":"불필요. 산프란시스코 영어 가이드는 정시마다 출발"},"sections":[{"title":"왜 갈까","paragraphs":["1535년 피사로가 세운 도시의 원점이다. 아르마스 광장(플라사 마요르)을 둘러싼 대통령궁·대성당·시청은 유네스코 세계유산이고, 산프란시스코 수도원 지하의 카타콤(유골 2만 5천 구)은 리마에서 가장 기억에 남는 장소다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["추천 순서: 산프란시스코 수도원(카타콤·도서관) → 아르마스 광장 → 대성당(피사로의 관) → 산토도밍고 → 히론 데 라 우니온 보행자 거리 → 산마르틴 광장.","대통령궁 근위병 교대식은 정오. 광장이 시위로 통제되는 날이 있다.","광장 남쪽·동쒹 몇 블록만 벗어나면 치안이 급격히 나빠진다. 지도의 관광 구역 밖으로 가지 않는다.","점심은 구시가지의 전통 식당(엘 코르다노 등 100년 된 카페)에서 부티파라 샌드위치.","오후에 미라플로레스로 돌아와 해안 절벽 산책과 일몰. 저녁 분수쇼로 이어진다."]},{"title":"이야기","paragraphs":["피사로의 유해는 대성당 첫 예배당에 있다. 1977년까지 다른 시신이 피사로로 전시되다가 진짜 유골이 지하실에서 발견됐다. 두개골에 칼자국이 있어 1541년 암살 기록과 일치했다."],"bullets":[]}]},{"id":"barranco","title":"미라플로레스·바랑코 산책","meta":{"day":1,"city":"lima","mapQuery":"Puente de los Suspiros, Barranco, Lima","time":"반나절","cost":"무료 (우아카 푸야나 15솔, 야간 투어 약 17솔)","level":"★☆☆","book":"불필요"},"sections":[{"title":"왜 갈까","paragraphs":["호텔에서 걸어서 갈 수 있는 리마의 얼굴이다. 미라플로레스 해안 절벽의 사랑의 공원(연인 조각 엘 베소), 패러글라이더가 뜨는 절벽, 절벽에 박힌 쇼핑몰 라르코마르, 그리고 택시 10분 거리 바랑코의 벽화 골목과 한숨의 다리."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["코스: 호텔 → 케네디 공원(고양이 공원) → 라르코마르 → 사랑의 공원 → 절벽길 남쪽으로 걸어 바랑코까지 40분(또는 택시) → 한숨의 다리 → 바하다 데 로스 바뇨스 → 해변.","우아카 푸야나는 미라플로레스 한복판의 선잉카 피라미드. 가이드 투어만 가능, 40분. 부지 안 레스토랑은 야경이 좋다.","살라사르 공원의 패딩턴 동상은 라르코마르 옆.","일몰은 18:15 전후. 절벽 위 공원에서 보고 라르코마르에서 저녁.","바랑코 밤 골목은 소지품 주의. 메인 광장 주변은 안전."]},{"title":"이야기","paragraphs":["한숨의 다리는 1876년에 세워진 목조 다리로, 숨을 참고 한 번에 건너면 소원이 이뤄진다는 말이 있다. 다리 아래 바하다 데 로스 바뇨스는 어부들이 바다로 내려가던 길이었고, 지금은 카페와 벽화 거리다. 바랑코는 리마 예술가와 음악가의 동네로, 가수 차부카 그란다의 노래 한숨의 다리가 이 다리에서 나왔다."],"bullets":[]}]},{"id":"magicwater","title":"분수쇼 (Circuito Mágico del Agua)","meta":{"day":1,"city":"lima","mapQuery":"Parque de la Reserva, Lima","time":"1.5~2시간 (19:15·20:15·21:30 레이저 쇼, 여행사 안내 기준 저녁 7·8·9시)","cost":"입장 4~7솔","level":"★☆☆","book":"불필요. 화~일 15:00~22:30, 월요일 휴무(여행사 자료는 월~일로 표기, 현장 확인)"},"sections":[{"title":"왜 갈까","paragraphs":["공원 하나에 13개의 분수가 있고 그중 터널 분수는 안을 걸어서 지나가고, 어린이 분수는 뛰어들 수 있다. 밤 레이저·음악 쇼는 남미 최대 규모라는 기네스 기록이 있다. 입장료가 커피 한 잔 값이라 첫날 저녁 시차 적응용으로 최적이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["미라플로레스에서 택시·Uber 20~30분(15~25솔). 돌아올 때 공원 앞에서 Uber.","분수에 들어갈 생각이면 갈아입을 옷이나 우비. 9월 리마 밤은 15도라 젖으면 춥다.","마술 분수 쇼는 정각에 시작하고 15분. 자리는 30분 전에."]},{"title":"이야기","paragraphs":["공원은 1929년 만들어졌다가 방치되어 2007년 재개장했다. 분수를 만든 것은 리마 시가 상수도 회사와 손잡은 사업이었고, 개장 당시 물 낭비라는 비판을 받았으나 지금은 리마 시민이 가장 사랑하는 공원이다."],"bullets":[]}]},{"id":"larco","title":"라르코 박물관 (Museo Larco)","meta":{"day":1,"city":"lima","mapQuery":"Museo Larco, Av. Bolívar 1515, Pueblo Libre, Lima","time":"2~3시간","cost":"약 40솔 (09:00~19:00 연중무휴)","level":"★☆☆","book":"불필요"},"sections":[{"title":"왜 갈까","paragraphs":["페루 5천 년 문명을 한 건물에서 보는 가장 좋은 방법이다. 모체·나스카·파라카스·잉카의 토기, 황금 장신구, 직물이 깨끗하게 전시되어 있고, 창고까지 개방해 유물 4만 점을 선반째로 볼 수 있다. 부속 에로틱 토기관은 이 박물관의 유명한 별관이다. 정원 안 카페는 리마에서 가장 아름다운 점심 장소로 꼽힌다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["미라플로레스에서 택시 25~35분(20~30솔). 구시가지와 묶으면 이동이 효율적이다.","한국어 오디오 가이드는 없지만 영어 설명이 충분하다. 앱 읽을거리의 안데스 문명 연표를 먼저 읽으면 두 배로 보인다.","저녁 19:00까지 열어 일몰 뒤 방문도 가능. 카페 저녁은 예약 권장."]},{"title":"이야기","paragraphs":["1926년 라파엘 라르코 오일레가 25세에 세운 개인 박물관이다. 그는 모체 문명의 연대를 토기 양식으로 정리해 페루 고고학의 기초를 놓았다. 모체 토기의 초상 항아리는 개인의 얼굴을 사실적으로 빚은 것으로, 2천 년 전 페루 사람들의 얼굴을 눈앞에서 본다."],"bullets":[]}]},{"id":"vinicunca","title":"비니쿤카 (무지개산)","meta":{"day":6,"city":"cusco","mapQuery":"Vinicunca Rainbow Mountain, Peru","time":"04:00~05:00 출발 → 17:00~18:00 복귀. 차량 3시간 + 트레킹 왕복 3시간 + 아침·점심","cost":"투어 약 60~100솔(차량·아침·점심 포함) + 입장료 25~30솔(마을 징수) + 말 편도 80~100솔(선택)","level":"★★★ 최고점 5,036m. 거리(왕복 7km)보다 고도가 문제","book":"전날(D5) 저녁까지 캡틴 통해. D4 밤 컨디션을 보고 결정"},"sections":[{"title":"왜 갈까","paragraphs":["빙하가 녹아 2015년경 드러난 줄무늬 산이다. 붉은색(산화철), 노란색(황화철), 녹색(녹니석), 흰색(석회암·석영) 지층이 세로로 서 있다. 정상 전망대에서 보는 산은 사진과 같지만, 뒤로 돌면 아우상가테 설산(6,384m)과 붉은 계곡이 펼쳐진다. 이번 여행의 최고점이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 가격(2026.9.1 기준): 60달러(차량+아침+점심+입장료). 말 또는 오토바이 왕복은 현장에서 100솔(약 30달러) 별도, 현금.","출발 전날 밤 잠을 충분히. 새벽 4시 픽업, 차에서 2시간 잔다.","아침은 투어 식당(피툰마르카 마을)에서 빵·죽. 트레킹 출발 주차장이 4,600m다.","말은 주차장에서 정상 직전(약 4,900m)까지. 거기서 정상 계단 15~20분은 걸어야 한다. 하산은 도보.","복장 4겹(내복·플리스·패딩·바람막이), 비니·장갑, 등산화. 정상은 바람에 체감 영하. 낮에는 덥다.","물 1.5L, 코카 캔디, 초콜릿. 산소 캔 하나 사 가면 심리적 안정.","고산 증상(심한 두통·구토·어지럼)이 있으면 무조건 내려온다. 정상은 다음에.","대안: 팔코요(Palccoyo)는 트레킹 40분, 4,900m, 무지개산 3개. 사람 적고 쉬움. 투어사에 물어볼 것."]},{"title":"이야기","paragraphs":["비니쿤카는 케추아어로 색깔의 산 또는 일곱 색의 산이다. 2016년 사진이 퍼진 뒤 하루 1천 명이 몰려들었고, 마을 두 곳(피툰마르카·쿠시팜파)이 서로 다른 길로 관광객을 받으며 입장료 분쟁을 했다. 2018년에는 산 아래 광산 채굴권 논란이 있었다. 지금 걷는 길은 마을이 관리하고 말은 마을 사람의 수입이다."],"bullets":[]}]},{"id":"sacredvalley","title":"성스러운 계곡 (마라스·모라이·오얀따이땀보·친체로)","meta":{"day":6,"city":"cusco","mapQuery":"Salineras de Maras, Peru","time":"종일 08:00~18:30 (반일 코스도 있음)","cost":"투어 약 50~90솔(차량·가이드, 점심 별도) + 통합권 부분권 70솔(모라이·오얀따이땀보·친체로·피삭) + 마라스 염전 10~20솔","level":"★☆☆ 차로 이동, 각 유적 30분~1시간 걷기. 고도 2,900~3,700m로 쿠스코보다 낮은 곳이 많음","book":"캡틴 통해 전날. 비니쿤카의 대안으로 여행사 추천"},"sections":[{"title":"왜 갈까","paragraphs":["우루밤바 강이 만든 계곡은 잉카의 곡창이었고, 마추픽추로 가는 길이다. D5에 오얀따이땀보 역을 스쳐 지나가지만 유적은 보지 못한다. 이 투어는 그것을 채운다. 마라스 염전은 산비탈에 3천 개의 소금 밭이 계단처럼 걸려 있고, 모라이는 원형 계단식 밭이 지름 30m 구덩이를 이룬다. 오얀따이땀보 요새는 1536년 잉카가 스페인을 이긴 유일한 전투 현장이다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사의 \"쿠스코 근교(성계) 투어\"(2026.9.1 기준): 차량+영어 가이드+입장료, 모라이+살리네라스(마라스 소금 염전). 4인 70달러 · 7인 65 · 12인 60, 최소 4인. 고도는 3,000~3,500m로 쿠스코와 비슷하다. 쿠스코 도착 전에 캡틴이 인원을 확인한다.","코스 예: 친체로(일요 시장·직조 시연) → 모라이 → 마라스 염전 → 우루밤바 점심 → 오얀따이땀보 → 쿠스코. 피삭을 넣으면 하루가 빠듯하다.","마라스 염전은 2019년부터 밭 안으로 못 들어가고 전망대에서 본다. 소금은 마을 상점에서 5솔.","친체로는 3,760m로 쿠스코보다 높다. 잠깐이니 문제없다.","점심은 우루밤바 뷔페(25~40솔)가 보통. 알파카 요리 있음.","비니쿤카보다 몸이 훨씬 편하고, 사진·역사 밀도는 더 높다. 고산 적응이 걱정되면 이쪽."]},{"title":"이야기","paragraphs":["마라스 염전은 잉카 이전부터 쓰였다. 산속 온천수가 소금기를 품고 흘러나와 밭에 채우면 햇빛에 증발해 소금이 남는다. 밭은 마을 가족들의 소유로 대를 이어 내려온다. 모라이의 원형 밭은 단마다 기온이 달라 잉카의 농업 실험장이었다는 설이 유력하다. 맨 아래와 맨 위의 기온 차가 5도에 이른다."],"bullets":[]}]},{"id":"sacsayhuaman","title":"삭사이와망과 쿠스코 근교 4유적","meta":{"day":4,"city":"cusco","mapQuery":"Sacsayhuamán, Cusco","time":"2~3시간 (택시 10분 또는 도보 40분 오르막)","cost":"통합권 부분권 70솔 (삭사이와망·켄코·푸카푸카라·탐보마차이) 또는 전체권. 택시 왕복 20~30솔","level":"★☆☆ 유적 내부는 평지, 접근이 오르막","book":"불필요"},"sections":[{"title":"왜 갈까","paragraphs":["쿠스코를 내려다보는 언덕 위 잉카 요새다. 무게 100톤이 넘는 돌을 지그재그 3단 성벽으로 쌓았고, 가장 큰 돌은 높이 8.5m다. 1536년 망코 잉카의 반란군과 스페인군이 여기서 격전을 벌였다. 도착 첫날(D4) 오후 고산 적응 겸 가볍게 다녀오기에 좋고, D6 오전 반나절 코스로도 좋다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["이름을 발음하면 영어의 sexy woman과 비슷해 가이드마다 이 농담을 한다.","언덕 위라 쿠스코 시내(3,400m)보다 300m 높다. 첫날이면 천천히.","켄코(제단 동굴), 푸카푸카라(붉은 요새), 탐보마차이(잉카의 목욕탕)는 같은 길에 있어 택시로 이어서 2시간.","유적 옆 하얀 예수상(크리스토 블랑코)에서 쿠스코 전경.","라마·알파카가 잔디를 먹고 있으면 촐리타 아주머니가 사진값 2~3솔을 요구한다."]},{"title":"이야기","paragraphs":["스페인은 이 성벽의 돌을 뜯어 성당을 지었다. 남은 것은 너무 커서 옮길 수 없던 돌들이다. 매년 6월 24일 인티 라이미(태양 축제)가 이 광장에서 열려 잉카 황제 역이 태양신에게 제사를 올린다. 잉카는 쿠스코를 퓨마 모양으로 설계했고 삭사이와망이 머리, 지그재그 성벽이 이빨이다."],"bullets":[]}]},{"id":"coricancha","title":"코리칸차·산블라스·산페드로 시장 (시내 반나절)","meta":{"day":6,"city":"cusco","mapQuery":"Qorikancha, Cusco","time":"3~4시간","cost":"코리칸차 15솔(통합권 미포함), 대성당 40솔(선택), 나머지 무료","level":"★☆☆ 시내 도보, 산블라스는 오르막","book":"불필요"},"sections":[{"title":"왜 갈까","paragraphs":["비니쿤카를 안 가는 날 오전 코스이자, D4·D5 저녁 자투리 시간에도 나눠 갈 수 있다. 코리칸차는 황금으로 덮였던 태양의 신전 위에 성당을 얹은 곳으로 잉카 곡선 석벽이 남아 있다. 산블라스는 언덕 위 예술가 골목, 산페드로 시장은 과일 주스와 로컬 점심."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["코리칸차 입장료 6달러(약 20솔). 월~토 08:30~17:30, 일 14:00~17:00 (여행사 안내).","12각돌은 하툰 루미욕 거리(대성당 뒤). 경찰이 지키고 있어 손대지 말 것. 오전 이른 시간이 사진 찍기 좋다.","산페드로 시장: 과일 주스 5솔(과일 두 종 섞어 달라고), 점심 세트 8~12솔. 소매치기 주의, 가방 앞으로. 코카잎·코카 캔디·알파카 제품 가장 저렴.","산블라스 광장 카페에서 커피, 골목 공방에서 기념품. 광장 교회 안 설교단은 나무 조각의 정점.","대성당은 최후의 만찬 기니피그 그림 때문에 들어갈 가치가 있다(40솔). 사진 금지."]},{"title":"이야기","paragraphs":["코리칸차 벽에 붙어 있던 황금판 700장은 아타우알파의 몸값으로 스페인에 뜯겨 녹여졌다. 1950년 지진으로 위에 지은 산토도밍고 성당이 무너졸 때 잉카 벽은 멀쩡했고, 그 뒤로 성당을 잉카 벽이 보이게 복원했다. 안뜰에 서면 두 문명이 한 벽에 붙어 있다."],"bullets":[]}]},{"id":"uros","title":"우로스 갈대섬","meta":{"day":7,"city":"puno","mapQuery":"Islas Uros, Puno","time":"반나절 2.5~3시간. 도착 당일 14:30 출발 편이 있음","cost":"약 30~40솔 (보트·섬 입장·가이드). 갈대배 시승 10솔 별도","level":"★☆☆","book":"캡틴 통해 당일 또는 전날. 호텔이 항구 옆이라 이동 10분"},"sections":[{"title":"왜 갈까","paragraphs":["토토라 갈대를 엮어 띄운 인공 섬 위에 사는 우로족을 만난다. 섬을 밟으면 스펀지처럼 푹신하고, 갈대 집·갈대 배·갈대 간식(밑동의 흰 부분)을 보여 준다. 푸노 1박이라 시간이 없어 반나절이 딱 맞다. 우리 호텔은 호숫가라 배 타기까지 가장 가깝다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 가격(2026.9.1 기준): 차량+입장료+보트+영어 가이드 30달러, 최소 4인. 캡틴이 신청을 받는다.","14:30 오후 편은 빛이 좋고 사람이 적다. 오전 편은 07:00.","섬에 내리면 가족이 노래·수공예 판매를 한다. 살 생각이 없으면 웃으며 그라시아스. 소액 기념품 10~20솔은 이들의 주 수입.","갈대배 시승(10솔)은 옆 섬까지 10분. 탈 만하다.","호수 위는 자외선 반사가 강하고 바람이 차다. 바람막이·선글라스·모자.","타킬레 섬까지 가는 종일 투어는 이번 일정(D7 오후 도착, D8 07:00 출발)에는 불가능하다."]},{"title":"이야기","paragraphs":["우로족은 원래 호수 주변에 살던 사람들이었으나 잉카에 밀려 물 위로 피했다. 우로어는 사멸했고 지금은 아이마라어를 쓴다. 섬은 갈대 뿌리 덩어리(키유)를 묶어 띄우고 그 위에 마른 갈대를 40cm 두께로 깐다. 아래층이 썩으면 위에 덧대고, 섬 전체를 30년마다 새로 만든다. 섬끼리 사이가 나빠지면 밧줄을 끊어 섬을 반으로 나눠 떠난다는 이야기가 유명하다."],"bullets":[]}]},{"id":"sillustani","title":"시유스타니 장묘탑 (Sillustani)","meta":{"day":7,"city":"puno","mapQuery":"Sillustani, Puno","time":"3시간 (오후 14:30 출발 투어)","cost":"투어 40~50솔 + 입장 15솔","level":"★☆☆ 완만한 언덕 20분","book":"캡틴 통해. 우로스와 같은 오후에는 하나만 가능"},"sections":[{"title":"왜 갈까","paragraphs":["푸노 외곽 우마요 호숫가 언덕에 선잉카 콜라족과 잉카가 세운 원통형 석탑 무덤(추야)이 서 있다. 높이 12m, 위가 더 넓은 독특한 형태로 귀족 가족을 미라로 안치했다. 호수 풍경과 함께 보는 석탑은 마추픽추와 결이 다른 사진이 된다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["우로스와 시유스타니 중 하나를 골라야 한다. 사람과 문화가 궁금하면 우로스, 풍경과 고고학이면 시유스타니.","3,900m로 푸노보다 높다. 언덕은 천천히.","돌아오는 길에 현지 농가에 들러 감자와 치즈, 기니피그를 보여 준다."]},{"title":"이야기","paragraphs":["석탑 중 하나는 도마뱀이 새겨져 있어 도마뱀 탑이라 불린다. 콜라족은 티티카카 북쪽을 지배했고 잉카에 정복된 뒤에도 장묘 전통을 이어 갔다. 탑 문은 동쪽을 향해 있어 매일 첫 햇빛이 죽은 자를 비춘다."],"bullets":[]}]},{"id":"witches","title":"마녀시장·사가르나가 거리와 케이블카 한 바퀴","meta":{"day":8,"city":"lapaz","mapQuery":"Mercado de las Brujas, La Paz","time":"반나절 (호텔 소나 수르에서 시내까지 케이블카 30~40분)","cost":"케이블카 1구간 3Bs, 환승 시 구간당 추가. 시장 무료","book":"불필요","level":"★☆☆ 시내는 언덕. 3,600~3,700m"},"sections":[{"title":"왜 갈까","paragraphs":["도착일 오후 자유시간의 정석 코스다. 소나 수르 호텔에서 그린라인(Irpavi 역)을 타고 시내로 올라가며 협곡 도시 전경을 보고, 마녀시장에서 야마 태아와 부적을 구경하고, 산프란시스코 광장을 지나 해 진 뒤 레드라인으로 야경을 본다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["케이블카 노선: 호텔 → 그린라인 Irpavi → 옐로우로 환승(Libertador) → 소포카치(Sopocachi) 또는 시내까지 40분. 마녀시장은 산프란시스코 광장 뒤 리나레스·사가르나가 거리.","사가르나가 거리는 알파카 제품·기념품이 가장 싼 곳. 흥정 가능.","레드라인은 센트랄 역에서 엘알토까지 올라가며 도시 전체 야경. 엘알토 역에서 내리지 말고 바로 왕복(6Bs). 밤 엘알토는 치안이 나쁘다.","저녁 시내에서 먹고 돌아올 때는 Uber(호텔까지 30~40Bs). 케이블카는 21~22시 막차.","마녀시장 상인 촬영은 허락을 받는다. 물건을 사면 대개 좋아한다."]},{"title":"이야기","paragraphs":["마녀시장의 정식 이름은 메르카도 데 라스 브루하스, 상인은 대부분 아이마라 여성이다. 야마 태아(수유)는 새집 기초에 묻는 제물이고, 사탕·미니어처·색 실을 조합한 메사는 야티리(주술사)가 태우는 기도문이다. 8월은 파차마마의 달이라 매출이 가장 높다."],"bullets":[]}]},{"id":"cholitas","title":"촐리타 레슬링 (엘알토)","meta":{"day":9,"city":"lapaz","mapQuery":"Multifuncional de la Ceja, El Alto, La Paz","time":"저녁 3~4시간 (목·일요일 공연. 우리 D9는 화요일이라 해당 없음 → D8 월요일도 불가)","cost":"투어 약 100~150Bs (왕복 차량·입장·간식)","level":"★☆☆","book":"요일 확인 필수. 이번 일정(월·화)에는 정기 공연이 없다. 캡틴에게 특별 공연 여부만 확인"},"sections":[{"title":"왜 갈까","paragraphs":["전통 폴레라 치마와 중절모를 쓴 여성 레슬러들이 링에서 뒹구는 쇼다. 원래 가정폭력 피해 여성들의 자기방어 모임에서 시작되어 지금은 엘알토의 명물이 됐다. 관광객은 링 옆 좌석에 앉아 팝콘을 먹으며 야유와 환호를 보낸다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 선택투어 목록에는 \"촐리타 쇼 차량+입장료 30달러, 최소 4인\"으로 올라 있다(9일차 오후). 실제 공연이 있는 요일인지 캡틴에게 확인.","정기 공연은 일요일 오후와 목요일 저녁. 우리 라파즈 체류(9/28 월, 9/29 화)에는 겹치지 않는다. 대안은 케이블카 야경이나 소나 수르 저녁.","혹시 특별 공연이 있으면 반드시 투어 차량으로. 엘알토(4,100m) 밤 개별 이동은 위험."]},{"title":"이야기","paragraphs":["촐리타 레슬러들은 링 밖에서는 시장 상인이고 어머니다. 2010년대 다큐멘터리와 잡지에 소개되며 세계적으로 알려졸고, 볼리비아 여성의 힘을 상징하는 문화 아이콘이 됐다."],"bullets":[]}]},{"id":"tiwanaku","title":"티와나쿠 유적","meta":{"day":9,"city":"lapaz","mapQuery":"Tiwanaku, Bolivia","time":"반일 5~6시간 (차 1.5시간 편도). 시티투어(09:00~13:30) 뒤 오후에는 시간 부족","cost":"입장 100Bs(외국인) + 투어 150~250Bs 또는 택시 대여","level":"★☆☆","book":"시티투어와 같은 날은 어렵다. 캡틴에게 D9 오후 반일 투어 가능 여부 문의"},"sections":[{"title":"왜 갈까","paragraphs":["잉카보다 500년 앞선 티와나쿠 문명(500~1000년)의 수도다. 태양의 문(하나의 돌로 만든 문, 상단에 비라코차 신 조각), 반지하 신전의 얼굴 조각들, 거석 아카파나 피라미드가 있다. 잉카는 자기 창조신화와 석조 기술을 이 도시에서 가져왔다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["시티투어가 13:30에 끝나면 14:00 출발해 16:00 도착, 17:30 폐장. 촉박하다. 캡틴이 반일 상품을 잡아 주면 가능.","박물관 두 곳(석조·토기)이 입장에 포함된다. 3,850m 평원이라 바람이 세고 춥다.","안 가도 아쉬움을 덜 방법: 라파즈 시내 국립고고학박물관(무리요 광장 근처)에 티와나쿠 유물이 있다."]},{"title":"이야기","paragraphs":["1500년 전 이곳은 인구 수만의 도시였고 티티카카 호수가 바로 옆까지 와 있었다. 호수가 물러가고 기후가 건조해지자 도시는 버려졌다. 스페인은 돌을 뜯어 교회와 철도 침목을 만들었고, 태양의 문은 20세기까지 반쪽으로 깨진 채 서 있었다."],"bullets":[]}]},{"id":"atacamavillage","title":"산페드로 마을 3시간 (카라콜레스 거리)","meta":{"day":12,"city":"atacama","mapQuery":"Calle Caracoles, San Pedro de Atacama","time":"12:00~15:00 자유시간","cost":"점심 CLP 10,000~15,000. 운석 박물관 CLP 5,000 전후","level":"☆☆☆","book":"불필요. 달의 계곡·석호 투어는 시간상 불가"},"sections":[{"title":"왜 갈까","paragraphs":["3일간 볼리비아 고원의 흙과 소금에서 내려와 처음 만나는 문명이다. 흙벽돌 골목, 카페, 아이스크림, 와이파이. 카라콜레스 거리 200m가 마을의 전부다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["국경 통과 후 12시 도착이면 점심이 먼저. 카라콜레스의 식당은 관광지 물가(칠레 페소 필요, 카드 대부분 가능). 환전소 두 곳, ATM은 수수료 높음.","광장의 산페드로 교회(선인장 나무 천장), 운석 박물관(작지만 알차다), 거리 끝 리칸카부르 화산 전망.","달의 계곡 일몰 투어는 17:30 이후라 불가. 대신 마을 남쪽 끝에서 사막 지형을 잠깐 볼 수 있다.","기념품: 구리 제품, 리카나타이 직물, 리카레 소금. 기내 짐 7~10kg 제한 기억.","15:00 칼라마 공항으로 출발. 1시간 30분."]},{"title":"이야기","paragraphs":["산페드로는 잉카 도로의 정거장이자 아타카메뇨(리칸 안타이) 사람들의 오아시스였다. 1950년대 벨기에 신부 구스타보 르 페주가 고고학 박물관을 세워 마을을 알렸고, 지금은 칠레 최대 관광 마을이다. 마을 전체가 흙색인 것은 건축 규제 때문이다."],"bullets":[]}]},{"id":"santiagocentro","title":"산티아고 역사 중심가 도보","meta":{"day":13,"city":"santiago","mapQuery":"Plaza de Armas, Santiago","time":"3~4시간","cost":"무료 (라 모네다 내부는 사전 예약 무료 투어, 산타루시아 무료, 메르카도 센트랄 식사 CLP 15,000~25,000)","level":"★☆☆ 지하철 1호선으로 프로비덴시아에서 15분","book":"불필요"},"sections":[{"title":"왜 갈까","paragraphs":["마지막 날 반나절로 칠레의 근현대사를 걷는 코스다. 아르마스 광장(대성당·중앙우체국) → 라 모네다 대통령궁(1973년 폭격 현장) → 산타루시아 언덕(도시 창건지, 계단 전망) → 메르카도 센트랄(해산물 점심)."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["지하철: 프로비덴시아 Pedro de Valdivia 역 → 1호선 → Universidad de Chile 또는 Plaza de Armas 역. bip! 카드 CLP 1,550 + 충전. 출퇴근 시간 소매치기 주의.","아르마스 광장 소매치기와 사기(가짜 경찰) 주의. 폰을 손에 들고 걷지 않는다.","메르카도 센트랄 안쪽 큰 식당은 관광객 가격이고 호객이 세다. 가장자리 작은 식당이 싸고 맛있다. 파일라 마리나·성게·대게.","산타루시아 언덕은 무료, 입구에서 방명록. 계단 많음. 정상에서 안데스 조망.","라 모네다 앞 시위가 있으면 우회. 지하 문화센터(GAM 아님, Centro Cultural La Moneda)는 전시가 좋고 무료."]},{"title":"이야기","paragraphs":["1541년 발디비아가 우엘렌(산타루시아) 언덕 옆에 도시를 세웠고, 아르마스 광장은 그때 그린 격자의 중심이다. 라 모네다는 원래 조폐국이었다가 1846년부터 대통령궁이 됐다. 1973년 9월 11일 아옌데 대통령은 이 건물 안에서 마지막 라디오 연설을 하고 죽었다. 지금은 매일 격일로 근위병 교대식이 열린다."],"bullets":[]}]},{"id":"sancristobal","title":"산크리스토발 언덕·베야비스타·라 차스코나","meta":{"day":13,"city":"santiago","mapQuery":"Cerro San Cristóbal, Santiago","time":"3시간","cost":"푸니쿨라 왕복 CLP 3,000~5,000, 케이블카 결합권 CLP 9,000 전후. 라 차스코나 CLP 10,000","level":"★☆☆","book":"라 차스코나는 화~일 10:00~18:00, 월 휴무(10/3 토요일이라 가능)"},"sections":[{"title":"왜 갈까","paragraphs":["산티아고 전경과 안데스를 한눈에 보는 곳이다. 베야비스타의 푸니쿨라 역(1925년 개통)에서 올라가면 정상(880m)에 성모상이 서 있고, 맑은 날 동쪽으로 설산이 벽처럼 펼쳐진다. 언덕 아래 베야비스타는 벽화·식당 거리, 그 골목 안이 네루다의 집 라 차스코나다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["오전에 가면 안데스가 선명하고 오후엔 스모그가 끼기 쉽다. 10월 초는 비 온 뒤 가장 맑은 편.","푸니쿨라로 올라가 케이블카로 프로비덴시아 쪽(오아시스 역)으로 내려오면 호텔까지 걸어갈 수 있다. 결합권 이용.","정상에서 모테 콘 우에시요 한 잔(CLP 2,000). 칠레 여름 음료.","라 차스코나는 오디오 가이드로 40분. 사진 촬영 금지 구역 있음.","베야비스타 점심: 파티오 베야비스타 단지 또는 콘스티투시온 거리 식당. 밤 골목은 소지품 주의."]},{"title":"이야기","paragraphs":["산크리스토발 정상의 성모상은 1908년 프랑스에서 만들어 왔고 높이 14m다. 1987년 교황 요한 바오로 2세가 여기서 미사를 올렸다. 언덕 전체가 메트로폴리탄 공원으로 뉴욕 센트럴파크의 두 배 넓이다. 라 차스코나는 네루다가 마틸데를 위해 지은 집으로, 1973년 쿠데타 직후 군이 침수시켰지만 마틸데가 그곳에서 장례를 치렀다."],"bullets":[]}]},{"id":"conchaytoro","title":"콘차 이 토로 와이너리 투어","meta":{"day":13,"city":"santiago","mapQuery":"Viña Concha y Toro, Pirque, Chile","time":"총 5시간 (이동 편도 1시간~1시간 20분 + 투어 1시간 15분 + 시음·매장)","cost":"전통 투어 약 CLP 35,000~45,000(3종 시음 포함, 시음 잔 기념), 교통 지하철 4호선 Las Mercedes 역 + 택시/우버 CLP 8,000 또는 프로비덴시아에서 우버 편도 CLP 25,000~35,000","level":"★☆☆ 야외 정원 걷기","book":"공식 사이트(conchaytoro.com) 온라인 예약 필수. 영어 투어 10:00·11:30 등 시간대 선택. 여행사 추천"},"sections":[{"title":"왜 갈까","paragraphs":["한국 마트 와인 코너의 절반을 차지하는 카시예로 델 디아블로(악마의 저장소)의 본가다. 1883년 창업자의 저택과 정원, 포도밭, 그리고 악마 전설의 지하 저장소(소리·조명 연출)를 돌고 3종을 시음한다. 여행 마지막 날 오전 일정으로 알맞고, 공항 가기 전 여유 있게 돌아올 수 있다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["여행사 선택투어(2026.9.1 기준): 차량+입장권+영어 가이드 60달러. 캡틴을 통해 신청하면 이동 걱정이 없다. 짐은 호텔에 맡기고, 국제선 4시간 전(16:40) 공항으로 개별 이동.","16:30 호텔 출발을 지키려면 10:00 또는 11:30 투어. 09:00 호텔 출발.","지하철 1호선 → Tobalaba 환승 4호선 → Las Mercedes 종점(약 45분) → 택시 10분. 돌아올 때 와이너리 앞에서 우버.","와인 구매는 면세 가격 아니고 한국보다 조금 싼 정도. 위탁 짐에 넣으면 되지만 23kg과 파손 주의(에어캡 판매).","시음 3잔은 낮술로 충분하다. 점심을 와이너리 레스토랑(비쌈)이나 돌아와서 프로비덴시아에서.","시내 도보 코스와 병행하려면 와이너리 오전 → 시내 점심·산타루시아 오후 → 15:30 호텔. 산크리스토발까지는 무리."]},{"title":"이야기","paragraphs":["창업자 돈 멜초르는 일꾼들이 지하 저장소에서 와인을 훔치자 그 안에 악마가 산다는 소문을 퍼뜨렸다. 소문은 통했고, 그 이름이 브랜드가 됐다. 카시예로 델 디아블로는 지금 140개국에 팔리는 칠레 최대 와인 브랜드이고, 2004년 한·칠레 FTA 이후 한국이 주요 시장이 됐다. 카르메네르 품종은 이 회사 포도밭에서 1994년 재발견됐다."],"bullets":[]}]},{"id":"skycostanera","title":"스카이 코스타네라 전망대","meta":{"day":12,"city":"santiago","mapQuery":"Sky Costanera, Santiago","time":"1시간 (호텔에서 도보 10분)","cost":"약 CLP 15,000~18,000 (10:00~22:00, 일몰 시간대 인기)","level":"☆☆☆","book":"현장 구매 가능, 온라인 예약 시 시간 지정"},"sections":[{"title":"왜 갈까","paragraphs":["남미에서 가장 높은 건물(300m)의 61~62층 전망대다. 도착 밤(D12) 22시 호텔 체크인 후에는 닫혀 있지만, D13 아침 일찍(10:00) 올라가면 안데스와 도시를 360도로 보고 바로 옆 코스타네라 센터 몰에서 마지막 쇼핑(수퍼 Jumbo에서 와인·초콜릿·마누카 꿀 등 기념품)을 할 수 있다."],"bullets":[]},{"title":"알아두기","paragraphs":[],"bullets":["호텔에서 도보 10분. 몰 지하 Jumbo는 기념품 쇼핑에 가장 실용적이다(카르메네르 와인 CLP 5,000~10,000, 만하르, 견과류).","아침이 시야가 좋다. 오후는 역광과 스모그.","몰 안에 환전소·약국·푸드코트가 있어 마지막 날 잔여 페소 정리에 편하다."]},{"title":"이야기","paragraphs":["그란 토레 산티아고는 2014년 완공됐다. 2010년 대지진(8.8) 중에도 공사 중이던 이 건물은 흔들렸지만 손상이 없었고, 칠레 건축 기술의 자존심이 됐다. 전망대 유리 바닥은 없다. 겁 안 먹어도 된다."],"bullets":[]}]},{"id":"airport","title":"리마 공항 → 호텔 (9/20 밤, 픽업 없음)","meta":{"day":0,"city":"lima","mapQuery":"Casa Andina Standard Benavides, Av. Alfredo Benavides 271, Miraflores, Lima","time":"착륙 21:55 → 입국·짐 22:30~22:45 → 이동 35~45분 → 호텔 23:15~23:45","cost":"공식 택시 카운터 70~85솔(약 USD 21~25, 카드·솔·달러) / 우버 50~100솔(야간 할증) / 공항버스는 22:00 막차라 불가","level":"★☆☆ 절차만 알면 쉬움. 밤이라 공식 창구만 이용","book":"불필요. 호텔 유료 픽업(USD 25~35)은 아고다 메시지로 2~4시간 전 요청 가능"},"sections":[{"title":"순서 (새 터미널, 2025년 6월 개장)","paragraphs":[],"bullets":["1. 착륙 후 입국심사. 외국인 줄은 수동 심사만 가능(자동 게이트는 페루인 전용). 밤 10시대는 10~45분. 여권만 내고, 물으면 \"turismo, trece días, Casa Andina Miraflores\".","2. 전광판에서 수하물 벨트 확인 → 짐 수취. 세관은 신고할 것이 없으면 그냥 통과(신고서 없음, 무작위 검사).","3. 출구 2 또는 3으로 나오면 도착홀(1층). 경찰 상주, 환전소·ATM·택시 카운터·무료 와이파이가 있다.","4-A 공식 택시: 도착홀 안의 택시 카운터(Taxi 365 24시간, Taxi Green, Taxi Directo, CMV)에서 \"Miraflores, Avenida Benavides 271\"이라고 말하고 요금을 먼저 확인한다. 카운터에서 결제(카드 가능) → 영수증에 기사 이름·차량 번호 → 직원이 전용 주차장의 차까지 안내. 밤 요금 70~85솔.","4-B 우버: 도착홀 안에서 와이파이로 호출. 목적지 \"Casa Andina Standard Benavides\". 승차 위치는 앱이 지정하는 도착층 오른쪽 끝 주차장 E2(카비파이는 E1). 차량 번호를 확인하고 탄다. 야간 할증으로 50~100솔, 대기 5~15분.","5. 차로 35~45분(일요일 밤은 막히지 않음). 호텔 도착 23:15~23:45. 리셉션은 24시간이고, 아고다 예약번호(앱 문서 칸)와 여권을 낸다."]},{"title":"알아두기","paragraphs":[],"bullets":["밖에서 \"택시?\"라고 다가오는 사람은 전부 무시한다. 공식 택시는 카운터 안에서만 판다. 재킷·명찰을 달아도 밖에 있으면 비공식이다.","택시비는 도착홀 환전소에서 USD 40 정도만 솔로 바꾸거나, 카운터에서 카드로 낸다. 큰 환전은 다음 날 캡틴과.","카운터 택시가 우버보다 10~20솔 비싸지만 밤 첫날은 확실한 쪽을 고른다. 두 명이면 차이가 1인당 5천 원 수준이다.","공항 SIM 매장은 비싸고 밤에 닫힐 수 있다. 와이파이만 쓰고 유심은 다음 날.","아고다 예약 메시지로 \"late check-in around 23:30\" 한 줄 보내 두면 안심이다.","호텔 주소를 스페인어로 보여 줄 문장: \"A Casa Andina Standard Benavides, Avenida Alfredo Benavides 271, Miraflores, por favor.\""]},{"title":"이야기","paragraphs":["옛 터미널은 공항 앞 도로에서 택시 호객이 심해 리마 첫인상을 망치는 곳이었다. 2025년 새 터미널은 도착홀을 통제 구역으로 만들어 카운터 택시와 앱 택시만 전용 주차장에서 탈 수 있게 했다. 공항에서 미라플로레스까지는 카야오 항구 지역을 지나 해안 도로(코스타 베르데)로 내려가는 길이 밤에 가장 빠르고, 왼쪽으로 태평양이 검게 보이면 거의 도착한 것이다."],"bullets":[]}]}];</script>

out.push(d);
