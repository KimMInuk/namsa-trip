agraphs":["아타카마는 극지방을 빼면 지구에서 가장 건조한 사막이다. 원인은 이중 비그늘이다. 동쪽 안데스가 아마존의 습기를 막고, 서쪽에서는 차가운 훔볼트 해류가 바다 위 공기를 식혀 비구름이 생기지 않게 한다. 일부 기상 관측소는 관측 이래 강수량 0을 기록했고, 사막 중심부는 400년 이상 비가 오지 않은 것으로 추정된다. 토양이 너무 건조해 미생물조차 없는 곳이 있어 NASA가 화성 탐사 장비를 여기서 시험한다.","산페드로 데 아타카마는 이 사막 안의 오아시스 마을이다. 흙벽돌(아도베) 집과 비포장 골목, 중심가 카라콜레스 거리에 식당과 여행사가 몰려 있다. 마을 광장의 산페드로 교회는 17세기에 지어진 칠레 최고(最古)급 교회로, 천장을 선인장 나무와 가죽끈으로 엮었다. 고도 2,400m로 우유니보다 1,200m 낮아 국경을 넘으면 몸이 한결 편해진다."]},{"title":"세계 천문학의 수도","paragraphs":["아타카마 하늘은 1년에 300일 이상 맑고 대기가 건조하며 주변에 불빛이 없다. 그래서 세계 최대 전파망원경 ALMA가 산페드로 근처 5,000m 차낙토르 고원에 있다. 접시 안테나 66개를 연결해 하나의 거대한 망원경처럼 쓰며, 미국·유럽·일본·한국 등이 참여한다. 2019년 인류 첫 블랙홀 사진에도 ALMA가 기여했다. 남쪽 파라날 산의 VLT, 건설 중인 세계 최대 광학망원경 ELT도 이 사막에 있다.","산페드로 마을에서도 밤에 조명을 벗어나면 은하수가 맨눈으로 보인다. 관광용 별 관측 투어가 많고, 맑은 날 밤 마을 외곽에 서 있기만 해도 남십자성과 마젤란 은하를 찾을 수 있다. 다만 이번 일정은 저녁 비행기로 산티아고로 떠나므로 밤하늘은 우유니에서 챙겨야 한다."]},{"title":"초석, 광부, 그리고 미라","paragraphs":["아타카마의 모래에는 초석(질산나트륨)이 묻혀 있다. 19세기 말 화약과 비료 원료로 유럽이 앞다퉈 사들였고, 이 이권을 두고 칠레가 페루·볼리비아와 태평양 전쟁을 벌여 이 땅을 가져갔다. 사막 곳곳에 남은 초석 공장 도시 험버스톤과 산타 라우라는 1930년대 합성 질산염 발명으로 버려져 유령 도시가 됐고 지금은 유네스코 세계유산이다.","2010년 이 사막의 산호세 광산에서 광부 33명이 지하 700m에 69일간 갇혔다 전원 구조된 사건은 전 세계가 지켜봤다. 한편 아타카마 북부 해안에서는 7천 년 전 친초로 문화의 미라가 발견됐다. 이집트보다 2천 년 앞선 세계 최고(最古)의 인공 미라다. 건조한 사막은 모든 것을 보존한다. 산페드로 마을 사람들 다수는 리칸 안타이(아타카메뇨) 원주민의 후손으로, 잉카 이전부터 이 오아시스에서 살아왔다."]},{"title":"산페드로 마을 한 바퀴: 선인장 지붕 성당과 카라콜레스","paragraphs":["산페드로 데 아타카마의 광장 성당은 17세기에 처음 지어 1744년 다시 세운 흙집이다. 지붕을 보면 대들보가 선인장(카르돈) 목재이고 서까래를 야마 가죽끈으로 묶었다. 못 없이 지은 집이다. 흰 회칠에 파란 문, 안은 서늘하고 어둡다. 광장의 후추나무들과 광장 옆 르 파이헤 박물관(벨기에 신부가 모은 아타카메뇨 유물)이 마을의 중심이고, 마을 전체가 흙벽돌 단층집이라 밤에는 별이 잘 보이도록 가로등이 어둡다.","카라콜레스 거리는 마을의 유일한 번화가로 300m 남짓한 흙길 양쪽에 투어 회사, 식당, 기념품 가게, 환전소가 늘어서 있다. 밤에는 화덕 피자와 라마 스테이크 냄새가 나고 배낭여행자들이 모인다. 마을 남쪽 끝 산페드로 강가에 잉카 유적 카탈페가 있고, 북쪽으로 3km 걸으면 12세기 요새 푸카라 데 키토르가 나온다. 1540년 스페인의 프란시스코 데 아기레가 이 요새를 함락하고 수비병들의 목을 잘랐다. 요새 위 전망대에서 리칸카부르 화산과 오아시스 전체가 보인다. 우리는 반나절이라 성당, 광장, 카라콜레스, 그리고 시간이 남으면 요새까지가 현실적이다."]},{"title":"세하르 석호: 사해처럼 뜨는 물","paragraphs":["산페드로에서 남쪽 18km 소금 평원 안의 세하르 석호는 염도가 사해 수준이라 몸이 그냥 뜬다. 눕기만 하면 물 위에서 신문을 읽는 자세가 되고, 발을 아래로 내려도 가라앉지 않는다. 물은 차갑고(14~18도), 나오면 몸에 소금 껍질이 생겨 샤워장이 있다. 눈과 상처에 물이 들어가면 따갑다. 근처 오호스 델 살라르는 소금 평원에 뚫린 지름 20m짜리 둥근 구멍 두 개로, 담수라 뛰어들 수 있다. 테빈키체 석호는 석양 때 안데스가 물에 비치는 곳이라 투어가 마지막에 세운다.","이 소금 평원(살라르 데 아타카마)은 우유니보다 작지만 지구 리튬의 큰 몫이 여기서 나온다. 평원 남쪽에서 소금물을 퍼 올려 햇볕에 말리는 거대한 증발 연못이 위성사진에 파란 사각형으로 보인다. 물을 퍼 올리면서 석호 수위가 낮아지고 플라밍고가 줄어든다는 논쟁이 있다. 우리는 석호에 뜨는 사람이고, 그 물 아래 있는 것이 전기차 배터리라는 것을 알고 뜨면 조금 다른 기분이 든다. 우리 일정은 반나절이라 갈 수 있을지는 도착 시간에 달렸다."]}]},"santiago":{"id":"santiago","name":"산티아고","articles":[{"title":"우엘렌 언덕에서 시작된 도시","paragraphs":["1541년 2월 12일 페드로 데 발디비아가 마포초 강가의 작은 언덕 우엘렌 옆에 산티아고를 세웠다. 이 언덕이 지금의 산타루시아 언덕이다. 발디비아는 몇 달 뒤 남쪽 마푸체족의 공격으로 도시가 불탄 뒤에도 재건을 고집했고, 마푸체와의 전쟁은 이후 300년간 이어졌다. 스페인은 끝내 칠레 남부를 정복하지 못했고 마푸체는 지금도 칠레 인구의 약 10%로 정체성 운동을 이어 간다.","1810년 9월 18일 산티아고에서 첫 자치 정부가 세워졌고, 이날은 지금도 칠레 최대 명절 디에시오초다. 1818년 산 마르틴과 베르나르도 오이긴스가 안데스를 넘어온 군대로 독립을 확정했다. 오이긴스는 아일랜드계 스페인 총독의 사생아였고, 산티아고의 중심 대로에 그의 이름이 붙어 있다. 이번 여행이 도착하는 10월 초는 9월 18일 연휴 직후라 도시가 아직 축제 분위기의 여운을 갖고 있을 수 있다."]},{"title":"1973년 9월 11일, 라 모네다","paragraphs":["칠레 현대사의 중심은 아르마스 광장 남쪽의 대통령궁 라 모네다다. 1970년 세계 최초로 선거로 집권한 사회주의자 살바도르 아옌데는 구리 국유화와 토지 개혁을 밀어붙였고, 1973년 9월 11일 아우구스토 피노체트 장군의 쿠데타로 무너졌다. 공군기가 라 모네다를 폭격하는 동안 아옌데는 라디오 연설을 남기고 궁 안에서 사망했다.","피노체트 정권 17년 동안 3천 명 이상이 살해되거나 실종됐고 수만 명이 고문당했다. 동시에 시카고 대학 출신 경제학자들이 급진적 시장 경제를 도입해 오늘날 칠레 경제의 틀을 만들었다. 1988년 국민투표에서 반대(NO) 진영이 이기면서 1990년 민주 정부가 들어섰고, 이 과정은 영화 노(No)로 만들어졌다. 2019년에는 지하철 요금 인상에서 시작된 대규모 시위(에스타이도 소시알)가 헌법 개정 논의로 이어졌다. 산티아고 곳곳의 벽화와 기념관은 이 기억의 흔적이다."]},{"title":"네루다와 라 차스코나","paragraphs":["파블로 네루다는 1971년 노벨문학상을 받은 칠레의 시인이자 외교관, 공산당 상원의원이었다. 산크리스토발 언덕 아래 베야비스타의 라 차스코나는 그가 1953년 비밀 연인 마틸데 우루티아를 위해 지은 집이다. 차스코나는 헝클어진 머리라는 뜻으로 마틸데의 붉은 곱슬머리를 가리킨다. 집은 배 모양으로 지어졌고 방마다 그가 세계에서 모은 물건이 가득하다.","네루다는 1973년 쿠데타 12일 뒤 병원에서 죽었다. 공식 사인은 전립선암이었지만 독살 의혹이 계속 제기됐고, 2023년 법의학 조사에서 독성 박테리아가 검출됐다는 발표가 나왔다. 그의 장례식은 쿠데타 후 첫 공개 저항 집회가 됐다. 라 차스코나는 쿠데타 직후 군에 의해 파괴됐다가 마틸데가 복원해 지금은 박물관이다."]},{"title":"안데스, 와인, 그리고 마지막 저녁","paragraphs":["산티아고는 해발 520m 분지에 있고 동쪽으로 6천m급 안데스가 병풍처럼 서 있다. 겨울(6~8월)에는 스모그로 산이 잘 안 보이지만 봄인 10월 초는 비 온 뒤 설산이 선명하게 보이는 시기다. 산크리스토발 언덕(880m)은 푸니쿨라나 케이블카로 오르며, 정상의 성모상 앞에서 도시와 안데스를 한눈에 본다.","칠레 와인은 프랑스 품종을 19세기에 들여와 필록세라 없이 보존한 것이 강점이다. 특히 카르메네르는 프랑스에서는 멸종하다시피 했는데 칠레에서 메를로로 잘못 알려진 채 자라다 1994년 재발견됐다. 산티아고 남쪽 마이포 계곡이 주산지다. 마지막 저녁으로는 완전한 칠레식 메뉴가 어울린다. 파스텔 데 초클로(옥수수 크림 아래 다진 고기), 메르카도 센트랄의 해산물(파일라 마리나 수프, 성게, 대게), 그리고 아보카도와 토마토를 얹은 핫도그 콤플레토. 피스코 사워 칠레 버전을 마시며 페루 것과 비교하는 것으로 여행을 마무리하면 된다."]},{"title":"메르카도 센트랄: 영국에서 배로 온 철골","paragraphs":["산티아고 중앙시장은 1872년에 문을 열었다. 철골 구조물은 영국에서 주조해 배로 실어 와 조립한 것으로, 그해 국제 박람회장으로 먼저 쓰였다. 유리 지붕 아래 생선 가게와 식당이 섞여 있고, 칠레의 긴 해안이 내놓는 것들, 성게, 마차스(조개), 콩그리오(붕장어), 왕게, 레이네타가 얼음 위에 누워 있다. 미국 잡지가 세계 5대 시장으로 꼽은 뒤 관광객이 늘어 가운데 큰 식당들은 비싸고 호객이 심하다. 가장자리 작은 식당이 반값이고 맛은 같다.","파일라 마리나(해물 수프)와 카수엘라, 그리고 마차스 아 라 파르메사나(치즈 얹은 조개 구이)가 시장의 대표 메뉴다. 시장 건너편 베가 센트랄은 채소와 과일의 진짜 서민 시장이고, 그 안의 식당은 더 싸다. 시장 옆 마포초 강은 안데스 눈 녹은 물이 흐르는 갈색 강이고, 옛 마포초 역은 문화센터가 됐다. 일요일 오전이 가장 활기차고, 오후 3시면 가게가 닫기 시작한다. 지갑은 앞주머니에."]},{"title":"산크리스토발 언덕: 성모상과 교황의 미사","paragraphs":["산티아고 어디서나 보이는 언덕 꼭대기의 흰 성모상은 1908년 프랑스에서 만들어 온 높이 14m 조각이다. 언덕은 해발 880m로 도시보다 300m 높고, 1925년 놓인 푸니쿨라가 지금도 다닌다. 위에서 스모그 없는 날에는 안데스 전체가 병풍처럼 서고, 스모그가 낀 날에는 산이 사라진다. 산티아고의 공기는 분지에 갇혀 겨울(6~8월)에 가장 나쁘고, 10월 초는 봄이라 나은 편이다. 1987년 교황 요한 바오로 2세가 이 언덕에서 미사를 열었을 때 피노체트 반대 시위와 겹쳐 최루탄이 날았다.","언덕 전체가 메트로폴리탄 공원으로 700헥타르가 넘는 세계 최대급 도시 공원이다. 동물원, 일본 정원, 수영장이 있고 케이블카가 언덕 반대편 프로비덴시아까지 이어져 우리 호텔 쪽으로 내려올 수 있다. 정상 매점의 모테 콘 우에시요(말린 복숭아와 밀알을 넣은 달콤한 음료)가 이 언덕의 맛이다. 등산로로 혼자 오르는 것은 강도 사례가 있어 권하지 않고, 푸니쿨라(베야비스타 쪽)로 올라 케이블카(프로비덴시아 쪽)로 내려오는 것이 정석이다. 오전이 시야가 좋다."]},{"title":"베야비스타와 청금석","paragraphs":["푸니쿨라 아래 베야비스타는 1970년대부터 예술가와 학생의 동네였다. 네루다의 집 라 차스코나가 골목 안에 있고, 벽화가 많고, 파티오 베야비스타라는 식당 골목은 밤에 붐빈다. 이 동네 가게 절반은 청금석(라피스 라줄리)을 판다. 청금석은 세계에서 아프가니스탄과 칠레 두 곳에서만 상업적으로 나오는 파란 돌로, 칠레의 국석이다. 칠레 것은 안데스 산속 광산에서 캐며 아프간 것보다 흰 줄이 많다. 작은 목걸이가 1~2만 페소이고, 색이 너무 균일하게 파랗고 싸면 염색한 돌이다.","베야비스타 남쪽 마포초 강 건너가 라스타리아 지구다. 미술관(벨라스 아르테스), 가브리엘라 미스트랄 문화센터, 산타루시아 언덕이 걸어서 이어지는 문화 동네이고 카페가 좋다. 두 동네 다 밤 10시까지는 사람이 많아 괜찮고 그 뒤로는 택시다. 칠레 사람들이 저녁을 9시에 먹기 때문에 식당은 8시 전에 가면 한산하다. 우리의 마지막 저녁이 여기라면 파티오 베야비스타의 야외 테이블에서 피스코 사워 한 잔이 어울린다."]},{"title":"스카이 코스타네라: 남미에서 가장 높은 곳","paragraphs":["그란 토레 산티아고는 높이 300m, 62층으로 남미에서 가장 높은 건물이다. 아르헨티나 출신 건축가 세사르 펠리가 설계했고 2013년 완공, 전망대 스카이 코스타네라는 2015년에 열었다. 61~62층 전망대에서 360도로 도시와 안데스가 보이고, 엘리베이터는 40초 만에 오른다. 입장료는 2만 페소 안팎으로 비싸지만 산티아고 분지의 크기, 안데스가 도시에 얼마나 바짝 붙어 있는지가 한눈에 들어온다. 해 지기 한 시간 전에 올라가면 낮과 밤을 다 본다.","이 건물은 2008년 금융위기 때 공사가 2년 멈췄고, 아래 쇼핑몰 코스타네라 센터가 라틴아메리카 최대 몰이다. 우리 호텔에서 걸어서 15분이라 마지막 날 반나절에 가장 무난한 곳이다. 전망대에서 동쪽으로 보이는 눈 덮인 봉우리가 엘 플로모(5,424m)이고, 잉카가 그 정상에 어린이 미라를 묻은 산이다. 그 미라는 산티아고 자연사박물관에 있다. 북쪽 아래로 산크리스토발 성모상이, 서쪽으로 도심의 고층 건물이 보인다. 흐린 날은 돈이 아까우니 아침 하늘을 보고 정한다."]},{"title":"카시예로 델 디아블로: 악마가 지키는 지하 창고","paragraphs":["콘차 이 토로는 1883년 돈 멜초르 콘차 이 토로가 프랑스 보르도 포도를 들여와 세운 와이너리다. 그의 지하 창고에서 좋은 와인이 자꾸 없어지자 그는 \"그 창고에 악마가 산다\"는 소문을 퍼뜨렸고, 그 뒤로 도둑이 없어졌다. 악마의 창고라는 뜻의 카시예로 델 디아블로는 그렇게 브랜드가 됐고 지금 전 세계 슈퍼에서 파는 칠레 와인의 얼굴이다. 투어의 마지막에 그 지하 창고에 들어가면 어둠 속에서 악마의 목소리가 나오는 쇼를 한다. 유치하지만 다들 웃는다.","투어는 저택 정원, 포도밭, 창고, 시음 세 잔으로 두 시간이고 산티아고 남쪽 피르케까지 차로 한 시간이다. 칠레 와인이 싸고 좋은 이유는 지리다. 서쪽 바다, 동쪽 안데스, 북쪽 사막, 남쪽 빙하로 막혀 있어 19세기 유럽 포도밭을 전멸시킨 필록세라 벌레가 들어오지 못했고, 지금도 접붙이기 없이 원래 뿌리로 키우는 몇 안 되는 나라다. 카르메네르 품종은 프랑스에서 멸종했다가 1994년 칠레에서 메를로로 잘못 알고 키우던 것이 발견된 것으로, 칠레의 대표 품종이 됐다. 시음할 때 카르메네르를 꼭 마셔 볼 것."]},{"title":"카페 콘 피에르나스: 산티아고의 이상한 커피","paragraphs":["산티아고 도심 골목에 창문이 검게 코팅된 카페들이 있다. \"다리 있는 커피\"라는 뜻의 카페 콘 피에르나스로, 짧은 치마를 입은 여성 종업원이 서서 마시는 손님에게 에스프레소를 내주는 곳이다. 1949년 문을 연 카페 아이티와 카페 카리베가 원조인데 처음에는 그저 이탈리아식 서서 마시는 커피 바였고, 1990년대 경쟁이 붙으면서 복장이 점점 짧아졌다. 의자가 없는 것은 회전율 때문이고, 손님은 정장 입은 직장인이 대부분이다. 칠레 사람들이 커피를 이렇게 마시게 된 것은 오랫동안 칠레에서 커피가 네스카페 인스턴트뿐이었기 때문이다. 제대로 된 원두 커피를 파는 곳이 이 카페들이었다.","논쟁도 많다. 여성 단체는 성차별이라 하고, 종업원들은 팁이 다른 데보다 낫다고 한다. 창문이 검은 곳일수록 복장이 심하고, 카페 아이티처럼 유리가 투명한 곳은 그냥 커피집이다. 아르마스 광장 근처 아우마다 거리에 몰려 있고, 관광객이 들어가도 아무도 신경 쓰지 않는다. 커피는 1,500~2,500페소이고 진하다. 알고 지나가는 것과 모르고 지나가는 것이 다른 종류의 산티아고 풍경이다."]}]},"geo":{"id":"geo","name":"땅과 하늘: 지질·자연","articles":[{"title":"안데스는 왜 이렇게 높은가","paragraphs":["안데스는 태평양 바닥의 나스카판이 남아메리카판 아래로 1년에 6~7cm씩 파고들면서 만들어졌다. 대륙 가장자리가 밀려 두꺼워지고 구겨지며 솟아올랐고, 녹은 암석이 화산으로 터져 나왔다. 히말라야가 두 대륙의 충돌이라면 안데스는 바다가 대륙 밑으로 사라지는 현장이다. 그래서 안데스에는 활화산이 200개 가까이 있고, 페루·볼리비아·칠레 전부가 환태평양 조산대(불의 고리) 위에 있다.","이 융기는 약 2,500만 년 전부터 빨라졌고 지금도 진행 중이다. 쿠스코의 잉카 석벽이 지진에 강하게 설계된 것, 리마가 몇 백 년마다 대지진을 맞는 것, 아타카마에 구리가 묻힌 것, 우유니에 리튬이 녹아 있는 것이 모두 같은 원인에서 나온다. 여행 중 만나는 풍경의 절반은 이 판의 충돌이 만든 것이다.","7,000km에 이르는 안데스는 세계에서 가장 긴 산맥이고, 최고봉 아콩카과(6,961m, 아르헨티나)는 아시아 밖에서 가장 높은 산이다. 이번 여행에서 보는 산들도 만만치 않다. 라파즈 뒤의 일리마니 6,438m, 볼리비아 최고봉 사하마 6,542m, 아타카마 마을 뒤의 리칸카부르 5,916m."]},{"title":"알티플라노: 티베트 다음으로 큰 고원","paragraphs":["쿠스코를 지나 푸노부터 우유니까지 여행하는 땅이 알티플라노다. 평균 해발 3,750m, 길이 약 1,000km로 티베트 고원 다음으로 넓은 고원이다. 안데스가 동서 두 줄기(코르디예라)로 갈라지면서 그 사이가 높이 들려 평평한 분지가 됐고, 여기에 물이 고여 거대한 호수들이 생겼다.","티티카카는 그 호수 중 살아남은 것이다. 남쪽으로는 데사구아데로 강을 통해 포오포 호수로 흐르는데, 포오포는 2015년 완전히 말라 버렸다. 티티카카 물의 90%는 강으로 빠지지 않고 증발한다. 우유니 소금사막은 이 고원의 남쪽 끝에서 물이 다 증발한 뒤 남은 바닥이다. 즉 이번 여행은 하나의 거대한 고원을 북쪽 호수에서 남쪽 소금 바닥까지 종단하는 코스다."]},{"title":"훔볼트 해류와 엘니뇨","paragraphs":["페루 앞바다에는 남극에서 올라온 차가운 훔볼트 해류가 흐른다. 이 바닷물이 깊은 곳의 영양분을 끌어올려 세계 최대의 어장을 만든다. 페루의 안초베타(멸치) 어획량은 단일 어종으로 세계 1위이고, 그 대부분이 어분이 되어 전 세계 양식장으로 간다. 세비체가 싱싱한 것도, 바예스타 섬의 바닷새 수십만 마리도 이 해류 덕분이다.","몇 년에 한 번 이 해류가 약해지고 따뜻한 물이 밀려온다. 크리스마스 무렵에 잘 나타나 페루 어부들이 아기 예수라는 뜻의 엘니뇨라고 불렀다. 엘니뇨가 오면 물고기가 사라지고 사막 리마에 폭우가 내리며, 반대로 지구 반대편 호주·인도네시아는 가뭄이 든다. 페루 해안의 작은 수온 변화가 전 지구 기후를 흔드는 것이다. 2023~2024년 강한 엘니뇨 뒤 지금은 평년에 가까운 상태다."]},{"title":"바다에 붙은 사막","paragraphs":["리마에서 아타카마까지 해안 3,500km는 거의 끊어지지 않는 사막이다. 바다 옆에 사막이 있는 이유는 훔볼트 해류다. 찬 바다 위의 공기는 무겁고 안정돼 비구름이 생기지 않고, 대신 낮은 안개만 만든다. 리마의 가루아 안개, 아타카마의 카만차카 안개가 그것이다. 이 안개를 먹고 사는 사막 식물 군락(로마스)이 해안 언덕에 띠처럼 자란다.","이카의 모래언덕은 이 사막의 하이라이트다. 나스카 근처 세로 블랑코는 높이 1,000m 이상으로 세계에서 가장 높은 사구로 꼽힌다. 와카치나 주변 사구도 100~200m로, 버기카가 오르는 언덕이 아파트 40층 높이다. 이 모래는 안데스에서 강이 실어 온 퇴적물이 바람에 다시 쌓인 것이다."]},{"title":"리마의 지진, 그리고 흔들리면 할 일","paragraphs":["리마는 1687년, 1746년, 1940년, 1974년, 2007년에 큰 지진을 겪었다. 1746년에는 도시가 무너지고 카야오 항구가 쓰나미로 사라졌다. 2007년 피스코 지진(규모 8.0)은 이카 근처가 진원이었고 500명 이상이 죽었다. 지질학자들은 리마 앞바다에 200년 이상 에너지가 쌓여 있다고 본다.","여행자가 할 일은 단순하다. 호텔 방에 들어가면 비상계단 위치를 확인한다. 흔들리면 문틀이나 튼튼한 탁자 아래로, 창문과 거울에서 멀어진다. 엘리베이터는 쓰지 않는다. 해안(미라플로레스 절벽 아래, 바랑코 해변)에서 강한 진동을 느끼면 즉시 높은 곳으로 올라간다. 페루 건물의 녹색 S 표시(Zona Segura)가 대피 안전 지점이다. 칠레는 지진 대비가 세계 최고 수준이라 건물 안에 있는 것이 대개 가장 안전하다."]},{"title":"우유니 소금의 육각형은 왜 생기나","paragraphs":["소금사막 표면은 한 변이 1m 안팎인 육각형 타일로 덮여 있다. 오랫동안 마른 진흙이 갈라지듯 소금이 수축해 갈라진 것으로 설명했지만, 2023년 물리학자들이 다른 답을 냈다. 소금 껍질 아래 염수가 아래에서 위로 천천히 순환(대류)하고, 그 순환 세포의 크기가 육각형 크기를 정한다는 것이다. 세계 어느 소금사막에서도 육각형 크기가 비슷한 이유가 이것이다. 발밑의 무늬는 땅속 물의 움직임을 보여 주는 지도다.","이 염수에는 리튬·칼륨·마그네슘·붕소가 녹아 있다. 볼리비아 정부는 우유니 남쪽에 리튬 공장을 세웠지만 증발 방식은 물이 많이 들고 느려서 생산량이 적다. 지프가 지나는 새하얀 평원 아래 수십 미터에 21세기 배터리 산업이 노리는 액체가 잠겨 있다."]},{"title":"색깔 호수의 화학","paragraphs":["투어 2일차에 만나는 호수들은 저마다 색이 다르다. 라구나 콜로라다의 붉은색은 붉은 조류와 플랑크톤, 그리고 호수 바닥의 붉은 퇴적물이 바람에 섞인 것이다. 색은 시간대와 바람에 따라 주황에서 진홍으로 바뀐다. 국경 근처 라구나 베르데는 구리·비소·납 성분 때문에 에메랄드빛인데, 바람이 물을 섞어야 색이 살아나서 오전 늦게가 가장 선명하다. 그래서 유독하고, 어떤 호수도 손을 담그지 않는 것이 규칙이다.","솔 데 마냐나(아침의 태양)는 해발 4,850m의 지열 지대다. 진흙이 부글거리고 증기가 50m까지 솟지만 엄밀히는 간헐천이 아니라 분기공이다. 새벽에 기온이 낮을 때 증기가 가장 장관이고, 가장자리는 얇아서 무너질 수 있으니 표시된 길 밖으로 나가지 않는다. 그 뒤에 들어가는 폴케스 온천은 35도 안팎의 천연 온천이고, 영하의 새벽에 몸을 담그는 것이 이 투어의 명장면이다."]},{"title":"아타카마: 화성에 가장 가까운 땅","paragraphs":["아타카마는 최소 1,500만 년 동안 극도로 건조했던, 지구에서 가장 오래된 사막이다. 토양에는 화성 표면과 같은 과염소산염이 있고, 일부 지역은 유기물이 거의 없어 NASA가 화성 탐사 로버의 생명 탐지 장비를 여기서 시험한다. 2003년 이 사막 토양으로 바이킹 탐사선의 실험을 재현했더니 화성처럼 생명이 없다는 결과가 나와 화제가 됐다.","산페드로 마을 동쪽에 우뚝 선 리칸카부르 화산(5,916m)은 볼리비아와 칠레의 국경이다. 정상 분화구 안에 세계에서 가장 높은 호수 중 하나가 있고, 겨울에도 얼지 않는 이 호수는 잉카 시대 제단이 있던 곳이다. 우유니 투어 마지막 날 국경을 넘어 내려오면서 이 산을 정면으로 보게 된다."]},{"title":"칠레의 구리와 규모 9.5","paragraphs":["칼라마 공항으로 가는 길에 지나는 추키카마타는 부피 기준 세계 최대의 노천 구리 광산이다. 길이 4.3km, 깊이 900m의 구멍이 100년 넘게 파였다. 칠레는 세계 구리의 4분의 1을 생산하고, 이 광산들의 세금이 칠레 경제를 떠받친다. 스마트폰 안 구리의 상당 부분이 이 사막에서 나왔다.","칠레는 지진의 나라이기도 하다. 1960년 발디비아 지진은 규모 9.5로 인류가 기록한 가장 강한 지진이고, 그 쓰나미가 하와이와 일본까지 갔다. 2010년 마울레 지진(8.8) 때 산티아고 고층 건물들이 거의 피해 없이 버틴 것은 세계 최고 수준의 내진 규정 덕분이다. 산티아고에서 진동을 느끼면 건물 밖으로 뛰어나가지 말고 안에서 기다리는 것이 칠레 사람들의 상식이다."]},{"title":"고도가 몸에 하는 일","paragraphs":["해발 3,400m 쿠스코의 공기는 해수면의 65%, 우유니 투어 최고점 4,950m에서는 55%의 산소만 담고 있다. 몸은 처음 며칠 호흡과 심박을 늘려 버티고, 2~3주가 지나야 적혈구가 늘어난다. 우리 일정은 그 적응 기간 안에 끝나므로 계속 약간 힘든 상태다. 고산약(아세타졸아미드)은 혈액을 약간 산성으로 만들어 호흡을 재촉하는 원리로, 적응을 빠르게 한다.","고도는 일상도 바꾼다. 쿠스코에서 물은 88도에서 끓어 차가 덜 뜨겁고 밥이 덜 익는다. 압력이 낮아 감자칩 봉지가 빵빵하게 부풀고, 볼펜 잉크가 새고, 선크림 뚜껑을 열면 튄다. 자외선은 해수면보다 40% 이상 강해 흐린 날에도 탄다. 안데스 사람들이 감자를 밤 서리에 얼리고 낮에 밟아 물을 뺀 추뇨를 만든 것도 이 기후 덕분이다. 세계 최초의 냉동건조 식품이다."]},{"title":"남반구의 밤하늘 읽는 법","paragraphs":["우유니와 아타카마의 밤하늘에는 한국에서 볼 수 없는 것이 세 가지 있다. 첫째, 남십자성. 남쪽 하늘의 작은 십자 모양 네 별로, 긴 축을 4.5배 연장하면 남쪽 하늘의 극점이다. 옆의 밝은 두 별(켄타우루스 알파·베타)이 가짜 십자와 구별하는 표지다. 둘째, 대·소 마젤란 은하. 남쪽 하늘에 떠 있는 희미한 구름 두 조각으로, 우리 은하의 위성 은하다. 셋째, 은하수의 중심. 9월 말 저녁 8~9시에 은하수 중심부(궁수자리)가 서쪽 하늘 높이 걸려 있어 가장 밝고 굵은 부분이 보인다.","잉카는 별이 아니라 은하수의 어두운 부분으로 별자리를 만들었다. 남십자성 옆의 검은 구멍(석탄자루 성운)은 야카나라는 검은 야마, 그 옆은 새끼 야마, 두꺼비, 여우, 뱀이다. 밤에 은하수를 볼 때 밝은 별 대신 검은 강줄기를 따라가면 그들이 본 하늘이 보인다. 스마트폰 야간 모드로 10~30초 노출을 주면 은하수가 찍힌다. 폰을 바위나 지프 지붕에 고정하고, 화면 밝기를 최소로 낮추고, 눈이 어둠에 적응하는 데 20분이 걸린다는 것만 기억하면 된다."]}]},"trivia":{"id":"trivia","name":"네타 창고: 알면 재미있는 것들","articles":[{"title":"패딩턴 베어는 페루에서 왔다","paragraphs":["영국의 국민 곰 패딩턴은 어두운 페루에서 마멀레이드를 좋아하는 이모 루시 손에 자라 런던으로 밀항한 곰이다. 작가 마이클 본드는 원래 아프리카 출신으로 쓰려다 아프리카에 곰이 없다는 지적에 페루로 바꿨다. 실제로 안데스에는 남미 유일의 곰인 안경곰이 산다. 미라플로레스 해안 절벽의 살라사르 공원에는 2015년 영국이 선물한 패딩턴 동상이 서 있다. 라르코마르 바로 옆이라 첫날 산책 코스에 넣기 좋다."]},{"title":"코카콜라가 이기지 못한 나라","paragraphs":["페루는 코카콜라가 판매 1위를 빼앗기지 못한 몇 안 되는 나라다. 1935년 리마의 영국 이민자 가족이 만든 노란 탄산음료 잉카 콜라가 늘 1위였다. 레몬 버베나 향에 풍선껌 맛이라는 평이 많고, 페루 사람들은 치파(중국 요리)와 함께 마시는 것이 진리라고 한다. 1999년 코카콜라가 결국 지분 절반을 사 버렸지만 페루에서는 여전히 잉카 콜라 로고가 코카콜라보다 크다."]},{"title":"감자 4천 종의 고향","paragraphs":["감자는 티티카카 호수 주변에서 약 8천 년 전 처음 재배됐다. 페루에는 지금도 4천 종 넘는 감자가 있고, 색은 노란색·보라색·붉은색·검은색까지 다양하다. 리마에는 국제감자센터가 있어 전 세계 감자 유전자를 보관한다. 16세기 스페인이 유럽으로 가져간 감자는 아일랜드와 독일 인구를 폭발시켰고, 프렌치프라이는 결국 안데스 원산이다. 시장에서 감자 이름을 물으면 열 가지는 나온다."]},{"title":"야마, 알파카, 비쿠냐, 과나코 구별법","paragraphs":["넷 다 낙타과 사촌이다. 야마는 크고 귀가 바나나처럼 휘었고 짐을 나른다. 알파카는 작고 얼굴이 뭉툭하며 털이 폭신하다. 사진에 자주 나오는 것은 대부분 알파카다. 비쿠냐는 야생이고 가늘고 우아하며, 그 털은 세계에서 가장 고운 동물 섬유라 잉카 시대에는 왕만 입었다. 지금도 3년에 한 번 마을 전체가 몰이(차쿠)를 해서 깎고, 비쿠냐 스카프 하나가 수백만 원이다. 과나코는 야생 야마로 아타카마와 파타고니아에 산다. 국경을 넘어 칠레로 내려올 때 도로 옆에 보이는 것이 비쿠냐 아니면 과나코다."]},{"title":"최후의 만찬에 기니피그가 있다","paragraphs":["쿠스코 대성당의 최후의 만찬 그림(마르코스 사파타, 1753)에는 식탁 한가운데 구운 기니피그가 놓여 있다. 안데스 화가가 성서 장면을 자기 땅의 잔칫상으로 옮긴 것이다. 옆에는 치차 술잔도 보인다. 페루는 1년에 기니피그 6천5백만 마리를 먹고, 축제 음식이라 값도 비싸다. 반 마리에 뼈가 많고 살은 적어 맛보다 경험에 가깝다. 기니피그를 애완동물로 만든 것은 16세기 유럽이지 안데스가 아니다."]},{"title":"엘 콘도르 파사의 진짜 주인","paragraphs":["사이먼 앤 가펑클의 엘 콘도르 파사는 원래 1913년 페루 작곡가 다니엘 알로미아 로블레스가 쓴 사르수엘라(음악극) 곡이다. 광산 노동자의 저항을 다룬 극에서 자유의 상징으로 콘도르가 등장한다. 폴 사이먼은 파리에서 이 곡을 연주하던 페루 그룹 로스 잉카스에게 배워 가사를 붙였고, 나중에 저작권 소송이 있었다. 2004년 페루는 이 곡을 국가 문화유산으로 지정했다. 쿠스코·푸노 광장에서 팬플루트 연주자가 이 곡을 연주하면 관광객용이 아니라 자기 노래를 부르는 것이다. 안데스 콘도르는 날개 폭 3.3m로 나는 새 중 가장 크고, 잉카에게는 하늘 세계의 사자였다."]},{"title":"세계에서 가장 위험한 도로","paragraphs":["라파즈에서 열대 저지대 코로이코로 내려가는 옛 융가스 도로는 폭 3m의 비포장 절벽길로, 매년 200~300명이 죽어 죽음의 도로라 불렸다. 2006년 새 도로가 생긴 뒤 지금은 자전거 내리막 투어 코스다. 4,650m에서 1,200m까지 64km를 내려오며 열대 우림으로 들어가는 이 투어는 라파즈 자유일정에 넣기에는 하루가 꽉 차지만, 이 도로 이야기를 알면 라파즈 버스 창밖 절벽길이 다르게 보인다."]},{"title":"거꾸로 도는 시계","paragraphs":["라파즈 무리요 광장의 국회 건물 시계는 거꾸로 돈다. 숫자가 반시계 방향으로 붙어 있고 바늘도 반대로 간다. 2014년 정부가 남반구의 시계라며 바꿨다. 북반구에서 해시계 그림자가 시계 방향으로 도는 것을 흉내 낸 것이 시계인데, 남반구에서는 그림자가 반대로 도니 시계도 반대로 가야 한다는 논리다. 시티투어에서 무리요 광장에 들르면 위를 올려다볼 것."]},{"title":"바다 없는 나라의 해군","paragraphs":["볼리비아는 1879년 태평양 전쟁으로 해안을 잃었지만 해군을 해체하지 않았다. 약 5천 명의 해군이 티티카카 호수와 강에서 근무하고, 매년 3월 23일 바다의 날에 바다를 되찾자는 행진을 한다. 2018년 국제사법재판소에 칠레가 협상 의무가 있다고 제소했지만 패소했다. 볼리비아 학교에서는 지금도 잃어버린 해안 지도를 가르친다. 국경에서 칠레로 넘어갈 때 이 감정의 온도를 알면 볼리비아 사람들의 칠레 이야기가 이해된다."]},{"title":"세계에서 가장 높은 국제공항","paragraphs":["라파즈 엘알토 공항은 해발 4,061m로 세계에서 가장 높은 국제공항 중 하나다. 공기가 희박해 비행기가 뜨는 데 더 긴 활주로가 필요하고(4km), 엔진 출력도 제한된다. 승객 쪽 문제도 있다. 착륙 직후 짐을 들고 뛰면 바로 숨이 찬다. 우리는 반대로 새벽 4시에 여기서 우유니로 떠나는데, 이 공항의 새벽은 영하다. 2015년 교황 프란치스코가 여기 착륙할 때 코카차를 마셨다는 이야기가 유명하다."]},{"title":"다카르 랠리가 지나간 소금사막","paragraphs":["2014년부터 2018년까지 다카르 랠리가 볼리비아를 통과했고, 우유니 소금사막이 하이라이트 구간이었다. 소금 위를 시속 150km로 달리는 사륜차와 모터사이클 영상이 우유니를 세계에 알렸다. 소금 표면은 단단해서 자동차가 달릴 수 있지만 가장자리는 물러서 빠진다. 지프 기사들이 정해진 길만 가는 이유다. 소금사막 한가운데 있는 다카르 기념비(소금 조각)가 투어 1일차 사진 포인트다."]},{"title":"코카콜라에 코카잎이 들어간다","paragraphs":["코카콜라의 이름은 코카잎과 콜라 열매에서 왔다. 1903년 코카인 성분은 빼기 시작했지만, 지금도 미국 뉴저지의 한 회사가 페루에서 코카잎을 합법적으로 수입해 코카인을 제거한 추출물을 코카콜라에 공급한다. 코카잎은 페루·볼리비아 사람들에게는 차와 껌이고, 미국에서는 콜라 향료이며, 국경에서는 마약이다. 볼리비아 헌법은 코카잎을 문화유산으로 규정하고, 유엔 마약 협약에서 코카잎 씹는 것을 예외로 인정받았다."]},{"title":"나스카의 우주인과 폰 데니켄","paragraphs":["1968년 스위스 작가 에리히 폰 데니켄은 신들의 전차라는 책에서 나스카 라인이 외계인의 활주로라고 주장해 세계적 베스트셀러가 됐다. 나스카에는 실제로 우주인이라 불리는 손을 흔드는 인물 그림이 있다. 고고학자들은 이것이 부엉이 머리를 한 사람이고, 직선들은 활주로가 아니라 물을 비는 의례 행렬 길이라고 본다. 마리아 라이헤는 이 책이 유적을 망쳤다고 평생 분노했다. 경비행기를 안 타는 대신, 팬아메리칸 고속도로 옆 전망탑(미라도르)에서 손과 나무 그림 두 개를 볼 수 있다는 것은 기억할 만하다."]},{"title":"마추픽추 여권 도장과 라마 정원사","paragraphs":["마추픽추 입구에는 여권에 찍는 기념 도장이 있다. 출구 쪽 부스에서 무료로 찍어 주고, 여권에 관광 도장을 찍는 것은 일부 나라에서 문제가 될 수 있으니 빈 페이지 대신 도장이 이미 있는 페이지 구석에 찍는 사람이 많다. 유적 안의 잔디는 라마 몇 마리가 관리한다. 사람을 겁내지 않아 사진 모델이 되어 주지만 침을 뱉으니 얼굴을 너무 가까이 대지 않는다. 하루 입장 인원은 시간대별로 제한되고, 입장 후 정해진 코스를 한 방향으로만 돈다. 되돌아가서 다시 볼 수 없으니 좋은 사진 자리에서는 시간을 쓴다."]},{"title":"틴틴과 인디아나 존스","paragraphs":["땡땡(틴틴)의 태양의 신전(1949)은 페루가 배경이다. 잉카 후예들의 비밀 신전, 일식으로 위기를 넘기는 장면이 유명하고, 마추픽추 발견 뒤 유럽에 번진 잃어버린 잉카 도시 열풍을 그대로 담았다. 인디아나 존스의 모델로 자주 언급되는 사람이 마추픽추의 하이럼 빙엄이다. 예일 교수, 탐험가, 페도라 모자. 실제로 그는 나중에 코네티컷 주지사와 상원의원이 됐다. 마추픽추로 가는 고급 열차 이름도 하이럼 빙엄호다."]},{"title":"칠레 스페인어는 왜 알아듣기 힘든가","paragraphs":["칠레 스페인어는 남미에서 가장 빠르고 어미의 s를 삼킨다. 스페인어권 사람들도 어렵다고 한다. 알아두면 좋은 것 몇 개. 문장 끝의 포(po)는 아무 뜻 없는 강조다(sí po = 그렇지). 카차이(¿cachai?)는 알겠어? 웨온(weón)은 친구부터 욕까지 다 되는 만능 단어라 외국인은 쓰지 않는다. 한 잔 하자는 카레테(carrete), 멋지다는 바칸(bacán), 간식 시간은 온세(once). 페루에서 배운 표현이 산티아고에서 안 통해도 당황할 필요 없다."]},{"title":"칠레 국기와 텍사스 깃발","paragraphs":["칠레 국기(1817)는 텍사스 주 깃발(1839)과 거의 같아서 미국인들이 자주 헷갈린다. 칠레 쪽이 20년 먼저다. 칠레 국기는 파란 사각형 안에 별 하나가 있고, 텍사스는 파란 띠 전체에 별이 있다. 9월 18일 독립기념일 주간에는 법으로 모든 건물에 국기를 걸어야 해서, 우리가 도착하는 10월 초에도 국기가 많이 남아 있다."]},{"title":"30페소가 아니라 30년","paragraphs":["2019년 10월 산티아고 지하철 요금이 30페소 오르자 학생들이 개찰구를 뛰어넘는 시위를 시작했고, 이것이 수백만 명의 시위로 번졌다. 구호가 30페소가 아니라 30년이었다. 1990년 민주화 이후 30년간 쌓인 불평등에 대한 분노라는 뜻이다. 그 결과 새 헌법 제정 국민투표가 열렸지만 두 번의 개헌안이 모두 부결됐다. 아르마스 광장 주변 벽화와 바케다노 광장(시위의 중심)의 흔적이 그 기억이다."]},{"title":"우유니에서 원근법 사진 잘 찍는 법","paragraphs":["소금사막 사진의 원리는 배경이 없다는 것이다. 지평선까지 하얀 평면이라 거리감이 사라져, 가까운 것과 먼 것이 같은 평면에 있는 것처럼 보인다. 폰을 땅에 거의 붙여서 낮게 잡고, 소품(공룡 피규어, 과자통)은 카메라 앞 30cm에, 사람은 20~30m 뒤에 세운다. 광각보다 기본 렌즈가 왜곡이 적다. 해를 등지고 찍어야 그림자가 앞으로 나와 재미있고, 정오보다 오후 4시 이후 빛이 부드럽다. 기사들이 이 사진에 전문가라 소품만 주면 연출을 알아서 해 준다.","별 사진은 다르다. 야간 모드 10~30초, 폰을 지프 지붕이나 바위에 올려 고정, 셀프타이머 3초로 손 떨림을 없앤다. 화면은 최저 밝기로, 플래시는 끈다. 별과 사람을 같이 찍으려면 사람이 노출 시간 동안 움직이지 않아야 한다. 9월 말은 달의 위상이 관건인데, 9월 26일이 보름 근처라 투어 1일차(9월 30일) 밤은 달이 밝아 은하수보다 달빛 소금사막이 주인공이 될 가능성이 크다. 달빛 아래 하얀 평원도 충분히 비현실적이다."]},{"title":"남미의 아시아 대통령과 페루 정치","paragraphs":["페루는 1990년 일본계 알베르토 후지모리를 대통령으로 뽑았다. 그는 내전을 끝내고 경제를 안정시켰지만 독재와 부패로 결국 감옥에 갔고, 딸 게이코는 세 번 대선에서 아슬아슬하게 졌다. 페루 정치는 그 뒤로도 격동이다. 2016년부터 2023년까지 대통령이 여섯 명 바뀌었고, 2025년 말 또 교체됐으며, 2026년 4~6월 대선으로 새 정부가 7월 28일 취임했다. 리마 거리에서 시위를 보면 이 맥락이다. 관광지 치안과는 별개이니 걱정할 일은 아니고, 대통령궁 앞 아르마스 광장이 시위로 막히면 우회하면 된다."]},{"title":"리마의 중국, 그리고 한국","paragraphs":["리마에는 차이나타운(바리오 치노)이 있고 페루 전체에 중국 음식점 치파가 6천 곳이 넘는다. 1849년부터 온 중국인 계약 노동자 10만 명의 후예다. 페루 인구의 5% 이상이 중국계 혈통을 갖고 있다는 추정이 있고, 볶음밥 차우파와 로모 살타도는 이 만남의 결과다. 한국과의 인연은 2011년 발효된 한·페루 FTA와 K-팝이다. 미라플로레스에는 한식당이 몇 곳 있어 고산 가기 전 마지막 한식을 먹을 수 있다. 칠레와의 FTA(2004)는 한국의 첫 자유무역협정이고, 그래서 콘차 이 토로 와인이 한국 마트에 그렇게 많다."]}]},"nature":{"id":"nature","name":"자연경관: 눈앞의 풍경이 만들어진 이야기","articles":[{"title":"리마 절벽은 강이 쌓은 자갈이다","paragraphs":["미라플로레스 해안 절벽(코스타 베르데)은 높이 70~100m의 자갈층이다. 바위가 아니라 리막 강이 수만 년 동안 안데스에서 실어 내려 쌓은 선상지(부채 모양 퇴적층)의 끝을 바다가 깎아 낸 것이다. 절벽을 가까이 보면 둥근 돌들이 층층이 박혀 있고, 그래서 비가 오면 쉽게 무너진다. 절벽 아래 도로 옆에 낙석 방지 그물이 촘촘한 이유다.","이 자갈층은 리마의 지하수 저장고이기도 하다. 비가 오지 않는 도시가 1천만 명을 먹이는 물의 대부분은 리막 강과 이 지하수에서 나온다. 절벽 위 공원의 초록 잔디는 전부 관개다. 해안 절벽에서 패러글라이더가 뜨는 것은 바다에서 절벽으로 부는 바람이 절벽에 부딪혀 위로 솟기 때문이고, 오후 2~5시가 바람이 가장 좋다."]},{"title":"이카의 오아시스는 어디서 물을 얻나","paragraphs":["사막 한복판의 와카치나 호수는 지하수가 지표로 솟은 곳이다. 안데스에서 내려온 이카 강은 대부분 사막 모래 속으로 스며들어 지하 수맥이 되고, 지형이 낮은 곳에서 다시 배어 나온다. 그래서 오아시스 주변 모래언덕은 겉은 바싹 말랐어도 몇 미터 아래는 젖어 있다. 근처 농장들이 아스파라거스·포도를 키우려 지하수를 퍼 올리면서 호수 수위가 내려간 것이 최근 20년의 문제다.","이카 사막의 모래는 원래 안데스의 암석이었다. 강이 깎아 바다까지 실어 가고, 파도가 해안에 뿌리고, 남쪽에서 늘 부는 바람이 다시 내륙으로 밀어 올려 사구가 됐다. 모래언덕은 지금도 1년에 몇 미터씩 북쪽으로 움직인다. 버기카가 넘는 언덕 능선이 칼처럼 날카로운 것은 바람이 바람맞이 쪽은 완만하게, 반대쪽은 급하게 깎기 때문이다. 샌드보딩은 이 급경사면에서 한다."]},{"title":"페루 중부에 화산이 없는 이유","paragraphs":["안데스 전체가 화산 지대인데 리마에서 쿠스코까지 페루 중부에는 활화산이 하나도 없다. 볼리비아·칠레 국경에 가면 화산이 줄지어 서 있는데 말이다. 이유는 판이 파고드는 각도다. 페루 중부 아래 나스카판은 거의 수평으로 미끄러져 들어가(평판 섭입) 마그마가 생길 깊이까지 내려가지 않는다. 남쪽 아레키파 부근부터 판이 급하게 꺾이면서 다시 화산이 나타난다. 우유니 투어에서 보는 화산들(오야궤, 리칸카부르)과 아레키파의 미스티 화산은 그 결과다.","대신 페루 중부는 지진이 잦다. 얕게 파고드는 판은 넓은 면적에서 마찰을 일으켜 큰 지진을 만든다. 1970년 안카시 지진(7만 명 사망)과 2007년 피스코 지진이 그것이다. 쿠스코 주변의 산들이 높지만 뾰족한 화산 모양이 아니고 주름진 습곡 산지인 것도 같은 이유다."]},{"title":"마추픽추는 왜 거기 지어졌나","paragraphs":["마추픽추가 앉은 봉우리는 거대한 화강암 덩어리다. 2억 5천만 년 전 땅속에서 식은 마그마가 화강암이 되고, 안데스 융기로 솟아오르며 두 개의 단층이 교차하는 자리에 놓였다. 단층을 따라 바위가 이미 잘게 갈라져 있어서 잉카 석공들은 채석장에서 돌을 떼어 내기가 쉬웠다. 유적 안의 채석장 구역에 반쯤 쪼개진 돌들이 그대로 있다.","또 하나는 물이다. 우루밤바 강은 마추픽추 봉우리를 세 방향에서 감싸 흐르며 300m 아래 협곡을 만들었다. 이 강은 안데스 동쪽 사면의 구름이 비로 내리는 곳이라 연 2,000mm가 온다. 잉카는 산 위 샘에서 물을 끌어와 16개의 분수를 이었고, 계단식 밭 밑에 자갈층을 깔아 배수를 해결했다. 유적이 500년간 산사태를 견딘 것은 이 지하 공사 덕분이다. 우루밤바 강 협곡을 기차로 내려가면서 식생이 고산 초원에서 열대 밀림(운무림)으로 바뀌는 것을 보게 된다. 해발 3,400m에서 2,000m로 내려가는 사이 안데스와 아마존이 만나는 경계를 지나는 셈이다."]},{"title":"사라지는 빙하와 무지개산","paragraphs":["비니쿤카가 2015년경 갑자기 나타난 것은 그 위를 덮고 있던 얼음과 눈이 사라졌기 때문이다. 페루는 세계 열대 빙하의 70%를 갖고 있는데, 1970년 이후 그 절반 이상이 녹았다. 쿠스코에서 보이는 아우상가테(6,384m)와 성스러운 계곡의 살칸타이(6,271m), 베로니카(5,893m)의 흰 봉우리가 매년 조금씩 작아진다.","빙하가 녹으면 처음에는 물이 늘어 농사가 잘되고, 빙하가 다 사라지면 건기에 강이 마른다. 쿠스코 주변 마을들은 이미 그 두 번째 단계로 들어가고 있다. 비니쿤카 줄무늬가 예쁜 색으로 보이는 것은 광물의 색이기도 하지만, 그 색을 드러낸 것이 기후 변화라는 것을 알고 보면 다른 감정이 든다. 말을 타고 오를 때 발밑에 굴러다니는 둥근 돌들은 빙하가 갈아 만든 것이다."]},{"title":"티티카카의 이상한 생물들","paragraphs":["해발 3,800m 호수에는 여기서만 사는 생물이 산다. 티티카카 거대개구리는 몸길이 20cm에 피부가 축 늘어져 주름이 많다. 산소가 적은 물에서 피부로 호흡하기 위해 표면적을 늘린 것이다. 1969년 자크 쿠스토 탐사대가 이 개구리를 처음 세계에 알렸다. 지금은 남획과 오염으로 멸종 위기이고 푸노 시장에서 개구리 주스가 팔리던 시절도 끝나 가고 있다.","날지 못하는 티티카카 논병아리, 호수 바닥의 토토라 갈대, 그리고 우로족이 먹는 갈대 밑동 흰 부분은 모두 이 호수의 산물이다. 반면 식당 메뉴의 송어는 1930년대 북미에서 들여온 외래종이다. 송어가 토착 어종을 몰아냈지만 지금은 호수 경제의 중심이다. 호수 물은 염분이 약간 있어 살짝 짠맛이 나고, 수온은 연중 10~14도로 수영은 무리다."]},{"title":"알티플라노의 야생동물 구별법","paragraphs":["푸노에서 우유니까지 고원 도로 옆에 보이는 동물은 대개 네 가지다. 목이 길고 우아하게 서 있으면 야생 비쿠냐(황갈색, 배가 흰색). 뭉툭하고 털이 폭신하면 방목 알파카. 크고 귀가 휘어 있으면 야마. 아르마딜로처럼 낮게 뛰어가면 비스카차인데, 토끼 몸에 긴 꼬리가 달린 설치류로 우유니 투어 기암 지대 바위 틈에서 볕을 쬔다. 기사가 차를 세우고 손짓하면 대개 비스카차다.","플라밍고는 세 종이 섞여 산다. 가장 흔한 칠레 플라밍고는 다리가 회색에 무릎이 붉고, 안데스 플라밍고는 다리가 노랗고 몸이 크며, 제임스 플라밍고는 가장 작고 눈 주위가 붉다. 라구나 콜로라다는 세 종을 한 번에 볼 수 있는 세계 유일의 장소로 꼽힌다. 호수 물을 쳐서 붉은 조류를 걸러 먹는 방식이 몸을 분홍색으로 만든다. 안데스 여우와 안데스 콘도르는 운이 좋으면 본다. 콘도르는 라 라야 고개 부근 상공에서 가끔 원을 그린다."]},{"title":"우유니 소금사막의 계절과 거울","paragraphs":["소금사막은 1년에 두 얼굴을 가진다. 12~3월 우기에는 주변 산에서 흘러든 물이 소금 껍질 위에 몇 cm 고여 세계 최대의 거울이 된다. 4~11월 건기에는 물이 증발해 순백의 평원과 육각형 무늬가 드러난다. 우리가 가는 9월 말은 건기 끝이라 완전히 마른 상태이고, 기사들이 아는 몇 군데 낮은 지점에만 물이 남아 있다. 여행사가 물찬 포인트를 항상 찾을 수 있다고 하는 것은 이 지점을 말한다.","거울이 없는 대신 건기의 장점이 있다. 지프가 소금평원 어디든 달릴 수 있어 잉카와시 섬과 소금 채취장까지 들어가고, 밤에 소금 위에 서서 별을 볼 수 있다. 우기에는 물 때문에 못 하는 일들이다. 소금 표면은 낮에 60도까지 뜨거워지고 밤에는 영하로 떨어져 하루 온도차가 50도를 넘는다. 이 열팽창과 수축이 육각형 가장자리를 볼록하게 만든다. 발에 밟히는 오돌토돌한 능선이 그것이다."]},{"title":"화산 사이를 달리는 길","paragraphs":["우유니 투어 2~3일차는 볼리비아와 칠레 국경을 따라 늘어선 화산 벨트 안을 달린다. 오야궤(5,868m)는 정상 옆에서 늘 연기가 나는 활화산으로, 2일차 오후에 오른쪽으로 보인다. 라구나 콜로라다 주변의 붉은 흙과 실로리 사막의 자갈은 화산재와 용암이 풍화된 것이고, 아르볼 데 피에드라(돌 나무)는 화산암이 바람에 아래쪽만 깎여 버섯 모양이 된 것이다. 이곳 바람은 오후에 시속 60~80km로 불어 지프 문을 열 때 조심해야 한다.","솔 데 마냐나의 진흙 구덩이와 증기는 땅속 3km 아래 마그마가 지하수를 데우는 현장이다. 볼리비아는 여기에 남미 최고 고도의 지열 발전소를 짓고 있다. 국경의 리칸카부르는 대칭이 완벽한 원뿔 화산으로 1만 년 안에 폭발한 기록은 없지만 휴화산으로 분류된다. 정상 분화구 호수는 수온이 영하에 가까운데도 얼지 않고 미생물이 사는데, 화성 탐사를 준비하는 과학자들이 여기서 잠수한 적이 있다."]},{"title":"아타카마의 달의 계곡과 소금 산맥","paragraphs":["산페드로 마을 서쪽 코르디예라 데 라 살(소금 산맥)은 이름 그대로 소금과 점토가 섞인 산맥이다. 2천만 년 전 이곳은 얕은 호수였고, 물이 증발하면서 두꺼운 소금·석고층이 쌓였다. 안데스가 밀어 올리면서 이 층이 구겨지고 기울어져 톱니 같은 능선이 됐다. 달의 계곡은 그 능선 사이의 침식 지형으로, 비가 거의 오지 않아 바람만이 조각을 하고 있다. 저녁에 기온이 떨어지면 소금 결정이 수축하며 딱딱 소리를 내는데, 현지인들은 산이 노래한다고 말한다.","산페드로에서 칼라마로 가는 길에 지나는 아타카마 소금 평원(살라르 데 아타카마)은 우유니보다 작지만 리튬 생산은 세계 1~2위다. 표면이 흰색이 아니라 갈색으로 울퉁불퉁한 것은 소금이 오래 노출되어 먼지와 섞였기 때문이다. 이 평원 아래 염수에서 리튬을 뽑아 증발 연못에서 농축하는 시설이 도로 멀리 보인다. 주변 원주민 공동체는 물 사용 문제로 광산 회사와 오랫동안 다투고 있다."]},{"title":"안개가 키우는 사막, 꽃이 피는 사막","paragraphs":["칠레 북부 해안에는 카만차카라는 안개가 아침마다 밀려온다. 훔볼트 해류 위에서 생긴 이 안개는 해안 산맥에 걸려 물방울을 떨어뜨리고, 그것만으로 사는 식물 군락이 있다. 페루의 로마스와 같은 원리다. 아타카마 일부 마을은 안개 그물을 세워 하루 수백 리터의 물을 모은다.","몇 년에 한 번 엘니뇨 해에 아타카마 남부에 비가 내리면 수십 년간 땅속에서 기다린 씨앗이 한꺼번에 발아해 사막이 보라색·노란색 꽃밭이 된다. 꽃피는 사막(데시에르토 플로리도)이라 부르고, 가장 최근에는 2022년과 2024년에 크게 피었다. 우리가 가는 9월 말~10월 초가 바로 그 시기이지만 산페드로 일대는 너무 건조해 해당되지 않고, 산티아고 북쪽 500km의 코피아포 부근 일이다. 칠레 뉴스에서 꽃 사진이 나오면 그 이야기다."]},{"title":"태양은 머리 위에, 달은 거꾸로","paragraphs":["리마는 남위 12도, 쿠스코는 13도로 열대 안에 있다. 9월 23일 추분 전후에는 태양이 정오에 거의 머리 바로 위에 온다. 그림자가 발밑으로 사라지고, 모자 없이는 정수리가 탄다. 한국에서 보던 것처럼 해가 남쪽에 낮게 걸리는 일이 없어 방향 감각이 흔들린다. 리마 구시가지에서 해를 보고 남북을 판단하면 틀린다.","밤에는 달이 뒤집혀 보인다. 남반구에서는 초승달의 밝은 쪽이 한국과 반대이고, 달 표면의 토끼 무늬도 위아래가 바뀐다. 해와 달이 모두 북쪽 하늘을 지나가고, 오리온자리는 거꾸로 서 있다. 우유니에서 별을 볼 때 익숙한 별자리를 못 찾는 것은 정상이다. 대신 남십자성과 마젤란 은하가 그 자리를 채운다."]},{"title":"산티아고 분지와 안데스의 눈","paragraphs":["산티아고는 해안 산맥과 안데스 사이에 낀 분지다. 겨울에는 찬 공기가 분지 바닥에 깔려 뚜껑처럼 덮이고, 그 아래 매연이 갇혀 남미에서 대기질이 나쁜 도시로 꼽힌다. 10월 초 봄에는 이 뚜껑이 자주 열려 비 온 다음 날 동쪽으로 눈 덮인 6천m 봉우리들이 도시 바로 뒤에 서 있는 것처럼 보인다. 산크리스토발 언덕에서 이 장면을 보려면 오전이 유리하다.","산티아고를 먹이는 물은 이 눈이다. 마이포 강과 마포초 강은 안데스 겨울 눈이 봄에 녹은 물이고, 그래서 봄이 수량이 가장 많다. 도심을 가르는 마포초 강이 10월에 흙탕물로 콸콸 흐르는 이유다. 최근 10년간 칠레 중부는 기록적인 가뭄(메가 가뭄)을 겪어 눈이 적게 내렸고, 산티아고 상수 제한 논의가 이어졌다. 콘차 이 토로 와이너리의 마이포 계곡 포도밭도 이 눈 녹은 물로 관개한다."]}]},"myth":{"id":"myth","name":"신화와 민속: 안데스가 믿는 것들","articles":[{"title":"비라코차, 티티카카에서 세상을 만들다","paragraphs":["안데스 창조신화의 주인공은 비라코차다. 세상이 어둠뿐이던 때 비라코차가 티티카카 호수에서 솟아올라 해와 달과 별을 만들었고, 태양의 섬(이슬라 델 솔)의 바위가 그 자리라고 한다. 처음 만든 인간들은 마음에 들지 않아 돌로 만들어 버렸는데, 티와나쿠 유적에 서 있는 거대한 석상들이 그 첫 인류라는 설명이 따라붙는다. 그다음 진흙으로 다시 사람을 빚어 각 부족에게 옷과 말과 노래를 주고 땅속으로 보냈고, 사람들은 동굴과 샘과 산에서 솟아났다. 그래서 안데스 마을마다 \"우리 조상이 나온 바위\"가 있다.","비라코차는 일을 마치자 거지 노인 모습으로 북서쪽으로 걸어가 에콰도르 해안에서 바다 위를 걸어 사라졌다. 언젠가 돌아온다는 약속과 함께. 1532년 피부가 희고 수염이 난 스페인인들이 바다에서 나타났을 때 잉카가 잠시 망설인 이유를 여기서 찾는 학자들이 있다. 실제로 잉카는 스페인인을 \"비라코차\"라고 불렀고, 페루 시골에서는 지금도 백인 외국인을 그렇게 부르는 어른들이 있다. 푸노에서 배를 타고 호수를 볼 때, 이 물이 안데스 사람들에게는 세상이 시작된 자리라는 것을 기억할 만하다."]},{"title":"만코 카팍의 황금 지팡이","paragraphs":["잉카 왕조의 건국 신화는 두 가지 판본이 있다. 하나는 태양신 인티가 아들 만코 카팍과 딸 마마 오크요를 티티카카 호수에 내려보냈다는 것. 인티는 황금 지팡이를 주며 \"지팡이가 한 번에 땅에 박히는 곳에 도시를 세우라\"고 했고, 남매는 북쪽으로 걸어가 쿠스코 분지에서 지팡이가 사라지듯 땅에 꽂히는 것을 보았다. 그 자리가 코리칸차, 태양의 신전이다. 다른 판본은 쿠스코 남쪽 파카리탐보의 동굴에서 네 형제와 네 자매(아야르 형제)가 나왔다는 것으로, 힘이 너무 센 형은 동굴에 가둬 버리고 다른 형은 날개가 돋아 돌이 되었다는 식의 거친 이야기다.","두 판본이 공존하는 것은 잉카가 정복한 부족마다 다른 신화를 갖고 있었고, 잉카 자신도 필요에 따라 역사를 고쳐 썼기 때문이다. 스페인 연대기 작가들이 받아 적은 것이 우리에게 남은 전부인데, 그들은 잉카가 \"겨우 100년 전에 나타난 벼락출세한 왕조\"라는 점을 강조하고 싶어 했다. 쿠스코 아르마스 광장의 분수 위에 서 있는 황금 동상이 바로 그 만코 카팍(또는 파차쿠텍)이다."]},{"title":"파차마마에게 첫 모금을","paragraphs":["볼리비아나 페루 시골에서 술을 마실 때 사람들이 첫 모금을 땅에 조금 붓는 것을 보게 된다. 차야(ch'alla)라고 하는 이 행동은 대지의 어머니 파차마마에게 먼저 드린다는 뜻이다. 새 차를 사면 맥주를 바퀴에 뿌리고, 집을 지으면 기초에 야마 태아를 묻는다. 라파즈 마녀시장에서 파는 말린 야마 태아가 그 용도다. 파차마마는 자애로운 어머니이면서 동시에 배고픈 존재라서, 8월에는 겨울잠에서 깨어난 땅이 \"입을 벌린다\"고 하여 한 달 내내 제물을 바친다.","코카잎을 씹을 때도 예법이 있다. 잘생긴 잎 세 장을 고른 킨투(k'intu)를 손에 들고 산과 땅에 입김을 불어 바친 다음 씹는다. 세 장은 세 세계(하늘·땅·지하)다. 관광객이 이걸 다 지킬 필요는 없지만, 현지인이 음료를 땅에 붓는 것을 보고 실수라고 웃지는 말 것. 안데스 가톨릭은 파차마마를 성모 마리아와 겹쳐 놓았기 때문에 성당 안의 성모상이 산 모양 치마를 입고 있는 경우가 있다. 라파즈 대성당이나 포토시 그림의 \"산 모양 성모\"가 유명하다."]},{"title":"아푸: 산은 신이다","paragraphs":["안데스에서 높은 산은 풍경이 아니라 인격이다. 아푸(Apu)라고 부르는 산신은 마을을 지키고 가축을 불리고 날씨를 정한다. 쿠스코 사람들의 아푸는 아우상가테(6,384m)와 살칸타이, 라파즈 사람들의 아푸는 도시 위에 우뚝한 이이마니(6,438m)다. 여행 중 산이 잘 보이는 날 기사나 가이드가 \"아푸가 우리를 맞아 준다\"고 말하면 인사치레가 아니라 진심에 가깝다. 아푸에게는 데스파초(despacho)라는 제물 꾸러미를 태워 바친다. 코카잎, 사탕, 야마 기름, 색종이, 별 모양 사탕이 들어가고, 파케(paqo)라는 사제가 태운 연기가 곧게 오르면 받아들여진 것이다.","가장 큰 순례는 5~6월 보름 즈음 아우상가테 자락 시나카라 빙하에서 열리는 코이유르 리티(Qoyllur Rit'i)다. 수만 명이 해발 4,700m 빙하 앞에서 밤새 춤추고, 곰 가면을 쓴 우쿠쿠들이 빙하에 올라가 얼음을 잘라 내려온다. 그 얼음물이 한 해의 축복이었는데, 빙하가 후퇴하면서 2000년대부터 얼음 채취를 금지했다. 비니쿤카로 가는 길에 보이는 아우상가테의 흰 봉우리가 바로 그 산이다."]},{"title":"에케코, 담배 피우는 풍요의 신","paragraphs":["라파즈 기념품 가게마다 있는 콧수염 난 뚱뚱한 아저씨 인형이 에케코(Ekeko)다. 몸에 미니어처 집, 자동차, 돈다발, 쌀 포대를 주렁주렁 매달고 있는데, 원하는 것을 작게 만들어 그에게 걸어 두면 1년 안에 진짜가 된다고 믿는다. 매년 1월 24일 라파즈에서 열리는 알라시타스 축제가 그 장이다. 사람들은 정오에 미니어처 지폐(100만 볼리비아노짜리)와 미니 집, 미니 졸업장, 심지어 미니 여권과 미니 비자를 사서 야티리(주술사)에게 축복을 받고 성당에서 성수도 뿌린다. 2017년 유네스코 무형유산이 되었다.","에케코를 모실 때 지켜야 할 규칙이 있다. 화요일과 금요일에 입에 담배를 물려 줘야 하고, 담배가 끝까지 타면 소원이 이루어진다. 원래는 알티플라노의 아이마라 신이었고, 스페인 식민 시대에 라파즈가 원주민 봉기에 포위된 1781년 이후 지금의 축제 형태가 됐다고 한다. 뮌헨 박물관에 있던 원조 에케코 석상은 2014년 볼리비아에 반환되어 라파즈 국립 민족지박물관에 있다. 기념품으로 산다면 담배는 꼭 물려 주자."]},{"title":"광산의 주인, 엘 티오","paragraphs":["포토시와 오루로의 광부들은 땅 위는 하느님 것이지만 땅속은 티오(El Tío, 아저씨)의 것이라고 말한다. 갱도 입구마다 뿔 달린 점토상이 앉아 있고, 광부들은 들어가기 전에 코카잎, 담배, 96도짜리 알코올을 바친다. 티오가 만족하면 광맥을 내주고, 화나면 무너뜨린다. 스페인인들이 광부를 겁주려고 악마상을 세운 것이 뒤집혀 광부들의 수호신이 되었다는 설명이 일반적이다. 광부들은 갱도 안에서 \"디아블로\"라는 말을 쓰지 않는다. 그 이름을 부르면 온다고 믿기 때문이다.","오루로 카니발의 대표 춤 디아블라다(악마의 춤)가 여기서 나왔다. 화려한 악마 가면을 쓴 무용수들이 대천사 미카엘에게 결국 굴복하는 내용인데, 볼리비아 사람들은 이 춤이 페루 푸노의 칸델라리아 축제에 등장하는 것을 두고 \"우리 것을 훔쳐 갔다\"며 오래 다투고 있다. 푸노에서 보는 가면과 라파즈에서 파는 가면이 같은 이유다. 우유니 가는 길 볼리비아 고원의 광산 마을들은 모두 티오를 모신다."]},{"title":"냐티타스: 해골을 집에 모시는 날","paragraphs":["매년 11월 8일 라파즈 공동묘지에는 사람들이 해골을 안고 줄을 선다. 냐티타스(Ñatitas, 납작코들)라고 부르는 이 해골은 대개 신원을 모르는 사람의 것인데, 집에 모셔 두면 도둑을 막고 병을 고치고 소원을 들어준다고 믿는다. 이날 해골에 모자를 씌우고 선글라스를 끼우고, 담배를 물리고, 꽃과 코카잎으로 장식해 축복을 받으러 온다. 가톨릭 교회는 오랫동안 금지하다가 지금은 묘지 예배당에서 미사를 열어 준다.","안데스에서 죽음은 끝이 아니라 관계의 연장이다. 잉카 황제의 미라는 죽은 뒤에도 궁전에 살면서 시종을 두고 축제에 참석했고, 살아 있는 후계자와 \"상의\"했다. 스페인인들이 가장 이해하지 못한 것이 이 점이었다. 11월 1~2일 죽은 자의 날(Todos Santos)에는 볼리비아 가정이 빵으로 만든 사다리와 인형(탄타와와), 사탕수수, 고인이 좋아하던 음식을 차린 제단을 만든다. 우리 제사상과 놀랍게 닮았다."]},{"title":"무지개 깃발과 위팔라","paragraphs":["쿠스코 시내에 걸린 일곱 색 무지개 깃발을 보고 성소수자 깃발로 오해하는 관광객이 많다. 쿠스코 깃발은 1978년 시가 채택한 것으로, 잉카 제국의 깃발이었다고 주장하지만 잉카에 깃발이 있었다는 확실한 기록은 없다. 볼리비아에서 보는 것은 다르다. 49개의 작은 정사각형을 대각선 무지개로 배열한 위팔라(Wiphala)는 아이마라 등 원주민의 상징으로, 2009년 헌법에서 볼리비아의 두 번째 국기가 됐다. 관공서에 삼색기와 나란히 걸린다. 2019년 정치 위기 때 경찰이 위팔라를 잘라 내는 장면이 원주민의 분노에 불을 붙였다.","안데스에서 무지개는 예쁜 것만은 아니었다. 무지개(쿠이치)는 하늘의 뱀 아마루(Amaru)와 연결되어, 여성이 무지개를 보고 있으면 몸에 들어와 병을 일으킨다는 믿음이 있어 입을 다물거나 손으로 가렸다. 티티카카에서 무지개가 뜨면 나이 든 아주머니들이 고개를 돌리는 것을 볼 수도 있다. 두 개의 머리를 가진 뱀 아마루는 잉카 왕의 이름(투팍 아마루)이자 물과 지하 세계의 상징이다."]},{"title":"콘도르, 퓨마, 뱀: 세 개의 세계","paragraphs":["안데스 우주는 세 층이다. 위 세계 하난 파차(하늘, 신, 조상)는 콘도르, 이 세계 카이 파차(살아 있는 우리)는 퓨마, 아래 세계 우쿠 파차(죽은 자, 씨앗, 물)는 뱀이 상징한다. 잉카 십자가 차카나(chakana)는 계단이 세 단씩 붙은 십자가로, 이 세 세계와 네 방위를 한 번에 그린 도형이다. 기념품 가게의 목걸이, 식당 벽, 호텔 로고에 끝없이 나온다. 잉카 건축의 계단식 창과 벽감이 모두 이 형태다.","쿠스코 도시는 퓨마 모양으로 설계됐다는 설이 유명하다. 삭사이와만 요새가 머리, 두 강이 합류하는 지점(푸막추판, \"퓨마의 꼬리\")이 꼬리이고 아르마스 광장은 심장이다. 항공사진으로 보면 그럴듯하지만 후대의 해석이라는 반론도 있다. 확실한 것은 잉카가 이 세 동물을 어디에나 새겼다는 점이다. 코리칸차의 벽, 오얀타이탐보의 물길, 티와나쿠의 태양의 문에 새겨진 얼굴들에서 찾아보면 된다. 콘도르 자세로 손을 뒤로 쭉 뻗고 마추픽추에서 사진 찍는 것도 여기서 왔다."]},{"title":"인티 라이미와 선택된 여자들","paragraphs":["매년 6월 24일 쿠스코 삭사이와만 언덕에서 열리는 인티 라이미(태양 축제)는 잉카 제국 최대 축제였다. 동지(남반구 6월)에 태양이 돌아오기를 비는 제의로, 황제가 황금 잔의 치차를 태양에 바치고 야마의 심장을 꺼내 점을 쳤다. 스페인이 1572년 금지했고, 지금 보는 축제는 1944년 쿠스코 지식인들이 연대기를 바탕으로 재구성한 연극에 가깝다. 그래도 수만 명이 모이고 배우 선발이 도시의 큰일이다.","축제를 준비한 것은 아클야(aclla), \"선택된 여자들\"이었다. 제국 전역에서 열 살 전후의 예쁜 소녀들을 뽑아 아클야와시(선택된 여자들의 집)에 모아 직조와 치차 양조를 가르쳤다. 가장 고운 옷감과 술은 이들이 만들었고, 일부는 귀족의 아내로, 일부는 태양의 아내로 평생 신전에서 살았다. 쿠스코의 산타 카탈리나 수녀원이 바로 아클야와시 터에 세워졌다. 스페인은 태양의 처녀들을 수녀로 바꿔 놓은 셈이다."]},{"title":"산 정상의 아이들: 카팍 코차","paragraphs":["1995년 아레키파 근처 암파토 화산(6,310m) 정상 부근에서 얼어 있는 잉카 소녀가 발견됐다. \"후아니타\"라고 이름 붙은 이 소녀는 500년 전 열두어 살에 산 정상에서 제물로 바쳐졌다. 1999년에는 아르헨티나 유야이야코 화산(6,739m)에서 세 아이가 발견됐는데 보존 상태가 워낙 좋아 팔의 솜털까지 남아 있었다. 카팍 코차(capacocha)라고 부르는 이 의식은 황제의 죽음이나 큰 재난 때 제국 각지에서 완벽한 아이를 골라 쿠스코로 데려와 축제를 벌인 뒤 몇 달을 걸어 산 정상으로 데려가 치차와 코카로 잠들게 하고 묻는 것이었다.","아이들의 머리카락을 분석한 결과 죽기 전 1년 동안 옥수수와 야마 고기, 코카, 술을 평소보다 훨씬 많이 먹였다는 것이 밝혀졌다. 선택된 순간부터 신의 신부로 대접받은 것이다. 부모에게는 영광이었다고 연대기는 적지만, 실제 마음이 어땠는지는 알 수 없다. 우유니에서 보이는 화산들, 아타카마의 리칸카부르 정상에도 잉카 제단이 있다. 리칸카부르(5,916m) 정상 분화구 호수 옆의 돌담이 그것이다. 잉카는 세계에서 가장 높은 곳에 신전을 지은 문명이다."]},{"title":"티티카카의 인어와 물속 도시","paragraphs":["차랑고를 잘 치고 싶은 청년은 악기를 밤새 폭포 옆에 두고 온다. 물의 인어(시레나)가 밤에 악기를 조율해 주고, 그 소리는 여자의 마음을 흔든다고 한다. 안데스의 인어는 유럽에서 온 이미지에 토착 물의 정령이 섞인 것으로, 푸노 대성당 정면의 조각에도 차랑고를 든 인어가 새겨져 있다. 호수 사람들에게 물은 언제나 다른 세계로 통하는 문이었다.","티티카카 호수 바닥에 잉카 이전의 도시가 잠겨 있다는 전설은 사실로 일부 확인됐다. 2000년 이탈리아 탐사대가 태양의 섬 근처 수심 20m에서 티와나쿠 시대의 신전 터와 길, 계단식 벽을 찾아냈고, 이후 볼리비아 정부의 수중 조사에서 수천 점의 제물(금판, 향로, 조개껍데기)이 나왔다. 호수 수위가 지금보다 낮았던 시절에 지어진 것들이 수위가 오르면서 잠겼다는 설명이 유력하다. 우로스 섬에서 배를 타고 갈 때 그 아래 어딘가에 천 년 전 신전이 있다."]},{"title":"아타카마의 사람들과 리칸카부르","paragraphs":["산페드로 사람들은 스스로를 리칸안타이(Lickan Antay)라고 부른다. 스페인 이전부터 아타카마 사막의 오아시스에 살았고, 잉카에 정복된 것은 겨우 1470년경이다. 마을 어디서나 보이는 완벽한 원뿔 화산 리칸카부르는 이들의 성산이다. 산에 함부로 오르면 안 되고, 정상 분화구 호수의 물은 신성하다. 산 이름의 뜻은 \"마을의 산\"이다. 지금 정상 등반은 볼리비아 쪽에서만 가능하고 칠레 쪽 사면에는 국경 분쟁 시절의 지뢰가 남아 있다.","칠레 북부 최대의 종교 축제는 7월 16일 이키케 근처 라 티라나 마을에서 열린다. 20만 명이 모여 \"중국인 춤(bailes chinos)\"이라 불리는 춤을 추는데, 중국과는 무관하고 케추아어로 \"하인\"이라는 뜻이다. 아타카마의 고고학 박물관을 세운 벨기에 신부 구스타보 르 파이헤는 1955년부터 이 지역에서 미라와 유물 수천 점을 모았고, 최근에는 그중 미라들을 후손 공동체의 요구로 전시에서 내렸다. 산페드로 광장 옆의 그의 이름을 딴 박물관은 그래서 유물 위주로 바뀌었다."]}]},"wild":{"id":"wild","name":"동물과 식물: 길에서 만나는 생명","articles":[{"title":"안데스 콘도르: 날개 3m, 날갯짓은 거의 안 한다","paragraphs":["안데스 콘도르는 날개를 펴면 3m가 넘고 몸무게 15kg에 이르는, 나는 새 중 가장 무거운 축이다. 그 무게로 날갯짓을 하면 금세 지치기 때문에 거의 활공만 한다. 한 연구에서 5시간 동안 단 한 번 날갯짓한 개체가 기록됐다. 아침 햇살에 땅이 데워져 상승기류가 생기는 오전 9~11시가 되어야 절벽에서 몸을 던지고, 흐린 날은 아예 나오지 않는다. 콘도르 관람지(아레키파 콜카 협곡, 쿠스코 근처 촌타 전망대)가 아침에 여는 이유다.","콘도르는 사냥을 하지 않고 죽은 동물만 먹는다. 머리에 털이 없는 것은 사체 속에 머리를 넣기 때문이고, 수컷은 이마에 볏이 있다. 수명 50~70년, 짝은 평생 하나, 2년에 알 하나. 그래서 개체수가 잘 늘지 않는다. 페루·볼리비아·칠레·에콰도르·콜롬비아 다섯 나라의 국조이자 국장에 들어간다. 라 라야 고개(4,335m)나 살칸타이 자락에서 하늘에 큰 원을 그리는 검은 점이 보이면 콘도르일 확률이 높다. 날개 끝 깃털이 손가락처럼 벌어져 있고 날개 윗면에 흰 띠가 있으면 확실하다."]},{"title":"비쿠냐: 세계에서 가장 비싼 털","paragraphs":["고원 도로 옆에서 사슴처럼 우아하게 서 있는 황갈색 동물이 비쿠냐다. 야마와 알파카의 야생 조상격으로, 털은 굵기 12마이크론으로 캐시미어(15)보다 가늘어 세계에서 가장 비싼 섬유다. 원사 1kg이 400달러를 넘고 코트 한 벌이 2~3만 달러다. 잉카 시대에는 황제만 입을 수 있었고, 4년에 한 번 수천 명이 산을 둘러싸 몰아 털을 깎고 놓아주는 차쿠(chaccu)를 했다. 죽이는 것은 금지였다.","스페인인은 총으로 잡았다. 1960년대에 6천 마리까지 줄어 멸종 직전이었다가 페루·볼리비아·칠레·아르헨티나가 보호 협약을 맺고 잉카식 차쿠를 부활시켰다. 지금은 50만 마리 이상이고, 마을 공동체가 털을 깎아 파는 수입이 고원 마을의 큰 몫이다. 페루 국장 왼쪽 위의 동물이 비쿠냐다. 기념품 가게에서 \"비쿠냐 100%\"를 싸게 판다면 가짜다. 진짜는 정부 인증표가 붙고 스카프 하나가 수십만 원이다. 알파카 스카프와 비쿠냐 스카프를 만져 보면 차이가 확실히 난다."]},{"title":"쿠이로 병을 알아낸다","paragraphs":["안데스 시골의 전통 치료사(쿠란데로)는 환자의 몸에 살아 있는 기니피그를 문지른다. 쿠이가 병을 빨아들인다고 믿고, 그다음 배를 갈라 장기를 살핀다. 쿠이의 간이 부어 있으면 환자의 간이 나쁜 것이다. 하카 샤크와(jaca shoqpi)라고 하는 이 진단법은 페루 병원 옆에서 지금도 행해진다. 쿠이는 5천 년 전에 가축화되었고 페루에서 한 해 6천만 마리 이상이 식탁에 오른다. 시골집 부엌 바닥에 쿠이가 돌아다니는 것은 흔한 풍경이다. 음식 찌꺼기를 먹고, 추울 때 부엌이 따뜻하고, 손님이 오면 바로 잡는다.","또 하나의 진단법은 달걀이다. 달걀을 몸에 굴린 뒤 물컵에 깨뜨려 흰자의 모양으로 \"수스토(susto, 놀람병)\"나 \"마르 데 오호(눈의 저주)\"를 읽는다. 놀람병은 영혼이 몸에서 떨어져 나간 상태로, 아이가 넘어지거나 개에게 물린 뒤 시름시름 앓으면 이 진단이 나온다. 치료는 영혼을 불러들이는 의식이다. 페루 보건부는 이런 전통 의료를 없애기보다 병원과 연결하는 정책을 쓴다. 쿠스코 산페드로 시장 안쪽에서 약초 파는 아주머니들이 이 세계의 입구다."]},{"title":"추뇨: 얼려서 밟아서 말린 감자","paragraphs":["알티플라노 시장에서 보이는 검고 쭈글쭈글한 돌 같은 것이 추뇨(chuño)다. 감자를 6월 서리 내리는 밤에 밖에 널어 얼리고, 낮에 녹으면 맨발로 밟아 물을 짜내고, 다시 얼리기를 며칠 반복한 뒤 햇볕에 말린다. 그러면 몇 년을 두어도 상하지 않는다. 잉카 제국이 창고(콜카)에 쌓아 군대를 먹이고 흉년을 견딘 비밀이 이것이다. 흰 추뇨(툰타)는 얼린 감자를 냇물에 한 달 담가 만들고, 더 비싸다.","맛은 솔직히 밍밍하고 식감은 스펀지 같다. 하지만 라파즈의 차이로 수프, 푸노의 국물 요리에 반드시 들어가며 볼리비아 사람들에게는 고향의 맛이다. 감자를 재배하는 고도 4천 미터의 땅에서 이런 저장 기술 없이는 문명이 불가능했다. 유럽에 감자가 건너간 것은 1570년경이고, 아일랜드 대기근(1845~52)은 안데스에서 온 한 품종에만 의존하다 병이 돌아 100만 명이 죽은 사건이다. 안데스에서는 한 밭에 수십 품종을 섞어 심어 그런 일이 없다."]},{"title":"키노아와 NASA","paragraphs":["키노아는 곡물이 아니라 시금치와 같은 명아주과 식물의 씨앗이다. 잉카는 \"어머니 곡식\"이라고 불렀고 파종 때 황제가 황금 삽으로 첫 씨를 뿌렸다. 스페인은 이교의 곡식이라며 재배를 억눌렀고, 키노아는 400년 동안 가난한 원주민의 음식으로만 남았다. 1993년 NASA가 우주 장기 체류 식량 후보로 꼽으면서 세상에 알려졌다. 필수 아미노산 9종을 다 갖춘 완전 단백질이고 글루텐이 없다.","2013년 유엔이 \"세계 키노아의 해\"로 정하자 가격이 세 배로 뛰었고, 정작 볼리비아 농민들은 자기 키노아를 못 먹게 됐다는 기사가 쏟아졌다. 몇 년 뒤 페루가 해안 지대에서 대량 재배하면서 가격은 내려왔다. 우유니 소금사막 가장자리가 키노아 레알(Quinoa Real)이라는 알이 굵은 최고급 품종의 원산지다. 소금기와 추위를 견디는 품종이다. 키노아 겉껍질의 사포닌은 쓴맛이 나고 거품이 이는데, 안데스 여인들은 이걸 비누로 썼다. 사촌 격인 키위차(아마란스)와 카니와도 시장에서 볼 수 있다. 카니와는 키노아보다 더 작고 갈색이며 볶아서 음료로 마신다."]},{"title":"시장 약초 사전: 무냐, 마카, 산 페드로","paragraphs":["쿠스코 산페드로 시장이나 푸노 시장의 약초 좌판에서 자주 보는 것들. 무냐(muña)는 안데스 박하로 잎을 뜯어 뜨거운 물에 우리면 속이 편해지고 고산증에도 좋다고 한다. 호텔 조식에 무냐 차가 있으면 마셔 볼 만하다. 마테 데 코카와 함께 가장 흔한 고산 음료다. 마카(maca)는 해발 4천 미터 후닌 고원의 무 같은 뿌리로, 정력제로 유명해져 중국 수출 붐이 일었다가 밀수 사건으로 시끄러웠다. 가루를 주스에 타 먹는다.","우냐 데 가토(고양이 발톱)는 아마존 덩굴로 면역에 좋다고 하고, 에르바 루이사는 레몬그라스 차, 마티코 잎은 상처에 붙인다. 산 페드로(San Pedro)는 다른 종류다. 이 기둥 선인장은 메스칼린을 함유해 3천 년 전 차빈 문명부터 무당의 환각제로 쓰였고, 쿠스코 주변에서 \"산 페드로 세레모니\"를 파는 곳이 많다. 페루에서 전통 의식은 합법이지만 관광객 사망 사고가 있었고, 아야와스카(아마존 덩굴 환각제) 의식은 더 위험하다. 호기심으로 손댈 것이 아니다. 시장에서 파란 선인장 토막을 팔고 있으면 그것이다."]},{"title":"옥수수 55색과 치차리아의 붉은 깃발","paragraphs":["페루에는 옥수수 품종이 55가지가 넘는다. 성스러운 계곡 우루밤바에서 나는 흰 옥수수는 알이 손톱만큼 커서 세계에서 가장 크고, 원산지 명칭 보호를 받는다. 삶은 옥수수와 치즈(초클로 콘 케소)로 판다. 보라색 옥수수를 끓인 치차 모라다는 안토시아닌 때문에 색이 진하고 계피·정향·파인애플 껍질을 넣어 달게 만든 음료다. 술이 아니다. 술은 치차 데 호라, 노란 옥수수를 싹 틔워 발효시킨 막걸리 같은 것으로, 잉카 시대에는 아클야(선택된 여자들)가 옥수수를 씹어 침으로 발효시켰다.","쿠스코 시골 마을이나 성스러운 계곡을 지날 때 집 문 앞 장대에 빨간 비닐봉지나 붉은 천이 걸려 있으면 치차리아, 즉 오늘 치차를 판다는 표시다. 안에는 큰 항아리와 긴 의자가 있고 한 잔에 1솔 정도다. 관광객이 마셔도 되지만 위생은 복불복이다. 프루티야다(딸기를 넣은 치차)는 마시기 쉽다. 참고로 옥수수의 원산지는 멕시코이고 안데스로 온 것은 약 6천 년 전이다. 감자와 키노아가 고원의 곡식이라면 옥수수는 계곡의 곡식이고, 잉카는 옥수수를 신의 음식으로 더 높이 쳤다."]},{"title":"세계에서 가장 높은 숲, 폴리레피스","paragraphs":["나무가 자랄 수 없을 것 같은 해발 4천~5천 미터에 나무가 있다. 폴리레피스(케추아어로 케냐)는 종이처럼 겹겹이 벗겨지는 붉은 껍질을 가진 작고 뒤틀린 나무로, 세계에서 가장 높은 곳에 사는 나무다. 껍질이 겹겹인 것은 밤의 영하 추위를 막는 단열재다. 잉카 시대에는 고원 곳곳에 이 숲이 있었는데 연료와 숯으로 베어 내고 스페인이 들여온 양과 소가 어린나무를 먹어 치워 지금은 원래의 2~3%만 남았다.","쿠스코 주변 마을들은 2000년부터 매년 12월 \"케우냐 라이미\"라는 나무 심기 축제를 연다. 하루에 수만 명이 모여 폴리레피스 묘목 10만 그루를 심고, 지금까지 300만 그루를 넘겼다. 비니쿤카나 성스러운 계곡 위쪽에서 붉은 껍질의 작은 나무 군락이 보이면 그것이다. 그 숲에는 여기서만 사는 새(황갈색 개미새, 흰뺨꼬리치레 등)와 안데스 고양이의 먹이가 되는 설치류가 산다. 고원의 물을 저장하는 스펀지 역할도 해서 마을 사람들은 \"숲이 있으면 샘이 마르지 않는다\"고 말한다."]},{"title":"백 년에 한 번 피고 죽는 꽃, 푸야 라이몬디","paragraphs":["안데스 고원 4천 미터 언저리에 사람 키 세 배쯤 되는 거대한 꽃대가 서 있으면 푸야 라이몬디다. 파인애플과 식물로 세계에서 가장 큰 꽃차례를 가졌다. 40년에서 100년 동안 잎 뭉치로만 살다가 단 한 번 10m 높이의 꽃대를 올려 8천~2만 송이 꽃을 피우고, 씨앗 수백만 개를 뿌리고 죽는다. 꽃이 피면 벌새 수십 마리가 몰려들어 잔치를 벌인다. 이름은 19세기 페루를 누비며 자연을 기록한 이탈리아인 안토니오 라이몬디에서 왔다.","가장 유명한 군락은 리마 북쪽 안카시의 와스카란 국립공원이지만, 우리 코스에서는 비니쿤카로 가는 길이나 아우상가테 자락, 티티카카 주변 고원에서 드문드문 볼 수 있다. 가시 돋친 잎 뭉치에 새가 걸려 죽어 있는 경우가 있어 \"새를 잡아먹는 식물\"이라는 소문이 있는데, 잎 가시가 안쪽으로 굽어 있어 우연히 걸린 것일 뿐 소화하지는 않는다. 마을 사람들이 꽃대를 잘라 불쏘시개로 쓰거나 밭을 넓히면서 개체수가 줄고 있다. 발견했다면 꽃이 핀 것을 보는 것은 대단한 행운이다."]},{"title":"사막의 펭귄과 새똥의 섬","paragraphs":["파라카스 바예스타스 섬에서 만나는 훔볼트 펭귄은 열대 사막 해안에 사는 펭귄이다. 남극에서 올라오는 차가운 훔볼트 해류가 물고기를 잔뜩 실어 오기 때문에 가능하다. 남미 바다사자 수천 마리가 바위에서 짖고, 하늘을 메운 새들은 구아나이 가마우지, 페루 부비, 갈색 펠리컨이다. 이 새들이 수천 년 싼 똥이 쌓여 50m 두께의 구아노층이 됐고, 19세기 페루는 이 새똥을 유럽에 비료로 팔아 나라를 먹였다. 배 위에서 모자를 쓰라고 하는 이유는 낭만이 아니다.","배가 섬으로 가는 길에 해안 모래 언덕에 새겨진 거대한 촛대 문양(칸델라브로)을 지난다. 높이 180m, 나스카 라인과 비슷한 시기(기원전 200년경)의 것으로 추정하지만 누가 왜 그렸는지는 모른다. 뱃사람의 이정표였다는 설, 선인장 문양이라는 설이 있다. 12월에서 3월 사이 엘니뇨가 오면 물고기가 사라지고 새들이 굶어 죽어 섬이 텅 빈다. 훔볼트 펭귄은 멸종 취약종이고, 칠레 북부 해안에서도 볼 수 있다. 9월 말은 바다사자 새끼가 태어나기 직전이라 수컷들이 시끄럽다."]},{"title":"벌새 중의 벌새, 그리고 밤에 얼지 않는 법","paragraphs":["성스러운 계곡이나 마추픽추 근처에서 참새만 한 벌새가 느릿느릿 날면 자이언트 벌새다. 몸길이 20cm로 세계에서 가장 큰 벌새인데, 다른 벌새가 초당 80번 날갯짓을 할 때 이 녀석은 10~15번만 해서 마치 큰 나방처럼 보인다. 해발 4천 미터까지 산다. 벌새가 안데스 고원에서 살 수 있는 것은 놀라운 일이다. 몸이 작을수록 열을 빨리 잃는데, 고원의 밤은 영하로 떨어지기 때문이다.","안데스 산벌새(오레오트로킬루스)는 밤마다 스스로 체온을 5도 가까이 떨어뜨려 가사 상태(토포)에 들어간다. 심장이 분당 1,200번 뛰다가 50번으로 느려지고, 바위 틈에서 죽은 듯이 밤을 나고 아침 햇살에 깨어난다. 티티카카 주변과 우유니 가는 길의 바위 지대에서 볼 수 있다. 페루에는 벌새가 120종 넘게 있고 마추픽추 유적 안에도 십여 종이 산다. 유적 안에서 붉은 부리를 가진 작은 새가 꽃 앞에 정지해 있으면 잠깐 멈춰 볼 것. 잉카 금세공에도 벌새는 단골 문양이고, 나스카 라인의 벌새는 가장 유명한 그림이다."]},{"title":"친칠라: 코트 한 벌에 백 마리","paragraphs":["칠레 북부 안데스가 고향인 친칠라는 세계에서 가장 부드러운 털을 가진 동물이다. 털구멍 하나에서 털이 60가닥씩 나온다. 그 부드러움이 재앙이었다. 19세기 말 유럽에서 친칠라 코트가 유행하자 매년 수십만 마리가 잡혀 나갔고, 코트 한 벌에 100~150마리가 들어갔다. 1900년대 초 거의 멸종했고, 지금 야생 친칠라는 칠레 중북부 일라펠 근처의 작은 국립보호구역에 몇천 마리만 산다. 1923년 미국인 채프먼이 11마리를 캘리포니아로 데려가 번식시킨 것이 오늘날 전 세계 애완 친칠라의 조상이다.","우유니 투어의 바위 지대에서 보는 비스카차는 친칠라의 사촌으로, 토끼 얼굴에 긴 꼬리가 달렸고 털이 그만큼 곱지 않아 살아남았다. 낮에 바위 위에서 볕을 쬐다가 사람이 오면 굴로 뛰어든다. 아타카마의 달의 계곡 근처, 산페드로 주변 바위에서도 보인다. 친칠라와 비스카차는 모래 목욕으로 털을 관리한다. 물에 젖으면 털이 마르지 않아 죽는다. 페루에서는 잉카 시대에 친칠라 털로 황제의 옷을 만들었다는 기록이 있다."]},{"title":"사막의 여우와 아메리카에서 가장 희귀한 고양이","paragraphs":["아타카마 관광지 주차장에 여우가 어슬렁거리면 쿨페오(안데스 여우)다. 붉은 털에 덩치가 크고, 관광객이 주는 과자에 길들어 겁이 없다. 먹이를 주면 안 된다. 사람 음식에 익숙해진 여우는 겨울에 굶어 죽고, 물면 광견병 검사가 필요하다. 라구나 콜로라다나 소금사막 가장자리에서도 본다. 볼리비아 사람들은 여우를 티와(tiwula)라고 부르며 교활한 이야기의 주인공으로 삼는다. 콘도르가 여우를 하늘 잔치에 데려갔다가 떨어뜨려 여우가 산산조각 나면서 세상에 키노아 씨앗이 퍼졌다는 이야기가 있다.","거의 볼 수 없지만 알아 둘 만한 것이 안데스 고양이(가토 안디노)다. 회색 바탕에 줄무늬, 굵은 꼬리를 가진 집고양이만 한 야생 고양이로 3천~5천 미터 바위 지대에 살며 전 세계에 1,500마리 정도 남았다. 남미에서 가장 희귀한 고양이다. 아이마라 사람들은 이 고양이를 티티(titi)라고 부르며 가축의 수호신으로 여겨 박제를 집에 걸었다. 티티카카라는 이름의 한 어원이 이 고양이(\"티티의 바위\")라는 설이 있다. 카메라 트랩에나 잡히는 동물이지만 우유니 투어 기사들 중 본 사람이 있다."]},{"title":"유칼립투스는 원래 없었다","paragraphs":["쿠스코 언덕과 라파즈 계곡을 덮은 키 큰 나무들, 성스러운 계곡 길가에 줄지어 선 나무들은 대부분 유칼립투스다. 안데스 나무가 아니라 호주 나무로, 1860년대에 페루에, 1900년 전후 볼리비아에 들여왔다. 빨리 자라고 광산 갱목과 철도 침목, 땔감으로 쓰기 좋아서 정부가 심기를 장려했다. 문제는 물을 엄청나게 빨아들여 주변 샘을 마르게 하고 잎이 떨어진 땅에는 다른 풀이 자라지 않는다는 것이다. 마을마다 \"유칼립투스를 뽑고 케냐(폴리레피스)를 심자\"는 운동이 있다.","칠레는 스케일이 다르다. 1970년대부터 소나무와 유칼립투스 조림에 보조금을 주어 중남부 300만 헥타르가 인공 숲이 됐고, 이 단일림이 2017년과 2023년 대형 산불의 원인으로 지목됐다. 산티아고 산크리스토발 언덕의 숲도 20세기 초에 심은 외래종이 대부분이다. 반대로 안데스 토종은 작고 못생긴 나무들이다. 기냐르 나무(볼리비아), 몰레(페루 후추나무, 분홍 후추 열매), 알가로보(콩깍지로 시럽을 만드는 사막 나무)가 그것이다. 이카에서 파는 알가로비나 시럽이 알가로보 열매다."]},{"title":"과일 이름 사전: 팔타에서 치리모야까지","paragraphs":["시장에서 만나는 과일 이름은 절반이 케추아어다. 아보카도는 페루·볼리비아·칠레에서 팔타(palta)다. 멕시코의 아과카테는 나와틀어, 팔타는 케추아어로 서로 다른 뿌리다. 페루는 세계 2위 아보카도 수출국이다. 루쿠마(lúcuma)는 페루 국민 아이스크림 맛으로, 단호박과 메이플 시럽 사이의 맛이 나는 주황색 과육이다. 치리모야(chirimoya)는 마크 트웨인이 \"인간에게 알려진 가장 맛있는 과일\"이라고 쓴 안데스 과일로, 겉은 초록 비늘, 속은 크림 같은 흰 과육에 검은 씨가 박혀 있다. 숟가락으로 떠먹는다.","그라나디야(granadilla)는 패션프루트의 순한 사촌으로 껍질을 깨고 후루룩 마시듯 먹으면 목이 아플 때 좋다. 툼보는 시고, 아과이만토(골든베리)는 주황색 꽈리로 새콤하다. 페피노는 오이가 아니라 멜론 맛 과일이고, 투나는 선인장 열매로 씨가 많다. 볼리비아 시장의 아차차이루는 시큼달콤한 아마존 과일이다. 칠레는 다르다. 9월 말 산티아고 시장에는 겨울 끝의 오렌지·키위·사과가 많고, 체리와 복숭아는 12월이다. 주스 가게에서 \"수르티도(surtido)\"는 여러 과일을 섞은 것, \"콘 레체\"는 우유를 넣은 것이다."]}]},"culture":{"id":"culture","name":"문화와 생활: 현지인처럼 읽기","articles":[{"title":"모자로 읽는 안데스 지도","paragraphs":["안데스에서 모자는 신분증이다. 쿠스코 주변의 몬테라(montera)는 원반처럼 납작하고 넓은 챙에 술이 달린 모자로 마을마다 무늬가 달라 어느 동네 사람인지 알 수 있다. 친체로 여자들은 붉은 몬테라, 피삭 여자들은 검은 바탕에 흰 술이다. 남자들이 쓰는 귀 덮개 달린 털모자 추요(chullo)는 타킬레 섬에서 색으로 미혼·기혼을 표시한다. 흰 부분이 있으면 미혼, 전부 붉으면 기혼, 추요 끝을 왼쪽으로 늘어뜨리면 애인이 없다는 뜻이다.","볼리비아 촐리타의 중절모(봄빈)는 20세기 초 영국 철도 노동자용으로 들여온 모자가 남자 머리에 너무 작아 여자들에게 팔았다는 이야기가 정설처럼 전해진다. 정수리에 얹듯 쓰는 것이 멋이고, 모자를 똑바로 쓰면 기혼, 옆으로 기울이면 미혼이나 과부라는 말이 있는데 지역마다 다르다. 좋은 봄빈은 이탈리아 보르살리노 제품으로 한 개에 수십만 원이다. 촐리타가 모자를 벗으면 긴 머리를 두 갈래로 땋고 끝을 검은 술(툴마)로 묶은 것이 보인다. 우유니 쪽 여자들은 챙이 넓은 흰 밀짚모자를 쓰고, 아타카마 사람들은 챙 넓은 펠트 모자를 쓴다. 사막의 해 때문이다."]},{"title":"아르마스 광장은 왜 다 똑같이 생겼나","paragraphs":["리마, 이카, 쿠스코, 푸노, 산티아고. 어느 도시나 중심에 정사각형 광장이 있고 한쪽에 대성당, 맞은편에 시청이 있다. 1573년 스페인 국왕 펠리페 2세가 반포한 인디아스 법이 신대륙 도시 건설 규격을 정했기 때문이다. 광장은 직사각형, 크기는 마차 행렬이 돌 수 있게, 도로는 바둑판, 성당은 광장에서 조금 높은 자리에, 상인 회랑은 광장 둘레에. 리마는 이 규격의 교과서였고, 쿠스코는 잉카의 대광장 우아카이파타 위에 그대로 덮어씌운 경우다. 잉카 광장은 지금의 두 배였고 바닥에 바다 모래를 깔았다.","광장 이름이 \"아르마스(무기)\"인 것은 식민 시대에 유사시 병력이 모이는 자리였기 때문이다. 산티아고 광장도, 리마 광장도 모두 같은 이름이다. 광장 둘레의 아케이드(포르탈)는 비와 해를 피하는 상점가이고, 광장 벤치는 도시의 거실이다. 구두닦이, 사진사, 아이스크림 장수, 연금 수급자들이 오후를 보낸다. 시골 도시일수록 오후 1시부터 3시까지 상점이 문을 닫는 시에스타가 남아 있고, 쿠스코 같은 관광 도시는 그렇지 않다. 일요일 아침 광장에서는 국기 게양식과 군악대 행진을 볼 때가 있다."]},{"title":"볼 키스, 카세라, 그리고 '치노'","paragraphs":["페루와 칠레에서 여자가 낀 인사는 오른쪽 볼을 한 번 맞대는 것이고 남자끼리는 악수다. 볼리비아 고원 사람들은 좀 더 거리를 두어 악수가 많다. 처음 보는 사이에 한국인이 볼 키스를 안 해도 실례가 아니다. 시장에서 단골 손님과 상인은 서로를 카세라(casera, 남자면 카세로)라고 부른다. \"카세리타, 얼마예요?\" 하고 부르면 값이 조금 내려간다. 젊은 사람은 호벤(joven), 여성은 세뇨리타, 나이 든 남자는 카바예로나 세뇨르다. 식당에서 종업원을 부를 때 \"호벤!\"이라고 하면 된다.","동양인은 나이와 상관없이 치노(chino)라고 불린다. 한국인이든 일본인이든 마찬가지이고 대체로 악의는 없다. 페루에서는 일본계 후지모리 대통령도 \"엘 치노\"였다. 그링고(gringo)는 미국인 또는 백인 외국인을 뜻하는 말로 역시 욕은 아니다. 대답할 때 \"소이 코레아노(한국 사람이에요)\"라고 하면 대개 반가워하고, 한류 이야기가 이어진다. 손짓도 다르다. 손바닥을 아래로 하고 까딱까딱하면 \"이리 와\"이고, 손을 펴서 흔들면 \"됐어요\"다. 엄지 척은 괜찮지만 OK 사인(엄지와 검지로 원)은 브라질과 달리 여기서는 문제없다."]},{"title":"아오리타는 언제인가","paragraphs":["\"아오리타(ahorita)\"는 \"지금 바로\"라는 뜻인데 실제로는 5분에서 두 시간 사이 어디쯤이다. 페루 사람들은 스스로 \"오라 페루아나(페루 시간)\"라고 부르며 웃고, 볼리비아는 \"오라 볼리비아나\"다. 초대 시간보다 한 시간 늦게 가는 것이 예의인 경우도 있다. 볼리비아 정부는 2000년대에 시계탑에 \"지금 도착하세요\"라는 표어를 붙이는 캠페인을 했지만 큰 효과는 없었다. 칠레는 상대적으로 시간을 지키는 편이고 산티아고 직장인들은 서두른다.","여행자에게 중요한 것은 예외다. 투어 버스, 기차, 비행기는 정확히 떠난다. 페루레일과 볼리비아 국내선은 늦게 온 사람을 기다려 주지 않는다. 반면 \"10분 후에 옵니다\"라는 택시나 \"곧 나옵니다\"라는 음식은 아오리타로 들으면 된다. 식당에서 계산서는 달라고 해야 온다. 먼저 가져오면 손님을 쫓는 것이라 여기기 때문이다. \"라 쿠엔타, 포르 파보르\"라고 말하고 5분은 기다릴 것. 마감 시간이 있을 때는 미리 말해 두는 것이 안전하다."]},{"title":"우리가 가는 9월 말, 세 나라의 달력","paragraphs":["페루 9월 24일은 메르세데스 성모의 날로 군의 수호성인이라 리마에 군 행렬이 있다. 10월은 리마의 \"보라색 달\"이다. 1655년 지진에서 살아남은 흑인 노예의 벽화 '기적의 주님(세뇨르 데 로스 밀라그로스)'을 모신 행렬이 10월 18·19·28일에 시내를 메우고, 시민들은 보라색 옷을 입고 투론 데 도냐 페파(꿀을 뿌린 과자)를 먹는다. 우리는 10월 초에 리마를 떠나지만 9월 말부터 거리에 보라색이 늘어나는 것을 볼 수 있다. 쿠스코는 9월 14일 성스러운 계곡의 세뇨르 데 우앙카 순례가 끝난 직후다.","칠레는 우리가 도착하기 열흘 전인 9월 18~19일이 독립기념일(피에스타스 파트리아스)이다. 법으로 모든 집과 건물에 국기를 걸어야 하고, 폰다라는 천막 장터에서 엠파나다와 치차, 테레모토를 먹고 쿠에카를 춘다. 9월 말 산티아고에는 그 여운이 남아 국기가 그대로 걸려 있고 슈퍼에 엠파나다가 쌓여 있다. 볼리비아는 우리 일정에 큰 축제가 없지만, 10월 첫 주 라파즈에서는 봄과 학생의 날(9월 21일) 뒤끝이 있다. 남반구에서 9월 21일은 봄의 첫날이자 사랑의 날이다. 젊은이들이 꽃을 주고받는다."]},{"title":"지폐 속 인물과 위조지폐","paragraphs":["페루 솔 지폐는 2021년부터 새 인물로 바뀌었다. 10솔은 가수 차부카 그란다, 20솔은 소설가 호세 마리아 아르게다스, 50솔은 역사학자 마리아 로스트워로프스키, 100솔은 로켓 선구자 페드로 파울레트, 200솔은 화가 틸사 츠치야다. 뒷면은 각각 페루의 동식물이다. 옛 지폐(비행사 키뇨네스가 그려진 10솔 등)도 아직 통용된다. 칠레 페소는 1,000 이그나시오 카레라 핀토, 2,000 마누엘 로드리게스, 5,000 노벨상 시인 가브리엘라 미스트랄, 10,000 해군 영웅 아르투로 프라트, 20,000 안드레스 베요이고 뒷면은 국립공원이다. 볼리비아는 2018~19년 새 지폐를 냈고 앞면에 원주민 저항 영웅들, 뒷면에 동식물과 유적이 있다.","페루는 위조지폐가 많은 나라라 상인들이 지폐를 만지고 불빛에 비추는 것이 습관이다. 100솔을 내면 꼼꼼히 본다. 우리도 거스름돈으로 받은 지폐를 확인하면 좋다. 진짜는 종이가 두껍고 까슬하며, 빛에 비추면 인물 워터마크와 색이 변하는 숫자가 있다. 찢어지거나 낙서된 지폐는 받아 주지 않으므로 환전소에서 깨끗한 것을 달라고 할 것. 달러를 환전할 때도 마찬가지로 구겨지거나 찢어진 달러는 환율이 나쁘거나 거부당한다. 칠레는 위조가 적고 지폐가 플라스틱이라 튼튼하다."]},{"title":"하루 네 끼와 칠레의 '온세'","paragraphs":["페루와 볼리비아의 하루 중 큰 식사는 오후 1~3시 점심이다. 국물(소파)로 시작해 메인(세군도)이 나오는 세트가 \"메누\"이고, 시골 식당은 저녁에는 문을 닫거나 가벼운 것만 판다. 볼리비아는 오전 10시경 살테냐를 먹는 것이 국민 습관이라 점심 전에 살테냐 가게 앞에 줄이 선다. 밤에 뭘 먹느냐고 물으면 \"차 마셔요\"라는 답이 돌아온다. 아침은 빵과 커피로 가볍다. 호텔 조식 뷔페는 그래서 현지 기준으로는 성찬이다.","칠레는 다르다. 아침, 점심, 그리고 오후 5~8시 사이에 빵과 아보카도, 치즈, 케이크에 차나 커피를 곁들이는 온세(once, 11)가 있고 저녁은 밤 9시 이후로 밀리거나 온세로 대체된다. 온세라는 이름은 옛날 남자들이 \"11자로 된 아과르디엔테(브랜디)를 마시러 간다\"고 둘러댄 데서 왔다는 설이 유명하다. 산티아고 카페에서 오후 6시에 사람이 가득한 이유다. 우리 일정에서 산티아고 마지막 날 늦은 점심을 먹고 저녁을 건너뛰어도 현지 리듬으로는 이상하지 않다. 페루 식당에서 \"메누\"를 시키면 오늘의 세트, \"카르타\"를 달라고 하면 단품 메뉴판이다."]},{"title":"슈퍼 진열대 읽기: 서블리메에서 네그리타까지","paragraphs":["페루 슈퍼에서 손에 잡히는 것들. 서블리메(Sublime)는 땅콩이 박힌 국민 초콜릿 바, 도냐 페파 투론은 10월 과자, 쿠아 쿠아는 웨하스, 필드(Field)는 크래커, 인카 콜라는 노란 국민 음료, 쿠스케냐와 필센 카야오는 맥주다. 카사 그란데 설탕과 그란 뽀요 닭. 볼리비아는 파세냐(라파즈) 맥주와 우아리(오루로) 맥주가 지역 자존심이고, 초콜릿은 세이보(Ceibo)와 브레이크(Breick), 물은 비바(Viva)다. 라파즈 슈퍼에는 소금사막에서 나온 소금과 키노아 과자가 기념품 값의 절반이다.","칠레 슈퍼는 규모가 다르다. 수페르 오초(Super 8)는 초콜릿 웨하스, 네그리타는 마시멜로 초코파이인데 이름이 인종차별적이라 2020년 초키타(Chokita)로 바뀌었다. 빌스 이 팝(Bilz y Pap)은 칠레 국민 탄산이고, 카찬툰은 생수, 콘차 이 토로의 카시예로 델 디아블로는 슈퍼에서 4~5천 페소에 사는 와인이다. 마라케타(marraqueta)는 칠레 빵으로 겉이 바삭하고 네 조각이 붙어 나온다. 칠레 사람들은 세계에서 빵을 두 번째로 많이 먹는다(1위 터키). 진열대 옆의 \"마니 콘피타도\"는 설탕 입힌 땅콩이고, 슈퍼 계산대에서 \"볼사(봉지)?\" 하고 물으면 유료다. 칠레는 2018년 비닐봉지를 금지했다."]},{"title":"남미 축구와 고지대 논쟁","paragraphs":["페루는 2018년 러시아 월드컵에 36년 만에 나갔고, 리마 공항에 5만 명이 나와 선수단을 맞았다. 리마의 알리안사 리마와 우니베르시타리오의 클라시코는 도시를 반으로 가른다. 칠레는 2015년과 2016년 코파 아메리카를 연속 우승했고 산티아고의 콜로콜로와 우니베르시다드 데 칠레의 수페르클라시코가 있다. 산티아고 국립경기장은 1962년 월드컵 결승이 열린 곳이자 1973년 쿠데타 직후 수천 명이 갇혔던 곳으로, 스탠드 한 구역을 당시 그대로 나무 의자로 남겨 두었다.","볼리비아는 라파즈 에르난도 실레스 경기장(3,637m)이 무기다. 상대 팀이 숨을 못 쉬는 사이 아르헨티나를 6-1로 이긴 적(2009)이 있다. 2007년 FIFA가 해발 2,500m 이상 경기를 금지하려 하자 에보 모랄레스 대통령이 직접 경기장에서 공을 찼고 마라도나가 라파즈로 날아와 \"고지대 금지는 차별\"이라며 시범 경기를 뛰었다. 금지는 철회됐다. 페루도 쿠스코(3,400m)에서 홈경기를 치른다. 택시 기사와 축구 이야기는 어느 나라에서나 통하는 대화의 열쇠다. 리마에서는 파올로 게레로, 칠레에서는 알렉시스 산체스와 아르투로 비달 이름을 대면 된다."]},{"title":"삼포냐, 차랑고, 그리고 플라멩코가 된 카혼","paragraphs":["안데스 음악의 소리는 세 악기에서 나온다. 삼포냐(시쿠)는 갈대 관을 두 줄로 엮은 팬파이프인데, 원래는 한 사람이 다 불지 않고 두 사람이 음을 번갈아 맡는다. 한쪽(이라)과 다른 쪽(아르카)이 한 음씩 주고받아야 선율이 되므로 혼자서는 연주할 수 없게 만든 것이다. 공동체의 악기다. 케나는 세로로 부는 대나무 피리이고, 차랑고는 스페인 기타를 본떠 만든 작은 열 줄 현악기로 원래 아르마딜로 등껍질로 울림통을 만들었다. 지금은 아르마딜로가 보호종이라 나무로 만들며, 껍질로 만든 옛 차랑고는 세관에서 압수된다.","페루 해안의 흑인 음악에서 나온 카혼은 상자 위에 앉아 두드리는 타악기다. 노예들이 북을 금지당하자 과일 상자를 두드린 데서 시작됐다. 1977년 스페인 기타리스트 파코 데 루시아가 리마 공연에서 카혼을 보고 하나 사 간 뒤 플라멩코의 필수 악기가 됐다. 지금 스페인 사람들은 카혼이 자기네 것인 줄 안다. 춤은 나라마다 국민 춤이 있다. 페루의 마리네라는 손수건을 흔드는 구애의 춤, 칠레의 쿠에카는 수탉이 암탉을 쫓는 춤으로 역시 손수건이 나오고, 볼리비아의 모레나다는 흑인 노예의 무거운 발걸음을 흉내 낸 가면 춤이다. 쿠스코 광장에서 저녁에 학생들이 연습하는 춤이 대개 이것들이다."]},{"title":"수도가 둘인 나라","paragraphs":["볼리비아 헌법상 수도는 수크레다. 대법원이 거기 있다. 그러나 대통령궁, 의회, 정부 부처는 모두 라파즈에 있다. 1899년 은광으로 부유했던 수크레 세력과 주석 광산으로 떠오른 라파즈 세력이 내전을 벌였고, 라파즈가 이기면서 정부를 옮겨 온 대신 명목상 수도는 수크레에 남겨 두는 타협을 했다. 2007년 새 헌법을 만들 때 수크레가 \"수도 완전 이전\"을 요구하며 시위를 벌였고 라파즈는 200만 명이 거리로 나와 반대했다. 결국 현상 유지다.","라파즈 무리요 광장의 대통령궁은 \"팔라시오 케마도(불탄 궁전)\"라고 불린다. 1875년 폭도가 불을 질렀기 때문이고, 그 뒤로도 볼리비아 대통령들은 이 광장에서 여러 번 끌려 나갔다. 1946년 비야로엘 대통령은 광장 가로등에 매달렸고, 그 가로등이 아직 있다. 2024년 6월에는 장군이 탱크를 몰고 궁 정문을 들이받는 쿠데타 시도가 몇 시간 만에 실패로 끝났다. 광장의 비둘기와 경비병, 국회의사당의 거꾸로 도는 시계는 그 역사를 모르는 척 평온하다. 참고로 페루도 수도가 한때 둘이었다. 독립 직후 리마와 쿠스코 어느 쪽이냐를 두고 다투다 리마로 정리됐다."]},{"title":"화장실 사정: 휴지는 휴지통에","paragraphs":["세 나라 모두 변기에 휴지를 넣지 않고 옆의 휴지통에 버린다. 배관이 가늘어 막히기 때문이고, 고급 호텔은 예외지만 식당·버스터미널·관광지는 거의 그렇다. 표지판은 SS.HH.(세르비시오스 이히에니코스)이고, 여자는 다마스(Damas) 또는 무헤레스, 남자는 카바예로스 또는 바로네스(Varones)다. 유료 화장실은 0.5~1솔, 볼리비아 1~2볼리비아노, 칠레 지하철역은 대개 무료다. 휴지는 안 준다. 주머니에 휴지와 손 소독제는 필수다.","샤워기 수도꼭지의 C는 차가운 물이 아니다. 칼리엔테(caliente, 뜨거운)의 C이고, F(프리오)가 찬물이다. 영어권 H/C 습관으로 돌리면 데인다. 저가 숙소의 샤워기 헤드에 전선이 연결된 것은 순간온수기 \"두차 엘렉트리카\"로, 물을 약하게 틀어야 뜨겁고 세게 틀면 미지근하다. 젖은 손으로 헤드를 만지지 말 것. 우리 호텔들은 보일러식이지만 우유니 소금 호텔은 물 사정이 다를 수 있다. 참고로 볼리비아 고원의 화장실은 밤에 무척 춥고, 우유니 투어 중 화장실은 라구나 옆 오두막이 전부다."]},{"title":"팁과 흥정의 규칙","paragraphs":["페루 식당은 영수증에 팁 칸이 없으면 10%를 현금으로 두는 것이 상류이고, 관광지 식당은 계산서에 \"세르비시오 10%\"가 이미 붙어 있는지 확인한다. 투어 가이드에게는 하루 10~20솔, 기사에게는 절반, 호텔 짐꾼은 2~5솔이다. 칠레 식당은 계산서에 \"프로피나 수헤리다 10%\"가 있고 종업원이 \"콘 프로피나?(팁 포함할까요?)\" 하고 묻는다. \"시\"라고 하면 카드에 얹는다. 볼리비아는 팁 문화가 약해 잔돈을 남기는 정도면 된다. 우유니 투어 기사 겸 가이드에게는 마지막 날 1인 20~50볼리비아노가 보통이다.","흥정은 시장과 노점의 기념품에서만 한다. 처음 부르는 값의 20~30% 아래에서 시작해 중간에서 만나는 것이 정석이고, 음식이나 슈퍼, 약국은 정찰제다. 택시는 페루·볼리비아에서 미터기가 없어 타기 전에 값을 정한다. \"쿠안토 아스타 ○○?\"라고 묻고 비싸면 \"무이 카로\"라고 하면 절반은 내려온다. 칠레 택시는 미터기가 있고 흥정하면 오히려 이상하다. 무엇보다 몇 솔 깎느라 시간을 쓰지 않는 것이 여행자의 흥정 규칙이다. 알파카 스웨터 3만 원과 3만 5천 원의 차이는 상인에게는 하루 생활비다."]},{"title":"우리가 쓰는 케추아어","paragraphs":["케추아어는 페루·볼리비아·에콰도르 등에서 약 800만 명이 쓰는, 아메리카 원주민 언어 중 가장 큰 언어다. 잉카는 정복한 부족에게 케추아어를 퍼뜨렸고, 아이러니하게 스페인 선교사들이 포교용으로 표준화하면서 더 넓게 퍼졌다. 지금 페루와 볼리비아의 공용어이고, 볼리비아는 2009년 헌법에서 36개 원주민 언어를 모두 공용어로 정했다. 티티카카 주변과 라파즈는 아이마라어권이다. 2016년 페루 국영 방송이 첫 케추아어 뉴스를 시작했고, 관공서 직원 채용에 케추아어 가산점이 있다.","우리가 이미 쓰는 케추아어 단어가 꽤 있다. 퓨마, 콘도르, 야마, 알파카, 비쿠냐, 키노아, 코카, 파파(감자), 팜파, 구아노, 차르키(육포 jerky의 어원), 판초, 칸차(운동장, 페루에서는 팝콘), 소로체(고산병). 초콜릿과 토마토, 아보카도는 멕시코 나와틀어라 다른 계통이다. 케추아어로 \"고맙습니다\"는 솔파이키(sulpayki), 아이마라어로는 유스파라(yuspagara)다. 쿠스코 시장에서 \"솔파이키\" 한마디면 아주머니 얼굴이 달라진다. 안녕하세요는 케추아어 \"알린 푼차우(allin p'unchay)\", 아이마라어 \"카미사라키(kamisaraki)\"다."]}]},"safety":{"id":"safety","name":"치안과 사기: 수법을 알면 안 당한다","articles":[{"title":"리마 택시의 규칙","paragraphs":["리마 택시는 미터기가 없다. 아무나 차 위에 \"TAXI\" 스티커를 붙이면 택시라서 등록 여부도 알 수 없다. 원칙은 세 가지다. 앱(우버·카비파이·인드라이브)을 우선 쓰고, 길에서 잡을 때는 타기 전에 값을 정하며, 밤에는 길에서 잡지 않는다. 미라플로레스에서 센트로까지 낮에 20~25솔, 공항까지 50~70솔이 기준이다. 앱 택시라도 번호판이 앱 화면과 같은지 확인하고 타고, 앞자리보다 뒷자리에 앉는다. 창문은 정차 시 닫는다. 신호 대기 중 창밖에서 휴대폰을 낚아채는 일이 있다.","가장 조심할 것은 \"세쿠에스트로 알 파소\", 즉 가짜 택시가 손님을 태우고 공범을 태워 ATM으로 데려가는 강도다. 관광객이 당하는 경우는 드물지만 방법은 간단해서, 길에서 잡은 택시가 낯선 사람을 태우려 하면 바로 내린다. 호텔에서 부르는 택시(탁시 세구로)는 조금 비싸지만 안전하고, 공항 도착층의 공식 택시 창구(탁시 그린, 탁시 디렉토)는 정찰제다. 결론은 우버다. 리마·쿠스코·산티아고 모두 우버가 잘 되고 라파즈는 우버보다 현지 앱과 라디오 택시가 낫다."]},{"title":"겨자, 새똥, 가짜 경찰","paragraphs":["남미 관광지 고전 수법의 첫째는 \"겨자 수법\"이다. 누군가 옷에 겨자나 케첩, 새똥처럼 보이는 것을 뿌리고 친절한 행인이 닦아 주는 사이 다른 사람이 가방을 가져간다. 옷에 뭐가 묻으면 그 자리에서 닦지 말고 가방을 앞으로 안은 채 걸어서 벗어난 뒤 닦는다. 둘째는 가짜 경찰이다. 사복이나 경찰 비슷한 옷을 입은 남자가 \"위조지폐 단속\"이라며 지갑과 여권 검사를 요구한다. 진짜 경찰은 길에서 관광객의 돈을 세지 않는다. \"경찰서에서 보여 드리겠다\"고 하고 자리를 뜨면 된다. 리마 센트로, 산티아고 아르마스 광장, 쿠스코에서 보고되는 수법이다.","셋째는 \"떨어진 돈\"이다. 앞사람이 지폐를 떨어뜨리고 당신이 줍는 순간 주인이 나타나 \"일부가 없어졌다\"고 우기거나, 줍는 사이 뒤에서 소매치기를 한다. 땅에 떨어진 돈은 줍지 않는다. 넷째는 사진을 찍어 주겠다며 휴대폰을 받아 달아나는 것으로, 사진은 관광객끼리 부탁하거나 가게 직원에게 부탁한다. 마지막은 시장과 버스의 소매치기다. 배낭은 앞으로 메고, 바지 뒷주머니에는 아무것도 넣지 않는다. 대부분의 수법이 \"주의를 딴 데로 돌리는\" 순간을 노린다는 것만 기억하면 된다."]},{"title":"ATM: 은행 안에서, 낮에, 손으로 가리고","paragraphs":["카드 복제(스키밍)는 페루·칠레에서 흔하다. 길거리 독립형 ATM보다 은행 지점 안이나 쇼핑몰 안의 ATM을 낮에 쓰고, 카드 넣는 입구가 헐겁거나 덧씌워져 있으면 쓰지 않는다. 비밀번호는 손으로 가린다. 인출 수수료는 페루 BCP·인터방크 13~20솔, 볼리비아 대부분 무료 또는 소액, 칠레는 7,000~8,000페소로 비싸므로 한 번에 크게 뽑는다. 한도는 페루 400~700솔, 칠레 20만 페소 정도다. ATM이 카드를 삼키면 은행 영업시간 안에 바로 지점 창구로 간다.","칠레에는 \"캄비아소\"라는 수법이 있다. ATM 앞에서 도와주는 척하며 카드를 바꿔치기하거나 비밀번호를 훔쳐본다. 도와주겠다는 사람은 무조건 거절한다. 카드는 두 장 이상을 따로 보관하고, 한국 은행 앱에서 해외 사용 알림을 켜 두면 복제 사용을 바로 알 수 있다. 현금은 하루 쓸 만큼만 지갑에, 나머지는 호텔 금고나 옷 안쪽 주머니에 나눈다. 여권은 복사본을 들고 다니고 원본은 금고에 두되, 페루 경찰이 검문하면 복사본으로 충분한 경우가 대부분이다. 볼리비아 국경과 항공편에서만 원본이 필요하다."]},{"title":"쿠스코의 밤: 고산, 술, 그리고 호객","paragraphs":["쿠스코에서 첫날밤 술을 마시면 고산증이 두 배로 온다. 3,400m에서는 알코올 분해가 느리고 탈수가 심해져 한 잔이 세 잔 효과다. 광장의 마사지 호객(\"마사헤?\")과 그림 파는 아이들, 클럽 무료 입장권 나눠 주는 청년들은 무시하면 그만이다. \"노 그라시아스\" 한마디로 끝난다. 아이를 데리고 야마와 사진 찍으라는 아주머니는 사진값 2~5솔을 받는데 문제는 없다. 다만 찍기 전에 값을 묻는다.","문제는 \"샤먼\"이다. 산 페드로나 아야와스카 의식을 파는 곳이 쿠스코 골목마다 있는데, 무자격자가 많고 2010년대 이후 사망 사고와 성폭행 사건이 여러 건 있었다. 호기심으로 갈 곳이 아니다. 클럽에서 모르는 사람이 주는 술은 받지 않는다. 약을 탄 술로 정신을 잃게 한 뒤 카드를 빼 가는 사건이 보고된다. 밤 10시 이후 광장에서 호텔까지는 큰길(아베니다 엘 솔)로 걷거나 택시를 탄다. 좁은 골목은 낮에는 예쁘고 밤에는 어둡다. 쿠스코 관광경찰은 광장 옆에 있고 영어가 통한다."]},{"title":"라파즈: 위험한 곳과 그렇게 보이는 곳","paragraphs":["라파즈는 보기보다 안전하고, 엘알토는 보기보다 위험하다. 관광객이 다니는 사가르나가 거리, 마녀시장, 무리요 광장, 케이블카는 낮에 문제가 없다. 엘알토 골목의 전봇대에 매달린 허수아비와 \"도둑은 불태운다\"는 벽글은 실제로 주민들이 린치를 하는 동네라는 뜻이니 관광객이 밤에 갈 곳이 아니다. 케이블카 노란선·빨간선 타고 엘알토 목요·일요 시장을 가는 것은 낮에는 괜찮지만 지갑을 앞에 둔다. 남미에서 가장 큰 노천 시장이다.","라파즈 특유의 수법은 가짜 관광객이다. 배낭을 멘 외국인이 다가와 친해진 뒤 가짜 경찰이 나타나 \"마약 검사\"를 하며 함께 경찰차(택시)에 타자고 한다. 절대 차에 타지 않는다. 진짜 경찰은 관광객을 택시에 태우지 않는다. 택시는 문에 전화번호가 적힌 라디오 택시를 타고, 밤에는 호텔에서 부른다. 시위와 도로 봉쇄가 잦은 도시라 무리요 광장에 최루탄 냄새가 나면 돌아 나온다. 고도 3,600m라 걷다가 숨이 차는 것은 위험이 아니라 정상이다. 계단을 오를 때 천천히, 물을 자주."]},{"title":"봉쇄(블로케오)와 파업","paragraphs":["페루와 볼리비아에서는 도로 봉쇄가 정치의 일부다. 농민, 광부, 운수 노조가 요구가 있을 때 돌과 타이어로 국도를 막는다. 2022년 말부터 2023년 초 페루 남부 시위 때는 쿠스코 공항이 여러 날 닫히고 마추픽추 기차가 끊겨 관광객 수천 명이 갇혔다. 볼리비아는 2024년 연료 부족과 정치 갈등으로 라파즈–오루로 도로가 여러 차례 막혔다. 우리 일정에서 봉쇄 위험이 있는 구간은 쿠스코–푸노 버스, 푸노–라파즈 국경 도로, 라파즈–우유니 항공(공항 진입로)이다.","여행사가 대처하지만 여행자가 할 수 있는 것은 정보다. 아침에 가이드나 호텔 프런트에 \"아이 블로케오?(봉쇄 있어요?)\"라고 묻고, 현지 뉴스 사이트(페루 RPP, 볼리비아 Página Siete·El Deber)를 훑는다. 봉쇄가 있어도 관광객이 다치는 일은 거의 없고, 걸어서 봉쇄선을 넘어 반대편 차로 갈아타는 것이 보통의 해법이다. 물과 간식, 여분 현금, 그리고 하루의 여유가 보험이다. 마지막 날 산티아고 비행기 전날은 무리한 일정을 잡지 않았다. 참고로 칠레는 봉쇄보다 지하철 파업과 시위가 문제인데, 산티아고 바케다노 광장 주변 금요일 오후가 시위 시간이다."]},{"title":"우유니 투어의 진짜 위험은 운전이다","paragraphs":["우유니에서 관광객이 다치는 원인은 강도가 아니라 지프 사고다. 2008년 일본인 관광객 다섯 명이 지프 충돌로 숨진 사건 이후 규제가 생겼지만 2016년, 2018년에도 사망 사고가 있었다. 원인은 늘 같다. 과속, 졸음, 음주, 밤 운전, 정비 불량. 소금사막은 표지도 차선도 없는 평원이라 기사들이 시속 100km로 달리고, 국경 근처 4,900m 고원에서는 산소 부족으로 판단이 흐려진다. 우리는 여행사가 정한 업체를 타지만 기사가 술 냄새를 풍기거나 밤에 달리려 하면 거부할 권리가 있다.","안전벨트가 있으면 맨다. 좌석은 앞자리가 시야는 좋지만 사고 때 가장 위험하고, 뒷줄은 멀미가 심하다. 밤 별 사진을 찍으러 나갈 때는 차에서 멀리 가지 않는다. 사막의 밤은 영하 15도이고 방향을 잃기 쉽다. 고원 둘째 날 밤 숙소(4,300m)에서 두통과 구토가 심하면 기사에게 말한다. 대부분 지프에 산소통이 있다. 물은 하루 2리터, 자외선 차단제는 두 시간마다, 선글라스는 필수다. 소금 반사로 설맹이 온다. 우유니 마을 자체는 작고 안전하며, 밤 11시 이후 술집 앞이 시끄러운 정도다."]},{"title":"산티아고: 폰 뺏기와 포르토나소","paragraphs":["산티아고의 범죄는 폭력보다 속도다. 오토바이 두 명이 지나가며 길에서 휴대폰을 낚아채는 것이 가장 흔하고, 프로비덴시아나 라스 콘데스 같은 부촌에서도 일어난다. 길에서 휴대폰을 오래 보지 않고, 볼 때는 벽 쪽을 향해 선다. 카페 테이블 위에 휴대폰을 두지 않는다. 지하철 1호선 출퇴근 시간에는 소매치기가 있어 가방을 앞으로 멘다. 포르토나소는 차량 강탈이라 렌터카를 안 타는 우리와 상관없지만, 밤에 택시 안에서 창문을 열어 두지 않는 정도는 지킨다.","밤에 피할 곳은 센트로의 아르마스 광장 남쪽 골목, 에스타시온 센트랄 주변, 바케다노 광장이다. 2019년 \"사회적 폭발\" 이후 바케다노 광장은 시위의 성지가 되어 금요일 저녁에 경찰과 충돌이 있다. 벨라비스타는 저녁 식사까지는 좋고 새벽에는 취객과 소매치기가 있다. 산크리스토발 언덕은 낮에 케이블카나 푸니쿨라로 오르면 안전하지만 등산로를 혼자 걷다 강도를 만난 사례가 있다. 대체로 산티아고는 남미에서 가장 안전한 대도시 중 하나이고, 지하철과 우버로 움직이면 걱정할 것이 별로 없다. 경찰(카라비네로스)은 133, 구급차 131이다."]},{"title":"물, 얼음, 세비체: 배탈 지도","paragraphs":["수돗물은 세 나라 어디서도 마시지 않는다. 산티아고 수돗물은 안전하다고 하지만 미네랄이 강해 외국인 배에는 맞지 않는다. 양치는 생수로 하는 것이 무난하다. 괜찮은 식당의 얼음은 정수한 물로 만든 것이라 문제가 없고, 노점 주스의 얼음은 피한다. 세비체는 날생선이지만 리마의 세비체리아는 그날 아침 잡은 생선을 점심에 쓰기 때문에 낮에 먹으면 안전하다. 세비체를 저녁에 파는 곳은 관광객용이다. 노점 음식은 \"줄이 길고, 눈앞에서 조리하며, 뜨거운 것\"이면 대체로 괜찮다.","배탈이 나면 첫날은 물과 경구수액(약국의 수에로 오랄)으로 버티고, 이동일이면 로페라미드(지사제)를 쓴다. 열이 나거나 사흘 넘게 가면 약국에 간다. 페루·볼리비아 약국은 처방전 없이 항생제를 팔고 약사가 진단도 해 준다. 고산에서는 소화가 느려 과식이 바로 탈로 이어지므로 저녁을 가볍게 먹는 것이 최고의 예방이다. 볼리비아 고원의 살테냐를 아침에 먹고 낮에 지프를 타면 멀미와 겹치기 쉽다. 마지막으로 코카차는 배탈에도 좋다고 하지만 근거는 약하고, 무냐 차가 더 낫다."]},{"title":"사진을 찍기 전에","paragraphs":["촐리타나 시장 상인, 아이를 찍을 때는 먼저 묻는다. \"푸에도 토마르 우나 포토?\" 대답이 \"1솔\"이면 준다. 쿠스코 광장의 전통 의상 입은 여인들과 새끼 야마는 사진값이 직업이니 찍고 나서 안 주면 다툰다. 우로스 섬 사람들은 배 위에서 찍어도 괜찮지만 집 안은 묻는다. 경찰, 군인, 공항 검색대, 군 시설, 국경 검문소는 찍지 않는다. 볼리비아 국경에서 카메라를 들면 삭제를 요구받는다. 라파즈 대통령궁 앞 경비병은 찍어도 된다.","드론은 마추픽추와 쿠스코 유적 전체에서 금지이고, 소금사막에서는 사실상 허용되지만 라구나(플라밍고) 근처는 국립보호구역이라 금지다. 칠레는 드론 등록이 필요하다. 마추픽추는 삼각대와 셀카봉이 금지이고 입구에서 걸린다. 성당 안에서는 플래시 없이 찍는 곳과 아예 금지인 곳(쿠스코 대성당, 리마 산프란시스코 카타콤)이 있으니 표지를 본다. 박물관은 대개 플래시 없이 허용이다. 그리고 사진보다 중요한 것 하나. 절벽이나 기차 문, 지프 지붕 위에서 찍는 사진은 매년 사고를 만든다. 우유니 원근법 사진은 땅에 엎드리는 것이지 지프에 올라가는 것이 아니다."]},{"title":"코카잎은 비행기에 태우지 마라","paragraphs":["코카잎, 코카차 티백, 코카 사탕은 페루와 볼리비아에서 합법이고 어디서나 판다. 그러나 칠레 입국 시 반입 금지이고, 한국은 마약류관리법상 코카잎 자체가 마약류라 티백 한 상자도 세관에서 문제가 된다. 라파즈나 쿠스코에서 기념품으로 코카 티백을 사면 우유니에서 다 마시거나 버리고 칠레로 넘어간다. 코카 사탕이나 코카 초콜릿도 마찬가지로 칠레 세관(SAG)에서 걸린다. 마테 데 코카를 며칠 마셨다고 약물 검사에 걸리는 일은 여행자에게 사실상 없지만, 귀국 직후 직장 검사가 있는 사람은 알아 둘 것.","칠레 SAG 검역은 남미에서 가장 엄격하다. 과일, 채소, 꿀, 육류, 씨앗, 유제품, 나무 공예품 일부까지 신고 대상이고 미신고 시 벌금이 수십만 원이다. 우유니에서 산 키노아, 라파즈 시장의 말린 과일, 아타카마 사막으로 넘어갈 때 배낭 속 사과 하나까지 신고서에 \"예\"라고 쓰고 보여 주면 압수는 되어도 벌금은 없다. 산티아고 공항 입국은 여권 심사보다 세관 줄이 길다. 한국 귀국 때는 육류·과일·씨앗이 검역 대상이고, 알파카 털 제품과 소금, 초콜릿, 술(2병까지)은 문제없다. 피스코나 와인은 위탁 수하물에 넣고, 도수 24도 이상은 총 5리터 제한이다."]},{"title":"응급 번호와 병원","paragraphs":["페루 경찰 105, 구급 116, 소방 116. 관광경찰(폴리시아 데 투리스모)은 리마 미라플로레스와 쿠스코 광장 옆에 있고 영어가 통한다. 볼리비아 경찰 110, 구급 118. 칠레 경찰 133, 구급 131, 소방 132. 세 나라 모두 여행자보험이 통하는 사립 병원이 있고, 우리 앱의 호텔 주변 목록에 넣어 둔 클리닉(리마 온코살루드, 쿠스코 우르헨트 케어와 클리니카 파르도, 푸노 로스 피노스, 라파즈 클리니카 산미겔, 산티아고 레드살루드)이 그것이다. 현금이나 카드로 먼저 내고 보험사에 청구하는 방식이라 영수증과 진단서(인포르메 메디코)를 꼭 받는다.","고산 응급은 조금 다르다. 두통·메스꺼움은 정상이지만, 걸을 수 없을 만큼 균형을 잃거나 가슴에서 거품 소리가 나거나 헛소리를 하면 뇌부종·폐부종 신호로 즉시 낮은 곳으로 내려가야 한다. 쿠스코와 라파즈 사립 병원은 산소 치료에 익숙하고, 호텔 프런트가 병원까지 택시를 불러 준다. 한국 대사관은 리마와 산티아고에 있고 라파즈에도 대사관이 있다. 영사 콜센터(+82-2-3210-0404)는 24시간이다. 여권을 잃으면 경찰 신고서(데눈시아)를 먼저 받아야 대사관에서 여행증명서를 준다. 여권 사본과 사진 2장을 따로 챙겨 두면 하루가 절약된다."]}]},"hist":{"id":"hist","name":"역사 뒷골목: 교과서에 없는 이야기","articles":[{"title":"아타왈파의 몸값 방","paragraphs":["1532년 카하마르카에서 사로잡힌 잉카 황제 아타왈파는 피사로에게 제안했다. 자신이 갇힌 방(가로 7m, 세로 5m)을 손이 닿는 높이까지 한 번은 금으로, 두 번은 은으로 채워 주면 풀어 달라고. 제국 전역에서 금이 쏟아져 들어왔다. 코리칸차의 황금 벽판, 황금 옥수수, 황금 야마가 녹여져 금괴가 됐다. 약 6톤의 금과 12톤의 은, 오늘 값으로 수천억 원이었다. 피사로는 몸값을 다 받고도 1533년 7월 아타왈파를 반역죄로 처형했다. 화형을 선고했다가 세례를 받으면 교살로 바꿔 주겠다고 했고, 잉카는 시신이 보존되어야 내세가 있다고 믿었기에 세례를 받았다.","전설은 여기서 시작된다. 키토에서 출발한 마지막 몸값 행렬(금 750톤이라는 말이 있다)이 황제의 처형 소식을 듣고 산속에 금을 숨겼다는 것이다. 장군 루미냐위가 에콰도르 얀가나테스 산지에 묻었다는 이 \"잉카의 잃어버린 황금\"은 500년 동안 보물 사냥꾼을 끌어들였고 지금도 매년 누군가 죽는다. 스페인이 받은 금의 5분의 1은 국왕 몫이었고, 병사 한 명당 오늘 값으로 수십억 원이 돌아갔다. 168명 중 대부분은 몇 년 안에 도박과 살인으로 그 돈을 잃었다."]},{"title":"피사로의 두개골은 어디 있었나","paragraphs":["프란시스코 피사로는 1541년 6월 리마 자기 집에서 알마그로파 자객 20명에게 살해됐다. 예순셋의 그는 칼을 뽑아 셋을 베고 쓰러졌고, 바닥에 자기 피로 십자가를 그리고 죽었다고 한다. 시신은 리마 대성당에 묻혔다. 1891년 사망 350주년에 성당은 지하실에서 찾은 미라를 유리관에 넣어 전시했고, 관광객들은 90년 동안 그 미라를 피사로로 알고 보았다.","1977년 성당 지하실 공사 중 납 상자가 나왔다. 뚜껑에 \"여기 후작 돈 프란시스코 피사로의 머리가 있다\"고 새겨져 있었고, 안에 두개골과 칼자국이 있는 뼈가 있었다. 법의학 조사 결과 유리관의 미라는 엉뚱한 사람이었고 납 상자의 것이 진짜였다. 두개골에는 자객의 칼이 남긴 상처가 여러 곳 있었다. 지금 리마 대성당 입구 오른쪽 예배당의 모자이크 석관 안에 있는 것이 그 유골이다. 광장의 피사로 기마상은 1935년 미국 조각가가 만든 것으로, 원주민 단체의 항의로 2003년 광장에서 치워져 지금은 성벽 공원 구석에 서 있다."]},{"title":"투팍 아마루 2세와 금지된 케추아","paragraphs":["1780년 쿠스코 남쪽 팅타에서 호세 가브리엘 콘도르칸키라는 원주민 귀족이 스페인 관리를 처형하고 봉기했다. 자신을 마지막 잉카의 후손 투팍 아마루 2세라고 불렀다. 봉기는 페루와 볼리비아 고원 전체로 번져 10만 명이 죽었고, 1781년 5월 쿠스코 아르마스 광장에서 그는 아내와 아들이 먼저 처형되는 것을 본 뒤 네 마리 말에 사지가 묶였다. 말들이 그를 찢지 못하자 참수했다. 스페인은 보복으로 케추아어 사용, 잉카 복장, 잉카 연극, 잉카 귀족 칭호를 모두 금지했다. 케추아어가 문자 없는 언어로 남은 이유 중 하나다.","200년 뒤 그의 이름은 두 곳에서 부활했다. 1968년 페루 군사정부는 그를 국가 영웅으로 삼아 지폐에 넣었고, 1980년대 게릴라 조직 MRTA(투팍 아마루 혁명운동)는 1996년 리마 일본 대사관저를 점거해 인질 72명을 126일간 붙잡았다. 미국 래퍼 투팍 샤커의 이름도 여기서 왔다. 어머니가 흑표당 활동가였다. 쿠스코 광장에 서면 그 자리에서 240년 전 일어난 일을 떠올리게 된다. 광장 한복판이 처형장이었다."]},{"title":"발레 운 포토시","paragraphs":["\"포토시 하나의 값어치\"라는 말은 돈키호테에 나온다. 1545년 발견된 볼리비아 포토시의 세로 리코(부유한 산)는 산 하나가 통째로 은광이었다. 1600년경 포토시 인구는 16만 명으로 런던, 파리보다 컸고, 세계 은의 절반이 여기서 나왔다. 그 은은 스페인의 은화 \"페소 데 오초\"가 되어 유럽, 중국, 필리핀을 돌았다. 달러 기호 $가 포토시 조폐국의 각인 PTSI를 겹쳐 쓴 데서 왔다는 설이 있을 정도다. 중국 명나라의 은 본위 경제도 이 산이 만들었다.","값은 사람이 치렀다. 스페인은 잉카의 노역 제도 미타를 가져와 주변 마을 남자 7분의 1을 강제로 광산에 보냈고, 갱도에서 일주일씩 나오지 못했다. 수은 아말감법으로 은을 뽑으면서 수은 중독이 더해졌다. 300년 동안 죽은 사람이 800만 명이라는 숫자는 과장이지만 수십만은 확실하다. 지금 세로 리코는 500년 동안 파 들어간 갱도 때문에 정상이 무너지고 있고, 광부 협동조합이 여전히 그 안에서 주석과 아연을 캔다. 우유니로 가는 비행기 아래 남동쪽에 그 산이 있다. 볼리비아가 \"은을 준 나라\"에서 \"세계 최빈국 중 하나\"가 된 이야기의 시작점이다."]},{"title":"태평양 전쟁: 새똥과 초석이 바꾼 국경","paragraphs":["1879년 칠레가 볼리비아와 페루를 상대로 전쟁을 시작한 이유는 아타카마 사막의 초석(질산나트륨)이었다. 화약과 비료의 원료로 유럽이 사 갔고, 당시 그 사막은 볼리비아 땅이었다. 칠레 회사가 채굴하고 볼리비아가 세금을 올리자 칠레 군대가 안토파가스타에 상륙했다. 볼리비아와 동맹이던 페루가 끌려 들어갔고, 4년 뒤 칠레는 볼리비아의 해안 전체와 페루의 타라파카를 가졌다. 볼리비아는 그날부터 바다 없는 나라가 됐고 매년 3월 23일 \"바다의 날\"에 잃은 해안을 기린다. 라파즈 무리요 광장 근처의 에두아르도 아바로아 동상은 칠레군의 항복 요구에 \"네 할머니나 항복하라\"고 외치고 죽은 영웅이다.","페루는 더 험한 일을 겪었다. 1881년 칠레군이 리마를 점령해 2년 동안 머물렀고 국립도서관 장서 수만 권을 실어 갔다. 칠레는 2007년에야 그중 4천 권을 돌려줬다. 페루 해군 영웅 미겔 그라우가 탔던 철갑선 우아스카르는 지금 칠레 탈카우아노 항구에 전리품으로 떠 있다. 타크나는 1929년에야 페루로 돌아왔고 아리카는 칠레에 남았다. 2018년 국제사법재판소는 볼리비아의 \"바다 협상 요구\"를 기각했다. 세 나라 사람과 이 전쟁 이야기를 할 때는 조심하는 것이 좋다. 140년이 지났지만 축구 경기에서 아직 나오는 이야기다."]},{"title":"1950년, 지진이 드러낸 잉카의 벽","paragraphs":["1950년 5월 21일 오후 쿠스코를 규모 6.0의 지진이 흔들었다. 식민 시대 성당과 저택의 절반이 무너졌다. 그런데 그 아래에서 잉카의 돌벽이 멀쩡하게 드러났다. 스페인인들이 잉카 신전 위에 지은 수도원과 성당이 무너지고, 400년 동안 회칠 아래 숨어 있던 잉카 벽이 나타난 것이다. 산토도밍고 수도원 아래 코리칸차의 곡선 벽이 그때 세상에 나왔다. 유네스코는 재건을 도우면서 \"잉카 벽을 다시 덮지 말라\"고 했고, 그 뒤 쿠스코 골목이 지금처럼 아래는 잉카, 위는 스페인인 모습이 됐다.","잉카 벽이 지진을 견디는 이유는 세 가지다. 벽이 안쪽으로 3~5도 기울어 있고, 돌이 모르타르 없이 서로 맞물려 흔들리면 잠깐 벌어졌다 제자리로 돌아오며, 창과 문이 사다리꼴이다. 1650년 대지진 뒤 쿠스코 사람들은 대성당의 검은 예수상(세뇨르 데 로스 템블로레스, 지진의 주님)이 지진을 멈췄다고 믿어 지금도 성주간 월요일에 광장을 도는 행렬을 한다. 예수상이 검은 것은 400년 동안 촛불 그을음이 앉았기 때문이다. 12각 돌이 있는 아툰루미욕 골목이 그 지진에서 살아남은 벽이다."]},{"title":"카팍 냔: 4만 km의 길과 달리는 사람들","paragraphs":["잉카는 문자도 바퀴도 말도 없이 남북 4천 km의 제국을 다스렸다. 그 비밀은 길이다. 카팍 냔(왕의 길)은 총연장 3~4만 km로 로마 가도보다 길었고, 에콰도르에서 칠레 중부까지 안데스 능선과 해안을 따라 두 줄기로 뻗었다. 20km마다 탐보라는 숙소와 창고가 있었고, 강에는 풀로 꼰 현수교를 걸었다. 쿠스코 남쪽의 케스와차카 다리는 지금도 마을 사람들이 매년 6월 새 풀로 다시 엮는다. 2014년 카팍 냔 전체가 6개국 공동 세계유산이 됐다.","길 위를 차스키가 달렸다. 릴레이 주자인 이들은 2~3km 간격의 초소에 대기하다가 앞사람의 전갈을 받아 다음 초소로 전력 질주했다. 하루 240km를 이어 달렸고, 키푸(매듭 문자)와 구두 메시지를 전했다. 해안에서 잡은 생선이 이틀 만에 쿠스코 황제의 식탁에 올랐다는 기록이 있다. 마추픽추 가는 잉카 트레일이 이 길의 한 토막이고, 오얀타이탐보 역 근처에서 시작한다. 성스러운 계곡의 산비탈에 대각선으로 그어진 선들 중 일부가 잉카 길이다. 스페인인들은 이 길을 타고 정복했고, 그다음 말이 다니기 편하게 계단을 깎아 망가뜨렸다."]},{"title":"키푸: 끈으로 쓴 문자","paragraphs":["잉카에는 문자가 없었다고 배우지만, 키푸(quipu)가 있었다. 굵은 줄에 색색의 끈을 매달고 매듭을 지어 숫자를 기록한 것으로, 매듭의 위치가 자릿수(십진법)다. 인구, 세금, 창고의 옥수수 자루 수가 이렇게 기록됐고, 키푸카마욕이라는 전문가가 읽었다. 1583년 리마 종교회의는 키푸를 우상숭배로 규정해 불태우도록 했다. 지금 전 세계 박물관에 남은 키푸는 1천 점 남짓이고, 하버드 대학이 데이터베이스로 만들어 해독을 시도하고 있다.","숫자 말고 이야기도 기록했는가는 100년 된 논쟁이다. 2017년 하버드 학부생 매니 메드라노가 17세기 스페인 인구조사 문서와 키푸 여섯 점의 끈 색과 매듭 방식이 일치한다는 것을 밝혀 \"키푸에 이름과 신분이 적혀 있다\"는 증거를 처음 내놓았다. 리마 근처 산후안 데 코야타 마을에는 18세기 봉기 때 마을 사이에 편지처럼 주고받은 키푸 두 점이 지금도 마을 금고에 있다. 쿠스코의 잉카 박물관과 리마 라르코 박물관에서 실물을 볼 수 있다. 끈 몇 가닥에 제국의 회계가 들어 있었다."]},{"title":"볼리비아 쿠데타 190번","paragraphs":["볼리비아는 1825년 독립 이후 쿠데타와 정권 교체가 190번 넘게 있었다는 통계로 유명하다. 20세기만 해도 대통령이 1년을 못 채운 경우가 수두룩했고, 1978~82년 사이에는 4년 동안 대통령이 9명이었다. 그중 1980년 가르시아 메사 장군의 \"코카인 쿠데타\"는 마약 조직 자금과 나치 전범 클라우스 바르비의 도움으로 일어났다. 라파즈 무리요 광장은 그 무대였다. 그런 나라에서 2006년 원주민 출신 에보 모랄레스가 대통령이 되어 14년을 집권한 것은 대사건이었다.","2019년 모랄레스가 부정선거 논란 끝에 사임하고 멕시코로 떠났고, 우파 임시정부와 원주민 시위대가 충돌해 수십 명이 죽었다. 2020년 그의 당 MAS가 다시 이겼지만 2024년 6월 26일 육군 총사령관 수니가가 탱크를 몰고 대통령궁 문을 들이받는 쿠데타 시도가 몇 시간 만에 실패했다. 2025년 10월 결선 투표에서 중도 우파 로드리고 파스가 당선되어 20년 만에 MAS 집권이 끝났고, 우리가 가는 2026년 9월은 새 정부 1년 차다. 연료 부족과 달러 부족이 나라의 큰 걱정이라 환전소에서 달러가 귀한 대접을 받는 것을 보게 될 것이다."]},{"title":"페루 대통령들은 왜 다 감옥에 가나","paragraphs":["최근 30년 페루 대통령 거의 전부가 기소되거나 수감됐다. 후지모리(1990~2000)는 인권 침해와 부패로 25년형을 받고 2023년 석방된 뒤 2024년 9월 사망했다. 톨레도는 브라질 건설사 오데브레히트 뇌물로 미국에서 송환되어 2024년 20년형, 우말라는 2025년 4월 15년형, 쿠친스키는 가택연금, 비스카라는 2020년 탄핵 뒤 2025년 구속, 카스티요는 2022년 12월 의회 해산을 선포하는 \"친위 쿠데타\"를 시도하다 두 시간 만에 체포되어 2025년 11월 11년형을 받았다. 알란 가르시아는 2019년 체포 직전 자택에서 자살했다. 그를 이은 볼루아르테는 2025년 10월 탄핵됐다.","원인의 핵심은 오데브레히트다. 이 브라질 건설사가 남미 각국 정치인에게 뇌물을 뿌린 사실이 2016년 미국 법정에서 드러났고 페루가 가장 철저히 수사했다. 페루 정치는 대통령과 의회가 서로를 탄핵과 해산으로 위협하는 구조라 대통령 임기가 끝까지 가는 일이 드물다. 2016년 이후 대통령이 7명이다. 2026년 4월 대선을 거쳐 7월 28일 새 대통령이 취임했고, 우리는 그 두 달 뒤에 도착한다. 리마 택시 기사에게 정치 이야기를 꺼내면 30분은 이어진다. 놀라운 것은 이런 정치 속에서도 페루 경제가 남미에서 가장 안정적으로 성장해 왔다는 점이다. 중앙은행이 정치와 분리돼 있기 때문이다."]},{"title":"칠레 광부 33인","paragraphs":["2010년 8월 5일 칠레 북부 코피아포 근처 산호세 구리 광산이 무너져 광부 33명이 지하 700m에 갇혔다. 17일 동안 생사를 몰랐다. 8월 22일 시추 드릴이 대피소에 닿았고, 드릴 끝에 빨간 글씨 쪽지가 붙어 나왔다. \"우리 33명은 대피소에 잘 있다.\" 그동안 그들은 이틀에 참치 두 숟갈과 우유 반 컵으로 버텼다. 10월 13일, 69일 만에 페닉스 캡슐이 한 명씩 끌어올리는 것을 전 세계 10억 명이 생중계로 봤다. 마지막으로 올라온 작업반장 루이스 우르수아가 대통령에게 \"교대 근무를 넘깁니다\"라고 말했다.","이 사건은 칠레 광산 안전법을 바꿨고 영화(2015, 안토니오 반데라스)가 됐지만, 광부들 대부분은 보상금 소송에서 졌고 몇몇은 트라우마로 일을 못 한다. 칠레는 세계 구리의 4분의 1을 캐는 나라이고, 코피아포는 우리가 가는 아타카마 사막의 남쪽 끝이다. 칼라마의 추키카마타는 세계 최대 노천 구리 광산으로 깊이 1km의 구덩이인데, 산페드로에서 칼라마 공항으로 갈 때 그 주변 광산 도시를 지난다. 칠레 사막의 하늘이 맑은 것과 땅속이 온통 구리인 것은 같은 지질의 결과다."]},{"title":"피노체트의 헌법은 아직 살아 있다","paragraphs":["칠레는 1973년 쿠데타 이후 17년의 피노체트 독재를 1988년 국민투표 \"NO\" 캠페인으로 끝냈다. 영화 「노(No)」가 그 이야기다. 그런데 독재가 1980년에 만든 헌법은 그대로 남았다. 2019년 10월 지하철 요금 30페소 인상에서 시작된 대규모 시위(\"30페소가 아니라 30년\")가 새 헌법 요구로 번졌고, 2020년 국민투표에서 78%가 새 헌법 제정에 찬성했다. 그러나 2022년 좌파 성향의 초안은 62%로 부결되고, 2023년 우파 성향의 초안은 56%로 부결됐다. 결국 헌법은 그대로다.","2022년 취임한 서른여섯 살의 좌파 대통령 가브리엘 보리치는 시위 세대의 얼굴이었지만 헌법도 연금 개혁도 뜻대로 되지 않았다. 2025년 12월 결선에서 강경 우파 호세 안토니오 카스트가 당선되어 2026년 3월 취임했다. 피노체트를 옹호한 전력이 있는 그의 당선은 치안 불안과 이민 문제가 칠레 유권자의 첫 관심사가 됐음을 보여 준다. 우리가 걷는 산티아고 알라메다 거리, 바케다노 광장의 낙서, 라 모네다 앞 아옌데 동상, 기억과 인권 박물관은 모두 이 50년 동안의 흔적이다. 산티아고 사람들과 정치 이야기는 페루보다 조심스럽다. 가족 안에서도 갈린 문제이기 때문이다."]},{"title":"기차 무덤과 부치 캐시디의 최후","paragraphs":["우유니 마을 외곽 기차 무덤의 녹슨 증기기관차들은 1890년대 영국 회사가 놓은 안토파가스타–우유니–오루로 철도의 유산이다. 볼리비아 고원의 은·주석·붕소를 태평양 항구로 실어 나르던 철도로, 우유니는 그 정비 기지로 세워진 마을이다. 1940년대 광물 값이 떨어지고 광산이 문을 닫으면서 기관차들은 사막에 버려졌고, 소금기 있는 바람이 100년 동안 녹슬게 했다. 마을 사람들이 부품을 뜯어 팔았고, 지금은 관광객이 올라타는 놀이터다. 우유니에서 칠레 국경 쪽으로 가는 철도는 지금도 화물이 다닌다.","이 철도가 실어 나르던 광산 급료를 노린 강도가 있었다. 1908년 11월 우유니 근처 산비센테 마을에서 볼리비아 군경에 포위되어 죽은 두 미국인 강도가 부치 캐시디와 선댄스 키드다. 미국에서 은행과 열차를 털다 쫓겨 아르헨티나 파타고니아로 갔고, 다시 볼리비아로 흘러들어 광산 급료 수송대를 턴 뒤 산비센테 여인숙에서 최후를 맞았다. 영화(1969, 폴 뉴먼과 로버트 레드퍼드)는 그 총격전 장면으로 끝난다. 시신은 신원 확인이 안 된 채 마을 묘지에 묻혔고, 1990년대 미국 법의학팀이 파 보았지만 다른 사람의 뼈였다. 우유니에서 남서쪽으로 100km, 투어 경로 근처의 아무것도 없는 광산 마을이다."]},{"title":"라파즈의 나치, 칠레의 콜로니아","paragraphs":["1951년 볼리비아에 \"클라우스 알트만\"이라는 독일인 사업가가 정착했다. 리옹 게슈타포 책임자로 수천 명을 고문하고 죽인 클라우스 바르비였다. 미국 정보기관이 반공 협력자로 쓰다가 남미로 도피시킨 것이다. 그는 라파즈에서 해운 회사를 하며 볼리비아 군사정권의 고문 자문을 맡았고, 1980년 마약 쿠데타에도 관여했다. 1983년 볼리비아에 민주 정부가 들어서자 프랑스로 넘겨져 종신형을 받고 1991년 감옥에서 죽었다. 라파즈 소포카치 지구의 카페에서 그가 오후를 보냈다는 이야기가 있다.","칠레에는 콜로니아 디그니다드가 있었다. 1961년 독일 전 위생병 파울 셰퍼가 산티아고 남쪽 300km에 세운 독일인 공동체로, 겉은 농장과 병원이었지만 안에서는 아동 성학대와 노예 노동이 있었고 피노체트 비밀경찰의 고문 장소로 쓰였다. 셰퍼는 1997년 도주해 2005년 아르헨티나에서 잡혔다. 지금 그 마을은 \"비야 바비에라\"라는 이름의 독일풍 관광지로 바뀌어 소시지와 케이크를 판다. 넷플릭스 드라마와 영화 「콜로니아」(2015)가 이 이야기다. 남미가 20세기 유럽의 어두운 유산을 어떻게 받아 안았는지 보여 주는 두 사례다."]},{"title":"파라카스의 긴 두개골과 이카의 가짜 돌","paragraphs":["1928년 페루 고고학자 훌리오 테요가 파라카스 반도 사막에서 무덤 429기를 발견했다. 2천 년 전 시신들은 화려한 직물에 싸여 있었고, 두개골이 길게 늘어난 것이 많았다. 갓난아기 머리를 널빤지와 천으로 묶어 자라는 동안 모양을 잡은 인공 변형으로, 귀족의 표시였다. 이카 지역박물관에 그 두개골과 직물이 있다. 2천 년 된 실의 색이 아직 선명하고, 한 장의 망토에 수십 가지 색실이 들어갔다. 파라카스 문화는 나스카 문화의 전신이다.","이 두개골은 \"외계인 증거\"로 끝없이 소비된다. 1960년대 이카의 의사 하비에르 카브레라는 공룡과 인간이 함께 새겨진 돌 1만 개를 모아 \"고대 문명이 공룡과 살았다\"고 주장했는데, 돌을 새겨 판 농부가 텔레비전에서 직접 만드는 법을 시연했다. 2017년부터 멕시코 방송인 하이메 마우산이 나스카 근처에서 나온 \"손가락 세 개 외계인 미라\"를 들고 다녔고 2023년 멕시코 의회에까지 가져갔지만, 페루 검찰과 학계는 동물 뼈와 인골을 조립한 것이라고 결론 냈다. 리마 공항에서 그 미라가 반출되다 압수된 적도 있다. 나스카 라인 전망대에서 이 이야기를 하는 가이드가 있으면 웃어 주면 된다."]},{"title":"남미 최초의 철도와 안데스를 오르는 기차","paragraphs":["남미 최초의 철도는 1851년 리마와 카야오 항구를 잇는 14km 노선이었다. 그러나 페루 철도의 전설은 1870년 미국인 헨리 메이그스가 시작한 리마–우안카요 중앙 철도다. 해발 0m에서 4,781m 고개까지 지그재그와 터널 60개, 다리 60개로 오르는 이 철도는 100년 넘게 세계에서 가장 높은 철도였고, 지금도 매달 몇 번 관광 열차가 다닌다. 객차에 산소통과 간호사가 탄다. 메이그스는 칠레에서 철도를 놓다 사기로 쫓겨난 인물인데 페루에서는 영웅이 됐다.","쿠스코–푸노 철도(우리가 타는 구간의 원형)는 1908년에 완성됐고 라 라야 고개(4,335m)를 넘는다. 쿠스코–마추픽추 노선은 1928년 개통했다. 마추픽추가 관광지가 된 것은 이 기차 덕이다. 원래 국영이던 페루 철도는 1999년 민영화되어 페루레일(벨몬드 소유)과 잉카레일이 나눠 운영하고, 관광객용 요금과 현지인용 요금이 열 배 차이다. 안데스에서 기차보다 흔한 것은 버스다. 페루 크루스 델 수르, 볼리비아 토도 투리스모, 칠레 투르부스 같은 침대 버스 회사가 밤새 안데스를 넘는다. 우리가 낮에 버스로 가는 쿠스코–푸노 구간은 밤에는 침대 버스가 8시간에 달린다."]}]}},"rail":[{"id":"exp31","name":"PeruRail Expedition 31","from":"오얀따이땀보","to":"아구아스칼리엔테스","dep":"2026-09-25T09:15","arr":"2026-09-25T10:52"},{"id":"exp604","name":"PeruRail Expedition 604","from":"아구아스칼리엔테스","to":"오얀따이땀보","dep":"2026-09-25T17:23","arr":"2026-09-25T19:02"}]};</script>
