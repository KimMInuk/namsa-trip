<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남미 13일</title>
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="남미13일">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
--bg:#0b0d12; --surface:#14171f; --surface-2:#1b1f2a;
--text:#eef0f5; --muted:#8d94a6; --faint:#5c6373;
--line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
--hi:inset 0 1px 0 rgba(255,255,255,.04);
--accent:#f2b544; --cool:#5aa9e6; --bad:#e2645c; --good:#5cb88a;
--pe:#e07a4a; --bo:#5cb88a; --cl:#5aa9e6;
--tint:var(--accent);
--r-card:18px; --r-tile:14px; --r-photo:16px; --r-chip:999px;
--radius:18px;
--maxw:640px; --pad:20px;
--tabh:60px;
--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
background:var(--bg); color:var(--text); font-family:var(--font);
font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
-webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere;
overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{
max-width:var(--maxw); margin:0 auto;
padding:14px var(--pad) calc(var(--tabh) + 28px + env(safe-area-inset-bottom));
}
@keyframes nsPage{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.pgin{animation:nsPage .16s cubic-bezier(.22,.61,.36,1) both}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.96)}
.tap.lg:active{transform:scale(.985)}
@keyframes nsSkel{0%,100%{opacity:.45}50%{opacity:.9}}
.skel{background:var(--surface-2);border-radius:8px;animation:nsSkel 1.1s ease-in-out infinite;display:block}
@media (prefers-reduced-motion:reduce){
#app.pgin{animation:none}
.tap,.tap:active{transition:none;transform:none}
.skel{animation:none}
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.display{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.title{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.015em}
.h{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.body{font-size:15px;line-height:24px;font-weight:400}
.small{font-size:13px;line-height:18px}
.micro{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.num,.tab-num{font-variant-numeric:tabular-nums}
.page-title{font-size:22px;line-height:28px;margin:6px 0 4px}
.page-sub{color:var(--muted);font-size:13px;line-height:18px;margin:0 0 18px}
.sec{margin:24px 0 0}
.sec-h{
font-size:11px;line-height:14px;color:var(--muted);font-weight:600;
letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;
}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.krw{font-size:.86em;color:var(--muted);white-space:nowrap}
.card{
background:var(--surface); border:1px solid var(--line);
border-radius:var(--r-card); padding:16px; margin-bottom:12px;
box-shadow:var(--hi);
}
.card.tight{padding:13px 14px}
.card.flat{background:transparent;box-shadow:none}
.callout{
border:1px solid rgba(242,181,68,.35); background:rgba(242,181,68,.07);
border-radius:12px; padding:13px 14px; margin:12px 0 0;
}
.callout .lab{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.callout.cool{border-color:rgba(110,168,216,.32);background:rgba(110,168,216,.07)}
.callout.cool .lab{color:var(--cool)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
display:inline-flex;align-items:center;gap:4px;
font-size:11px;font-weight:600;letter-spacing:.02em;
padding:3px 8px;border-radius:999px;
border:1px solid var(--line); color:var(--muted); background:var(--surface-2);
white-space:nowrap;
}
.badge.accent{color:var(--accent);border-color:rgba(242,181,68,.35);background:rgba(242,181,68,.08)}
.badge.cool{color:var(--cool);border-color:rgba(110,168,216,.35);background:rgba(110,168,216,.09)}
.badge.off{opacity:.35}
.row{
display:flex;gap:11px;align-items:flex-start;
padding:12px 13px; border:1px solid var(--line); border-radius:var(--r-tile);
background:var(--surface); margin-bottom:8px; width:100%; text-align:left;
box-shadow:var(--hi); transition:transform .12s ease,background .12s ease;
}
.row.plain{background:transparent;box-shadow:none}
a.row:active,button.row:active{background:var(--surface-2);transform:scale(.985)}
.row .ico{flex:0 0 auto;margin-top:2px;color:var(--accent);display:flex}
.row .ico.geo{position:relative}
.row .ico.geo::after{content:"";position:absolute;top:0;right:-1px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.85}
.row .bd{flex:1 1 auto;min-width:0}
.row .nm{display:block;font-weight:600;font-size:15px}
.row .mt{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.row .nt{display:block;color:var(--muted);font-size:13px;margin-top:5px;line-height:1.55}
.row .badges{display:flex}
.row .chev{flex:0 0 auto;color:var(--muted);align-self:center}
ul.bul{margin:0;padding-left:18px}
ul.bul li{margin:5px 0}
ul.bul.tight li{margin:3px 0}
.btn{
display:inline-flex;align-items:center;justify-content:center;gap:6px;
padding:10px 14px;border-radius:12px;border:1px solid var(--line);
background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;
cursor:pointer;min-height:44px;transition:transform .12s ease,opacity .12s ease;
}
.btn:active{opacity:.75;transform:scale(.96)}
.btn.ghost{background:transparent}
.btn.accent{border-color:rgba(242,181,68,.4);color:var(--accent);background:rgba(242,181,68,.08)}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-row .btn{flex:1 1 auto}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],input[type=email],select{
background:var(--bg);border:1px solid var(--line);border-radius:10px;
padding:9px 11px;width:100%;outline:none;
}
input:focus,select:focus{border-color:var(--accent)}
label.fl{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
label.fl:first-child{margin-top:0}
.shake{animation:nsShake .38s cubic-bezier(.36,.07,.19,.97) both}
@keyframes nsShake{
10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.vault-err{color:var(--bad)}
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;cursor:pointer;min-height:44px}
.chk input{
appearance:none;-webkit-appearance:none;flex:0 0 auto;
width:19px;height:19px;margin:2px 0 0;border:1.5px solid var(--line);
border-radius:6px;background:var(--bg);position:relative;cursor:pointer;
}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{
content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
border:solid #0b0d12;border-width:0 2px 2px 0;transform:rotate(43deg);
}
.chk span{flex:1;font-size:14px;line-height:1.55}
.chk input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk.set input:checked + span{color:var(--text);text-decoration:none}
.tabbar{
position:fixed;left:0;right:0;bottom:0;z-index:50;
background:rgba(11,13,18,.72); backdrop-filter:blur(18px) saturate(140%);
-webkit-backdrop-filter:blur(18px) saturate(140%);
border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:var(--maxw);margin:0 auto;display:flex}
.tab{
position:relative;
flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:2px;height:var(--tabh);color:var(--muted);font-size:11px;font-weight:500;
background:none;border:0;cursor:pointer;transition:color .12s ease;
}
.tab.on{color:var(--text);font-weight:700}
.tab svg{display:block}
.tab .dotm{display:block;width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.tab.on .dotm{background:var(--accent)}
.tab.on .ic{color:var(--accent)}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl-item{position:relative;margin-bottom:10px}
.tl-item::before{
content:"";position:absolute;left:-18px;top:20px;width:9px;height:9px;
border-radius:50%;background:var(--bg);border:1.5px solid var(--line);
}
.tl-item.on::before{background:var(--accent);border-color:var(--accent)}
.tl-head{
display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
background:var(--surface);border:1px solid var(--line);border-radius:12px;
padding:12px 13px;cursor:pointer;
}
.tl-item.on .tl-head{border-color:rgba(242,181,68,.4)}
.tl-d{flex:0 0 46px;font-size:12px;font-weight:700;color:var(--accent);padding-top:1px}
.tl-b{flex:1;min-width:0}
.tl-t{display:block;font-weight:600;font-size:14.5px}
.tl-m{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tl-body{padding:2px 0 6px}
.alt{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px}
.alt-b{flex:1;background:var(--surface-2);border-radius:3px 3px 0 0;min-height:4px;position:relative}
.alt-b.on{background:var(--accent)}
.alt-l{display:flex;gap:3px;margin-top:6px}
.alt-l span{flex:1;font-size:9px;color:var(--muted);text-align:center;line-height:1.25;word-break:keep-all}
.alt-l span.on{color:var(--accent);font-weight:700}
.read-wrap{font-size:16px;line-height:1.75;max-width:60ch}
.read-wrap p{margin:0 0 14px}
details.art{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px;overflow:hidden}
details.art > summary{
list-style:none;cursor:pointer;padding:14px 15px;display:flex;gap:10px;align-items:flex-start;
font-weight:600;font-size:15.5px;line-height:1.5;
}
details.art > summary::-webkit-details-marker{display:none}
details.art[open] > summary{border-bottom:1px solid var(--line)}
details.art .art-body{padding:15px}
.art-chk{
flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--line);border-radius:6px;
display:flex;align-items:center;justify-content:center;margin-top:2px;
background:var(--bg);color:transparent;
}
.art-chk.done{background:var(--accent);border-color:var(--accent);color:#0b0d12}
details.art .art-t{flex:1;min-width:0}
.card.rdl{padding:4px 16px}
.rdr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;min-height:52px}
.rdr:last-child{border-bottom:0}
.rdr .art-chk.sm{width:22px;height:22px;flex:0 0 auto}
.rdr .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rdr .rt{font-size:15px;font-weight:600;line-height:21px}
.rdr .rm{font-size:12px;color:var(--muted)}
.rdr>.ic{flex:0 0 auto;width:16px;height:16px;color:var(--faint)}
.rdr:active{background:var(--surface-2)}
.dcol .rdr.hid{display:none}
.rdl .dep-more{margin:0 -16px -4px;width:calc(100% + 32px)}
details.plain{margin-top:12px}
details.plain > summary{
list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;
padding:8px 0;display:flex;align-items:center;gap:6px;
}
details.plain > summary::-webkit-details-marker{display:none}
table.fx{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.fx th,table.fx td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.fx th:first-child,table.fx td:first-child{text-align:left;color:var(--muted)}
table.fx th{color:var(--muted);font-weight:600;font-size:12px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.clock{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.clock:last-child{border-bottom:0}
.clock .z{font-weight:600}
.clock .z small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.clock .t{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.01em}
.clock .t small{display:block;text-align:right;color:var(--muted);font-size:11.5px;font-weight:400}
.phr{padding:11px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .es{font-weight:700;font-size:15px}
.phr .pr{color:var(--accent);font-size:15px;font-weight:500;line-height:1.45;margin-top:3px;letter-spacing:-.01em}
.phr .ko{color:var(--muted);font-size:13.5px;margin-top:3px}
.ph-search{padding:2px 0 2px;margin:0 0 4px}
.dd{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13.5px}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{text-align:right}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;padding:6px 0;margin-bottom:2px;background:none;border:0;cursor:pointer}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}
.flt{display:flex;align-items:center;gap:10px;margin:10px 0}
.flt .side{flex:1;min-width:0}
.flt .side.r{text-align:right}
.flt .code{font-size:19px;font-weight:700;letter-spacing:-.01em}
.flt .tm{font-variant-numeric:tabular-nums;font-size:13.5px;margin-top:1px}
.flt .term{color:var(--muted);font-size:11.5px;margin-top:1px}
.flt .mid{flex:0 0 auto;color:var(--muted);font-size:11px;text-align:center;padding:0 4px}
.hero{
position:relative;border-radius:var(--r-photo);overflow:hidden;
background:var(--surface-2);border:1px solid var(--line);margin:0 0 14px;
}
.hero .ph{aspect-ratio:16/9}
.hero.compact .ph{max-height:150px}
.hero .cap{
position:absolute;left:0;right:0;bottom:0;padding:30px 16px 13px;
background:linear-gradient(to top,rgba(11,13,18,calc(.62 + .34 * var(--gk,.5))),rgba(11,13,18,calc(.2 + .34 * var(--gk,.5))) 46%,rgba(11,13,18,0));
font-weight:700;font-size:17px;line-height:24px;letter-spacing:-.01em;
}
.hero .cap small{display:block;font-weight:500;font-size:11.5px;color:#c3c9d6;margin-top:2px}
.hero .crd{
position:absolute;right:8px;top:8px;font-size:10px;color:#c3c9d6;
background:rgba(11,13,18,.62);border-radius:6px;padding:2px 6px;
}
.row.rowimg{padding:0;gap:0;overflow:hidden;align-items:stretch}
.row.rowimg .rowlink{display:flex;gap:11px;align-items:flex-start;flex:1 1 auto;min-width:0;padding:12px 13px}
.row.rowimg .rowlink:active{background:var(--surface-2)}
.thumb{
flex:0 0 auto;width:72px;height:72px;align-self:center;margin:8px 8px 8px 4px;
padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
background:var(--surface-2);cursor:pointer;display:block;
}
.thumb .ph{height:100%}
.thumb:active{opacity:.7}
.gal{margin:0 0 16px}
.gal .bhead{margin-bottom:8px}
.gal-s{
display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:1px 0 7px;
-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:none;
}
.gal-s::-webkit-scrollbar{display:none}
.gal-c{
position:relative;flex:0 0 auto;width:198px;scroll-snap-align:start;padding:0;
border:1px solid var(--line);border-radius:12px;overflow:hidden;
background:var(--surface-2);color:inherit;cursor:pointer;display:block;
}
.gal-c .ph{aspect-ratio:16/9}
.gal-c:active{opacity:.75}
.gal-c .gc{
position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;text-align:left;
font-size:11px;line-height:1.35;font-weight:600;color:#eef1f6;
background:linear-gradient(to top,rgba(11,13,18,calc(.62 + .34 * var(--gk,.5))),rgba(11,13,18,0));
}
.gal.compact .gal-c{width:138px}
.gal.compact .gal-c .gc{font-size:10px;padding:14px 7px 5px}
.lb{
position:fixed;inset:0;z-index:200;background:rgba(6,7,10,.97);
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
}
.lb img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px;display:block}
.lb .lb-cap{max-width:min(100%,560px);margin-top:14px;font-size:13px;line-height:1.55;text-align:center}
.lb .lb-cap .cr{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.lb .lb-cap .cr a{text-decoration:underline;text-underline-offset:2px}
.lb .lb-x{
position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.lb .lb-b{display:flex;flex-direction:column;align-items:center;max-width:100%}
.lb .lb-a{
position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
border:1px solid var(--line);background:rgba(20,23,30,.9);color:var(--text);
display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
}
.lb .lb-a.p{left:8px}
.lb .lb-a.n{right:8px}
.lb .lb-a.p .ic{transform:none}
.thumb.sm{width:56px;height:56px;margin:0;border-radius:9px;align-self:flex-start}
.row .oth{
flex:0 0 auto;width:56px;height:56px;align-self:center;display:block;overflow:hidden;
border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
}
.row .oth .ph{height:100%}
.credits{font-size:12px;line-height:1.6}
.credits .cr-g{color:var(--muted);font-weight:600;letter-spacing:.04em;padding:12px 0 3px}
.credits .cr-g:first-child{padding-top:0}
.credits .cr-i{padding:9px 0;border-bottom:1px solid var(--line)}
.credits .cr-i:last-child{border-bottom:0}
.credits .cr-t{color:var(--text);word-break:break-all}
.credits .cr-m{color:var(--muted);margin-top:2px}
.credits a{text-decoration:underline;text-underline-offset:2px}
.wx{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 13px}
.wx-top{display:flex;align-items:center;gap:11px}
.wx-ico{flex:0 0 auto;color:var(--accent);display:flex}
.wx-now{flex:0 0 auto;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx-lab{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.45}
.wx-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.wx-grid .wx-c{
flex:1 1 84px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;
}
.wx-c .k{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.wx-c .v{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.wx-ref{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6;border-left:2px solid var(--line-2);padding-left:10px}
.wx-ref b{color:var(--text);font-weight:600}

.dprof{
border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-photo) var(--r-photo);
background:var(--surface);padding:8px 0 6px;margin-bottom:14px;overflow:hidden;
}
.dprof-h{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 14px 4px}
.bhead{display:flex;align-items:center;gap:7px;margin:0 0 8px}
.bhead .ic{width:16px;height:16px;color:var(--accent);vertical-align:0}
.bhead .t{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bhead .n{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.icard{display:flex;gap:11px;align-items:flex-start}
.icard > .ic{color:var(--accent);margin-top:3px}
.icard .ib{flex:1;min-width:0}
.chero.noimg{padding-top:132px;background:linear-gradient(160deg,var(--surface-2),var(--bg))}
.chero.noimg::after{background:none}
.tk-card{display:block;color:inherit}
.tk-card:active{transform:scale(.985)}
.pcard .pov > span{display:block}
.pcard .pm{display:flex}
.pcard.nopic{min-height:132px;background:linear-gradient(150deg,var(--surface-2),var(--surface))}
.pcard.nopic .pov{position:relative;background:none;padding:16px 14px}
.dhero.solo{border-radius:var(--r-photo);margin-bottom:14px}
.bchip.off{opacity:.42}
.bchip.off .ic{color:var(--faint)}
.mseg{margin-bottom:8px}
.mseg > summary{
list-style:none;cursor:pointer;display:flex;gap:11px;align-items:center;min-height:44px;
padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-tile);
background:var(--surface);box-shadow:var(--hi);
}
.mseg > summary::-webkit-details-marker{display:none}
.mseg > summary .ico{flex:0 0 auto;color:var(--accent);display:flex}
.mseg > summary .chev{flex:0 0 auto;color:var(--muted);display:flex;transition:transform .15s}
.mseg[open] > summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.mseg[open] > summary .chev{transform:rotate(90deg)}
.row.done .ico{color:var(--good)}
.msb{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-tile) var(--r-tile);background:var(--surface);padding:12px 13px 13px}
.msb .mctx{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:10px}
.msb .row{margin-bottom:7px}
.row .mbg{display:block;color:var(--accent);font-size:12px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mchips .chp{
display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:5px 12px 5px 5px;
border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface-2);
color:var(--text);font-size:12.5px;font-weight:600;text-decoration:none;
}
.mchips .chp.noim{padding-left:12px}
.mchips .chp img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block}
.mchips .chp:active{transform:scale(.96)}
.mtip{display:flex;gap:7px;align-items:flex-start;margin-top:9px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.mtip .ic{flex:0 0 auto;margin-top:3px;color:var(--accent)}
.mtip.warn .ic{color:var(--cool)}
.mtip .micro{color:var(--faint);margin-right:5px}
.ocard{
position:relative;background:var(--surface);border:1px solid var(--line);
border-radius:var(--r-photo);box-shadow:var(--hi);overflow:hidden;display:flex;flex-direction:column;
}
.ocard .oa{position:relative;display:block;background:var(--surface-2);color:inherit}
.ocard .oa .ph{aspect-ratio:1/1}
.ocard.nopic .oa{
min-height:96px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(150deg,rgba(242,181,68,.12),var(--surface-2));color:var(--accent);
}
.ocard.nopic .oa > .ic{width:26px;height:26px}
.ocard .ov{
position:absolute;left:0;right:0;bottom:0;padding:26px 11px 9px;
background:linear-gradient(to top,rgba(11,13,18,.94),rgba(11,13,18,.42) 55%,rgba(11,13,18,0));
}
.ocard.nopic .ov{position:relative;padding:10px 11px 0;background:none}
.ocard .ot{display:block;font-size:13.5px;line-height:18px;font-weight:700;color:#fff;letter-spacing:-.01em}
.ocard.nopic .ot{color:var(--text)}
.ocard .obd{padding:9px 11px 11px}
.ocard .od{
font-size:12px;line-height:17px;color:var(--muted);
display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.ocard .dst{margin-top:6px}
.ocard .actx{
position:absolute;right:6px;top:6px;width:32px;height:32px;margin:0;padding:0;
border:1px solid rgba(255,255,255,.16);border-left:1px solid rgba(255,255,255,.16);
border-radius:50%;background:rgba(11,13,18,.6);color:#eef0f5;z-index:2;
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.ocard .actx:active{color:var(--accent)}
.ring{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rgb{stroke:rgba(255,255,255,.14)}
.ring .rgf{stroke:var(--accent);stroke-linecap:round}
.ring .rgt{position:absolute;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring.sm .rgt{font-size:10px}
.ring.on-photo .rgb{stroke:rgba(255,255,255,.3)}
.msn .pcard{flex:0 0 76%;margin-bottom:0}
.mghead{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.mghead .mgb{flex:1;min-width:0}
.read-wrap.big{font-size:17px;line-height:1.75;max-width:62ch}
.read-wrap.big > p:first-child{font-size:18.5px;line-height:1.7;color:#f7f9fc}
.artfig{margin:18px 0;border-radius:var(--r-photo);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.artfig:active{opacity:.8}
.artfig .ph{aspect-ratio:3/2}
.artfig figcaption{font-size:11.5px;color:var(--muted);padding:8px 12px 10px;line-height:1.5}
.btn.rnd{border-radius:var(--r-chip)}
.rtime{display:block;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:3px;font-weight:500}
.gcard .gi .ic{width:22px;height:22px;vertical-align:0}
.gcard.dngr,.row.dngr{border-color:rgba(226,100,92,.32);background:rgba(226,100,92,.06)}
.gcard.dngr .gi,.row.dngr .ico{color:var(--bad)}
.gcard .gv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tiles.t2{grid-template-columns:1fr 1fr}
.tile .tv.s{font-size:14.5px;line-height:20px;letter-spacing:-.01em}
.tile.nite{background:linear-gradient(158deg,rgba(90,169,230,.13),var(--surface))}
.tile.dayt{background:linear-gradient(158deg,rgba(242,181,68,.13),var(--surface))}
.clk2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk-code.iata{font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.02em}
.tk-card.sm .tk-code.iata{font-size:21px;line-height:26px}
.tk-fields{display:flex;flex-wrap:wrap;gap:10px 16px;padding:2px 16px 13px}
.tk-f{min-width:70px}
.tk-f .k{display:block;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tk-f .v{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.tk-card .btn-row{margin:0;padding:0 16px 14px}
.fxrow{display:flex;align-items:center;gap:9px;margin-top:2px}
.fxrow input{font-size:26px;font-weight:700;letter-spacing:-.02em;padding:11px 12px;font-variant-numeric:tabular-nums}
.fxrow select{min-height:44px}
.flip{
flex:0 0 44px;width:44px;height:44px;border-radius:50%;cursor:pointer;
border:1px solid rgba(242,181,68,.4);background:rgba(242,181,68,.1);color:var(--accent);
display:flex;align-items:center;justify-content:center;transition:transform .12s ease;
}
.flip:active{transform:scale(.92)}
.fxres{display:flex;align-items:flex-end;gap:8px}
.fxres .fv{font-size:30px;line-height:34px;font-weight:700;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cwx{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cwx:last-child{border-bottom:0}
.cwx .cn{flex:0 0 82px;font-size:13px;font-weight:600}
.cwx .cn small{display:block;color:var(--faint);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.cwx .ct{flex:1;min-width:40px;height:8px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.cwx .cf{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--cool),var(--accent))}
.cwx .cv{flex:0 0 72px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.gbar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:9px 0 2px}
.gbar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .18s ease}
.segs{display:flex;gap:4px;margin-top:12px}
.seg{flex:1;height:7px;border-radius:999px;background:var(--surface-2)}
.seg.done{background:rgba(242,181,68,.42)}
.seg.on{background:var(--accent)}
.seglab{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-d.w{flex:0 0 76px;font-size:11.5px;letter-spacing:-.02em}
.tl-body .chk{padding:7px 2px}
.substick{position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0 7px}
ul.dotul{margin:0;padding:0;list-style:none}
ul.dotul li{position:relative;padding-left:15px;margin:7px 0;font-size:15px;line-height:1.65}
ul.dotul li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75}
.callout.warn{border-color:rgba(226,100,92,.35);background:rgba(226,100,92,.07)}
.callout.warn .lab{color:var(--bad);display:flex;align-items:center;gap:5px}
.callout.warn .lab .ic{width:14px;height:14px;vertical-align:0}
.strs{display:inline-flex;gap:2px;align-items:center;vertical-align:-2px}
.strs .ic{width:14px;height:14px;vertical-align:0;color:var(--accent)}
.strs .ic.off{color:var(--faint)}
.arow.a4{grid-template-columns:repeat(4,1fr)}
.spk{
flex:0 0 auto;width:36px;height:36px;margin:-6px -6px -6px 4px;border:0;border-radius:50%;
background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
cursor:pointer;position:relative;
}
.spk::after{content:"";position:absolute;inset:-4px}
.spk:active{color:var(--accent);transform:scale(.9)}
.spk.on{color:var(--accent)}
.spk .ic{width:18px;height:18px;vertical-align:0}
.esr{display:flex;align-items:flex-start;gap:6px}
.esr .esb{flex:1 1 auto;min-width:0}
.es-hint{border-color:rgba(90,169,230,.32);background:rgba(90,169,230,.07)}
.es-hint .lab{color:var(--cool);display:flex;align-items:center;gap:5px}
.es-hint .lab .ic{width:14px;height:14px;vertical-align:0}
.bub{display:flex;margin:0 0 10px}
.bub.me{justify-content:flex-end}
.bub-in{
max-width:86%;border:1px solid var(--line);border-radius:16px;padding:10px 13px;
background:var(--surface);box-shadow:var(--hi);position:relative;
}
.bub.me .bub-in{border-color:rgba(242,181,68,.32);background:rgba(242,181,68,.09);border-bottom-right-radius:5px}
.bub.them .bub-in{border-bottom-left-radius:5px}
.bub-in.now{border-color:var(--accent);background:rgba(242,181,68,.16)}
.bub .es{font-size:16px;font-weight:600;line-height:1.4}
.bub .pr{color:var(--accent);font-size:13.5px;margin-top:3px;line-height:1.4}
.bub .ko{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
.bub.hid .bub-in{filter:blur(4px);opacity:.5}
.bub-who{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shc{
border:1px solid var(--line);border-radius:var(--r-tile);background:var(--surface);box-shadow:var(--hi);
padding:12px;text-align:left;cursor:pointer;min-height:88px;display:flex;flex-direction:column;gap:4px;
}
.shc:active{background:var(--surface-2);transform:scale(.97)}
.shc .k{font-size:13.5px;font-weight:600;line-height:1.4}
.shc .e{color:var(--muted);font-size:11.5px;line-height:1.4;overflow:hidden}
.shc .mine{color:var(--accent);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.sho{
position:fixed;inset:0;z-index:210;background:#05060a;color:#fff;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:calc(56px + env(safe-area-inset-top)) 20px calc(74px + env(safe-area-inset-bottom));text-align:center;
}
.sho .sh-es{font-weight:700;line-height:1.28;letter-spacing:-.01em;word-break:keep-all}
.sho .sh-ko{color:#aeb6c6;font-size:14px;margin-top:18px;line-height:1.5}
.sho .sh-pr{color:var(--accent);font-size:14px;margin-top:8px}
.sho .sh-x,.sho .sh-nav{
position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sho .sh-x{top:calc(12px + env(safe-area-inset-top));right:14px}
.sho .sh-nav.p{left:14px;bottom:calc(16px + env(safe-area-inset-bottom))}
.sho .sh-nav.n{right:14px;bottom:calc(16px + env(safe-area-inset-bottom))}
.sho .sh-say{
position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(242,181,68,.45);
background:rgba(242,181,68,.14);color:var(--accent);display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px;
}
.sho .sh-i{position:absolute;top:calc(20px + env(safe-area-inset-top));left:0;right:0;color:#6c7488;font-size:12px;letter-spacing:.06em}
.dfr{display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.dfr:last-child{border-bottom:0}
.dfr .dk{flex:0 0 84px;font-size:13px;font-weight:600;padding-top:2px}
.dfc{flex:1 1 0;min-width:0;border-radius:9px;padding:6px 8px;border:1px solid var(--line)}
.dfc .c{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.dfc .w{display:block;font-size:13px;font-weight:600;margin-top:2px;line-height:1.35}
.dfc.pe{color:var(--pe);border-color:rgba(224,122,74,.3);background:rgba(224,122,74,.1)}
.dfc.bo{color:var(--bo);border-color:rgba(92,184,138,.3);background:rgba(92,184,138,.1)}
.dfc.cl{color:var(--cl);border-color:rgba(90,169,230,.3);background:rgba(90,169,230,.1)}
.dfn{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
.spk.dfs{width:30px;height:30px;margin:2px 0 -4px -6px;color:inherit;opacity:.75}
.spk.dfs .ic{width:15px;height:15px}
.rul{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.rul:last-child{border-bottom:0}
.rul .rn{
flex:0 0 22px;height:22px;border-radius:50%;background:rgba(242,181,68,.13);color:var(--accent);
font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.rul .rt{flex:1;font-size:13.5px;line-height:1.6}
.wtag{
display:inline-flex;align-items:center;min-height:26px;padding:1px 9px;margin:3px 4px 0 0;border-radius:999px;
border:1px solid rgba(242,181,68,.3);background:rgba(242,181,68,.08);color:var(--accent);
font-size:12.5px;cursor:pointer;
}
.wtag:active{transform:scale(.94)}
.osel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opill{
min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
color:var(--text);font-size:13px;display:inline-flex;align-items:center;cursor:pointer;
}
.opill.on{color:var(--accent);border-color:rgba(242,181,68,.45);background:rgba(242,181,68,.1)}
.opill:active{transform:scale(.95)}
.ores{border:1px solid rgba(242,181,68,.35);background:rgba(242,181,68,.07);border-radius:var(--r-card);padding:14px}
.ores .oe{font-size:17px;font-weight:700;line-height:1.4}
.ores .op{color:var(--accent);font-size:14px;margin-top:5px;line-height:1.45}
.ores .ok{color:var(--muted);font-size:13px;margin-top:5px}
.dpick{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit}
.dpick:last-child{border-bottom:0}
.dpick .db{flex:1;min-width:0}
.dpick .de{font-size:14px;font-weight:600}
.dpick .dko{color:var(--muted);font-size:12px;margin-top:1px}
.qch{
display:block;width:100%;min-height:52px;margin-top:8px;border-radius:12px;border:1px solid var(--line);
background:var(--surface);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;padding:12px;
font-variant-numeric:tabular-nums;
}
.qch:active{background:var(--surface-2)}
.qch.ok{border-color:rgba(92,184,138,.55);background:rgba(92,184,138,.12);color:var(--good)}
.qch.no{border-color:rgba(226,100,92,.55);background:rgba(226,100,92,.12);color:var(--bad)}
.qbig{font-size:24px;font-weight:700;line-height:1.35;text-align:center;padding:14px 4px;letter-spacing:-.01em}
.qst{display:flex;gap:6px}
.qst .tile{flex:1}
.fcw{perspective:900px;margin:10px 0}
.fcc{
min-height:220px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);
box-shadow:var(--hi);display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:24px 20px;text-align:center;cursor:pointer;width:100%;color:inherit;gap:8px;
}
.fcc:active{background:var(--surface-2)}
.fcc .fk{font-size:19px;font-weight:600;line-height:1.45}
.fcc .fe{font-size:21px;font-weight:700;line-height:1.35}
.fcc .fp{color:var(--accent);font-size:15px}
.fcc .fh{color:var(--faint);font-size:12px;margin-top:6px}
.fcc .fsrc{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.ph{position:relative;display:block;width:100%;overflow:hidden;isolation:isolate;background:var(--pc,var(--surface-2))}
.ph::after{
content:"";position:absolute;inset:-12%;z-index:0;pointer-events:none;
background-image:var(--pb);background-size:cover;background-position:var(--fp,50% 45%);
filter:blur(10px);transition:opacity .2s ease;
}
.ph.ld::after{opacity:0}
.ph > img{
position:relative;z-index:1;display:block;width:100%;height:100%;
object-fit:cover;object-position:var(--fp,50% 45%);opacity:0;transition:opacity .2s ease;
}
.ph.ld > img{opacity:1}
.ph > .phx{position:absolute;inset:0;z-index:2;pointer-events:none;background:var(--pc);opacity:.1}
.ph.a169{aspect-ratio:16/9}.ph.a43{aspect-ratio:4/3}.ph.a167{aspect-ratio:16/7}
.ph.a32{aspect-ratio:3/2}.ph.a1{aspect-ratio:1/1}.ph.fill{height:100%}
@media (prefers-reduced-motion:reduce){.ph::after,.ph > img{transition:none}}
.chero-b,.dday-wrap,.hero .cap,.gal-c .gc,.pcard .pov,.dhero-b,.ocard .ov,.fg-c .fgl{
text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.pcard .pn,.gal-c .gc,.ocard .ot{color:#eef1f6}
.phrow{position:relative;overflow:hidden;isolation:isolate}
.phrow .bgp{
position:absolute;inset:0;z-index:-2;background-image:var(--bg-img);background-size:cover;
background-position:var(--fp,50% 45%);opacity:.26;
}
.phrow .bgt{position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--pc) 0%,rgba(20,23,31,.86) 62%,rgba(20,23,31,.94) 100%);opacity:.63}
.row.phrow .nt,.row.phrow .mt{color:#c3c9d6}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mos > .pcard{margin-bottom:0}
.mos > .m2{grid-column:span 2}
.rprog{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .08s linear}
@media (prefers-reduced-motion:reduce){.rprog{transition:none}}
.read-wrap.big > p:first-child::first-letter{
float:left;font-size:50px;line-height:.88;font-weight:800;letter-spacing:-.03em;
padding:3px 9px 0 0;color:var(--accent);
}
.artfig.fb{margin:20px calc(-1 * (var(--pad) + 16px));border-radius:0;border-left:0;border-right:0}
.artfig .cbar{display:flex;align-items:center;gap:9px;padding:8px 12px 10px}
.artfig.fb .cbar{padding-left:calc(var(--pad) + 16px);padding-right:calc(var(--pad) + 16px)}
.artfig .cbar .cnm{flex:1;min-width:0;font-size:12px;line-height:1.45;font-weight:600;color:var(--text)}
.artfig .cbar .cnm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.artfig .crb{
flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.artfig .crb .ic{width:15px;height:15px;vertical-align:0}
.crdpop{
position:fixed;z-index:210;max-width:min(300px,calc(100vw - 24px));
background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
padding:10px 12px;font-size:12px;line-height:1.55;box-shadow:0 12px 34px rgba(0,0,0,.55);
}
.crdpop a{text-decoration:underline;text-underline-offset:2px}
.crdpop .t{font-weight:600;margin-bottom:3px;color:var(--text)}
.crdpop .m{color:var(--muted)}
.gm-mk{fill:none;stroke:var(--bg);stroke-width:2.2}
.gm-mk2{fill:none;stroke:var(--accent);stroke-width:1.3;opacity:.9}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fg-c{
position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:12px;
overflow:hidden;background:var(--surface-2);color:inherit;cursor:pointer;
}
.fg-c:active{opacity:.75}
.fg-c .fgl{
position:absolute;left:0;right:0;bottom:0;z-index:3;padding:18px 7px 6px;text-align:left;
font-size:10.5px;line-height:1.3;font-weight:700;color:#fff;
background:linear-gradient(to top,rgba(11,13,18,calc(.64 + .3 * var(--gk,.5))),rgba(11,13,18,0));
}
.gtog{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.ec .ecp40{flex:0 0 auto;width:40px;height:40px;border-radius:11px;overflow:hidden;display:block}
.mn-i.phrow{padding:11px 12px;border-bottom:0;border-radius:var(--r-tile);margin-bottom:8px}
.mn-i.phrow + .mn-i:not(.phrow){border-top:1px solid var(--line)}
.artfig .fbi{display:block;cursor:pointer}
.artfig .fbi:active{opacity:.82}
.lb .lb-z{overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;max-width:100%}
.lb .lb-z img{transform-origin:center center;will-change:transform}
.lb .lb-rel{
display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 14px;min-height:44px;
border:1px solid var(--line-2);border-radius:var(--r-chip);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;
}
.lb button.lb-rel{font-family:inherit;cursor:pointer;margin-left:6px}
.lb .lb-hint{display:block;color:var(--faint);font-size:11.5px;margin-top:6px}
.splash{
position:fixed;inset:0;z-index:300;background:var(--bg);
display:flex;align-items:center;justify-content:center;
animation:spOut .32s ease .9s both;
}
.splash .sph{position:absolute;inset:0;overflow:hidden}
.splash .sph .ph{height:100%}
.splash .spv{
position:absolute;inset:0;background:linear-gradient(to top,rgba(11,13,18,.9),rgba(11,13,18,.35) 55%,rgba(11,13,18,.72));
}
.splash .spt{
position:relative;z-index:2;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);
animation:spIn .5s cubic-bezier(.22,.61,.36,1) both;
}
.splash .spn{font-size:38px;line-height:44px;font-weight:800;letter-spacing:-.03em}
.splash .sps{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#d6dbe6;margin-top:8px}
@keyframes spIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
.splash{animation:spOut .01s linear .6s both}
.splash .spt{animation:none}
}
</style>

, Bolivia Chile, San Pedro de Atacama","source":"https://lovebolivia.com/bolivia-border-crossings-guide/","lat":-22.91661,"lon":-67.79784}]}},{"id":"santiago","name":"산티아고","country":"칠레","altitude_m":520,"days":[12,13],"hotelIds":["santiago-novotel"],"subtitle":"산티아고 — 안데스 품의 종착지","meta":"해발 520m · 마지막 날 자유일정 후 기내泊 귀국","intro":"고지대를 다 내려와 숨이 트이는 마지막 도시. 자유일정으로 시내를 둘러보고 야간 귀국편 탑승. 여행 내내 못 먹은 도시 음식을 즐기기 좋은 날.","pois":[{"name":"산크리스토발 언덕","kind":"자유","desc":"푸니쿨라/케이블카로 오르는 도시+안데스 파노라마 전망대. 정상에 성모상.","mapQuery":"Cerro San Cristobal Santiago","lat":-33.42034,"lon":-70.6299},{"name":"산타루시아 언덕","kind":"자유","desc":"도심 한복판의 작은 언덕 공원. 계단·테라스 전망이 예쁜 산책 코스.","mapQuery":"Cerro Santa Lucia Santiago","lat":-33.43993,"lon":-70.64344},{"name":"아르마스 광장 (히스토릭 센터)","kind":"자유","desc":"대성당·중앙우체국이 둘러싼 구시가지 중심. 도보 관광 출발점.","mapQuery":"Plaza de Armas Santiago","lat":-33.43742,"lon":-70.65128},{"name":"바리오 베야비스타 / 라스타리아","kind":"자유","desc":"보헤미안 식당·바·갤러리 밀집. 식사+기념품에 최적. 야간 골목 소지품 주의.","mapQuery":"Barrio Bellavista Santiago","lat":-33.43255,"lon":-70.64765},{"name":"라 차스코나 (네루다의 집)","kind":"자유","desc":"노벨문학상 시인 네루다의 베야비스타 저택. 독특한 배 모양 집 투어.","mapQuery":"La Chascona Santiago"},{"name":"메르카도 센트랄","kind":"자유","desc":"철골 시장 안 해산물 식당가. 마지막 점심으로 칠레 해산물.","mapQuery":"Mercado Central Santiago","lat":-33.43362,"lon":-70.65102}],"restaurants":[{"name":"Sanguchería Ciudad Vieja","rating":"4.7","desc":"현지인으로 꽉 차는 칠레 가정식. 추천: 파스텔 데 초클로, 초대형 샌드위치. 월 휴무.","meta":"Constitución 92 · Bellavista · $$","mapQuery":"Sanguchería Ciudad Vieja"},{"name":"Peumayén Ancestral Food","rating":"4.5","desc":"마푸체 등 선조 문화 기반 테이스팅 다이닝. 추천: 빵 코스. 마무리 특별한 한 끼. 일 휴무.","meta":"Constitución 136 · Bellavista · $$$","mapQuery":"Peumayén Ancestral Food"},{"name":"Patio Bellavista","rating":"4.6","desc":"식당·바·공예점 모인 야외 푸드 단지. 못 정했을 때 무난, 기념품까지 한 번에.","meta":"Constitución 30 · 늦게까지","mapQuery":"Patio Bellavista","lat":-33.43416,"lon":-70.63507}]}],"inclusions":{"included":["남미내 3구간 항공 (항공료, 유류할증료, 항공TAX, 공항세 포함) — 1. 리마-쿠스코 2. 라파즈-우유니 3. 칼라마-산티아고","숙소 (2-4성급 호텔, 2인1실)","도시간 이동 버스, 공항/터미널-호텔 트랜스퍼 포함","특전 5가지: 1. 버기투어 2. 이카 사막디너 3. 마추피추 투어 4. 라파즈 시티투어 5. 우유니 2박3일 투어","중남미 스페셜리스트 '투어캡틴' 동행"],"excluded":["한국 – 남미 왕복 항공권 (본 상품은 페루 리마에서부터 시작하는 상품으로 남미로 오시는 항공권은 포함되어 있지 않습니다)","여행자보험 (개별적으로 반드시 가입하셔야 합니다)","남미 현지 교통비, 투어비 및 입장료, 식사비 및 개인경비 — USD $650","1인실 사용료: 84만원"],"notes":["최소 출발인원 8명 / 최대 25명","이 상품은 남미5개국 일주 팀과 리마부터 산티아고까지 함께 이동, 숙박하는 상품입니다.","남미내 항공권은 환불 불가. 확정서가 나오기 전까지 일정 순서·항공시간이 변동될 수 있습니다."]},"altitudeProfile":[{"city":"리마","altitude_m":154},{"city":"이카 · 와카치나","altitude_m":406},{"city":"쿠스코","altitude_m":3400},{"city":"마추픽추","altitude_m":2430},{"city":"푸노 · 티티카카","altitude_m":3812},{"city":"라파즈","altitude_m":3640},{"city":"우유니","altitude_m":3656},{"city":"알티플라노 · 라구나 콜로라다","altitude_m":4300},{"city":"산페드로 데 아따까마","altitude_m":2408},{"city":"산티아고","altitude_m":520}],"tips":{"altitude":["고산약은 한국에서 처방받아 가고, 리마공항에서 쿠스코행 탑승 전(D4, 09-24 오전)부터 복용. 현지에선 코카차·코카캔디로 보조.","고산약을 못 챙겼다면 D1(09-21) 리마 자유일정 때 약국에서 구입 — 투어캡틴 안내 사항.","도착 첫날 룰: 술·담배·과식·뜨거운 물 샤워 금지, 무리한 일정 금지, 물 많이. 이상 시 즉시 투어캡틴에게.","고산증세가 있을 때는 온수 샤워를 자제하고, 잠을 많이 자거나 누워만 있지 않기.","가장 큰 두 결정은 D3 나스카/바예스타와 D6 비니쿤카. 비용·체력·시간을 통으로 먹으니 이 둘만 정하면 끝.","비니쿤카 말(馬): 오르막은 말로 커버되지만 정상 직전 10~20분 + 계단은 직접 걷고 하산은 보통 도보. 쉬운 코스 아님.","고도 순서: 리마 154m → 쿠스코 3,400m → 푸노 3,812m(최고 숙박지) → 라파즈 3,640m → 우유니 3,656m → 라구나 4,300m대 → 아따까마 2,408m → 산티아고 520m","고산약은 리마공항 탑승 전부터 최소 48시간 복용. 현지 Altavita 20알 45~60솔(US$18). 투어 최고점 4,950m.","여행사 경험상 10명 중 1명 정도 증상 호소, 심하면 응급실. 가벼운 증상은 충분히 관리 가능."],"packing":["일교차 큰 레이어드(낮 반팔·밤 패딩), 선글라스·선크림·모자, 보조배터리, 멀미약.","D2 이카 사막 디너: 갑작스러운 기온 변화 대비 가벼운 외투, 모래바람 대비 선글라스·마스크.","D5 마추픽추: 긴바지·긴팔 권장, 화장실은 입구에만 있으니 입장 전 해결.","D10~D12 우유니 지프투어: 밤 영하 — 방한복·장갑·핫팩, 숙소 온수/전기 제한 가정.","D3 협곡 트레킹을 택하면 운동화 필수.","국제선 위탁 2개(각 23kg/158cm)·기내 1개(10kg). 남미 국내선은 위탁 23kg 1개, 기내 JetSMART·Sky 10kg(25×35×45), BoA 7kg(55×35×20). 기내용 캐리어는 유료 → 백팩.","수영복·스포츠타월 (이카 호텔 수영장, 우유니 노천온천).","핫팩 1~2개, 컵라면·햇반·컵밥, 휴대폰 방수팩, KF마스크·버프, 여권용 사진 2장, 휴대용 우산.","우유니 사진 소품: 야마 인형, 원통 과자통, 컬러풀 판초(쿠스코에서 구입 가능). 장화는 현지 제공.","보조배터리(대한항공 2026.4 기준): 1인 2개, 100Wh 이하(20,000mAh≈74Wh), 기내 휴대, 기내 사용·충전 금지, 선반 보관 금지, 지퍼백 개별 보관.","24인치 캐리어 권장 (오래 메고 다닐 일 없음). 캐리어 자물쇠."],"border":["여권 잔여 유효기간 6개월 이상 필요.","미국 경유 → ESTA 필수 (출발 72시간 전 승인 권장). 애틀랜타에서 입국심사 + 짐 찾아 재위탁 절차 있음.","볼리비아는 라파즈·우유니만 방문이면 황열병 접종 불요.","D8: 페루→볼리비아 데사구아데로 육로 국경, 출입국 심사 약 1시간. 페루와 볼리비아는 1시간 시차.","D12: 칠레 입국 시 각종 농식품 반입 금지 — 익히지 않은 유제품/과일류/농산물/코카잎/고기류 등. 지프투어 중 받은 간식·코카잎은 국경 전에 처리.","미성년자(만18세 미만)의 중남미 여행은 대사관 공증 필요.","칠레 반입: 조리된 포장식품(김치·멸치볶음 등)은 허용. 익히지 않은 농수산물·과일·유제품·코카잎·육류 금지."]},"readings":{"intro":{"id":"intro","name":"여행 전체 배경","articles":[{"title":"안데스 5천 년, 13일로 압축하기","paragraphs":["이번 여행이 지나가는 땅은 세계에서 가장 오래된 문명권 중 하나다. 리마 북쪽 카랄 유적은 기원전 3000년경, 이집트 피라미드와 같은 시대에 세워진 아메리카 최고(最古)의 도시다. 그 뒤로 차빈(기원전 900~200), 파라카스(기원전 800~기원후 100), 나스카(기원전 100~기원후 800), 모체(100~700), 티와나쿠(500~1000), 와리(600~1000) 문명이 차례로 안데스와 해안을 지배했다.","잉카는 이 긴 역사의 마지막 100년에 불과하다. 1438년 파차쿠텍이 확장을 시작해 1532년 스페인이 도착하기까지, 잉카는 오늘의 콜롬비아 남부에서 칠레 중부까지 약 4천km를 하나로 묶었다. 여행에서 만나는 유적 중 잉카의 것은 쿠스코·마추픽추·오얀따이땀보 정도이고, 나스카 라인·파라카스·우아카 푸야나·티와나쿠는 모두 잉카보다 수백에서 천 년 이상 앞선 것들이다.","여행 순서는 우연히도 역사 순서와 비슷하다. 리마(선잉카 우아카)→이카(파라카스·나스카)→쿠스코(잉카)→티티카카(잉카의 창조신화)→라파즈(식민지·독립)→산티아고(현대사). 각 도시에서 그 시대의 이야기를 하나씩 붙이면 13일이 하나의 연대기가 된다."]},{"title":"168명이 제국을 무너뜨린 이유","paragraphs":["1532년 11월 16일 카하마르카. 프란시스코 피사로의 168명이 수만 명의 잉카 군대 앞에서 황제 아타우알파를 생포했다. 이 믿기 어려운 사건의 배경에는 세 가지가 있다. 첫째, 천연두. 스페인인이 도착하기 5년 전 천연두가 먼저 남하해 황제 우아이나 카팍과 후계자를 죽였고, 형제 우아스카르와 아타우알파의 내전이 제국을 두 쪽 냈다. 둘째, 말과 강철. 안데스에는 말도 철도 없었다. 셋째, 잉카 내부의 피정복 민족들이 스페인 편에 섰다.","아타우알파는 몸값으로 방 하나를 황금으로, 두 방을 은으로 채우겠다고 약속했고 실제로 채웠다. 스페인은 몸값을 받은 뒤 1533년 7월 그를 처형했다. 같은 해 11월 스페인군은 쿠스코에 입성했다. 1536년 꼭두각시 황제 망코 잉카가 반란을 일으켜 삭사이와망에서 격전을 벌였지만 실패했고, 잉카의 잔존 세력은 빌카밤바의 밀림으로 물러나 1572년 마지막 황제 투팍 아마루가 쿠스코 광장에서 처형될 때까지 버텼다."]},{"title":"남미 독립과 세 나라의 얽힌 관계","paragraphs":["페루·볼리비아·칠레는 1810~1825년 사이 스페인에서 독립했다. 남쪽에서는 아르헨티나의 산 마르틴이 안데스를 넘어 칠레(1818)를 해방하고 1821년 7월 28일 리마에서 페루 독립을 선언했다. 북쪽에서는 시몬 볼리바르가 내려와 1824년 아야쿠초 전투로 스페인 세력을 완전히 몰아냈다. 볼리비아(1825)는 아예 볼리바르의 이름을 따 나라 이름을 지었다. 두 영웅은 1822년 에콰도르 과야킬에서 단 한 번 만났고, 회담 내용은 지금도 비밀로 남아 있다.","세 나라의 관계를 지금까지 규정하는 사건은 태평양 전쟁(1879~1884)이다. 아타카마 사막의 초석(질산염)과 구아노를 둘러싼 이 전쟁에서 칠레가 승리해 페루 남부와 볼리비아의 해안 전체를 가져갔다. 볼리비아는 바다를 잃고 내륙국이 되었지만 지금도 해군을 유지하고 매년 3월 23일 바다의 날을 기념한다. 이번 여행에서 우유니 투어 마지막 날 볼리비아에서 칠레로 넘어가는 그 국경이 바로 이 전쟁의 결과다."]},{"title":"출발 전 볼 것","paragraphs":["여행사가 사전모임 자료에서 추천한 예습 목록이다. 다큐멘터리로는 KBS 걸어서 세계속으로의 남미 편(공룡 도시 라파즈, 시간이 멈춘 잉카의 땅, 안데스 8천km 여정 등)이 이번 경로와 겹친다. 예능은 떠나면 김에 세계일주 시즌 1(페루·볼리비아), 지구마을 세계여행 시즌 2(페루). 넷플릭스 다큐 라틴아메리카는 4회가 페루 리마, 6회가 볼리비아 편이다.","영화로는 체 게바라의 남미 종단을 그린 모터사이클 다이어리(마추픽추·쿠스코 장면), 1988년 칠레 국민투표를 다룬 노(No), 아타카마 사막과 피노체트 시대 실종자를 함께 다룬 다큐 빛을 향한 노스탤지어가 여행지와 직접 닿아 있다. 음악은 엘 콘도르 파사 원곡(로스 잉카스)과 볼리비아 포크 그룹 로스 카르카스, 칠레의 비올레타 파라를 들어 두면 현지 거리 공연이 반갑게 들린다.","책은 존 헤밍의 잉카 제국의 정복, 마크 애덤스의 마추픽추 발견기(Turn Right at Machu Picchu)가 읽기 쉽다. 시간이 없으면 이 앱의 읽을거리를 비행기에서 순서대로 읽는 것으로 충분하다."]}]},"lima":{"id":"lima","name":"리마","articles":[{"title":"왕들의 도시: 피사로는 왜 쿠스코를 버렸나","paragraphs":["피사로는 1535년 1월 18일 리마를 세웠다. 잉카의 수도 쿠스코가 있는데 굳이 새 도시를 만든 이유는 바다다. 해발 3,400m의 산악 도시는 스페인과의 연결에 불리했고, 리막 강 하구와 카야오 항구가 있는 이 자리는 태평양을 통해 파나마와 세비야로 은을 실어 보내기에 이상적이었다. 공식 이름은 시우다드 데 로스 레예스(왕들의 도시). 동방박사 축일에 부지를 정한 데서 나온 이름이지만, 곧 원주민 이름 리막(말하는 자)이 변한 리마로 불리게 됐다.","이후 300년 가까이 리마는 스페인 남미 식민지 전체의 수도였다. 페루 부왕령은 한때 파나마부터 아르헨티나까지를 관할했고, 포토시의 은이 전부 이곳을 거쳐 유럽으로 갔다. 아메리카 최초의 대학(산 마르코스, 1551)과 종교재판소도 리마에 세워졌다. 1746년 대지진과 쓰나미로 도시 대부분과 카야오가 파괴됐고, 지금 구시가지의 바로크 건물 상당수는 그 뒤 재건된 것이다.","산 프란시스코 수도원 지하의 카타콤에는 약 2만 5천 구의 유골이 안치돼 있다. 1808년 시립 묘지가 생기기 전까지 리마 시민은 교회 지하에 묻혔고, 뼈들이 종류별로 정리된 기하학적 배열은 20세기 발굴 때 만들어진 것이다."]},{"title":"비는 안 오는데 늘 흐린 도시","paragraphs":["리마는 카이로 다음으로 건조한 대도시다. 연 강수량이 10mm 안팎으로 사막 한복판이나 다름없다. 그런데 5월부터 11월까지는 해가 거의 나지 않는다. 남극에서 올라오는 차가운 훔볼트 해류가 바다 위 공기를 식혀 두꺼운 안개층을 만들고, 이것이 도시를 덮는다. 페루 사람들은 이 안개를 가루아라고 부르며, 비가 아니라 이슬처럼 내려앉는다.","9월 말 도착하면 바로 이 회색 하늘을 만날 가능성이 높다. 기온은 15~19도로 서늘하고 습도가 높아 체감은 더 춥다. 이 우울한 하늘 때문에 리마 사람들은 허먼 멜빌이 백경에서 세상에서 가장 슬픈 도시라고 쓴 것을 자주 인용한다. 반대로 훔볼트 해류는 세계에서 가장 풍부한 어장을 만들어 페루 요리의 기반이 됐다. 세비체는 이 차가운 바다 덕분에 가능하다."]},{"title":"미라플로레스, 바랑코, 그리고 1992년","paragraphs":["호텔이 있는 미라플로레스는 리마의 부유한 해안 지구다. 태평양을 향한 100m 높이 절벽 위에 공원과 아파트가 늘어서 있고, 절벽 아래로는 서핑 해변과 라르코마르 쇼핑몰이 박혀 있다. 이 동네 한복판의 우아카 푸야나는 잉카보다 1천 년 앞선 리마 문화(200~700년)가 진흙 벽돌로 쌓은 피라미드다. 도시가 유적을 삼킨 것이 아니라 유적 주위로 도시가 자란 셈이다.","미라플로레스가 지금처럼 안전하고 정돈된 모습이 된 것은 오래되지 않았다. 1980~1992년 페루는 마오주의 게릴라 센데로 루미노소와의 내전으로 약 7만 명이 죽었고, 1992년 7월 16일 미라플로레스 타라타 거리에서 차량 폭탄이 터져 25명이 숨졌다. 그해 9월 지도자 아비마엘 구스만이 체포되면서 내전은 사실상 끝났고, 2000년대 경제 성장과 함께 미라플로레스와 바랑코가 관광·미식의 중심이 됐다. 바랑코는 19세기 리마 상류층의 해변 휴양지였다가 예술가들이 모여든 동네로, 한숨의 다리는 한 번에 숨을 참고 건너면 소원이 이뤄진다는 이야기가 있다."]},{"title":"페루 요리가 세계 1위가 된 이유","paragraphs":["2023년 리마의 레스토랑 센트랄이 세계 50대 레스토랑 1위에 올랐다. 페루 요리의 힘은 재료와 이민의 조합이다. 해안에는 훔볼트 해류의 해산물, 안데스에는 3천 종이 넘는 감자와 수십 종의 옥수수, 아마존에는 열대 과일이 있다. 여기에 스페인(양파·라임·소), 아프리카 노예(내장 요리 안티쿠초), 1849년부터 온 중국인 노동자(볶음 요리 치파, 로모 살타도는 웍 기법), 1899년부터 온 일본인(날생선을 얇게 써는 티라디토, 니케이 요리)이 겹쳐졌다.","세비체는 날생선을 라임즙·고추·양파·소금에 몇 분만 재운 것으로, 원래는 몇 시간 재웠지만 일본 이민자의 영향으로 짧게 재우는 지금 방식이 됐다. 생선을 재우고 남은 국물 레체 데 티그레(호랑이 우유)는 숙취 해소제이자 정력제로 따로 마신다. 세비체는 아침에 잡은 생선으로 점심에 먹는 음식이라 정통 세비체리아는 오후 4~5시면 문을 닫는다. 로모 살타도(소고기 볶음+감자튀김+밥), 아히 데 가이나(닭고기 크림), 카우사(감자 테린), 안티쿠초(소 염통 꼬치)가 대표 메뉴이고, 보라색 옥수수 음료 치차 모라다와 노란 탄산음료 잉카 콜라를 곁들인다."]},{"title":"피스코 사워, 원조 논쟁의 한가운데","paragraphs":["피스코는 포도 증류주다. 16세기 스페인이 가져온 포도로 이카 지방에서 만들기 시작했고, 선적항 이름 피스코가 술 이름이 됐다. 피스코 사워는 1920년대 리마 구시가지의 모리스 바에서 미국인 바텐더 빅터 모리스가 위스키 사워를 변형해 만든 것으로 알려져 있다. 피스코, 라임, 시럽, 달걀흰자를 흔들어 거품을 내고 앙고스투라 비터스 몇 방울을 떨어뜨린다.","페루와 칠레는 피스코의 원조를 두고 수십 년째 싸우고 있다. 칠레도 북부에서 피스코를 만들고 지역 이름을 아예 피스코 엘키로 바꿨다. 페루는 2월 첫째 토요일을 피스코 사워의 날로 지정했다. 이번 여행은 페루에서 시작해 칠레에서 끝나니 양쪽에서 한 잔씩 마시고 직접 판정해 볼 수 있다."]},{"title":"우아카 푸야나: 미라플로레스 한복판의 흙 피라미드","paragraphs":["미라플로레스 아파트 숲 사이에 갑자기 나타나는 거대한 흙더미가 우아카 푸야나다. 리마 문화(서기 200~700년)가 벽돌을 세워 쌓은 피라미드로 높이 22m, 원래는 지금의 세 배 넓이였다. 벽돌을 책꽂이의 책처럼 세로로 세우고 사이를 띄운 \"리브레로\" 공법이 특징인데, 지진이 나면 벽돌이 흔들리며 힘을 흘려보내는 방식이라 1,500년을 버텼다. 여기서 상어 이빨과 상어 뼈가 제물로 많이 나왔다. 바다의 신에게 바친 것이다. 나중에 와리 문명은 이곳을 묘지로 썼고, 미라를 감싼 직물 꾸러미가 지금도 발굴 중이다.","1980년대까지는 동네 아이들의 오토바이 언덕이었고 도시가 야금야금 깎아 먹었다. 지금은 가이드와 함께만 들어갈 수 있고(스페인어·영어, 약 1시간), 저녁 조명을 켠 야간 투어가 특히 아름답다. 유적 옆 레스토랑은 피라미드를 바라보며 먹는 자리로 리마에서 예약이 어려운 곳 중 하나다. 호텔에서 택시로 10분이고, 미라플로레스 안에서 잉카 이전 리마의 얼굴을 볼 수 있는 유일한 곳이다."]},{"title":"분수쇼: 저수지 공원이 기네스 기록이 되기까지","paragraphs":["파르케 데 라 레세르바는 1929년 리마 상수도 저수 시설 위에 만든 공원이다. 이름이 \"저수지 공원\"인 이유다. 80년 동안 평범한 공원이던 곳이 2007년 분수 13개를 갖춘 \"마법의 물 순환로\"로 바뀌었고, 공공 공원 안 분수 단지로는 세계 최대라는 기네스 기록을 받았다. 가장 높은 마법의 분수는 물줄기가 80m까지 솟고, 터널 분수는 물 아치 아래로 걸어 지나가며, 환상의 분수에서는 밤마다 레이저와 영상을 물 커튼에 쏘는 쇼를 한다.","입장료는 4솔, 수요일부터 일요일 오후 3시부터 밤 10시 반까지 열고 쇼는 저녁 7시·8시·9시 즈음 세 번이다. 리마의 가족과 연인들이 밤에 모이는 곳이라 관광지라기보다 동네 축제 같다. 신발이 젖어도 되는 차림이 좋고, 밤에는 공원 안이 안전하지만 나갈 때 큰길에서 택시나 우버를 잡는다. 이 공원 옆 국립 경기장은 1964년 관중 압사 참사(300명 사망)가 있었던 곳이다. 밝은 분수 옆에 어두운 기억도 있다."]},{"title":"한숨의 다리와 바랑코의 소원","paragraphs":["바랑코의 \"한숨의 다리\"는 1876년에 놓인 나무 다리다. 이름은 다리 아래 계곡 길에서 연인들이 만나고 헤어지며 한숨을 쉬었다는 데서 왔다. 처음 건널 때 숨을 참고 끝까지 가면 소원이 이루어진다는 규칙이 있어, 다리 위에서 볼이 빨개진 사람들을 보게 된다. 페루의 국민 가수 차부카 그란다가 이 다리에 바친 노래 \"푸엔테 데 로스 수스피로스\"가 있고, 다리 옆에 그녀의 동상이 있다.","다리 아래 \"바하다 데 로스 바뇨스\"는 옛날 어부와 해수욕객이 바다로 내려가던 돌길이다. 이 길을 따라 내려가면 절벽 사이로 태평양이 보이고, 길 양쪽이 지금은 바와 레스토랑이다. 바랑코는 1920년대 리마 부자들의 해변 별장 동네였다가 예술가 동네가 됐고, 벽마다 그라피티가 있다. 마테 박물관, 페드로 데 오스마 박물관, 그리고 저녁이면 페냐(민속 음악 술집)가 연다. 미라플로레스에서 해안 산책로로 걸어서 40분이고, 해 질 녘에 도착하면 가장 좋다."]},{"title":"라르코 박물관: 45,000점을 다 꺼내 놓은 창고","paragraphs":["라르코 박물관은 1926년 스물다섯 살의 라파엘 라르코 오일레가 아버지에게 받은 도자기로 시작했다. 사탕수수 농장주 집안이었고, 그는 페루 북부 해안의 모체·치무 문명을 학문으로 세운 사람이다. 18세기 저택을 7세기 피라미드 위에 지었으니 박물관 자체가 유적이다. 4만 5천 점 중 전시장에 못 나온 3만 점을 유리 선반에 빽빽이 꽂아 둔 \"열린 수장고\"가 이 박물관의 진짜 명물이다. 다른 박물관이 숨기는 것을 다 보여 준다.","가장 유명한 방은 에로틱 도자기실이다. 모체 문명(서기 100~800년)이 남긴 성행위 도자기 수백 점이 있는데, 다산의 기원이 아니라 죽음과 조상 세계와의 소통을 그린 것이라는 해석이 유력하다. 모체의 초상 도자기는 개인의 얼굴을 사실적으로 빚어 그 시대 사람의 표정을 지금 볼 수 있게 한다. 금관과 코 장식, 귀 장식은 시판 왕의 무덤 시대의 것이다. 정원 카페가 좋고, 미라플로레스에서 택시로 25분이다. 오디오 가이드는 한국어가 없으니 영어로."]},{"title":"센트로 골목의 디테일: 발코니, 고양이, 바 코르다노","paragraphs":["리마 구시가지에서 눈을 위로 들면 나무 발코니가 보인다. 무어식 격자 발코니는 안에서는 밖이 보이고 밖에서는 안이 안 보이는 구조로, 식민 시대 여자들이 거리를 구경하던 창이었다. 1,600개가 남아 있고 유네스코 등재의 핵심이다. 아르마스 광장 옆 카사 데 알리아가는 1535년 피사로가 부하 알리아가에게 준 땅에 지은 집으로 17대째 같은 가문이 산다. 아메리카에서 가장 오래된 \"계속 사람이 사는 집\"이고 예약하면 안을 볼 수 있다.","대통령궁 뒤 바 코르다노는 1905년부터 대통령들이 드나든 술집으로 부티파라 샌드위치와 피스코가 명물이다. 차이나타운(바리오 치노)의 카폰 거리는 1849년부터 들어온 중국인 노동자의 후손이 만든 곳이고 치파(중국식 페루 요리)의 발상지다. 산프란시스코 수도원 지하 카타콤에는 1808년까지 묻힌 2만 5천 명의 뼈가 종류별로 정리되어 있다. 대통령궁 근위병 교대식은 정오, 광장 바로 옆이다. 산 마르틴 광장의 동상 밑 여신상 머리에 야마가 얹혀 있는 것을 찾아볼 것. 조각가가 \"불꽃(llama)\"을 얹으라는 말을 동물 야마로 알아들었다는 이야기가 있다."]},{"title":"케네디 공원의 고양이와 사랑의 공원","paragraphs":["미라플로레스 중심 케네디 공원에는 고양이가 100마리 넘게 산다. 1990년대 누가 버린 고양이들이 번식했고, 시와 자원봉사 단체가 중성화와 급식을 맡아 지금은 공원의 명물이다. 벤치마다 고양이가 앉아 있고 입양 게시판이 있다. 밤에는 공원 광장에서 춤판이 벌어진다. 나이 든 커플들이 살사와 마리네라를 추는 것을 보는 게 관광객의 저녁 일과다.","해안 절벽 위 사랑의 공원에는 \"엘 베소(키스)\"라는 거대한 조각이 있다. 1993년 빅토르 델핀이 만든 것으로 발렌타인데이에 여기서 가장 오래 키스하는 커플 대회를 연다. 벽의 타일 모자이크는 가우디풍이고 페루 시인들의 사랑 시가 박혀 있다. 이 절벽에서 패러글라이더가 뜨고, 절벽 안에 파묻힌 라르코마르 쇼핑몰은 1998년에 절벽을 파서 지은 것이라 밖에서 보면 건물이 없다. 절벽 산책로를 남쪽으로 따라가면 바랑코까지 이어진다."]}]},"ica":{"id":"ica","name":"이카·와카치나·나스카","articles":[{"title":"사막 속 오아시스의 전설과 현실","paragraphs":["와카치나는 이카 시내에서 5km 떨어진 사막 한복판의 작은 호수다. 전설에 따르면 한 잉카 공주가 목욕하다 사냥꾼에게 들켜 도망쳤고, 그가 남긴 물이 호수가, 벗어 던진 망토가 모래언덕이 됐다고 한다. 지명은 케추아어로 우는 여인이라는 뜻이다. 1940~50년대에는 리마 상류층의 온천 휴양지로 호숫가에 호텔이 지어졌다.","현실은 덜 낭만적이다. 주변 농업용 지하수 채취로 수위가 계속 내려가 한때 거의 말랐고, 지금은 인근 우물에서 물을 펌프로 끌어와 채우고 있다. 그래도 야자수와 모래언덕, 100m 넘는 사구를 오르내리는 버기카와 샌드보딩은 남미에서 여기서만 가능한 경험이다. 밤의 사막은 기온이 급격히 떨어지고 별이 쏟아진다."]},{"title":"나스카 라인: 누가, 왜 그렸나","paragraphs":["나스카 라인은 기원전 100년경부터 기원후 800년까지 나스카 문화가 사막 표면의 검붉은 돌을 걷어내 밝은 흙을 드러내는 방식으로 만든 지상화다. 벌새, 원숭이, 거미, 고래 등 70여 점의 동물·식물 그림과 수백 개의 직선·기하 도형이 있고, 큰 것은 300m가 넘는다. 비가 거의 오지 않고 바람이 약해 2천 년 동안 지워지지 않았다.","1927년 근처 언덕에서 처음 보고됐지만 본격적으로 알려진 것은 비행기가 다니면서다. 독일 수학자 마리아 라이헤는 1940년부터 1998년 사망까지 50년을 사막에서 혼자 살며 선을 측량하고 지켰다. 그녀는 지상화가 천문 달력이라고 믿었다. 이후 연구는 물과 풍요를 비는 의례 공간, 즉 걸으며 기도하는 길이었다는 설에 무게를 둔다. 2024년에는 일본 야마가타 대학이 AI로 항공사진을 분석해 303개의 새 지상화를 찾아냈다. 경비행기 투어는 30분 남짓으로, 조종사가 그림마다 좌우로 급선회하며 보여 주기 때문에 멀미가 심하면 약을 미리 먹어야 한다."]},{"title":"파라카스와 구아노 전쟁","paragraphs":["파라카스 반도는 나스카보다 앞선 파라카스 문화(기원전 800~기원후 100)의 땅이다. 1925년 페루 고고학자 훌리오 테요가 발굴한 400여 기의 미라 묶음에서 나온 직물은 세계에서 가장 정교한 고대 직물로 꼽힌다. 파라카스 사람들은 아기 머리를 판자로 눌러 길게 변형하고, 두개골에 구멍을 뚫는 수술을 했는데 상당수가 수술 후 생존했다.","바예스타 섬은 페루 근대사와 얽혀 있다. 섬을 뒤덮은 바닷새의 배설물 구아노는 19세기 최고의 비료였다. 1840~1870년대 구아노 수출은 페루 정부 수입의 대부분을 차지했고, 중국인 노동자 수만 명이 이 섬에서 구아노를 팠다. 구아노와 초석을 둘러싼 이권 다툼이 태평양 전쟁으로 이어졌다. 지금은 보호구역으로 바다사자, 훔볼트 펭귄, 가마우지가 산다. 보트로 가는 길에 언덕에 새겨진 촛대 모양의 거대 지상화(칸델라브로)를 지나는데, 누가 왜 만들었는지 아직 모른다."]},{"title":"이카의 피스코 보데가","paragraphs":["이카는 페루 피스코와 와인의 본고장이다. 1550년대 스페인 선교사들이 미사용 포도주를 만들기 위해 포도를 심었고, 이 사막 계곡의 강한 햇빛과 건조한 기후가 포도 재배에 맞았다. 17세기에는 스페인 본국 와인 산업을 위협한다며 왕이 수출을 금지하는 바람에 포도주 대신 증류주 피스코가 발달했다.","이카 시 주변의 보데가(양조장) 가운데 타카마는 1540년 설립을 내세우는 남미 최고(最古)의 와이너리이고, 비스타 알레그레, 엘 카타도르 등이 투어와 시음을 한다. 페루 피스코는 물이나 오크 없이 포도 원액만 증류하는 것이 규정이라 도수 38~48도에 향이 강하다. 케브란타 품종이 표준이고, 이탈리아·모스카텔 품종은 아로마틱 피스코로 따로 분류된다."]},{"title":"잃어버린 협곡: 2011년에 '발견된' 계곡","paragraphs":["카뇬 데 로스 페르디도스는 이카에서 남쪽으로 60여 km, 오쿠카헤 사막 한복판에 있다. 마른 강(리오 세코)이 수만 년 동안 사암을 깎아 만든 협곡으로 길이 2km 남짓, 깊이는 깊은 곳이 100m를 넘는다. 위에서 보면 사막 평원이 갑자기 쩍 갈라진 모습이고, 바닥에 내려가면 물결 무늬 벽이 양쪽에 선다. 놀라운 것은 이 협곡이 2011년에야 세상에 알려졌다는 점이다. 근처 농민과 사냥꾼만 알던 곳을 한 탐사대가 보도하면서 관광지가 됐고, \"잃어버린\"이라는 이름은 길을 잃은 사람과 가축이 흘러들던 곳이라는 데서 왔다고 전해진다.","투어는 4륜구동으로 사막을 두 시간 달려 들어간다. 길이 없어서 기사가 모래 능선을 읽으며 간다. 협곡 벽에는 조개와 물고기 화석이 박혀 있다. 이 사막 전체가 수천만 년 전에는 바다 밑이었기 때문이다. 바람이 세고 해가 강하니 물 2리터와 모자, 스카프를 챙기고, 바닥으로 내려가는 길은 모래가 흘러내려 미끄럽다. 우기가 없는 지역이라 연중 갈 수 있다. 바예스타 섬과 같은 날은 무리이고, 하나를 골라야 한다면 바다 동물은 바예스타, 지질과 고요는 협곡이다."]},{"title":"오쿠카헤 사막의 고래: 지구 역사상 가장 무거운 동물","paragraphs":["잃어버린 협곡이 있는 오쿠카헤 사막은 세계에서 가장 중요한 고래 화석지 중 하나다. 4천만 년 전 이곳은 얕고 따뜻한 바다였고, 사막이 되면서 뼈가 그대로 보존됐다. 2023년 이 사막에서 나온 척추뼈로 발표된 \"페루세투스 콜로수스\"는 몸무게 추정치가 최대 340톤으로 대왕고래를 넘어 지구 역사상 가장 무거운 동물이라는 제목으로 세계 뉴스에 났다. 이후 연구에서 60~100톤 정도로 내려잡았지만, 뼈 하나하나가 사람 몸통만 한 것은 변함없다. 리마 자연사박물관에 그 척추뼈가 있다.","사막에는 다리가 있는 초기 고래(고래가 아직 육지를 걷던 시절), 이빨이 있는 거대 상어 메갈로돈의 이빨, 펭귄 화석이 흔하다. 이카 사막의 화석은 도굴과 밀수의 대상이기도 해서, 가이드가 \"주워 가지 말라\"고 하는 것은 진심이다. 협곡 벽에서 조개 화석을 보면 그것이 4천만 년 전 바다의 바닥이었다는 뜻이고, 그 위를 지금 걷는 것이다. 사막 한가운데서 고래 뼈를 밟는 기분은 여기서만 느낄 수 있다."]},{"title":"친차와 카녜테: 버스가 지나는 흑인 페루","paragraphs":["리마에서 이카로 가는 판아메리카나 도로는 카녜테 계곡과 친차를 지난다. 친차는 흑인 페루 문화의 수도다. 16세기부터 사탕수수와 목화 농장에 아프리카 노예가 들어왔고, 1854년 노예 해방 뒤에도 후손들이 엘 카르멘 마을에 남아 페루 흑인 음악을 지켰다. 카혼(상자 북), 키하다(당나귀 턱뼈로 만든 타악기), 사파테오(발 구르기 춤)가 여기서 나왔고, 매년 여름 흑인 예술 축제가 열린다. 페루 대표 흑인 음악 그룹 \"페루 네그로\"의 고향이다.","친차의 아시엔다 산호세는 17세기 사탕수수 농장 저택으로 지금은 호텔인데, 지하에 노예들이 묶여 있던 굴이 그대로 남아 있다. 2007년 피스코 지진 때 저택 절반이 무너졌고 복구했다. 그 지진은 규모 8.0으로 피스코 시내의 성당이 미사 중에 무너져 500명 넘게 죽은 사건이다. 버스 창밖으로 보이는 피스코 시내는 그 뒤 새로 지은 건물이 많다. 카녜테 계곡은 리마 사람들이 래프팅과 시골 요리(까르아팔카 튀김 요리)를 즐기러 오는 곳이고, 휴게소가 이 근처다."]}]},"cusco":{"id":"cusco","name":"쿠스코·마추픽추","articles":[{"title":"세계의 배꼽, 타완틴수유","paragraphs":["쿠스코는 케추아어로 배꼽이다. 잉카는 자기 나라를 타완틴수유, 즉 네 지방의 합이라고 불렀고 그 중심이 쿠스코였다. 전설에 따르면 첫 잉카 망코 카팍이 티티카카 호수에서 황금 지팡이를 들고 올라와 지팡이가 땅에 꽂히는 곳에 도시를 세웠다. 실제 잉카는 13세기경 쿠스코 계곡의 작은 부족이었고, 1438년 9대 황제 파차쿠텍이 창카족의 침입을 막아낸 뒤 폭발적으로 팽창했다. 파차쿠텍은 쿠스코를 퓨마 모양으로 재설계했고, 삭사이와망이 퓨마의 머리다.","잉카는 문자가 없었다. 대신 키푸라는 매듭 끈으로 인구·세금·창고를 기록했고, 총 4만km에 이르는 도로망 카팍냔을 따라 차스키(전령)가 릴레이로 하루 240km를 달렸다. 쿠스코 광장에서 태평양의 생선이 이틀 만에 황제 식탁에 올랐다는 이야기가 전해진다. 정복 후 잉카의 신전 위에 성당이, 궁전 위에 저택이 지어졌다. 아르마스 광장의 대성당은 비라코차 신전 터에, 라 콤파니아 교회는 우아이나 카팍 궁전 터에 서 있다."]},{"title":"면도날도 안 들어가는 돌","paragraphs":["잉카 석조의 비밀은 아직 완전히 풀리지 않았다. 철도, 바퀴도, 시멘트도 없이 수 톤짜리 안산암을 다각형으로 깎아 종이 한 장 들어갈 틈 없이 맞췄다. 하툰 루미욕 거리의 12각돌은 12개의 모서리가 주변 돌과 정확히 맞물린다. 돌 하나를 다른 돌에 반복해서 대보며 갈았을 것으로 추정된다.","이 석조는 지진에 강하다. 벽은 안쪽으로 살짝 기울어져 있고, 창과 문은 위가 좁은 사다리꼴이며, 돌들은 서로 맞물려 흔들려도 제자리로 돌아온다. 1650년과 1950년 대지진 때 스페인 식민 건물은 무너졌지만 그 아래 잉카 벽은 그대로 남았다. 코리칸차(태양의 신전)는 이것을 가장 극적으로 보여 준다. 벽이 황금판으로 덮여 있던 잉카 최고의 신전은 약탈당한 뒤 산토 도밍고 성당이 그 위에 지어졌고, 1950년 지진으로 성당이 무너지자 안에서 잉카의 곡선 벽이 드러났다."]},{"title":"마추픽추: 잃어버린 적 없는 잃어버린 도시","paragraphs":["마추픽추는 1450년경 파차쿠텍이 지은 왕실 영지로 추정된다. 황제와 귀족이 쿠스코의 추위를 피해 머무는 별장이자 종교 시설이었고, 상주 인구는 750명 정도였다. 스페인은 이곳을 끝내 찾지 못했다. 1572년 이후 버려진 채 숲에 덮였다.","1911년 7월 24일 예일 대학의 하이럼 빙엄이 이곳에 도착했다. 그는 잉카 최후의 도시 빌카밤바를 찾고 있었고, 현지 농부 멜초르 아르테아가의 안내로 산을 올랐다. 도착해 보니 이미 두 가족이 계단식 밭에서 농사를 짓고 있었고, 1902년 현지인 아구스틴 리사라가가 벽에 이름을 새겨 놓은 것도 있었다. 잃어버린 도시는 현지인에게는 잃어버린 적이 없었다. 빙엄은 유물 수천 점을 예일로 가져갔고, 페루는 100년 가까이 반환을 요구해 2011년에야 돌려받았다. 마추픽추는 1983년 유네스코 세계유산, 2007년 신7대 불가사의에 선정됐다.","유적에서 볼 것은 세 가지다. 인티우아타나(태양을 묶는 기둥)는 동지·하지에 그림자가 사라지는 천문 관측용 돌이다. 태양의 신전은 자연 바위 위에 곡선으로 쌓은 잉카 석조의 정점이며 6월 동지 아침 창으로 햇빛이 정확히 들어온다. 그리고 눈에 안 보이는 배수 시스템이 있다. 연 강수량 2천mm의 산 위에서 500년을 버틴 것은 지하에 깔린 130개의 배수로와 계단식 밭의 층별 자갈층 덕분이다."]},{"title":"비니쿤카, 2015년에 나타난 산","paragraphs":["무지개산 비니쿤카는 잉카 유적이 아니다. 몇 년 전까지 눈과 얼음에 덮여 있었고, 기후 변화로 만년설이 녹으면서 2015년경 지금의 줄무늬가 드러났다. 붉은색은 산화철(적철석), 노란색은 황화철, 녹색은 녹니석과 구리, 흰색은 석회암과 석영이다. 수천만 년 전 바다와 호수 밑에 쌓인 퇴적층이 안데스 융기로 기울어져 세로 줄무늬로 보이는 것이다.","정상 전망대는 해발 5,036m로 이번 여행의 최고점이다. 쿠스코에서 새벽 4~5시 출발해 차로 3시간, 주차장(4,600m)에서 걸어서 1시간 반~2시간이다. 말을 빌리면 대부분 구간을 태워 주지만 마지막 가파른 언덕과 계단은 걸어야 한다. 이 고도에서는 산소가 해수면의 절반이라 평소 체력과 무관하게 숨이 찬다. 천천히, 자주 쉬면서 올라가고 이상하면 바로 내려오는 것이 규칙이다."]},{"title":"코카잎과 고산병","paragraphs":["쿠스코에 도착하면 호텔에서 코카차를 준다. 코카잎은 안데스에서 4천 년 이상 씹어 온 식물로, 잉카 시대에는 귀족과 사제만 쓸 수 있었다. 잎 자체는 코카인과 다르며 약한 각성 효과와 식욕 억제, 고산 증상 완화에 도움이 된다. 잎을 뭉쳐 볼에 넣고 천천히 즙을 빨거나 차로 마시고, 코카 캔디도 흔하다. 다만 코카잎은 한국·칠레 등 대부분 나라에서 반입 금지이므로 칠레 국경을 넘기 전에 다 버려야 한다.","고산병(소로체)은 산소 부족에 몸이 적응하지 못해 생긴다. 두통, 메스꺼움, 불면, 식욕 부진이 흔하고 보통 1~2일 안에 가라앉는다. 예방약(아세타졸아미드)은 리마에서 쿠스코행 비행기 타기 전날이나 당일 아침부터 먹는다. 첫날은 술·과식·뜨거운 샤워를 피하고 물을 많이 마시며 천천히 걷는다. 안데스 원주민은 수천 년 적응의 결과로 폐가 크고 혈액의 산소 운반 능력이 높다. 잉카 병사들이 5천m 고개를 달려 넘은 것은 이 몸 덕분이다."]},{"title":"12각돌: 맥주 상표가 된 돌","paragraphs":["쿠스코 대성당 뒤 아툰루미욕(\"큰 돌\") 골목의 벽에 열두 개의 각을 가진 돌이 박혀 있다. 잉카 6대 왕 잉카 로카의 궁전 벽이었고, 스페인은 그 위에 대주교 저택을 올렸다. 지금 그 건물은 종교미술 박물관이다. 돌은 높이 1m 남짓한 초록빛 섬록암으로, 열두 면이 주변 돌들과 종이 한 장 틈 없이 맞물려 있다. 페루 국민 맥주 쿠스케냐의 병 상표에 이 돌이 그려져 있을 만큼 잉카 석공술의 상징이 됐다. 골목에는 늘 사람이 있고, 잉카 복장을 한 아저씨가 돌 앞을 지키며 사진값을 받는다.","열두 각이 기록은 아니다. 같은 골목과 근처에 13각, 14각 돌이 있고, 마추픽추에는 32각을 헤아리는 돌도 있다고 한다. 12각돌이 유명한 것은 크기와 접근성 때문이다. 2014년 한 남자가 이 돌을 긁어 훼손해 체포됐고, 그 뒤로 손을 대는 것이 금지됐다. 벽을 손바닥으로 훑어 보면 각 돌의 면이 살짝 볼록하게 다듬어져 있다. 이것이 잉카 벽 특유의 \"베개 모양\" 마감이고, 지진 때 돌들이 서로 미끄러졌다 돌아오게 하는 장치다. 같은 골목 아래쪽에는 벽면에 퓨마와 뱀 모양으로 돌을 배열했다는 곳이 있어 가이드들이 손가락으로 그려 준다."]},{"title":"산블라스: 설교단에 얹힌 조각가의 두개골","paragraphs":["쿠스코 광장에서 가파른 골목을 오르면 나오는 산블라스는 잉카 시대부터 장인들의 동네였다. 작은 산블라스 성당(1563)은 겉은 소박하지만 안의 설교단이 유명하다. 삼나무 한 그루를 통째로 깎아 만든 바로크 조각으로 아메리카 목조 조각의 최고봉으로 꼽힌다. 설교단 꼭대기의 성인상 발 아래 두개골이 하나 있는데, 이 설교단을 만든 원주민 조각가 후안 토마스 투이루 투팍의 것이라는 전설이 있다. 자기 작품 위에서 영원히 설교를 듣겠다는 유언이었다고.","산블라스 골목에는 대를 이은 공방들이 있다. 멘디빌 가문의 목이 긴 성모상(안데스의 야마 목을 닮았다는 해석)은 쿠스코 미술의 상징이고, 올라베 공방은 종교 조각, 메리다는 도자기다. 토요일 오전 광장에 수공예 장터가 선다. 동네 위쪽 전망대에서 쿠스코 지붕들이 내려다보이고, 카페와 빵집이 많아 오후를 보내기 좋다. 골목 계단이 가파르니 고산 첫날은 천천히. 성당 옆 \"12각돌\"과 함께 시내 반나절 코스의 한 축이다."]},{"title":"산페드로 시장: 에펠이 설계했다는 시장","paragraphs":["쿠스코 산페드로 시장은 1925년에 지은 철골 건물로, 에펠탑을 만든 구스타브 에펠의 회사가 설계했다는 말이 붙어 다닌다. 기록으로 확인되지는 않지만 쿠스코 사람들은 그렇게 믿는다. 안은 구역별로 나뉜다. 입구 쪽 과일 주스 줄에서는 아주머니가 한 잔을 채우고 나면 남은 것을 다시 채워 주는 \"야파(덤)\" 문화가 있다. 중앙은 치즈와 빵(쿠스코의 둥근 빵 \"판 추타\"), 안쪽은 고기와 생선, 그리고 개구리 주스와 소머리 수프를 파는 식당 골목이 있다.","가장 흥미로운 곳은 약초와 주술 코너다. 코카잎, 무냐, 야마 태아, 별사탕과 색종이(파차마마 제물용), 산 페드로 선인장, 사랑의 향수가 한 좌판에 있다. 관광객이 많아졌지만 여전히 시장의 손님은 대부분 현지인이다. 소매치기가 있으니 가방을 앞으로 메고, 사진은 물어보고 찍는다. 시장 앞 산페드로 역은 마추픽추행 옛 기차가 떠나던 곳이다. 오전 8~10시가 가장 활기차고, 점심을 여기서 먹으면 세트가 8~12솔이다."]},{"title":"코리칸차와 41개의 선","paragraphs":["코리칸차(황금 울타리)는 잉카 제국의 중심 신전이었다. 벽에 금판 700장이 붙어 있었고, 안뜰에는 금으로 만든 옥수수와 야마와 목동이 있는 정원이 있었다는 것이 스페인 연대기의 기록이다. 그 금은 전부 아타왈파의 몸값으로 녹여졌다. 스페인은 신전 위에 산토도밍고 수도원을 지었고, 1950년 지진 뒤 아래의 잉카 벽이 드러났다. 특히 곡선으로 휜 외벽은 잉카 석공술의 정점으로, 이음매에 손톱이 안 들어간다.","코리칸차는 제국의 좌표 원점이기도 했다. 여기서 41개의 상상의 선(세케)이 사방으로 뻗고, 그 선 위에 328개의 성소(우아카)가 놓였다. 샘, 바위, 언덕, 궁전이 이 선들로 엮여 달력이자 지도이자 신앙 체계가 됐다. 쿠스코 주변에서 \"성스러운 바위\"라고 하는 것들이 대개 이 세케 위의 우아카다. 신전 안에서 태양의 방, 달의 방, 별의 방, 무지개의 방, 천둥의 방을 차례로 보고, 뒤뜰 정원에서 잉카 벽과 수도원 회랑이 겹친 모습을 보면 쿠스코가 무엇인지 한눈에 들어온다. 입장은 통합권에 포함되지 않고 따로 15솔이다."]},{"title":"삭사이와망: 120톤 돌과 카우이데의 투신","paragraphs":["쿠스코 위 언덕의 삭사이와망은 지그재그로 세 겹을 이룬 돌벽이다. 가장 큰 돌은 높이 8.5m, 무게 120톤을 넘고 굴려 온 채석장이 3km 밖이다. 벽이 지그재그인 것은 퓨마의 이빨 또는 번개 모양이라는 해석이 있고, 방어에도 유리하다. 1536년 망코 잉카가 이끄는 잉카군이 이곳에서 스페인에 마지막 대반격을 했다. 피사로의 동생 후안 피사로가 여기서 돌에 맞아 죽었고, 잉카 장군 카우이데는 탑 위에서 항복 대신 몸을 던졌다. 스페인은 이긴 뒤 탑을 허물고 돌을 실어 내려 성당과 저택을 지었다. 지금 남은 것은 너무 커서 못 옮긴 돌들이다.","같은 통합권으로 근처 유적 셋을 더 본다. 켄코는 바위 안에 파 놓은 제단으로 야마를 제물로 바치던 곳이고, 푸카 푸카라(붉은 요새)는 검문소, 탐보마차이는 지금도 물이 흐르는 잉카 목욕탕으로 어디서 오는 물인지 모른다. 삭사이와망 옆 큰 흰 예수상은 1945년 팔레스타인 난민들이 쿠스코에 감사하며 세운 것이다. 6월 24일 인티 라이미가 여기서 열린다. 택시로 광장에서 10분, 걸어 내려오면 30분인데 고산 첫날에는 택시로 올라가 걸어 내려오는 것이 정석이다."]},{"title":"모라이와 마라스: 잉카의 농업 실험실과 3천 개의 소금 밭","paragraphs":["모라이는 땅이 움푹 꺼진 자리에 동심원 계단식 밭을 판 곳이다. 가장 깊은 곳과 맨 위의 온도 차가 최대 15도까지 난다고 하고, 층마다 흙을 다른 곳에서 가져와 채웠다. 잉카가 고도별 작물 적응 실험을 한 농업 연구소였다는 설명이 유력하다. 제국의 감자와 옥수수 품종이 이렇게 개량됐다는 것이다. 원형 극장처럼 생겨서 사진이 좋고, 위에서 내려다보는 것이 전부라 30분이면 된다.","마라스 소금밭은 산비탈에 3천 개가 넘는 작은 못이 계단처럼 붙어 있는 곳이다. 산속에서 솟는 소금물 샘 하나가 도랑을 타고 내려와 못마다 채워지고, 햇볕에 말라 소금이 된다. 잉카 이전부터 마라스 마을 가족들이 못을 나눠 가졌고 지금도 협동조합이 손으로 긁어 모은다. 분홍빛 도는 \"마라스 소금\"이 페루 고급 식당의 마감 소금이다. 2019년부터 관광객이 못 사이로 걸어 들어가는 것은 금지되어 위 전망대에서 본다. 입구 노점에서 파는 소금 초콜릿과 100g 소금 봉지가 가장 가벼운 기념품이다."]},{"title":"오얀타이탐보: 스페인이 진 마을","paragraphs":["오얀타이탐보는 잉카가 살던 모습 그대로 사람이 사는 유일한 마을이다. 잉카가 깐 격자 골목과 물길, 담장 안 마당(칸차)이 지금도 집으로 쓰인다. 1537년 망코 잉카는 이 마을 앞 평원에 물을 끌어들여 진흙탕으로 만들고 스페인 기병을 무력화했다. 에르난도 피사로가 밤에 후퇴한, 스페인이 잉카에게 진 드문 전투다. 그다음 해 잉카는 밀림 속 빌카밤바로 물러났고 40년을 더 버텼다.","마을 위 계단식 밭 꼭대기의 태양의 신전은 미완성이다. 분홍 화강암 판 여섯 장이 서 있는데, 이 돌은 강 건너 6km 산 위 채석장에서 왔다. 강을 건너 옮기다 놓친 돌들이 \"지친 돌\"이라는 이름으로 길에 누워 있다. 마을 맞은편 절벽의 창고 유적 핑쿠유나는 잉카가 곡식을 서늘한 바람에 말리던 곳이고, 그 절벽에 사람 얼굴 모양이 있다는 것을 가이드가 짚어 준다. 마추픽추행 기차가 여기서 떠나고, 역 앞 골목의 아침 시장은 관광객 없이 조용하다."]},{"title":"친체로: 직조 마을과 새 공항","paragraphs":["친체로는 해발 3,760m 고원 마을로, 잉카 10대 왕 투팍 유팡키의 별궁 터 위에 1607년 스페인 성당이 서 있다. 성당 천장의 꽃 그림과 잉카 벽 위에 얹힌 흰 벽이 그대로다. 마을 여자들의 직조 협동조합이 유명해서, 야마 털을 씻고(사포닌이 나는 뿌리로), 자연 염료(코치닐 벌레의 붉은색, 식물의 노랑과 초록)로 물들이고, 허리에 베틀을 걸고 짜는 과정을 보여 준다. 시연이 끝나면 물건을 파는데 값은 쿠스코 시장보다 비싸도 진짜 손으로 짠 것이다.","이 조용한 마을이 지금 페루 최대의 논쟁거리다. 쿠스코의 새 국제공항이 친체로 고원에 건설 중이기 때문이다. 유네스코와 고고학자들은 잉카 유적과 성스러운 계곡 경관을 망친다고 반대했고, 지역 사람들은 일자리와 땅값을 기대한다. 2020년대 후반 개항 목표로 공사가 진행 중이라 마을 옆에 거대한 평지가 파헤쳐진 것이 보인다. 일요일에는 광장에서 전통 시장이 서고, 사람들이 물건을 돈 없이 맞바꾸는 트루에케 장이 남아 있다."]},{"title":"마추픽추 안에서 꼭 볼 여덟 곳","paragraphs":["1. 파수꾼의 집: 유적 전체가 내려다보이는 그 사진의 자리. 입장 직후 왼쪽 위로 오른다. 2. 인티와타나: \"태양을 매는 기둥\". 바위를 깎은 해시계이자 제단으로, 동지·하지에 그림자가 사라진다. 2000년 맥주 광고를 찍던 크레인이 떨어져 모서리가 깨졌고, 그 뒤로 만질 수 없다. 3. 태양의 신전: 곡선 벽 위 두 창으로 동지와 하지에 해가 정확히 들어온다. 아래 동굴은 왕의 무덤이라 불린다. 4. 세 창문의 신전: 큰 창 세 개가 안데스 세 세계를 뜻한다.","5. 콘도르 신전: 바닥의 바위가 콘도르 머리, 뒤의 두 바위가 펼친 날개다. 6. 성스러운 바위: 뒤에 보이는 산의 능선과 같은 모양으로 다듬은 바위다. 7. 잉카 다리: 절벽 길을 통나무 다리로 잇던 비상 통로로 15분 걸어 들어간다. 8. 태양의 문(인티푼쿠): 잉카 트레일이 끝나는 고개로, 유적이 아침 햇살에 드러나는 자리다. 왕복 2시간이라 우리 일정에는 벅차다. 2024년부터 관람은 정해진 순환로(서킷)로만 다니고 되돌아갈 수 없으니 가이드를 따라가고, 유적 안 야마들은 잔디 관리용으로 풀어 둔 것이다. 화장실은 입구 밖에만 있다."]}]},"puno":{"id":"puno","name":"푸노·티티카카","articles":[{"title":"잉카가 태어난 호수","paragraphs":["티티카카는 해발 3,812m, 면적 8,300km²로 세계에서 가장 높은 곳에 있는 대형 호수다. 남한 면적의 8%가 넘고 가장 깊은 곳은 280m다. 안데스 사람들에게 이곳은 세상이 시작된 자리다. 창조신 비라코차가 호수에서 나와 해와 달과 별을 만들었고, 첫 잉카 부부 망코 카팍과 마마 오클로가 호수 안 태양의 섬에서 태어나 쿠스코로 갔다고 한다.","잉카 이전에 이 호수 남쪽에는 티와나쿠 문명(500~1000년)이 있었다. 라파즈 근교의 티와나쿠 유적은 거석 신전과 태양의 문으로 유명하고, 잉카는 자신들의 석조 기술과 신화 상당 부분을 이 문명에서 물려받았다. 호수 이름은 아이마라어로 퓨마의 바위라는 뜻이라는 설이 유력하다. 페루와 볼리비아가 호수를 나눠 갖고 있어 페루 쪽 사람들은 티티는 페루 것, 카카는 볼리비아 것이라는 농담을 한다."]},{"title":"갈대 위에서 사는 사람들","paragraphs":["우로스는 토토라 갈대를 엮어 만든 인공 섬 위에 사는 사람들이다. 원래는 호수 주변에 살던 우루족이 콜라족과 잉카의 압박을 피해 호수 안으로 들어간 것이 시작이다. 섬은 갈대 뿌리 덩어리를 밧줄로 묶어 띄우고 그 위에 마른 갈대를 겹겹이 깐다. 아래층 갈대가 썩기 때문에 2~3주마다 새 갈대를 위에 덧대고, 섬 하나의 수명은 약 30년이다. 집, 배, 심지어 간식(갈대 밑동의 흰 부분)까지 갈대다.","현재 약 100개 섬에 2천 명 정도가 살고, 거의 전적으로 관광 수입에 의존한다. 섬마다 순번을 정해 관광객을 받고, 태양광 패널로 전기를 쓰며 아이들은 배로 통학한다. 보여 주기용이라는 비판도 있지만 이들이 갈대 섬을 유지하는 기술 자체는 진짜다. 푸노 항구에서 보트로 30분 거리이고 반나절이면 충분하다."]},{"title":"뜨개질하는 남자들의 섬, 타킬레","paragraphs":["타킬레는 우로스보다 훨씬 안쪽에 있는 진짜 섬으로 보트로 2~3시간 걸린다. 인구 2천 명의 케추아 공동체가 사는데, 이곳의 남자들은 어릴 때부터 뜨개질을 배운다. 모자 색과 무늬가 결혼 여부와 사회적 지위를 나타내고, 남자는 자기 모자를 직접 짜서 신부 가족에게 실력을 증명해야 한다. 이 직조 문화는 2005년 유네스코 인류무형유산에 올랐다. 섬에는 차도 개도 없고 호텔 대신 민박을 공동체가 순번으로 운영한다."]},{"title":"노새가 싣고 온 증기선","paragraphs":["푸노 항구에는 야바리라는 증기선이 있다. 1862년 영국 버밍엄에서 만들어져 2,766개의 부품으로 분해된 채 배로 페루에 왔고, 사막과 안데스를 넘어 노새와 짐꾼이 6년에 걸쳐 4천m 고원까지 날랐다. 1870년 진수 후 라마 배설물을 연료로 달렸다는 기록이 있다. 지금은 박물관 겸 숙소로 복원돼 있다. 푸노는 페루의 민속 수도로 불리며, 매년 2월 칸델라리아 축제 때는 수만 명의 무용수가 악마 춤(디아블라다)을 추며 2주간 도시를 채운다."]},{"title":"시유스타니: 호수 위 언덕의 죽음의 탑","paragraphs":["푸노에서 30km, 우마요 호수를 내려다보는 언덕에 둥근 돌탑 수십 개가 서 있다. 추파(chullpa)라고 부르는 이 탑은 티티카카를 다스리던 코야 사람들(12~15세기)의 귀족 무덤이다. 위로 갈수록 넓어지는 원통 안에 미라와 부장품을 넣고 입구를 동쪽(해 뜨는 쪽)으로 냈다. 가장 높은 탑은 12m이고, 도마뱀이 새겨진 \"라가르토 추파\"가 유명하다. 도마뱀은 꼬리가 다시 자라기에 부활의 상징이었다. 잉카가 정복한 뒤 세운 탑은 돌이 반듯하게 다듬어져 코야 시대 것과 바로 구분된다.","탑 하나는 번개를 맞아 세로로 쪼개져 안이 보인다. 언덕 위에는 잉카 이전의 돌 원(태양 관측용)이 있고, 우마요 호수 안 섬에는 비쿠냐가 산다. 오후에 가면 호수 위로 지는 해와 탑의 실루엣이 좋고, 바람이 세니 겉옷을 챙긴다. 길가에서 마을 사람들이 화덕 흙집을 보여 주고 감자와 치즈를 주며 기니피그를 보여 준다. 우로스 섬과 반나절씩 묶으면 하루가 된다."]},{"title":"아라무 무루: 신들의 문과 가짜 남근 신전","paragraphs":["푸노에서 데사구아데로 국경으로 가는 길, 훌리 근처 바위 산에 폭과 높이가 7m쯤 되는 문 모양이 깎여 있다. 아라무 무루 또는 \"하유 마르카의 문\"이라 불리는 이 문은 문틀만 있고 열리지 않는다. 전설은 스페인 정복 때 잉카 사제 아라무 무루가 태양신전의 황금 원반을 들고 도망쳐 이 문에 원반을 대자 문이 열렸고, 그는 원반을 사제들에게 맡기고 사라졌다는 것이다. 1990년대 한 가이드가 \"차원의 문\"으로 소개한 뒤 명상하러 오는 사람들이 생겼다. 고고학적으로는 미완성 잉카 벽감으로 본다. 도로에서 가까워 버스에서 잠깐 세우기도 한다.","같은 길의 추쿠이토 마을에는 \"잉카 우요\"라는 다산의 신전이 있다. 돌담 안에 남근 모양 돌 수십 개가 서 있어 관광객이 좋아하는데, 1990년대에 마을 사람들이 흩어진 돌을 모아 세운 것이라는 것이 정설이다. 그래도 돌 위에 앉아 사진을 찍고 아이를 빌던 여자들 이야기가 남아 있다. 훌리는 \"아메리카의 로마\"라 불릴 만큼 16세기 예수회 성당이 네 채 있고, 포마타 성당은 분홍 화강암이다. 이 길은 티티카카 남쪽 호숫가를 내내 끼고 달려 창밖이 좋다."]},{"title":"데사구아데로: 호수가 빠져나가는 국경","paragraphs":["데사구아데로는 \"배수구\"라는 뜻이다. 티티카카 호수의 물이 유일하게 빠져나가는 강이 여기서 시작해 남쪽 포오포 호수로 흐른다. 호수로 들어오는 물의 90%는 증발하고 5%만 이 강으로 나간다. 그래서 티티카카는 살짝 짜고, 포오포 호수는 2015년 말라붙었다. 강 위에 다리가 둘 있고 페루 쪽과 볼리비아 쪽 마을 이름이 같다. 국경은 시장이다. 볼리비아 물건이 페루로, 페루 물건이 볼리비아로 손수레에 실려 다리를 건넌다. 출입국 사무소는 다리 양쪽에 하나씩이고, 페루 출국 도장을 받고 걸어서 다리를 건너 볼리비아 입국 도장을 받는다.","여기서 시간이 걸리는 것은 정상이다. 창구가 적고 화요일·금요일 장날에는 더 붐빈다. 볼리비아 입국 카드에 호텔 이름을 적어야 하니 앱의 호텔 주소를 켜 두고, 볼리비아 쪽은 서머타임이 없어 페루와 시차가 1시간 난다(볼리비아가 1시간 빠르다). 시계는 다리를 건너면서 한 시간 앞으로. 환전상들이 다리 근처에 있고 환율은 라파즈보다 나쁘지만 소액은 여기서 바꿔도 된다. 화장실은 유료이고 상태가 나쁘니 버스에서 미리 다녀온다. 라파즈까지는 여기서 두 시간 반이다."]}]},"lapaz":{"id":"lapaz","name":"라파즈","articles":[{"title":"협곡 속의 수도","paragraphs":["라파즈는 1548년 알론소 데 멘도사가 포토시의 은을 리마로 나르는 길목에 세웠다. 정식 이름은 누에스트라 세뇨라 데 라 파스(평화의 성모)다. 도시는 초케야푸 강이 판 깊은 협곡 안에 들어앉아 있어, 고도가 3,200m에서 4,100m까지 900m나 차이 난다. 다른 도시와 반대로 이곳에서는 높은 곳이 가난하고 낮은 곳이 부유하다. 협곡 위 고원 도시 엘 알토(4,100m)는 이주 원주민의 도시이고, 협곡 바닥의 소나 수르는 공기가 따뜻하고 산소가 많아 부촌이 됐다.","볼리비아의 헌법상 수도는 수크레다. 1899년 내전에서 라파즈가 이기면서 정부와 의회가 라파즈로 옮겨 왔고, 대법원만 수크레에 남았다. 그래서 라파즈는 세계에서 가장 높은 행정 수도로 불린다. 2014년 개통한 미 텔레페리코 케이블카는 지형 때문에 지하철을 놓을 수 없는 이 도시의 해법이다. 10개 노선 30km가 넘는 세계 최장 도시 케이블카망으로, 시내 교통수단이면서 동시에 도시 전체와 일리마니 설산(6,438m)이 보이는 최고의 전망대다."]},{"title":"은의 산에서 리튬까지: 볼리비아 압축사","paragraphs":["볼리비아 역사는 땅속 자원의 역사다. 1545년 발견된 포토시의 세로 리코(부유한 산)는 200년간 세계 은의 절반 이상을 쏟아냈고, 17세기 포토시는 런던보다 큰 도시였다. 그 은을 캐다 죽은 원주민과 아프리카 노예는 수백만으로 추산된다. 볼리비아 사람들은 이것을 유럽을 먹여 살린 산이라고 부른다.","1825년 독립 후 볼리비아는 영토의 절반 이상을 이웃에 잃었다. 태평양 전쟁으로 칠레에 해안을(1879~84), 아크레 전쟁으로 브라질에 고무 지대를(1903), 차코 전쟁으로 파라과이에 남부 저지대를(1932~35) 내줬다. 1952년 혁명으로 광산 국유화와 토지 개혁, 원주민 보통선거가 이뤄졌고, 2006년 아이마라 출신 에보 모랄레스가 첫 원주민 대통령이 됐다. 그는 2019년 부정선거 논란 속에 사임했다. 볼리비아 인구의 40% 이상이 원주민으로 남미에서 비율이 가장 높고, 아이마라어와 케추아어가 스페인어와 함께 공용어다. 그리고 우유니 아래 묻힌 리튬은 21세기의 은이 될지 모른다."]},{"title":"촐리타: 중절모와 폴레라 치마","paragraphs":["라파즈 거리에서 만나는 폭 넓은 치마(폴레라), 숄, 작은 중절모(봄빈)를 쓴 여성들이 촐리타다. 촐라는 원래 원주민 혼혈 여성을 낮춰 부르는 말이었다. 폴레라 치마는 18세기 스페인 여성 복장을 식민 당국이 원주민에게 강제한 것이고, 중절모는 1920년대 영국 철도 노동자용으로 들여온 모자가 사이즈가 맞지 않아 여성에게 팔렸다는 설이 유력하다.","20세기 내내 촐리타는 식당 출입, 버스 탑승, 공직 진출에서 차별받았다. 2000년대 이후 상황이 뒤집혀 지금은 촐리타 복장이 자부심의 상징이 됐고, 촐리타 앵커, 촐리타 국회의원, 촐리타 등반대가 있다. 엘 알토의 촐리타 레슬링은 여성 레슬러들이 전통 복장으로 링에 오르는 쇼로, 원래는 가정폭력 피해 여성들의 자기방어 모임에서 시작됐다."]},{"title":"마녀시장과 파차마마","paragraphs":["사가르나가 거리 옆 마녀시장에서는 말린 야마 태아, 개구리, 부엉이 깃털, 색색의 사탕 판을 판다. 야마 태아(수유)는 집을 지을 때 기초 아래 묻어 파차마마(대지의 어머니)에게 바치는 제물이다. 대부분 자연 유산한 태아를 모아 파는 것이다. 사탕과 미니어처를 얹은 판은 메사라고 하며, 야티리(아이마라 주술사)가 소원에 맞춰 조합해 태우는 용도다.","안데스에서는 가톨릭과 파차마마 신앙이 500년째 공존한다. 술을 마시기 전 첫 모금을 땅에 뿌리는 차야는 파차마마에게 먼저 권하는 것이고, 8월은 땅이 입을 여는 파차마마의 달이라 제물을 바친다. 매년 1월 알라시타스 축제에서는 갖고 싶은 것의 미니어처(집, 차, 돈다발, 졸업장)를 사서 축복을 받으면 그해 진짜가 생긴다고 믿는다. 라파즈 공항 근처 엘 알토에서는 실제로 야티리들이 거리에서 점을 본다."]},{"title":"케이블카에서 보는 도시: 촐레츠와 협곡","paragraphs":["라파즈의 미 텔레페리코는 2014년에 첫 노선을 열고 2019년까지 열 개 노선 33km로 자라, 세계에서 가장 긴 도시 케이블카망이 됐다. 오스트리아 도펠마이어 회사가 지었고, 요금은 한 구간 3볼리비아노다. 협곡 도시라 버스로 한 시간 걸리던 엘알토와 시내가 10분이 됐다. 노선 색이 볼리비아 국기와 위팔라의 색이고, 사람들은 \"빨간선 타고 노란선 갈아타\"처럼 색으로 부른다. 캐빈 안에서 도시 전체와 이이마니 설산이 보이는 것이 이 도시 최고의 전망이다.","엘알토 상공을 지날 때 원색 유리와 기하학 무늬로 덮인 4~6층 건물이 보인다. 촐레츠(cholet, 촐로+샬레)라고 부르는 이 건물은 건축가 프레디 마마니가 2000년대부터 만든 \"신안데스\" 양식이다. 아래층은 상가, 중간은 결혼식장 같은 잔치 홀, 꼭대기는 주인의 집이다. 아이마라 상인들이 부를 과시하는 방식이고, 티와나쿠 문양과 위팔라 색을 쓴다. 뉴욕과 파리 건축 전시에 갔다. 케이블카 노란선 종점 근처에서 여러 채를 볼 수 있다. 협곡 바닥은 부유층, 위로 갈수록 서민이라는 이 도시의 지형 계급도 캐빈에서 읽힌다."]},{"title":"달의 계곡: 암스트롱이 이름 지었다는 흙기둥","paragraphs":["라파즈 남쪽 말라사 지구의 달의 계곡은 진흙과 모래가 굳은 언덕이 비에 깎여 수천 개의 뾰족한 기둥이 된 곳이다. 지질학적으로는 우유니 가는 길에 보는 침식 지형과 같은 종류인데, 도시 안에 있다는 것이 특별하다. 이름에는 이야기가 붙어 있다. 1969년 달에 다녀온 닐 암스트롱이 볼리비아를 방문해 이 계곡을 보고 \"달 표면 같다\"고 말한 데서 이름이 났다는 것이다. 볼리비아 사람들이 좋아하는 이야기이고, 확인은 어렵다.","45분짜리 산책로가 정비돼 있고 입장료 15볼리비아노다. 흙기둥 색이 광물에 따라 붉은색, 보라색, 회색으로 달라지고, 오후 햇살이 비스듬할 때 그림자가 길어 사진이 좋다. 선인장이 드문드문 있고 아이마라 사람들이 이 지형을 \"악마의 어금니\"라고도 부른다. 시티투어 코스에 흔히 들어가고, 개인적으로 가면 시내에서 택시로 30분이다. 우유니에서 더 큰 것을 볼 예정이라 시간이 없으면 건너뛰어도 되지만, 라파즈 시티투어에 포함돼 있다면 안내판을 읽을 만하다."]},{"title":"산프란시스코 성당과 하엔 거리","paragraphs":["라파즈 중심 산프란시스코 광장의 성당은 1549년 처음 세워졌고 지금 건물은 18세기 것이다. 정면 조각을 자세히 보면 유럽 성당에 없는 것들이 있다. 열대 과일, 앵무새, 태양, 가면 같은 얼굴이 성인들 사이에 새겨져 있다. 원주민 석공이 유럽 양식을 배우면서 자기 세계를 끼워 넣은 \"메스티소 바로크\"다. 옥상에 올라가면 광장과 시장 골목이 내려다보이고, 안의 회랑 박물관은 조용하다. 광장은 시위와 집회의 단골 장소라 최루탄 자국이 있다.","성당 뒤 하엔 거리는 식민 시대 골목이 그대로 남은 곳으로 작은 박물관이 네 곳 모여 있다. 독립 영웅 페드로 도밍고 무리요의 집(그는 1810년 무리요 광장에서 교수형을 당했다), 해안 박물관(볼리비아가 잃은 바다를 지도와 유물로 기억하는 곳), 악기 박물관(차랑고 수백 점), 금 공예 박물관. 한 표로 다 볼 수 있고 한 시간이면 된다. 거리 자체가 좁고 알록달록해서 사진 찍기 좋다. 무리요 광장에서 걸어서 5분이다."]},{"title":"티와나쿠: 잉카보다 천 년 앞선 도시","paragraphs":["티와나쿠는 라파즈에서 서쪽 70km, 티티카카 호수 근처 고원에 있다. 서기 500~1000년 사이에 번성해 인구 2만 명을 넘었고, 잉카보다 천 년 앞서 안데스 남부를 지배한 문명이다. 태양의 문은 안데사이트 한 덩어리를 깎아 만든 문으로 위에 지팡이를 든 신과 48개의 날개 달린 형상이 새겨져 있는데 달력이라는 해석이 있다. 아카파나 피라미드, 반지하 신전 벽에 박힌 수십 개의 돌 얼굴, 7m 높이의 베넷 석상이 있다. 푸마푼쿠 구역의 H자 돌은 정밀도가 놀라워 \"외계인\" 프로그램의 단골이 됐지만, 청동 꺾쇠와 돌 망치로 만든 흔적이 다 남아 있다.","티와나쿠는 1000년경 긴 가뭄으로 무너졌다. 호수 수위가 내려가고 계단식 밭의 물이 마르자 사람들이 흩어졌다. 그 뒤 잉카는 이 폐허를 조상의 도시로 모셨고, 비라코차 신화의 무대로 삼았다. 지금 볼리비아 대통령들은 취임 전날 여기서 원주민 사제에게 축복을 받는다. 유적은 넓고 그늘이 없어 모자와 물이 필요하고, 박물관 안의 석상은 사진 금지다. 라파즈에서 반나절 투어로 다녀온다."]}]},"uyuni":{"id":"uyuni","name":"우유니","articles":[{"title":"소금 사막이 만들어진 4만 년","paragraphs":["우유니 소금사막은 면적 10,582km²로 세계 최대다. 약 4만 년 전 이 고원 전체를 덮었던 거대한 민친 호수가 마르고, 다시 타우카 호수가 생겼다 1만 년 전쯤 완전히 증발하면서 소금이 남았다. 소금층은 두께가 최대 10m, 표면은 극도로 평평해 전체 고저차가 1m 이내다. 그래서 인공위성이 고도계를 보정하는 기준면으로 쓴다.","소금 아래 염수에는 리튬이 녹아 있다. 볼리비아는 세계 최대 리튬 매장국으로 추정되며(약 2,100만 톤), 아르헨티나·칠레와 함께 리튬 삼각지대를 이룬다. 전기차 배터리 시대에 이 하얀 평원이 볼리비아 경제를 바꿀 수 있지만, 국유화 원칙과 기술 부족으로 개발은 더디다. 소금 표면의 육각형 무늬는 소금이 마르며 수축할 때 생기는 것으로, 12~3월 우기에 얕은 물이 덮이면 하늘을 비추는 거울이 된다. 9월 말은 건기라 거울 대신 끝없이 하얀 평원과 원근감이 사라진 사진, 그리고 밤하늘의 은하수가 주인공이다."]},{"title":"선인장 섬과 산호","paragraphs":["소금평원 한복판의 잉카와시(잉카의 집) 섬은 옛 화산의 꼭대기다. 섬을 덮은 거대 선인장은 1년에 1cm씩 자라 큰 것은 12m, 나이가 1,200년이 넘는다. 섬의 바위를 자세히 보면 산호와 조류 화석이 있다. 이곳이 호수 바닥이었다는 증거다. 잉카 시대에는 소금평원을 건너는 대상들의 쉼터였다.","우유니 마을 외곽의 기차 무덤은 1890년대 영국 기술자들이 건설한 안토파가스타~볼리비아 철도의 유산이다. 우유니는 1889년 이 철도의 교차점으로 세워진 마을이고, 광산 붐이 꺼지고 1940년대 광산이 문을 닫으면서 증기기관차들이 이곳에 버려졌다. 소금기 섞인 바람에 녹슨 철골은 지금 우유니의 첫 포토존이다."]},{"title":"붉은 호수와 국경의 영웅","paragraphs":["투어 2일차의 라구나 콜로라다는 물이 붉다. 붉은 조류와 플랑크톤, 미네랄 때문이고, 바람과 시간대에 따라 색이 변한다. 이 붉은 물에 사는 조류를 먹고 살아 몸이 분홍색인 제임스 플라밍고는 한때 멸종한 것으로 여겨졌다가 1957년 이곳에서 다시 발견됐다. 세계 개체수 대부분이 이 일대에 산다.","이 지역은 에두아르도 아바로아 국립 안데스 동물 보호구역이다. 아바로아는 태평양 전쟁 첫 전투(1879년 토파테르)에서 칠레군의 항복 요구에 맞서다 전사한 볼리비아의 국민 영웅이다. 국경 지대에 그의 이름이 붙은 것은 우연이 아니다. 보호구역 입장료(현금 볼리비아노)는 별도이고, 4,900m 고지의 새벽 간헐천(솔 데 마냐나)과 노천 온천을 지나면 칠레 국경이다. 국경에서 볼리비아 출국 도장을 받고 칠레 쪽에서는 과일·씨앗·유제품·코카잎을 엄격히 검사한다."]},{"title":"소금 호텔과 고원 숙소, 이틀 밤","paragraphs":["소금 호텔은 소금 벽돌로 벽을 쌓고 바닥에 소금 알갱이를 깐 숙소다. 침대 틀, 식탁, 의자도 소금이다. 우리 팀은 투어 첫날 소금사막 한가운데 있는 최초의 소금 호텔(플라야 블랑카, 지금은 박물관)에 들르고, 첫날 밤은 우유니 마을 안 호텔(Cielo & Sal)에서 잔다. 오지 소금 호텔은 위생과 샤워가 불편해서 여행사가 마을 숙박을 택했다. 둘째 밤이 진짜 오지다. 국경 근처 4,300m 고원 숙소(San Bernardo)는 발전기를 돌려 저녁 몇 시간만 전기가 오고, 드라이기나 전기장판을 꽂으면 전기가 끊긴다. 보조배터리를 낮에 차에서 충전하고, 밤에는 영하로 내려가므로 핫팩과 보온 물주머니, 두꺼운 양말이 난방이다.","지프 한 대에 6명이 타고 사흘을 함께 다닌다. 물과 간식, 화장지, 물티슈, 헤드랜턴, 선글라스, 선크림은 우유니 마을에서 미리 사야 한다. 화장실은 전부 유료(약 5볼리비아노)라 소액권을 챙긴다. 둘째 날은 08:30에 떠나 종일 고원을 달리고 14시경 플라밍고 호수에서 점심, 18시경 숙소에 닿는 가장 긴 날이다. 별은 첫날 밤 소금평원에서 가장 잘 보이고, 별 투어와 선라이즈는 날씨가 나쁘면 취소된다."]},{"title":"콜차니: 소금을 긁어 파는 마을","paragraphs":["우유니 투어의 첫 정차지 콜차니는 소금사막 가장자리의 소금 마을이다. 마을 사람들은 사막에 나가 소금을 삽으로 긁어 원뿔로 쌓아 물을 빼고, 트럭으로 실어 와 가마에 말리고 요오드를 섞어 봉지에 담는다. 한 해 2만 톤쯤이 이렇게 손으로 나온다. 1kg 봉지가 몇 볼리비아노이니 노동에 비해 헐값이다. 마을에 소금 벽돌로 지은 집과 소금 조각품 가게가 있고, 다카르 랠리 기념 소금 조각이 근처에 있다.","세계 최초의 소금 호텔도 여기 있었다. 1990년대 사막 한가운데 소금 벽돌로 지은 플라야 블랑카 호텔은 화장실 오수를 사막에 버려 2002년에 문을 닫았고, 지금은 투어 차량이 잠깐 서는 소금 박물관 겸 기념품 가게다. 우리가 자는 소금 호텔들은 사막 밖 가장자리에 있어 그 문제가 없다. 콜차니에서 산 소금은 칠레 입국 때 문제없고, 한국 세관도 소금은 신경 쓰지 않는다. 소금 조각 야마와 소금 결정 덩어리가 가장 흔한 기념품이고, 알파카 장갑과 모자도 여기가 라파즈보다 싸다."]},{"title":"돌나무와 달리 사막","paragraphs":["우유니 투어 둘째 날 시롤리 사막에 7m 높이의 돌이 나무 모양으로 서 있다. 아르볼 데 피에드라, 돌나무다. 화산에서 뿜어져 나온 화산재가 굳은 응회암(이그님브라이트)을 모래 섞인 바람이 수만 년 깎았는데, 바람이 땅에 가까운 곳에서 가장 세니 아래가 가늘어지고 위가 남아 나무 모양이 됐다. 주변에도 비슷하게 깎인 바위들이 흩어져 있고, 그 사이에서 비스카차가 볕을 쬔다. 언젠가는 밑동이 부러질 것이고 가이드들은 매년 조금씩 가늘어진다고 말한다.","셋째 날 새벽 지나는 달리 사막은 붉은 모래 위에 커다란 바위들이 띄엄띄엄 놓여 있어 살바도르 달리의 그림처럼 보인다고 붙은 이름이다. 달리가 여기 온 적은 없다. 바위들은 근처 화산이 던져 놓은 것이고, 해가 뜨면 그림자가 길게 늘어져 초현실적 풍경이 된다. 이 구간은 해발 4,700m가 넘고 아침 기온이 영하 15도까지 내려간다. 차에서 내릴 때는 장갑과 목도리를, 사진은 빨리 찍고 다시 탄다. 이 근처가 투어 전체에서 가장 높고 가장 추운 곳이다."]},{"title":"솔 데 마냐나, 폴케스 온천, 라구나 베르데","paragraphs":["셋째 날 새벽에 서는 솔 데 마냐나(아침의 태양)는 해발 4,850m의 지열 지대다. 진흙이 끓어 터지는 구덩이와 증기를 뿜는 분기공 사이를 난간 없이 걷는다. 김이 나는 곳 가장자리는 얇은 껍질이라 무너질 수 있으니 기사가 가지 말라는 곳은 정말 가지 않는다. 볼리비아가 여기서 지열 발전소를 짓고 있어 파이프가 보인다. 이름과 달리 아침 해가 뜨기 전이 가장 볼만하다. 추운 공기에 증기가 더 크게 보이기 때문이다.","그다음 폴케스 온천은 해발 4,400m 호숫가에 있는 30도짜리 노천탕이다. 영하의 공기에서 따뜻한 물에 들어가는 것이 우유니 투어의 하이라이트 중 하나이고, 나올 때가 문제다. 수건과 갈아입을 옷을 차에서 꺼내기 쉽게 두고, 탈의실은 유료이며 허술하다. 마지막 라구나 베르데는 리칸카부르 화산 발치의 초록 호수인데, 구리와 비소 광물 때문에 바람이 불어 물이 섞이면 에메랄드색이 되고 잔잔하면 회색이다. 오전 늦게 바람이 불기 시작하니 국경으로 가기 직전이 색이 좋다. 여기서 칠레 국경까지 20분이다."]}]},"atacama":{"id":"atacama","name":"산페드로 데 아따까마","articles":[{"title":"400년 동안 비가 안 온 땅","par
